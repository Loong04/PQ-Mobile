<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PeopleHCM - Staff Request</title>
  <script>(()=>{const q=new URLSearchParams(location.search).get('theme');document.documentElement.dataset.theme=q==='light'?'light':'dark';})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../../css/theme.css">
  <link rel="stylesheet" href="../../../../css/app.css">
  <link rel="stylesheet" href="../../css/employee-career.css">
  <link rel="stylesheet" href="../../css/employee-career-forms.css">
  <script src="../../../../js/components.js"></script>
  <script src="../../../../js/app.js" defer></script>
  <script src="../../js/employee-career-forms.js" defer></script>
  <link rel="stylesheet" href="../../../../css/form-section-headings.css">
</head>
<body class="employee-career-option-page employee-career-form-page employee-career-team-form-page">
  <preview-top-bar active-page="v2"></preview-top-bar>
  <div class="phone-container">
    <header class="employee-career-header">
      <phone-status-bar time="9:41"></phone-status-bar>
      <div class="employee-career-header-row">
        <a class="employee-career-back" data-option-back href="../../index.html?scope=team" aria-label="Back to Employee and Career"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></a>
        <div class="employee-career-heading"><h1>Staff Request</h1></div>
        <span class="employee-career-header-spacer" aria-hidden="true"></span>
      </div>
    </header>
    <main class="main-content employee-career-content">
      <form id="staffRequestForm" novalidate>
        <div class="employee-career-form-card">
        <section class="employee-career-form-section" aria-labelledby="requestOverviewHeading">
          <h2 class="form-section-heading" id="requestOverviewHeading">Request Overview</h2>
          <div class="employee-career-form-grid">
            <div class="employee-career-field"><label for="requestPeriod">Request Period</label><input id="requestPeriod" class="employee-career-control" type="month"></div>
            <div class="employee-career-field"><label for="requestType">Type</label><select id="requestType" class="employee-career-control"><option>Unbudgeted</option><option>Budgeted</option><option>Replacement</option></select></div>
          </div>
          <div class="employee-career-field"><label for="requestManpowerPlan">Manpower Plan #</label><input id="requestManpowerPlan" class="employee-career-control" type="text" placeholder="Enter manpower plan reference"></div>
          <div class="employee-career-field"><label for="requestDescription">Description</label><textarea id="requestDescription" class="employee-career-control" placeholder="Describe the requested role"></textarea></div>
        </section>
        <section class="employee-career-form-section" aria-labelledby="requestPositionHeading">
          <h2 class="form-section-heading" id="requestPositionHeading">Position Details</h2>
          <div class="employee-career-form-grid">
            <div class="employee-career-field employee-career-field--wide"><label for="requestCompany">Company</label><select id="requestCompany" class="employee-career-control"><option value="">Select Company</option><option>PeopleHCM Malaysia</option><option>PeopleHCM Services</option><option>PeopleHCM Technology</option></select></div>
            <div class="employee-career-field employee-career-field--wide"><label for="requestBranch">Branch</label><select id="requestBranch" class="employee-career-control"><option value="">Select Branch</option><option>Kuala Lumpur</option><option>Johor Bahru</option><option>Penang</option><option>Remote</option></select></div>
            <div class="employee-career-field employee-career-field--wide"><label for="requestDepartment">Department</label><select id="requestDepartment" class="employee-career-control"><option value="">Select Department</option><option>People Operations</option><option>Finance</option><option>Product</option><option>Technology</option><option>Sales</option></select></div>
            <div class="employee-career-field employee-career-field--wide"><label for="requestLocation">Location</label><select id="requestLocation" class="employee-career-control"><option value="">Select Location</option><option>Head Office</option><option>Client Site</option><option>Hybrid</option><option>Remote</option></select></div>
            <div class="employee-career-field employee-career-field--wide"><label for="requestJob">Job</label><select id="requestJob" class="employee-career-control"><option value="">Select Job</option><option>Executive</option><option>Senior Executive</option><option>Manager</option><option>Specialist</option><option>Intern</option></select></div>
            <div class="employee-career-field employee-career-field--wide"><label for="requestAccess">Access</label><select id="requestAccess" class="employee-career-control"><option value="">Select Access</option><option>Employee</option><option>Team Lead</option><option>Manager</option><option>Administrator</option></select></div>
            <div class="employee-career-field"><label for="requestEmploymentType">Employment Type</label><select id="requestEmploymentType" class="employee-career-control"><option>Permanent</option><option>Contract</option><option>Part Time</option><option>Internship</option></select></div>
            <div class="employee-career-field"><label for="requestCount">Count</label><input id="requestCount" class="employee-career-control" type="number" min="0" value="0"></div>
            <div class="employee-career-field employee-career-field--wide"><label for="requestRequiredBy">Required By</label><input id="requestRequiredBy" class="employee-career-control" type="date"></div>
            <div class="employee-career-field employee-career-field--wide"><label for="requestReason">Reason</label><select id="requestReason" class="employee-career-control"><option value="">Select Reason</option><option>New Position</option><option>Replacement</option><option>Expansion</option><option>Temporary Support</option><option>Project Requirement</option></select></div>
          </div>
          <div class="employee-career-field"><label for="requestRemarks">Remarks</label><textarea id="requestRemarks" class="employee-career-control" placeholder="Add request remarks"></textarea></div>
        </section>
        <fieldset class="employee-career-field employee-career-fieldset">
          <legend class="form-section-heading">Upload Attachments</legend>
          <div class="employee-career-upload-actions">
            <button class="employee-career-upload-button" type="button" data-file-picker="requestFiles"><span class="employee-career-upload-icon"><i class="fa-solid fa-file-arrow-up" aria-hidden="true"></i></span><span>Select File(s)</span></button>
            <button class="employee-career-upload-button" type="button" data-file-picker="requestCamera"><span class="employee-career-upload-icon"><i class="fa-solid fa-camera" aria-hidden="true"></i></span><span>Take a Picture</span></button>
          </div>
          <input id="requestFiles" type="file" multiple hidden>
          <input id="requestCamera" type="file" accept="image/*" capture="environment" hidden>
          <div id="requestAttachments" class="form-attachment-list" aria-live="polite"></div>
        </fieldset>
        </div>
        <div class="employee-career-form-actions">
          <a class="form-cancel-btn" data-option-back href="../../index.html?scope=team"><i class="fa-solid fa-xmark" aria-hidden="true"></i><span>Cancel</span></a>
          <button class="employee-career-button primary" id="staffRequestSubmit" type="submit"><span>Submit</span><i class="fa-solid fa-paper-plane" aria-hidden="true"></i></button>
        </div>
      </form>
    </main>
    <div id="employeeCareerToast" class="employee-career-toast" role="status" aria-live="polite"></div>
    <phone-bottom-nav active="apps"></phone-bottom-nav>
  </div>
</body>
</html>
