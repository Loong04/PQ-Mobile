<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PeopleHCM - Manpower Statistics</title>
  <script>(()=>{const q=new URLSearchParams(location.search).get('theme');document.documentElement.dataset.theme=q==='light'?'light':'dark';})();</script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../../css/theme.css"><link rel="stylesheet" href="../../../../css/app.css"><link rel="stylesheet" href="../../css/employee-career.css">
  <link rel="stylesheet" href="../../css/staff-list.css"><link rel="stylesheet" href="../../css/manpower-statistics.css">
  <script src="../../../../js/components.js"></script><script src="../../../../js/app.js" defer></script><script src="../../js/employee-career-option.js" defer></script>
  <script src="../../js/manpower-statistics-data.js" defer></script><script src="../../js/manpower-statistics.js" defer></script>
</head>
<body class="employee-career-option-page staff-list-page manpower-statistics-page"><preview-top-bar active-page="v2"></preview-top-bar><div class="phone-container">
  <header class="employee-career-header"><phone-status-bar time="9:41"></phone-status-bar><div class="employee-career-header-row"><a id="manpowerBack" class="employee-career-back" data-option-back href="../../index.html?scope=team" aria-label="Back to Employee and Career"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></a><div class="employee-career-heading"><h1 id="manpowerTitle">Manpower Statistics</h1></div><span class="employee-career-header-spacer"></span></div></header>
  <main class="main-content employee-career-content">
    <section id="manpowerTableView" aria-label="Manpower statistics listing">
      <div class="staff-list-filter-summary filter-summary-bar">
        <div><small>Current Filter</small><strong id="manpowerFilterSummary"></strong></div>
        <button type="button" id="manpowerFilterTrigger" title="Open Filter Options" aria-label="Open manpower filter" aria-haspopup="dialog" aria-controls="manpowerFilterOverlay"><i class="fa-solid fa-sliders" aria-hidden="true"></i></button>
      </div>
      <div class="staff-list-action-summary action-summary-bar" aria-live="polite">
        <div class="staff-list-summary-row">
          <div><span class="staff-list-summary-label">Total Records</span><strong id="manpowerTotalRecords" class="staff-list-summary-count">0</strong></div>
          <button type="button" id="manpowerViewChart" class="view-chart-btn"><i class="fa-solid fa-chart-pie" aria-hidden="true"></i><span>View Chart</span></button>
        </div>
        <div class="staff-list-summary-row">
          <div><span class="staff-list-summary-label">Total Headcount</span><strong id="manpowerTotalHeadcount" class="staff-list-summary-date">0</strong></div>
          <div class="manpower-effective-summary"><span class="staff-list-summary-label">Effective Date</span><strong id="manpowerDateSummary"></strong></div>
        </div>
      </div>
      <div class="staff-list-table-card manpower-table-card">
        <table id="manpowerTable"><thead><tr><th scope="col">Description</th><th scope="col">Headcount</th></tr></thead><tbody></tbody></table>
        <div id="manpowerEmpty" class="staff-list-empty" hidden><i class="fa-solid fa-users" aria-hidden="true"></i><h2>No Manpower Records Found</h2><p>Adjust the filters or effective date to find records.</p></div>
      </div>
    </section>
    <section id="manpowerChartView" aria-label="Manpower distribution" hidden>
      <div class="staff-list-breakdown-card">
        <label for="manpowerChartMetric">Breakdown By</label>
        <div class="staff-list-select"><select id="manpowerChartMetric"><option value="jobType">Job Type</option><option value="company">Company</option><option value="branch">Branch</option><option value="department">Department</option></select><i class="fa-solid fa-chevron-down" aria-hidden="true"></i></div>
      </div>
      <div class="staff-list-donut-card">
        <div class="staff-list-chart-heading"><h2 id="manpowerChartTitle">Headcount by job type</h2><p>Share of total headcount</p></div>
        <div class="staff-list-donut">
          <svg id="manpowerChartDonut" viewBox="0 0 180 180" role="img" aria-label="Headcount by job type"><circle cx="90" cy="90" r="70" fill="none" stroke="var(--border-subtle)" stroke-width="22"></circle><g id="manpowerChartSegments"></g></svg>
          <div class="staff-list-donut-center"><strong id="manpowerChartTotal">0</strong><span>Total Headcount</span></div>
        </div>
        <p id="manpowerChartNote" class="staff-list-chart-note"></p>
      </div>
      <div class="staff-list-legend-card">
        <div class="staff-list-legend-head manpower-legend-grid"><span id="manpowerChartColumn">Job Type</span><span>Headcount</span><span>% of Total</span></div>
        <div id="manpowerChartLegend" class="staff-list-legend"></div>
        <div id="manpowerChartViewAllFooter" class="staff-list-legend-footer"><button type="button" id="manpowerChartViewAll" aria-expanded="false"><span>View all job types</span><i class="fa-solid fa-chevron-down" aria-hidden="true"></i></button></div>
      </div>
    </section>
  </main>
  <phone-bottom-nav active="apps"></phone-bottom-nav>
  <left-profile-drawer></left-profile-drawer><notification-sheet></notification-sheet><favourite-sheet></favourite-sheet>
  <div id="manpowerFilterOverlay" class="staff-list-filter-overlay standard-filter-sheet" hidden>
    <form id="manpowerFilterForm" class="staff-list-filter-panel standard-filter-panel" data-standard-filter-ready="true" role="dialog" aria-modal="true" aria-labelledby="manpowerFilterTitle">
      <div class="standard-filter-handle" aria-hidden="true"></div>
      <header class="standard-filter-header"><h2 id="manpowerFilterTitle">Filter</h2><div class="standard-filter-header-actions"><button type="button" id="manpowerResetFilter" class="standard-filter-reset"><i class="fa-solid fa-rotate-left" aria-hidden="true"></i><span>Reset</span></button><button type="button" id="manpowerCloseFilter" class="standard-filter-close" aria-label="Close manpower filter"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button></div></header>
      <div class="staff-list-filter-fields">
        <div><label for="manpowerCompany">Company</label><select id="manpowerCompany" name="company"></select></div>
        <div><label for="manpowerBranch">Branch</label><select id="manpowerBranch" name="branch"></select></div>
        <div><label for="manpowerDepartment">Department</label><select id="manpowerDepartment" name="department"></select></div>
        <div><label for="manpowerSummaryBy">Summary By</label><select id="manpowerSummaryBy" name="summaryBy"><option value="jobType">Job Type</option><option value="company">Company</option><option value="branch">Branch</option><option value="department">Department</option></select></div>
        <div><label for="manpowerSummaryType">Summary Type</label><select id="manpowerSummaryType" name="summaryType"><option value="headcount">Headcount</option></select></div>
        <div><label for="manpowerEffectiveDate">Effective Date</label><input id="manpowerEffectiveDate" name="effectiveDate" type="date" required value="2026-10-05"></div>
      </div>
      <footer class="standard-filter-footer"><button type="submit" id="manpowerApplyFilter" class="standard-filter-apply">Apply Filter</button></footer>
    </form>
  </div>
</div></body></html>
