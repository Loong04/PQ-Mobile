<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PeopleHCM - Whereabout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../../css/theme.css"><link rel="stylesheet" href="../../../../css/app.css"><link rel="stylesheet" href="../../css/employee-career.css">
  <link rel="stylesheet" href="../../css/employee-career-forms.css">
  <script src="../../../../js/components.js"></script><script src="../../../../js/app.js" defer></script><script src="../../js/employee-career-forms.js" defer></script>
  <link rel="stylesheet" href="../../../../css/form-section-headings.css">
</head>
<body class="employee-career-option-page employee-career-form-page">
  <preview-top-bar active-page="v2"></preview-top-bar>
  <div class="phone-container">
    <header class="employee-career-header"><phone-status-bar time="9:41"></phone-status-bar><div class="employee-career-header-row"><a class="employee-career-back" data-option-back href="../../index.html?scope=individual" aria-label="Back to Employee and Career"><i class="fa-solid fa-chevron-left"></i></a><div class="employee-career-heading"><h1>Whereabout</h1></div><span class="employee-career-header-spacer"></span></div></header>
    <main class="main-content employee-career-content">
      <form id="whereaboutForm" novalidate>
        <section class="employee-career-form-card" aria-labelledby="whereaboutDetailsTitle">
        <div class="employee-career-form-heading"><span aria-hidden="true"></span><h2 id="whereaboutDetailsTitle">Whereabout Details</h2></div>
        <div class="employee-career-form-grid"><div class="employee-career-field"><label for="whereaboutDate">Date</label><input id="whereaboutDate" class="employee-career-control" type="date"></div><div class="employee-career-field"><label for="whereaboutToDate">To Date</label><input id="whereaboutToDate" class="employee-career-control" type="date"></div></div>
        <div class="employee-career-form-grid"><div class="employee-career-field"><label for="whereaboutStartTime">Start Time</label><input id="whereaboutStartTime" class="employee-career-control" type="time"></div><div class="employee-career-field"><label for="whereaboutEndTime">End Time</label><input id="whereaboutEndTime" class="employee-career-control" type="time"></div></div>
        <div class="employee-career-field"><label for="whereaboutLocation">Location</label><input id="whereaboutLocation" class="employee-career-control" type="text" placeholder="Enter location"></div>
        <div class="employee-career-field"><label for="whereaboutState">State</label><select id="whereaboutState" class="employee-career-control"><option value="">Select State</option><option>Johor</option><option>Kedah</option><option>Kelantan</option><option>Melaka</option><option>Negeri Sembilan</option><option>Pahang</option><option>Penang</option><option>Perak</option><option>Perlis</option><option>Sabah</option><option>Sarawak</option><option>Selangor</option><option>Terengganu</option><option>Kuala Lumpur</option><option>Labuan</option><option>Putrajaya</option></select></div>
        <div class="employee-career-form-grid"><div class="employee-career-field"><label for="whereaboutProject">Project</label><select id="whereaboutProject" class="employee-career-control"><option value="">Select Project</option><option value="project-nova">Project Nova</option><option value="peoplehub-rollout">PeopleHub Rollout</option><option value="workplace-refresh">Workplace Refresh</option></select></div><div class="employee-career-field"><label for="whereaboutTask">Task</label><select id="whereaboutTask" class="employee-career-control"><option value="">Select Task</option></select></div></div>
        <div class="employee-career-field"><label for="whereaboutRemarks">Remarks</label><textarea id="whereaboutRemarks" class="employee-career-control" placeholder="Add remarks"></textarea></div>
        </section>
        <div class="employee-career-form-actions"><a class="form-cancel-btn" data-option-back href="../../index.html?scope=individual"><i class="fa-solid fa-xmark" aria-hidden="true"></i><span>Cancel</span></a><button class="employee-career-button primary" id="whereaboutSubmit" type="submit"><span>Submit</span><i class="fa-solid fa-paper-plane" aria-hidden="true"></i></button></div>
      </form>
    </main>
    <div id="employeeCareerToast" class="employee-career-toast" role="status" aria-live="polite"></div><phone-bottom-nav active="apps"></phone-bottom-nav>
  </div>
</body>
</html>
