<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleHCM - Policy / SOP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../css/theme.css">
  <link rel="stylesheet" href="../../../css/app.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../../../css/claim-forms.css">
  <link rel="stylesheet" href="../../../css/history-cards.css">
  <link rel="stylesheet" href="../../../css/claim-summary-cards.css">
  <link rel="stylesheet" href="../css/policy-sop.css">
  <script src="../../../js/components.js"></script>
  <script src="../../../js/app.js" defer></script>
  <script src="../js/admin-app.js" defer></script>
  <script src="../js/policy-data.js" defer></script>
  <script src="../js/policy-sop.js" defer></script>
</head>
<body class="admin-page policy-page">
  <preview-top-bar active-page="workplace"></preview-top-bar>
  <div class="phone-container">
    <header class="admin-header">
      <phone-status-bar time="9:41"></phone-status-bar>
      <div class="admin-header-row">
        <a class="admin-back" data-admin-back href="../index.html" aria-label="Back to Workplace"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></a>
        <div class="admin-heading"><h1>Policy / SOP</h1></div>
        <span aria-hidden="true"></span>
      </div>
    </header>
    <main class="main-content admin-content">
      <button id="policyFilterTrigger" class="claim-filter-bar" type="button" aria-haspopup="dialog" aria-controls="policyFilterModal" aria-expanded="false">
        <span class="claim-filter-copy"><span class="claim-eyebrow">Current Filter</span><span id="policyFilterSummary" class="claim-filter-value">All Departments / All Documents</span></span>
        <span class="claim-icon-button" aria-hidden="true"><i class="fa-solid fa-sliders"></i></span>
      </button>
      <div id="policyList" aria-live="polite"></div>
      <section id="policyEmptyState" class="policy-empty" hidden>
        <span class="policy-empty-icon"><i class="fa-regular fa-folder-open" aria-hidden="true"></i></span>
        <h2>No documents found</h2><p>Try another title, department or effective date.</p>
        <button id="clearPolicyFilters" class="policy-text-button" type="button">Clear filters</button>
      </section>
    </main>
    <phone-bottom-nav active="apps"></phone-bottom-nav>
    <div id="policyFilterModal" class="claim-filter-sheet" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="policyFilterHeading">
      <form id="policyFilterForm" class="claim-filter-panel" novalidate>
        <div class="claim-filter-handle" aria-hidden="true"></div>
        <div class="claim-filter-header">
          <h2 id="policyFilterHeading" class="claim-filter-title">Filter</h2>
          <div class="claim-filter-header-actions">
            <button id="resetPolicyFilter" class="claim-filter-reset" type="button"><i class="fa-solid fa-rotate-left" aria-hidden="true"></i><span>Reset</span></button>
            <button id="closePolicyFilter" class="claim-filter-close" type="button" aria-label="Close filter"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
          </div>
        </div>
        <div class="claim-filter-fields">
          <div><label class="claim-filter-label" for="policyReference">Reference #</label><input id="policyReference" name="reference" class="claim-control" type="text" placeholder="Search reference" autocomplete="off"></div>
          <div><label class="claim-filter-label" for="policyTitle">Document Title</label><input id="policyTitle" name="title" class="claim-control" type="text" placeholder="Search document title" autocomplete="off"></div>
          <div><label class="claim-filter-label" for="policyDepartment">Department</label><div class="claim-filter-select-wrap"><select id="policyDepartment" name="department" class="claim-filter-select"><option value="">All Departments</option></select><i class="fa-solid fa-chevron-down claim-filter-chevron" aria-hidden="true"></i></div></div>
          <fieldset class="policy-date-group"><legend class="claim-filter-label">Policy WEF</legend><div class="policy-date-fields"><div><input id="policyFrom" name="policyFrom" class="claim-control" type="date" aria-label="Policy WEF start date"></div><div><input id="policyTo" name="policyTo" class="claim-control" type="date" aria-label="Policy WEF end date"></div></div></fieldset>
          <fieldset class="policy-date-group"><legend class="claim-filter-label">SOP WEF</legend><div class="policy-date-fields"><div><input id="sopFrom" name="sopFrom" class="claim-control" type="date" aria-label="SOP WEF start date"></div><div><input id="sopTo" name="sopTo" class="claim-control" type="date" aria-label="SOP WEF end date"></div></div></fieldset>
          <fieldset class="policy-date-group"><legend class="claim-filter-label">Guideline WEF</legend><div class="policy-date-fields"><div><input id="guidelineFrom" name="guidelineFrom" class="claim-control" type="date" aria-label="Guideline WEF start date"></div><div><input id="guidelineTo" name="guidelineTo" class="claim-control" type="date" aria-label="Guideline WEF end date"></div></div></fieldset>
          <p id="policyFilterError" class="policy-filter-error" role="alert" hidden></p>
        </div>
        <button id="applyPolicyFilter" class="claim-filter-apply" type="submit">Apply Filter</button>
      </form>
    </div>
  </div>
</body>
</html>
