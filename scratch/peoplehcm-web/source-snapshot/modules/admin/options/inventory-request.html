<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleHCM - Inventory Request</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../css/theme.css">
  <link rel="stylesheet" href="../../../css/app.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../../../css/claim-forms.css">
  <link rel="stylesheet" href="../../../css/form-section-headings.css">
  <link rel="stylesheet" href="../css/inventory-request.css">
  <script src="../../../js/components.js"></script>
  <script src="../../../js/app.js" defer></script>
  <script src="../js/admin-app.js" defer></script>
  <script src="../js/workplace-history-store.js" defer></script>
  <script src="../js/inventory-request.js" defer></script>
</head>
<body class="admin-page inventory-request-page">
  <preview-top-bar active-page="workplace"></preview-top-bar>
  <div class="phone-container">
    <header class="admin-header">
      <phone-status-bar time="9:41"></phone-status-bar>
      <div class="admin-header-row">
        <a class="admin-back" data-admin-back href="../index.html?scope=individual" aria-label="Back to Workplace Individual"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></a>
        <div class="admin-heading"><h1>Inventory Request</h1></div>
        <span aria-hidden="true"></span>
      </div>
    </header>
    <main class="main-content admin-content">
      <form id="inventoryRequestForm" novalidate>
        <div class="claim-form-card">
          <section class="inventory-request-section" aria-labelledby="inventoryRequestDetailsHeading">
            <h2 id="inventoryRequestDetailsHeading" class="form-section-heading">Request Details</h2>
            <div class="claim-form-stack">
              <div class="claim-field">
                <label class="claim-field-label" for="inventoryRequestItem">Request Item<span class="claim-required" aria-hidden="true">*</span></label>
                <div class="inventory-request-select"><select id="inventoryRequestItem" name="requestItem" class="claim-control" required><option value="">Select Request Item</option><option value="office-supplies">Office Supplies</option><option value="it-accessories">IT Accessories</option><option value="pantry-supplies">Pantry Supplies</option><option value="uniform-ppe">Uniform / PPE</option><option value="other">Other</option></select><i class="fa-solid fa-chevron-down" aria-hidden="true"></i></div>
              </div>
              <div class="claim-field"><label class="claim-field-label" for="inventoryRequestQuantity">Quantity<span class="claim-required" aria-hidden="true">*</span></label><input id="inventoryRequestQuantity" name="quantity" class="claim-control" type="number" value="1" min="1" step="1" inputmode="numeric" required></div>
              <div class="claim-field"><label class="claim-field-label" for="inventoryRequestRequiredBy">Required By<span class="claim-required" aria-hidden="true">*</span></label><input id="inventoryRequestRequiredBy" name="requiredBy" class="claim-control" type="date" required></div>
              <div class="claim-field">
                <label class="claim-field-label" for="inventoryRequestReason">Reason<span class="claim-required" aria-hidden="true">*</span></label>
                <div class="inventory-request-select"><select id="inventoryRequestReason" name="reason" class="claim-control" required><option value="">Select Reason</option><option value="new-requirement">New Requirement</option><option value="replacement">Replacement</option><option value="damaged-lost">Damaged / Lost</option><option value="stock-replenishment">Stock Replenishment</option><option value="other">Other</option></select><i class="fa-solid fa-chevron-down" aria-hidden="true"></i></div>
              </div>
            </div>
          </section>
          <section class="inventory-request-section" aria-labelledby="inventoryAdditionalHeading">
            <h2 id="inventoryAdditionalHeading" class="form-section-heading">Additional Information</h2>
            <div class="claim-form-stack">
              <div class="claim-field"><label class="claim-field-label" for="inventoryRequestRemarks">Remarks</label><textarea id="inventoryRequestRemarks" name="remarks" class="claim-control" placeholder="Add remarks" maxlength="2000"></textarea></div>
              <fieldset id="inventoryUploadFieldset" class="claim-field inventory-upload-fieldset">
                <legend class="form-section-heading">Upload Attachments</legend>
                <div id="inventoryUploadActions" class="inventory-upload-actions">
                  <button class="inventory-upload-action" type="button" data-file-picker="inventoryRequestFiles"><span class="inventory-upload-icon"><i class="fa-solid fa-file-arrow-up" aria-hidden="true"></i></span><span>Select File(s)</span></button>
                  <button class="inventory-upload-action inventory-camera-action" type="button" data-file-picker="inventoryRequestCamera"><span class="inventory-upload-icon"><i class="fa-solid fa-camera" aria-hidden="true"></i></span><span>Take a Picture</span></button>
                </div>
                <input id="inventoryRequestFiles" type="file" multiple hidden>
                <input id="inventoryRequestCamera" type="file" accept="image/*" capture="environment" hidden>
                <div id="inventoryAttachmentList" class="form-attachment-list" aria-live="polite"></div>
              </fieldset>
            </div>
          </section>
        </div>
        <p id="inventoryRequestFeedback" class="inventory-request-feedback" role="status" aria-live="polite" hidden></p>
        <div class="inventory-request-actions"><a class="form-cancel-btn" data-admin-back href="../index.html?scope=individual"><i class="fa-solid fa-xmark" aria-hidden="true"></i><span>Cancel</span></a><button id="inventoryRequestSubmit" class="claim-button claim-button-primary" type="submit"><span>Submit</span><i class="fa-solid fa-paper-plane" aria-hidden="true"></i></button></div>
      </form>
    </main>
    <phone-bottom-nav active="apps"></phone-bottom-nav>
  </div>
</body>
</html>
