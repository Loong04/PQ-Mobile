<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleHCM - Book Resource</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../css/theme.css">
  <link rel="stylesheet" href="../../../css/app.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../../../css/claim-forms.css">
  <link rel="stylesheet" href="../../../css/form-section-headings.css">
  <link rel="stylesheet" href="../../../css/history-cards.css">
  <link rel="stylesheet" href="../css/book-resource.css">
  <script src="../../../js/components.js"></script>
  <script src="../../../js/app.js" defer></script>
  <script src="../js/admin-app.js" defer></script>
  <script src="../js/book-resource-store.js" defer></script>
  <script src="../js/book-resource.js" defer></script>
</head>
<body class="admin-page book-resource-page">
  <preview-top-bar active-page="workplace"></preview-top-bar>
  <div class="phone-container">
    <header class="admin-header">
      <phone-status-bar time="9:41"></phone-status-bar>
      <div class="admin-header-row">
        <a class="admin-back" data-admin-back href="../index.html" aria-label="Back to Workplace"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></a>
        <div class="admin-heading"><h1>Book Resource</h1></div>
        <span aria-hidden="true"></span>
      </div>
    </header>
    <main class="main-content admin-content">
      <section id="bookingListView" aria-labelledby="bookingListTitle">
      <div class="booking-list-heading">
        <div><h2 id="bookingListTitle">Current Records</h2><p id="bookingRecordCount" aria-live="polite">Total Records: 0</p></div>
        <button id="bookingAdd" type="button" class="claim-button claim-button-primary booking-add" aria-label="Add resource booking" aria-expanded="false" aria-controls="bookingEditor"><span class="booking-add-glyph" aria-hidden="true">+</span></button>
      </div>
      <p id="bookingFeedback" class="booking-feedback" role="status" aria-live="polite" hidden></p>
      <div id="bookingRecords" aria-live="polite"></div>
      <div id="bookingEmpty" class="booking-empty" hidden><i class="fa-regular fa-calendar" aria-hidden="true"></i><h3>No bookings yet</h3><p>Tap the + button to book or plan a resource.</p></div>
      </section>
      <section id="bookingEditor" aria-labelledby="bookingFormTitle" hidden>
        <form id="bookingForm" novalidate>
          <div class="claim-form-card">
            <h2 id="bookingFormTitle" class="form-section-heading">Resource Booking</h2>
            <div class="claim-form-stack">
              <div class="claim-field"><label class="claim-field-label" for="bookingDate">Booking Date<span class="claim-required" aria-hidden="true">*</span></label><input id="bookingDate" name="date" class="claim-control" type="date" required></div>
              <div class="booking-time-grid">
                <div class="claim-field"><label class="claim-field-label" for="bookingStartTime">Start Time<span class="claim-required" aria-hidden="true">*</span></label><input id="bookingStartTime" name="startTime" class="claim-control" type="time" value="00:00" required></div>
                <div class="claim-field"><label class="claim-field-label" for="bookingEndTime">End Time<span class="claim-required" aria-hidden="true">*</span></label><input id="bookingEndTime" name="endTime" class="claim-control" type="time" value="00:00" required></div>
              </div>
              <div class="claim-field"><label class="claim-field-label" for="bookingResource">Resource<span class="claim-required" aria-hidden="true">*</span></label><div class="booking-select"><select id="bookingResource" name="resource" class="claim-control" required><option value="">Select Resource</option></select><i class="fa-solid fa-chevron-down" aria-hidden="true"></i></div></div>
              <div class="claim-field"><label class="claim-field-label" for="bookingPurpose">Purpose</label><input id="bookingPurpose" name="purpose" class="claim-control" type="text" placeholder="Enter booking purpose" maxlength="1000"></div>
              <div class="claim-field"><label class="claim-field-label" for="bookingMeetingRef">Meeting Ref #</label><input id="bookingMeetingRef" name="meetingRef" class="claim-control" type="text" placeholder="Enter meeting reference" maxlength="200"></div>
              <div class="claim-field"><label class="claim-field-label" for="bookingTask">Task<span class="claim-required" aria-hidden="true">*</span></label><div class="booking-select"><select id="bookingTask" name="task" class="claim-control" required><option value="">Select Task</option></select><i class="fa-solid fa-chevron-down" aria-hidden="true"></i></div></div>
              <div class="claim-field"><label class="claim-field-label" for="bookingRemarks">Remarks</label><textarea id="bookingRemarks" name="remarks" class="claim-control" placeholder="Add remarks" maxlength="5000"></textarea></div>
            </div>
          </div>
          <p id="bookingFormFeedback" class="booking-feedback is-error" role="alert" hidden></p>
          <div class="booking-form-actions">
            <button id="bookingCancel" type="button" class="form-cancel-btn"><i class="fa-solid fa-xmark" aria-hidden="true"></i><span>Cancel</span></button>
            <button id="bookingPlan" type="submit" name="action" value="plan" class="claim-button claim-button-secondary"><i class="fa-regular fa-calendar" aria-hidden="true"></i><span>Plan</span></button>
            <button id="bookingBook" type="submit" name="action" value="book" class="claim-button claim-button-primary"><i class="fa-solid fa-calendar-check" aria-hidden="true"></i><span>Book</span></button>
          </div>
        </form>
      </section>
    </main>
    <phone-bottom-nav active="apps"></phone-bottom-nav>
  </div>
</body>
</html>
