<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PeopleHCM - Staff Attendance</title>
  <script src="../../../js/components.js"></script>
  <script src="../../../js/app.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../css/theme.css">
  <link rel="stylesheet" href="../../../css/app.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    body {
      background-color: var(--bg-page);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: var(--text-primary);
      padding: 20px 0;
    }
    .phone-container {
      width: 100%;
      max-width: 420px;
      height: 900px;
      background: var(--bg-phone);
      border-radius: 44px;
      overflow: hidden;
      box-shadow: var(--shadow-phone);
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 90px;
      position: relative;
      z-index: 10;
      scrollbar-width: none;
    }
    .main-content::-webkit-scrollbar { display: none; }

    /* Top Executive Header */
    .cal-top-header {
      background: linear-gradient(135deg, #4c1d95 0%, #6d28d9 50%, #7c3aed 100%);
      padding: 12px 16px 14px;
      border-bottom-left-radius: 22px;
      border-bottom-right-radius: 22px;
      box-shadow: 0 8px 24px rgba(76, 29, 149, 0.28);
      position: relative;
      z-index: 20;
    }
    .header-btn-icon {
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.25);
      width: 36px;
      height: 36px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #ffffff;
      transition: transform 0.15s ease;
    }
    .header-btn-icon:active { transform: scale(0.92); }

    /* Consistent Standard Executive Filter Summary Bar */
    .filter-summary-bar {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 12px 16px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .filter-summary-bar:hover {
      border-color: var(--purple-border);
      background: var(--bg-input);
    }
    .filter-bar-label {
      font-size: 10px;
      font-weight: 800;
      color: var(--purple-primary);
      letter-spacing: 0.6px;
      text-transform: uppercase;
      margin-bottom: 2px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .filter-bar-value {
      font-size: 13.5px;
      font-weight: 800;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .filter-trigger-btn {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      color: var(--purple-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s ease;
      flex-shrink: 0;
    }
    .filter-trigger-btn:active { transform: scale(0.92); }

    /* Filter Modal Controls */
    .filter-grid-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .field-label {
      font-size: 10.5px;
      font-weight: 800;
      color: var(--purple-primary);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 4px;
      display: block;
    }
    .form-input-ctrl {
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      font-size: 12.5px;
      font-weight: 700;
      outline: none;
      box-sizing: border-box;
      font-family: inherit;
    }
    .form-input-ctrl::-webkit-calendar-picker-indicator {
      filter: invert(0.8);
      cursor: pointer;
    }
    .form-select-ctrl {
      width: 100%;
      padding: 10px 30px 10px 12px;
      border-radius: 12px;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      font-size: 12.5px;
      font-weight: 700;
      outline: none;
      box-sizing: border-box;
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      cursor: pointer;
    }
    .select-wrap { position: relative; }
    .select-chevron {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--purple-primary);
      font-size: 11px;
    }

    .btn-reset-light {
      padding: 8px 16px;
      border-radius: 12px;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-search-primary {
      padding: 8px 20px;
      border-radius: 12px;
      background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
      color: #ffffff;
      font-size: 12px;
      font-weight: 800;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(124, 58, 237, 0.3);
    }

    /* Executive KPI Stats Overview Bar */
    .summary-stats-bar {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 12px 14px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow-sm);
    }
    .stats-info-col {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .stat-line-item {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-muted);
    }
    .stat-line-item strong {
      font-weight: 900;
      color: var(--text-primary);
    }
    .stat-line-item strong.purple {
      color: var(--purple-primary);
    }

    /* Verify All Toggle Pill */
    .verify-all-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 800;
      color: var(--text-primary);
      cursor: pointer;
      user-select: none;
      background: var(--bg-input);
      padding: 6px 12px;
      border-radius: 12px;
      border: 1px solid var(--border-subtle);
    }
    /* Verify Trigger Pill & Custom Checkbox */
    .verify-trigger-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      font-weight: 800;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
      padding: 4px 8px;
      border-radius: 8px;
      transition: all 0.15s ease;
    }
    .verify-trigger-pill:hover {
      background: rgba(124, 58, 237, 0.08);
      color: var(--text-primary);
    }
    .verify-trigger-pill.is-verified {
      color: #10b981;
    }

    .custom-checkbox-box {
      width: 19px;
      height: 19px;
      border-radius: 6px;
      border: 1.5px solid var(--border-subtle);
      background: var(--bg-input);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      color: transparent;
    }
    .custom-checkbox-box i {
      display: none;
      font-size: 11px;
    }
    .custom-checkbox-box.checked {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border-color: #10b981;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(16, 185, 129, 0.35);
    }
    .custom-checkbox-box.checked i {
      display: block;
    }

    /* Modal Sheet Styling */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 9000;
      display: none;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      border-radius: 44px;
      overflow: hidden;
    }
    .modal-overlay.active { opacity: 1; }

    /* Centered Popout Modal Dialog styling */
    .modal-overlay.popout-mode {
      align-items: center !important;
      justify-content: center !important;
      padding: 18px;
    }
    .popout-dialog-card {
      width: 100%;
      max-width: 380px;
      max-height: 82vh;
      background: var(--bg-card);
      border-radius: 22px;
      border: 1px solid var(--border-subtle);
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.65);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform: scale(0.9);
      opacity: 0;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s ease;
      box-sizing: border-box;
    }
    .modal-overlay.active .popout-dialog-card {
      transform: scale(1);
      opacity: 1;
    }

    /* Executive Colored Header Bar */
    .popout-hdr-colored {
      background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
      padding: 14px 18px;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }
    .popout-hdr-title {
      font-size: 15.5px;
      font-weight: 800;
      color: #ffffff;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 9px;
      letter-spacing: 0.3px;
    }
    .popout-close-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.15s ease, transform 0.15s ease;
    }
    .popout-close-btn:hover { background: rgba(255, 255, 255, 0.35); }
    .popout-close-btn:active { transform: scale(0.92); }

    .popout-body-content {
      padding: 14px 18px;
      overflow-y: auto;
      flex: 1;
    }

    .popout-footer-bar {
      padding: 12px 18px 16px;
      border-top: 1px solid var(--border-subtle);
      background: var(--bg-card);
      display: flex;
      justify-content: flex-end;
    }
    .popout-close-cta {
      width: 100%;
      padding: 11px;
      border-radius: 14px;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
      transition: background 0.15s ease;
    }
    .popout-close-cta:hover { background: rgba(124, 58, 237, 0.1); color: var(--purple-primary); }

    .bottom-sheet-card {
      width: 100%;
      max-width: 420px;
      background: var(--bg-card);
      border-top-left-radius: 28px;
      border-top-right-radius: 28px;
      border: 1px solid var(--border-subtle);
      border-bottom: none;
      padding: 16px 20px 28px;
      box-shadow: 0 -12px 36px rgba(0, 0, 0, 0.45);
      transform: translateY(100%);
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }
    .modal-overlay.active .bottom-sheet-card { transform: translateY(0); }
    
    .sheet-handle-pill {
      width: 38px;
      height: 4px;
      background: var(--border-subtle);
      border-radius: 4px;
      margin: 0 auto 16px;
      opacity: 0.7;
    }
    .sheet-title-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-subtle);
      margin-bottom: 14px;
    }
    .sheet-title-text {
      font-size: 17.5px;
      font-weight: 800;
      color: var(--text-primary);
    }
    .sheet-close-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* Toast Notification */
    .feedback-toast {
      position: absolute;
      bottom: 85px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #0f172a;
      color: #ffffff;
      padding: 9px 18px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.15);
      z-index: 10000;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .feedback-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
  <link rel="stylesheet" href="../../../css/attendance-staff.css">
</head>
<body class="staff-attendance-page">
  <preview-top-bar active-page="attendance"></preview-top-bar>

  <div class="phone-container">
    
    <!-- VIEW 1: STAFF ATTENDANCE LIST PAGE SCREEN -->
    <div id="view-list" style="display: flex; flex-direction: column; flex: 1;">
      <!-- Top Executive Header -->
      <div class="cal-top-header">
        <phone-status-bar time="17:23" style="color: #ffffff;"></phone-status-bar>
        <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 4px;">
          <div style="display: flex; align-items: center; gap: 12px;">
            <button class="header-btn-icon" onclick="javascript:history.back()" aria-label="Back" title="Back">
              <i class="fa-solid fa-chevron-left" style="font-size: 16px;"></i>
            </button>
            <div>
              <h1 style="font-size: 18.5px; font-weight: 800; color: #ffffff; margin: 0;">Staff Attendance</h1>
            </div>
          </div>
        </div>
      </div>

      <!-- Main Content -->
      <div class="main-content">
        
        <!-- 1. Consistent Executive Filter Summary Bar -->
        <div class="filter-summary-bar" id="filterBarContainer" onclick="openFilterModal()" title="Click to filter staff attendance">
          <div style="flex: 1; min-width: 0; padding-right: 8px;">
            <div class="filter-bar-label">
              <span>CURRENT FILTER</span>
            </div>
            <div class="filter-bar-value" id="filterSummaryText">
              21 Aug 2026 - 20 Sep 2026 • All Branches
            </div>
          </div>
          <button type="button" class="filter-trigger-btn" onclick="event.stopPropagation(); openFilterModal();" title="Filter Options" aria-label="Filter Options">
            <i class="fa-solid fa-sliders" style="font-size: 15px;"></i>
          </button>
        </div>

        <!-- 2. Summary KPI Overview Bar -->
        <div class="summary-stats-bar">
          <div class="stats-info-col">
            <div class="stat-line-item">Total Records: <strong id="totalRecordsText">8,804</strong></div>
            <div class="stat-line-item">Total Hours: <strong class="purple" id="totalHoursText">31,798.47 / 3,680.12</strong></div>
          </div>
          <label class="verify-all-wrap">
            <input type="checkbox" class="staff-verify-checkbox" id="staffVerifyAll" onchange="toggleVerifyAll()">
            <span class="staff-verify-box staff-verify-all-box" aria-hidden="true"><i class="fa-solid fa-check"></i></span>
            <span class="staff-verify-label" id="staffVerifyAllText">Verify All</span>
          </label>
        </div>

        <!-- 3. Staff Attendance Cards List -->
        <div id="staffCardsContainer">
          <!-- Dynamically rendered attendance cards matching exact screenshot data -->
        </div>

      </div>
      <button type="button" id="staffAttendanceUpdate" class="staff-update-button" onclick="updateStaffAttendanceVerification()" disabled>Update</button>
    </div>

    <div class="modal-overlay popout-mode" id="detailsModal" onclick="closeDetailsModal(event)">
      <section class="popout-dialog-card staff-dialog" role="dialog" aria-modal="true" aria-labelledby="staffDetailsTitle" onclick="event.stopPropagation()">
        <div class="popout-hdr-colored">
          <h2 id="staffDetailsTitle" class="popout-hdr-title">Attendance Details</h2>
          <button type="button" class="popout-close-btn" onclick="closeDetailsModalDirect()" aria-label="Close attendance details">&times;</button>
        </div>
        <div class="popout-body-content detail-popout-body">
          <table class="staff-details-table detail-popout-table record-detail-table"><tbody id="detailsModalTableBody"></tbody></table>
          <div class="attendance-detail-section-title">Leave Info</div>
          <table id="staffLeaveInfoTable" class="attendance-detail-subtable detail-popout-table record-detail-table" hidden>
            <tbody><tr><td class="detail-popout-label">Description</td><td class="detail-popout-value" id="staffLeaveInfoValue">-</td></tr></tbody>
          </table>
          <div class="attendance-detail-section-title">Overtime Info</div>
          <table id="staffOvertimeInfoTable" class="attendance-detail-subtable detail-popout-table record-detail-table" hidden>
            <tbody><tr><td class="detail-popout-label">Description</td><td class="detail-popout-value" id="staffOvertimeInfoValue">-</td></tr></tbody>
          </table>
        </div>
      </section>
    </div>

    <!-- Follow Up is a separate screen with its own header and scroll area. -->
    <section id="view-follow-up" style="display: none; flex-direction: column; flex: 1;" aria-labelledby="followUpTitle">
      <div class="cal-top-header">
        <phone-status-bar time="17:23" style="color: #ffffff;"></phone-status-bar>
        <div class="staff-follow-up-heading">
          <button type="button" class="header-btn-icon" onclick="closeFollowUpScreen()" aria-label="Back to Staff Attendance">
            <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
          </button>
          <h1 id="followUpTitle" tabindex="-1">Attendance Follow Up</h1>
        </div>
      </div>
      <form id="staffFollowUpForm" onsubmit="submitFollowUp(event)">
        <div class="main-content staff-follow-up-body">
          <div class="history-card-item staff-follow-up-context">
            <strong id="followUpEmployeeName" class="staff-hdr-name"></strong>
            <span id="followUpEmployeeId" class="staff-hdr-empno"></span>
            <div class="attendance-record-detail"><span>Date</span><strong id="followUpDate"></strong></div>
            <div class="attendance-record-detail"><span>Shift</span><strong id="followUpShift"></strong></div>
          </div>
          <div class="history-card-item staff-follow-up-field">
            <label for="followUpRemarks">Remarks</label>
            <textarea id="followUpRemarks" class="form-input-ctrl" rows="5" required maxlength="2000" placeholder="Enter follow up remarks..."></textarea>
          </div>
        </div>
        <div class="staff-follow-up-actions">
          <button type="button" id="followUpCancel" class="attendance-form-cancel" onclick="closeFollowUpScreen()"><i class="fa-solid fa-xmark" aria-hidden="true"></i><span>Cancel</span></button>
          <button type="submit" id="followUpSubmit" class="attendance-form-submit"><span>Submit</span><i class="fa-solid fa-paper-plane" aria-hidden="true"></i></button>
        </div>
      </form>
    </section>

    <div class="feedback-toast" id="feedbackToast" role="status" aria-live="polite"><span id="toastMessage"></span></div>

    <!-- MODAL 3: BOTTOM SHEET DATA FILTER MODAL (CONSISTENT DESIGN) -->
    <div class="modal-overlay" id="filterModal" onclick="closeFilterModal(event)">
      <div class="bottom-sheet-card" onclick="event.stopPropagation()" style="max-height: 82vh;">
        <div class="sheet-handle-pill"></div>
        
        <div class="sheet-title-bar">
          <h3 class="sheet-title-text" style="font-size: 18px; margin: 0;">Data Filter</h3>
          <button type="button" class="btn-reset-light" onclick="resetFilterModal()" style="border-radius: 20px; font-size: 12px; padding: 5px 14px; display: flex; align-items: center; gap: 6px;">
            <i class="fa-solid fa-rotate-left" style="font-size: 11px;"></i> Reset
          </button>
        </div>

        <div style="display: flex; flex-direction: column; overflow-y: auto; flex: 1; padding-right: 2px; gap: 14px;">
          
          <!-- Keyword -->
          <div>
            <label class="field-label">Keyword:</label>
            <input type="text" id="filterKeyword" class="form-input-ctrl" placeholder="Search by name or employee ID...">
          </div>

          <!-- Start Date & End Date Grid -->
          <div class="filter-grid-2col">
            <div>
              <label class="field-label">Start Date:</label>
              <input type="date" id="filterStartDate" class="form-input-ctrl" value="2026-08-21">
            </div>
            <div>
              <label class="field-label">End Date:</label>
              <input type="date" id="filterEndDate" class="form-input-ctrl" value="2026-09-20">
            </div>
          </div>

          <!-- Filter By, followed by Branch on its own row -->
          <div class="staff-filter-stacked-fields">
            <div>
              <label class="field-label">Filter By:</label>
              <div class="select-wrap">
                <select id="filterBySelect" class="form-select-ctrl">
                  <option value="all" selected>- All -</option>
                  <option value="work_day">Work Day</option>
                  <option value="late">Late In</option>
                  <option value="early">Early Out</option>
                  <option value="absent">Absent</option>
                </select>
                <div class="select-chevron"><i class="fa-solid fa-chevron-down"></i></div>
              </div>
            </div>
            <div>
              <label class="field-label">Branch:</label>
              <div class="select-wrap">
                <select id="filterBranchSelect" class="form-select-ctrl">
                  <option value="all" selected>- All Branches -</option>
                  <option value="HQ - KL Main">HQ - KL Main</option>
                  <option value="Penang Branch">Penang Branch</option>
                  <option value="Johor Bahru Branch">Johor Bahru Branch</option>
                </select>
                <div class="select-chevron"><i class="fa-solid fa-chevron-down"></i></div>
              </div>
            </div>
          </div>

          <!-- Department -->
          <div>
            <label class="field-label">Department:</label>
            <div class="select-wrap">
              <select id="filterDeptSelect" class="form-select-ctrl">
                <option value="all" selected>- All Departments -</option>
                <option value="HUMAN RESOURCE">Human Resources Department</option>
                <option value="ACCOUNTS">Accounts Department</option>
                <option value="PLANT OPERATIONS">Plant Operations Department</option>
              </select>
              <div class="select-chevron"><i class="fa-solid fa-chevron-down"></i></div>
            </div>
          </div>

          <!-- Apply Filter Button -->
          <button type="button" class="btn-search-primary" style="width: 100%; margin-top: 6px; padding: 14px; border-radius: 16px; font-size: 14.5px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px;" onclick="applyFilterModal()">
            <i class="fa-solid fa-filter" style="font-size: 13px;"></i>
            <span>Apply Filter</span>
          </button>
        </div>
      </div>
    </div>

  </div>

  <script>
    const masterStaffDataset = [
      {
        empNo: '#000008',
        cleanEmpNo: '000008',
        name: 'Aqilah antasha',
        date: '20 Sep 2026',
        shift: '8.30AM-5.30PM (W01)',

      {

        otHours: '0.00',
        exception: '-',

        dept: 'HUMAN RESOURCE',
        verified: false
      },
      {
        empNo: '#000100',
        cleanEmpNo: '000100',
        name: 'Loh Siew Hong',
        date: '20 Sep 2026',
        shift: '8.30AM-5.30PM (W01)',
        times: '08:05',
        normalHours: '8.00',
        otHours: '1.50',
        exception: '-',
        dayType: 'Work Day',
        shiftGroup: 'GROUP A',
        supervisor: 'Lee Soon Hock',
        clockTimes: '08:05',

      {

        dayType: 'Work Day',

        lateIn: '-',

        absent: 'No',
        approvedOt: '0.00',
        unapprovedOt: '0.00',
        docNo: '-',
        leaveInfo: '-',
        otInfo: '-',
        branch: 'Johor Bahru Branch',
        dept: 'PLANT OPERATIONS',
        verified: false
      }
    ];

    function openFilterModal() {
      const modal = document.getElementById('filterModal');
      if (!modal) return;
      modal.style.display = 'flex';
      setTimeout(() => { modal.classList.add('active'); }, 10);
    }

    function closeFilterModal(e) {
      if (e && e.target !== e.currentTarget) return;
      closeFilterModalDirect();
    }
    function closeFilterModalDirect() {
      const modal = document.getElementById('filterModal');
      if (!modal) return;
      modal.classList.remove('active');
      setTimeout(() => { modal.style.display = 'none'; }, 260);
    }

    function updateFilterSummaryDisplay() {
      const startDate = document.getElementById('filterStartDate')?.value || '';
      const endDate = document.getElementById('filterEndDate')?.value || '';
      const branch = document.getElementById('filterBranchSelect')?.value || 'all';

      let parts = [];
      if (startDate && endDate) {
        parts.push(`${formatDateShort(startDate)} - ${formatDateShort(endDate)}`);
      }
      if (branch !== 'all') {
        parts.push(branch);
      } else {
        parts.push('All Branches');
      }

      document.getElementById('filterSummaryText').innerText = parts.join(' • ');
    }

    function formatDateShort(dateStr) {
      if (!dateStr) return '';
      const parts = dateStr.split('-');
      if (parts.length !== 3) return dateStr;
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      return `${parts[2]} ${months[parseInt(parts[1], 10) - 1]} ${parts[0]}`;
    }

    function resetFilterModal() {
      if (document.getElementById('filterKeyword')) document.getElementById('filterKeyword').value = '';
      if (document.getElementById('filterStartDate')) document.getElementById('filterStartDate').value = '2026-08-21';
      if (document.getElementById('filterEndDate')) document.getElementById('filterEndDate').value = '2026-09-20';
      if (document.getElementById('filterBySelect')) document.getElementById('filterBySelect').value = 'all';
      if (document.getElementById('filterBranchSelect')) document.getElementById('filterBranchSelect').value = 'all';
      if (document.getElementById('filterDeptSelect')) document.getElementById('filterDeptSelect').value = 'all';
      
      updateFilterSummaryDisplay();
      closeFilterModalDirect();
      renderStaffCards();
      showToast('Filters reset to default');
    }

    function applyFilterModal() {
      updateFilterSummaryDisplay();
      closeFilterModalDirect();
      renderStaffCards();
      showToast('Filter applied successfully');
    }

    function getFilteredStaffRecords() {
      const keyword = document.getElementById('filterKeyword')?.value.toLowerCase().trim() || '';
      const branchFilter = document.getElementById('filterBranchSelect')?.value || 'all';
      const deptFilter = document.getElementById('filterDeptSelect')?.value || 'all';
      
      return masterStaffDataset.filter(item => {
        const matchKeyword = (!keyword || item.name.toLowerCase().includes(keyword) || item.cleanEmpNo.includes(keyword) || item.empNo.includes(keyword));
        const matchBranch = (branchFilter === 'all' || item.branch === branchFilter);
        const matchDept = (deptFilter === 'all' || item.dept === deptFilter);
        return matchKeyword && matchBranch && matchDept;
      });
    }

    const staffSavedVerification = new Map(masterStaffDataset.map(item => [item.cleanEmpNo, item.verified]));
    let renderedStaffRecords = [];
    function syncStaffAttendanceUpdate() {
      document.getElementById('staffAttendanceUpdate').disabled = !masterStaffDataset.some(item => item.verified !== staffSavedVerification.get(item.cleanEmpNo));
    }

    function updateStaffAttendanceVerification() {
      // Commit verification to this static preview's record state.
      masterStaffDataset.forEach(item => staffSavedVerification.set(item.cleanEmpNo, item.verified));
      syncStaffAttendanceUpdate();
      document.getElementById('staffVerifyAll').focus({ preventScroll: true });
      showToast('Attendance verification updated');
    }

    function renderStaffCards(filtered = getFilteredStaffRecords()) {
      renderedStaffRecords = [...filtered];

      document.getElementById('totalRecordsText').innerText = filtered.length.toLocaleString();
      const normalHours = filtered.reduce((total, item) => total + Number(item.normalHours), 0);
      const otHours = filtered.reduce((total, item) => total + Number(item.otHours), 0);
      document.getElementById('totalHoursText').textContent = `${normalHours.toFixed(2)} / ${otHours.toFixed(2)}`;
      const verifyAll = document.getElementById('staffVerifyAll');
      const verifiedCount = filtered.filter(item => item.verified).length;
      verifyAll.checked = filtered.length > 0 && verifiedCount === filtered.length;
      verifyAll.indeterminate = false;
      verifyAll.disabled = !filtered.length;
      document.getElementById('staffVerifyAllText').textContent = verifyAll.checked ? 'Verified All' : 'Verify All';
      syncStaffAttendanceUpdate();

      const container = document.getElementById('staffCardsContainer');
      if (!container) return;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; padding: 32px 16px; color: var(--text-muted); font-size: 13px;">
            No staff attendance records found matching search filter.
          </div>
        `;
        return;
      }

      container.replaceChildren();
      for (const item of filtered) {
        const hasException = Boolean(item.exception && item.exception !== '-' && item.exception !== 'No Exception');
        const card = document.createElement('article');
        card.className = `history-card-item staff-card-item${hasException ? ' exception-theme' : ''}`;
        card.dataset.empNo = item.cleanEmpNo;
        card.innerHTML = '<div class="attendance-record-top"><button type="button" class="staff-card-details-trigger"><span class="staff-hdr-name"></span><span class="staff-hdr-empno"></span><span class="history-time-row"></span><span class="attendance-record-reference"></span></button><div class="attendance-record-controls"><label class="staff-verify-control"><input type="checkbox" class="staff-verify-checkbox"><span class="staff-verify-box" aria-hidden="true"><i class="fa-solid fa-check"></i></span><span class="staff-verify-label">Verify</span></label><span class="attendance-exception-status"></span></div></div><div class="attendance-record-summary-panel"></div><div class="staff-card-actions"><button type="button" class="btn-action-feedback">Feedback</button><button type="button" class="btn-action-follow-up">Follow Up</button></div>';
        card.querySelector('.staff-hdr-name').textContent = item.name;
        card.querySelector('.staff-hdr-empno').textContent = `#${item.empNo.replace(/^#/, '')}`;
        card.querySelector('.history-time-row').textContent = `Shift: ${item.shift}`;
        card.querySelector('.attendance-record-reference').textContent = `Date: ${item.date}`;
        const details = card.querySelector('.staff-card-details-trigger');
        details.setAttribute('aria-label', `Attendance details for ${item.name}, ${item.empNo}, ${item.date}, ${item.shift}`);
        details.addEventListener('click', () => openDetailsModal(item.cleanEmpNo));
        const verify = card.querySelector('.staff-verify-checkbox');
        verify.checked = item.verified;
        card.querySelector('.staff-verify-label').textContent = item.verified ? 'Verified' : 'Verify';
        verify.setAttribute('aria-label', `Verify attendance for ${item.name}, ${item.date}`);
        verify.addEventListener('change', () => toggleSingleVerify(item.cleanEmpNo));
        const status = card.querySelector('.attendance-exception-status');
        status.classList.toggle('is-exception', hasException);
        status.textContent = hasException ? item.exception : 'No Exception';
        const panel = card.querySelector('.attendance-record-summary-panel');
        for (const [label, value] of [['Times', item.times], ['Normal Hours', item.normalHours], ['OT Hours', item.otHours]]) {
          const row = document.createElement('div');
          row.className = 'attendance-record-detail';
          const key = document.createElement('span');
          key.textContent = label;
          const text = document.createElement('strong');
          text.textContent = value;
          row.append(key, text);
          panel.append(row);
        }
        card.querySelector('.btn-action-feedback').addEventListener('click', () => openFeedbackModal(item.cleanEmpNo));
        card.querySelector('.btn-action-follow-up').addEventListener('click', () => openFollowUpScreen(item.cleanEmpNo));
        container.append(card);
      }
    }

    function toggleSingleVerify(cleanEmpNo) {
      const item = masterStaffDataset.find(x => x.cleanEmpNo === cleanEmpNo);
      if (item) {
        item.verified = !item.verified;
        renderStaffCards(renderedStaffRecords);
        document.querySelector(`[data-emp-no="${cleanEmpNo}"] .staff-verify-checkbox`)?.focus({ preventScroll: true });
        showToast(`Verification ${item.verified ? 'checked' : 'unchecked'} for #${cleanEmpNo}`);
      }
    }

    function toggleVerifyAll() {
      const filtered = renderedStaffRecords;
      const verifyAllActive = filtered.some(item => !item.verified);
      filtered.forEach(item => { item.verified = verifyAllActive; });
      renderStaffCards(filtered);
      showToast(verifyAllActive ? 'All records verified' : 'Cleared verify all');
    }

    /* Modal 1: Details */
    let attendanceDialogReturnFocus = null;
    function openDetailsModal(cleanEmpNo) {
      const item = masterStaffDataset.find(x => x.cleanEmpNo === cleanEmpNo);
      if (!item) return;
      attendanceDialogReturnFocus = document.activeElement;

      const rows = [
        { key: 'Employee #', val: `#${item.empNo.replace(/^#/, '')}` },
        { key: 'Name', val: item.name },
        { key: 'Date', val: item.date },
        { key: 'Shift', val: item.shift },
        { key: 'Day Type', val: item.dayType },
        { key: 'Shift Group', val: item.shiftGroup },
        { key: 'Supervisor', val: item.supervisor },
        { key: 'Clock Times', val: item.clockTimes },
        { key: 'Normal Hours', val: item.normalHours },
        { key: 'Late In', val: item.lateIn },
        { key: 'Early Out', val: item.earlyOut },
        { key: 'Time Off', val: item.timeOff },
        { key: 'Absent', val: item.absent },
        { key: 'Approved OT Hours', val: item.approvedOt },
        { key: 'Unapproved OT Hours', val: item.unapprovedOt },
        { key: 'Exception', val: item.exception },
        { key: 'Document #', val: item.docNo }
      ];

      const tbody = document.getElementById('detailsModalTableBody');
      if (tbody) {
        tbody.innerHTML = rows.map(r => `
          <tr>
            <td class="detail-popout-label">${r.key}</td>
            <td class="detail-popout-value">${r.val}</td>
          </tr>
        `).join('');
      }

      const leaveInfo = String(item.leaveInfo || '').trim();
      const hasLeaveInfo = Boolean(leaveInfo && leaveInfo !== '-');
      document.getElementById('staffLeaveInfoValue').textContent = hasLeaveInfo ? leaveInfo : '-';
      document.getElementById('staffLeaveInfoTable').hidden = !hasLeaveInfo;

      const overtimeInfo = String(item.otInfo || '').trim();
      const hasOvertimeInfo = Boolean(overtimeInfo && overtimeInfo !== '-');
      document.getElementById('staffOvertimeInfoValue').textContent = hasOvertimeInfo ? overtimeInfo : '-';
      document.getElementById('staffOvertimeInfoTable').hidden = !hasOvertimeInfo;

      const modal = document.getElementById('detailsModal');
      if (modal) {
        modal.style.display = 'flex';
        modal.getBoundingClientRect();
        modal.classList.add('active');
        modal.querySelector('.popout-close-btn').focus({ preventScroll: true });
      }
    }

    function closeDetailsModal(e) {
      if (e && e.target !== e.currentTarget) return;
      closeDetailsModalDirect();
    }
    function closeDetailsModalDirect() {
      const modal = document.getElementById('detailsModal');
      if (!modal) return;
      const wasOpen = modal.style.display === 'flex';
      modal.classList.remove('active');
      setTimeout(() => { if (!modal.classList.contains('active')) modal.style.display = 'none'; }, 260);
      if (wasOpen) attendanceDialogReturnFocus?.focus({ preventScroll: true });
    }

    let followUpRecord = null;
    let followUpReturnFocus = null;
    function openFollowUpScreen(cleanEmpNo) {
      const item = masterStaffDataset.find(record => record.cleanEmpNo === cleanEmpNo);
      if (!item) return;
      followUpRecord = item;
      followUpReturnFocus = document.activeElement;
      document.getElementById('followUpEmployeeName').textContent = item.name;
      document.getElementById('followUpEmployeeId').textContent = `#${item.empNo.replace(/^#/, '')}`;
      document.getElementById('followUpDate').textContent = item.date;
      document.getElementById('followUpShift').textContent = item.shift;
      document.getElementById('staffFollowUpForm').reset();
      document.getElementById('followUpRemarks').setCustomValidity('');
      document.getElementById('view-list').style.display = 'none';
      const view = document.getElementById('view-follow-up');
      view.style.display = 'flex';
      view.querySelector('.main-content').scrollTop = 0;
      document.getElementById('followUpTitle').focus({ preventScroll: true });
    }

    function closeFollowUpScreen() {
      const view = document.getElementById('view-follow-up');
      const wasOpen = view.style.display === 'flex';
      if (!wasOpen) return;
      view.style.display = 'none';
      document.getElementById('view-list').style.display = 'flex';
      followUpRecord = null;
      followUpReturnFocus?.focus({ preventScroll: true });
    }

    function submitFollowUp(event) {
      event.preventDefault();
      const field = document.getElementById('followUpRemarks');
      const remarks = field.value.trim();
      field.setCustomValidity(remarks ? '' : 'Please enter remarks.');
      if (!field.reportValidity() || !followUpRecord) return;
      // This static preview stores submissions on the selected attendance record.
      followUpRecord.followUps ??= [];
      followUpRecord.followUps.push({ remarks, date: followUpRecord.date, shift: followUpRecord.shift, submittedAt: new Date().toISOString() });
      closeFollowUpScreen();
      showToast('Follow up submitted');
    }

    document.getElementById('followUpRemarks').addEventListener('input', event => event.target.setCustomValidity(''));

    // Reuse Individual Attendance's actual Feedback screen and form behavior.
    const staffFeedbackStateKey = 'staff-attendance:feedback-return';
    const staffFilterFieldIds = ['filterKeyword', 'filterStartDate', 'filterEndDate', 'filterBySelect', 'filterBranchSelect', 'filterDeptSelect'];
    function openFeedbackModal(cleanEmpNo) {
      const item = masterStaffDataset.find(record => record.cleanEmpNo === cleanEmpNo);
      if (!item) return;
      const state = {
        returnToken: crypto.randomUUID?.() || `${Date.now()}-${Math.random()}`,
        records: masterStaffDataset.map(record => ({ id: record.cleanEmpNo, verified: record.verified, followUps: record.followUps || [] })),
        savedVerification: [...staffSavedVerification],
        visibleIds: renderedStaffRecords.map(record => record.cleanEmpNo),
        filterValues: Object.fromEntries(staffFilterFieldIds.map(id => [id, document.getElementById(id).value])),
        filterSummary: document.getElementById('filterSummaryText').textContent,
        scrollTop: document.querySelector('#view-list .main-content').scrollTop,
        employeeId: item.cleanEmpNo
      };
      try { sessionStorage.setItem(staffFeedbackStateKey, JSON.stringify(state)); } catch (error) { /* Navigation works even when browser storage is unavailable. */ }
      const url = new URL('attendance.html', window.location.href);
      url.search = new URLSearchParams({
        theme: document.documentElement.dataset.theme,
        feedbackReturnToken: state.returnToken,
        feedbackFrom: 'staff-attendance', feedbackDate: item.date, feedbackShift: item.shift,
        feedbackClockTimes: item.clockTimes, feedbackEmployeeName: item.name, feedbackEmployeeNo: item.cleanEmpNo
      });
      window.location.href = url.href;
    }

    function restoreStaffFeedbackState() {
      let state;
      try {
        state = JSON.parse(sessionStorage.getItem(staffFeedbackStateKey));
        sessionStorage.removeItem(staffFeedbackStateKey);
      } catch (error) { return false; }
      if (!state || !Array.isArray(state.records) || !Array.isArray(state.visibleIds)) return false;
      for (const saved of state.records) {
        const record = masterStaffDataset.find(item => item.cleanEmpNo === saved.id);
        if (!record) continue;
        record.verified = !!saved.verified;
        record.followUps = Array.isArray(saved.followUps) ? saved.followUps : [];
      }
      for (const [id, verified] of state.savedVerification || []) {
        if (staffSavedVerification.has(id)) staffSavedVerification.set(id, !!verified);
      }
      for (const id of staffFilterFieldIds) {
        if (typeof state.filterValues?.[id] === 'string') document.getElementById(id).value = state.filterValues[id];
      }
      document.getElementById('filterSummaryText').textContent = state.filterSummary || '';
      renderStaffCards(state.visibleIds.map(id => masterStaffDataset.find(item => item.cleanEmpNo === id)).filter(Boolean));
      document.querySelector('#view-list .main-content').scrollTop = state.scrollTop || 0;
      const card = [...document.querySelectorAll('.staff-card-item')].find(node => node.dataset.empNo === state.employeeId);
      card?.querySelector('.btn-action-feedback').focus({ preventScroll: true });
      return true;
    }

    // A browser Back restored from its cache already has the original list state.
    window.addEventListener('pageshow', event => {
      if (event.persisted) {
        try { sessionStorage.removeItem(staffFeedbackStateKey); } catch (error) { /* Storage can be disabled. */ }
      }
    });

    function showInfoHelp() { showToast('Staff Attendance Help & Info'); }
    function showOptionsHelp() { showToast('More Attendance Options'); }

    function showToast(msg) {
      const toast = document.getElementById('feedbackToast');
      const text = document.getElementById('toastMessage');
      if (!toast || !text) return;
      text.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => { toast.classList.remove('show'); }, 2200);
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeFollowUpScreen();
        closeDetailsModalDirect();
        closeFilterModalDirect();
      }
      if (e.key === 'Tab') {
        const modal = document.querySelector('#detailsModal.active');
        if (!modal) return;
        const controls = [...modal.querySelectorAll('button, textarea, input, select')].filter(control => !control.disabled);
        const first = controls[0];
        const last = controls[controls.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      if (!restoreStaffFeedbackState()) {
        updateFilterSummaryDisplay();
        renderStaffCards();
      }
    });
  </script>
