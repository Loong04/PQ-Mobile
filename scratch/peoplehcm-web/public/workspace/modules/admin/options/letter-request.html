<!DOCTYPE html>
<html lang="en" data-theme="light" data-peoplehcm-web="" data-web-native="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleHCM - Letter Request</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="/vendor/fonts.css" rel="stylesheet">
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="../../../css/theme.css">
  <link rel="stylesheet" href="../../../css/app.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../../../css/claim-forms.css">
  <link rel="stylesheet" href="../../../css/form-section-headings.css">
  <link rel="stylesheet" href="../css/letter-request.css">
  <script src="../../../js/components.js"></script>
  <script src="../../../js/app.js" defer></script>
  <script src="../js/admin-app.js" defer></script>
  <script src="../js/workplace-history-store.js" defer></script>
  <script src="../js/letter-request.js" defer></script>
<link rel="stylesheet" href="/web-adapter/desktop.css" data-web-presentation>
</head>
<body class="admin-page letter-request-page">
  <preview-top-bar active-page="workplace"></preview-top-bar>
  <div class="phone-container">
    <header class="admin-header">
      <phone-status-bar time="9:41"></phone-status-bar>
      <div class="admin-header-row">
        <a class="admin-back" data-admin-back href="../index.html" aria-label="Back to Workplace"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></a>
        <div class="admin-heading"><h1>Letter Request</h1></div>
        <span aria-hidden="true"></span>
      </div>
    </header>
    <main class="main-content admin-content">
      <form id="letterRequestForm" novalidate>
        <div class="claim-form-card">
          <section class="letter-request-section" aria-labelledby="letterRequestDetailsHeading">
            <h2 id="letterRequestDetailsHeading" class="form-section-heading">Letter Details</h2>
            <div class="claim-form-stack">
              <div class="claim-field"><label class="claim-field-label" for="letterRequestType">Letter Type</label><div class="letter-request-select"><select id="letterRequestType" name="letterType" class="claim-control" aria-describedby="letterRequestFeedback"><option value="">All Types</option><option value="employment-confirmation">Employment Confirmation</option><option value="salary-confirmation">Salary Confirmation</option><option value="visa-support">Visa Support</option><option value="other">Other</option></select><i class="fa-solid fa-chevron-down" aria-hidden="true"></i></div></div>
              <div class="claim-field"><label class="claim-field-label" for="letterRequestDescription">Description</label><input id="letterRequestDescription" name="description" class="claim-control" type="text" placeholder="Enter letter description" maxlength="1000"></div>
            </div>
          </section>
          <section class="letter-request-section" aria-labelledby="letterRequestMergeHeading">
            <h2 id="letterRequestMergeHeading" class="form-section-heading">Merge Text</h2>
            <div class="claim-form-stack">
              <div class="claim-field"><label class="claim-field-label" for="letterRequestMerge1">1st Merge Text</label><input id="letterRequestMerge1" name="mergeText1" class="claim-control" type="text" placeholder="Enter first merge text" maxlength="2000"></div>
              <div class="claim-field"><label class="claim-field-label" for="letterRequestMerge2">2nd Merge Text</label><input id="letterRequestMerge2" name="mergeText2" class="claim-control" type="text" placeholder="Enter second merge text" maxlength="2000"></div>
              <div class="claim-field"><label class="claim-field-label" for="letterRequestMerge3">3rd Merge Text</label><input id="letterRequestMerge3" name="mergeText3" class="claim-control" type="text" placeholder="Enter third merge text" maxlength="2000"></div>
            </div>
          </section>
          <section class="letter-request-section" aria-labelledby="letterRequestReasonHeading">
            <h2 id="letterRequestReasonHeading" class="form-section-heading">Request Details</h2>
            <div class="claim-form-stack">
              <div class="claim-field"><label class="claim-field-label" for="letterRequestReason">Reason</label><input id="letterRequestReason" name="reason" class="claim-control" type="text" placeholder="Enter request reason" maxlength="1000"></div>
              <div class="claim-field"><label class="claim-field-label" for="letterRequestRemarks">Remarks</label><textarea id="letterRequestRemarks" name="remarks" class="claim-control" placeholder="Add remarks" maxlength="5000"></textarea></div>
            </div>
          </section>
        </div>
        <p id="letterRequestFeedback" class="letter-request-feedback" role="status" aria-live="polite" hidden></p>
        <div class="letter-request-actions"><a id="letterRequestCancel" class="form-cancel-btn" data-admin-back href="../index.html"><i class="fa-solid fa-xmark" aria-hidden="true"></i><span>Cancel</span></a><button id="letterRequestSubmit" class="claim-button claim-button-primary" type="submit"><span>Submit</span><i class="fa-solid fa-paper-plane" aria-hidden="true"></i></button></div>
      </form>
    </main>
    <phone-bottom-nav active="apps"></phone-bottom-nav>
  </div>
<script src="/web-adapter/translations.js" defer data-web-presentation></script><script src="/web-adapter/bridge.js" defer data-web-presentation></script><script type="module" src="/web-entry.js" data-web-presentation></script>
</body>
</html>
