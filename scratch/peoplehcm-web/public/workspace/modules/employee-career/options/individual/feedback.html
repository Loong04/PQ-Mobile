<!DOCTYPE html>
<html lang="en" data-theme="light" data-peoplehcm-web="" data-web-native="">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleHCM - Feedback</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="/vendor/fonts.css" rel="stylesheet">
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="../../../../css/theme.css"><link rel="stylesheet" href="../../../../css/app.css"><link rel="stylesheet" href="../../css/employee-career.css">
  <link rel="stylesheet" href="../../css/employee-career-forms.css">
  <script src="../../../../js/components.js"></script><script src="../../../../js/app.js" defer></script><script src="../../js/employee-career-forms.js" defer></script>
  <link rel="stylesheet" href="../../../../css/form-section-headings.css">
<link rel="stylesheet" href="/web-adapter/desktop.css" data-web-presentation>
</head>
<body class="employee-career-option-page employee-career-form-page">
  <preview-top-bar active-page="v2"></preview-top-bar>
  <div class="phone-container">
    <header class="employee-career-header"><phone-status-bar time="9:41"></phone-status-bar><div class="employee-career-header-row"><a class="employee-career-back" data-option-back href="../../index.html?scope=individual" aria-label="Back to Employee and Career"><i class="fa-solid fa-chevron-left"></i></a><div class="employee-career-heading"><h1>Feedback</h1></div><span class="employee-career-header-spacer"></span></div></header>
    <main class="main-content employee-career-content">
      <form id="feedbackForm" novalidate>
        <section class="employee-career-form-card" aria-labelledby="feedbackDetailsTitle">
        <div class="employee-career-form-heading"><span aria-hidden="true"></span><h2 id="feedbackDetailsTitle">Feedback Details</h2></div>
        <div class="employee-career-form-grid">
          <div class="employee-career-field"><label for="feedbackType">Feedback Type</label><select id="feedbackType" class="employee-career-control"><option value="">Select Feedback Type</option><option>General</option><option>Suggestion</option><option>Compliment</option><option>Complaint</option></select></div>
          <div class="employee-career-field"><label for="feedbackCategory">Category</label><select id="feedbackCategory" class="employee-career-control"><option value="">Select Category</option><option>Workplace</option><option>Management</option><option>Policy</option><option>Facilities</option><option>Other</option></select></div>
        </div>
        <div class="employee-career-field"><label for="feedbackTitle">Title</label><input id="feedbackTitle" class="employee-career-control" type="text" placeholder="Enter feedback title"></div>
        <div class="employee-career-form-grid">
          <div class="employee-career-field"><label for="feedbackDate1">Feedback Date 1</label><input id="feedbackDate1" class="employee-career-control" type="date"></div>
          <div class="employee-career-field"><label for="feedbackDate2">Feedback Date 2</label><input id="feedbackDate2" class="employee-career-control" type="date"></div>
        </div>
        <div class="employee-career-form-grid">
          <div class="employee-career-field"><label for="feedbackReference1">Reference 1</label><input id="feedbackReference1" class="employee-career-control" type="text" placeholder="Enter reference"></div>
          <div class="employee-career-field"><label for="feedbackReference2">Reference 2</label><input id="feedbackReference2" class="employee-career-control" type="text" placeholder="Enter reference"></div>
        </div>
        <div class="employee-career-field"><label for="feedbackBody">Your Feedback</label><textarea id="feedbackBody" class="employee-career-control" placeholder="Write your feedback"></textarea></div>
        <div class="employee-career-field"><label for="feedbackRemarks">Remarks</label><textarea id="feedbackRemarks" class="employee-career-control" placeholder="Add remarks"></textarea></div>
        <fieldset class="employee-career-field employee-career-fieldset"><legend class="form-section-heading">Upload Attachments</legend><div class="employee-career-upload-actions"><button class="employee-career-upload-button" type="button" data-file-picker="feedbackFiles"><span class="employee-career-upload-icon"><i class="fa-solid fa-file-arrow-up" aria-hidden="true"></i></span><span>Select File(s)</span></button><button class="employee-career-upload-button" type="button" data-file-picker="feedbackCamera"><span class="employee-career-upload-icon"><i class="fa-solid fa-camera" aria-hidden="true"></i></span><span>Take a Picture</span></button></div><input id="feedbackFiles" type="file" multiple hidden><input id="feedbackCamera" type="file" accept="image/*" capture="environment" hidden><div id="feedbackAttachments" class="form-attachment-list" aria-live="polite"></div></fieldset>
        </section>
        <div class="employee-career-form-actions"><a class="form-cancel-btn" data-option-back href="../../index.html?scope=individual"><i class="fa-solid fa-xmark" aria-hidden="true"></i><span>Cancel</span></a><button class="employee-career-button primary" id="feedbackSubmit" type="submit"><span>Submit</span><i class="fa-solid fa-paper-plane" aria-hidden="true"></i></button></div>
      </form>
    </main>
    <div id="employeeCareerToast" class="employee-career-toast" role="status" aria-live="polite"></div><phone-bottom-nav active="apps"></phone-bottom-nav>
  </div>
<script src="/web-adapter/translations.js" defer data-web-presentation></script><script src="/web-adapter/bridge.js" defer data-web-presentation></script><script type="module" src="/web-entry.js" data-web-presentation></script>
</body>
</html>
