<!DOCTYPE html>
<html lang="en" data-theme="light" data-peoplehcm-web="" data-web-native="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleHCM - Employee &amp; Career History</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="/vendor/fonts.css" rel="stylesheet">
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="../../../css/theme.css">
  <link rel="stylesheet" href="../../../css/app.css">
  <link rel="stylesheet" href="../../../css/claim-forms.css">
  <link rel="stylesheet" href="../../../css/history-cards.css">
  <link rel="stylesheet" href="../../../css/payroll-history.css">
  <link rel="stylesheet" href="../css/employee-career.css">
  <link rel="stylesheet" href="../css/employee-career-history.css">
  <script src="../../../js/components.js"></script>
  <script src="../../../js/app.js" defer></script>
  <script src="../js/employee-career-history-data.js" defer></script>
  <script src="../js/employee-career-history.js" defer></script>
<link rel="stylesheet" href="/web-adapter/desktop.css" data-web-presentation>
</head>
<body class="employee-career-option-page career-history-page">
  <preview-top-bar active-page="v2"></preview-top-bar>
  <div class="phone-container payroll-history-phone career-history-phone">
    <header class="employee-career-header">
      <phone-status-bar time="9:41"></phone-status-bar>
      <div class="employee-career-header-row">
        <a id="careerHistoryBack" class="employee-career-back" href="../index.html?scope=individual" aria-label="Back to Employee and Career"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></a>
        <div class="employee-career-heading"><h1>History</h1></div>
        <span class="employee-career-header-spacer" aria-hidden="true"></span>
      </div>
    </header>
    <main class="main-content">
      <div class="history-categories" aria-label="History categories">
        <div class="me-jump-bar">
          <button class="me-jump-pill active" type="button" data-history-kind="feedback" aria-pressed="true">Feedback</button>
          <button class="me-jump-pill" type="button" data-history-kind="whereabout" aria-pressed="false">Whereabout</button>
        </div>
      </div>
      <button id="historyFilterTrigger" class="claim-filter-bar" type="button" aria-haspopup="dialog" aria-controls="historyFilterModal">
        <span class="claim-filter-copy"><span class="claim-eyebrow">Current Filter</span><span id="historyFilterSummary" class="claim-filter-value">All Feedback</span></span>
        <span class="claim-icon-button" aria-hidden="true"><i class="fa-solid fa-sliders"></i></span>
      </button>
      <div class="history-section-heading"><h2 id="historyCategoryTitle">Feedback History</h2><span id="historyRecordCount" aria-live="polite"></span></div>
      <div id="careerHistoryList" aria-live="polite"></div>
      <div id="historyEmptyState" class="history-empty" hidden><i class="fa-regular fa-folder-open" aria-hidden="true"></i><h3>No records found</h3><p>Try another filter.</p></div>
    </main>
    <phone-bottom-nav active="apps"></phone-bottom-nav>
    <div id="historyFilterModal" class="claim-filter-sheet" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="historyFilterTitle">
      <form id="historyFilterForm" class="claim-filter-panel" novalidate>
        <div class="claim-filter-handle" aria-hidden="true"></div>
        <div class="claim-filter-header">
          <h2 id="historyFilterTitle" class="claim-filter-title">Filter Feedback History</h2>
          <div class="claim-filter-header-actions">
            <button id="resetHistoryFilter" type="button" class="claim-filter-reset"><i class="fa-solid fa-rotate-left" aria-hidden="true"></i><span>Reset</span></button>
            <button id="closeHistoryFilter" type="button" class="claim-filter-close" aria-label="Close filter"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
          </div>
        </div>
        <div class="claim-filter-fields">
          <div id="feedbackHistoryFields">
            <div class="history-date-fields">
              <div><label for="historyDateFrom" class="claim-filter-label">Start Date</label><input id="historyDateFrom" class="claim-control" type="date"></div>
              <div><label for="historyDateTo" class="claim-filter-label">End Date</label><input id="historyDateTo" class="claim-control" type="date"></div>
            </div>
            <div><label for="historyFeedbackType" class="claim-filter-label">Feedback Type</label><div class="claim-filter-select-wrap"><select id="historyFeedbackType" class="claim-filter-select"></select><i class="fa-solid fa-chevron-down claim-filter-chevron" aria-hidden="true"></i></div></div>
            <div><label for="historyFeedbackCategory" class="claim-filter-label">Feedback Category</label><div class="claim-filter-select-wrap"><select id="historyFeedbackCategory" class="claim-filter-select"></select><i class="fa-solid fa-chevron-down claim-filter-chevron" aria-hidden="true"></i></div></div>
            <div><label for="historyStatus" class="claim-filter-label">Status</label><div class="claim-filter-select-wrap"><select id="historyStatus" class="claim-filter-select"><option value="">All Status</option><option value="submitted">Submitted</option></select><i class="fa-solid fa-chevron-down claim-filter-chevron" aria-hidden="true"></i></div></div>
          </div>
          <div id="whereaboutHistoryFields" class="history-date-fields" hidden>
            <div><label for="historyYear" class="claim-filter-label">Year</label><div class="claim-filter-select-wrap"><select id="historyYear" class="claim-filter-select"></select><i class="fa-solid fa-chevron-down claim-filter-chevron" aria-hidden="true"></i></div></div>
            <div><label for="historyMonth" class="claim-filter-label">Month</label><div class="claim-filter-select-wrap"><select id="historyMonth" class="claim-filter-select"><option value="">All Months</option></select><i class="fa-solid fa-chevron-down claim-filter-chevron" aria-hidden="true"></i></div></div>
          </div>
          <p id="historyFilterError" class="history-filter-error" role="alert" hidden></p>
        </div>
        <button id="applyHistoryFilter" class="claim-filter-apply" type="submit">Apply Filter</button>
      </form>
    </div>
    <div id="historyDetailsModal" class="history-detail-overlay" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="historyDetailTitle">
      <section class="history-detail-panel">
        <div class="history-detail-header"><h2 id="historyDetailTitle">Feedback Detail</h2><button id="closeHistoryDetails" type="button" aria-label="Close details"><i class="fa-solid fa-circle-xmark" aria-hidden="true"></i></button></div>
        <div id="historyDetailBody" class="history-detail-body"></div>
      </section>
    </div>
  </div>
<script src="/web-adapter/translations.js" defer data-web-presentation></script><script src="/web-adapter/bridge.js" defer data-web-presentation></script><script type="module" src="/web-entry.js" data-web-presentation></script>
</body>
</html>
