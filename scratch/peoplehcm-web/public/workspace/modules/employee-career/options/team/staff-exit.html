<!DOCTYPE html>
<html lang="en" data-theme="light" data-peoplehcm-web="" data-web-native="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleHCM - Staff Exit</title>
  <script>(()=>{const q=new URLSearchParams(location.search).get('theme');document.documentElement.dataset.theme=q==='light'?'light':'dark';})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="/vendor/fonts.css" rel="stylesheet">
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="../../../../css/theme.css">
  <link rel="stylesheet" href="../../../../css/app.css">
  <link rel="stylesheet" href="../../css/employee-career.css">
  <link rel="stylesheet" href="../../css/employee-career-forms.css">
  <script src="../../../../js/components.js"></script>
  <script src="../../../../js/app.js" defer></script>
  <script src="../../js/employee-career-forms.js" defer></script>
  <link rel="stylesheet" href="../../../../css/form-section-headings.css">
<link rel="stylesheet" href="/web-adapter/desktop.css" data-web-presentation>
</head>
<body class="employee-career-option-page employee-career-form-page employee-career-team-form-page">
  <preview-top-bar active-page="v2"></preview-top-bar>
  <div class="phone-container">
    <header class="employee-career-header">
      <phone-status-bar time="9:41"></phone-status-bar>
      <div class="employee-career-header-row">
        <a class="employee-career-back" data-option-back href="../../index.html?scope=team" aria-label="Back to Employee and Career"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></a>
        <div class="employee-career-heading"><h1>Staff Exit</h1></div>
        <span class="employee-career-header-spacer" aria-hidden="true"></span>
      </div>
    </header>
    <main class="main-content employee-career-content">
      <form id="staffExitForm" novalidate>
        <div class="employee-career-form-card">
        <section class="employee-career-form-section" aria-labelledby="exitEmployeeHeading">
          <h2 class="form-section-heading" id="exitEmployeeHeading">Employee Details</h2>
          <div class="employee-career-field">
            <label for="exitEmployee">Employee #</label>
            <select id="exitEmployee" class="employee-career-control">
              <option value="">Select Employee</option>
              <option value="EBB01">#EBB01 — Aina Rahman</option>
              <option value="EBB02">#EBB02 — Daniel Wong</option>
              <option value="EBB03">#EBB03 — Nur Izzati</option>
            </select>
          </div>
          <div class="employee-career-form-grid">
            <div class="employee-career-field employee-career-field--wide"><label for="exitName">Name</label><input id="exitName" class="employee-career-control employee-career-readonly" type="text" placeholder="Selected employee name" readonly></div>
            <div class="employee-career-field employee-career-field--wide"><label for="exitPosition">Position</label><input id="exitPosition" class="employee-career-control employee-career-readonly" type="text" placeholder="Selected employee position" readonly></div>
          </div>
        </section>
        <section class="employee-career-form-section" aria-labelledby="exitDetailsHeading">
          <h2 class="form-section-heading" id="exitDetailsHeading">Exit Details</h2>
          <div class="employee-career-form-grid">
            <div class="employee-career-field"><label for="exitNoticeDate">Notice Date</label><input id="exitNoticeDate" class="employee-career-control" type="date"></div>
            <div class="employee-career-field"><label for="exitLastPaidDay">Last Paid Day</label><input id="exitLastPaidDay" class="employee-career-control" type="date"></div>
            <div class="employee-career-field employee-career-field--wide"><label for="exitType">Exit Type</label><select id="exitType" class="employee-career-control"><option value="">Select Exit Type</option><option>Resignation</option><option>Retirement</option><option>Contract End</option><option>Termination</option><option>Mutual Separation</option></select></div>
            <div class="employee-career-field employee-career-field--wide"><label for="exitReason">Reason</label><select id="exitReason" class="employee-career-control"><option value="">Select Reason</option><option>Career Opportunity</option><option>Personal Reasons</option><option>Relocation</option><option>Performance</option><option>Contract Completion</option><option>Other</option></select></div>
            <div class="employee-career-field employee-career-field--wide"><label for="exitRecommendation">Recommendation</label><select id="exitRecommendation" class="employee-career-control"><option value="">Select Recommended Action</option><option>Replace Position</option><option>Do Not Replace</option><option>Transfer Duties</option><option>Further Review</option></select></div>
            <div class="employee-career-field employee-career-field--wide"><label for="exitReplaceDeadline">Replace Deadline</label><input id="exitReplaceDeadline" class="employee-career-control" type="date"></div>
          </div>
          <div class="employee-career-field">
            <label class="employee-career-switch-row" for="exitBlacklist"><span>Blacklist?</span><span class="employee-career-switch"><input id="exitBlacklist" type="checkbox" role="switch"><span class="employee-career-switch-track" aria-hidden="true"></span></span></label>
          </div>
          <div class="employee-career-field"><label for="exitRemarks">Remarks</label><textarea id="exitRemarks" class="employee-career-control" placeholder="Add exit remarks"></textarea></div>
        </section>
        <fieldset class="employee-career-field employee-career-fieldset">
          <legend class="form-section-heading">Upload Attachments</legend>
          <div class="employee-career-upload-actions">
            <button class="employee-career-upload-button" type="button" data-file-picker="exitFiles"><span class="employee-career-upload-icon"><i class="fa-solid fa-file-arrow-up" aria-hidden="true"></i></span><span>Select File(s)</span></button>
            <button class="employee-career-upload-button" type="button" data-file-picker="exitCamera"><span class="employee-career-upload-icon"><i class="fa-solid fa-camera" aria-hidden="true"></i></span><span>Take a Picture</span></button>
          </div>
          <input id="exitFiles" type="file" multiple hidden>
          <input id="exitCamera" type="file" accept="image/*" capture="environment" hidden>
          <div id="exitAttachments" class="form-attachment-list" aria-live="polite"></div>
        </fieldset>
        </div>
        <div class="employee-career-form-actions">
          <a class="form-cancel-btn" data-option-back href="../../index.html?scope=team"><i class="fa-solid fa-xmark" aria-hidden="true"></i><span>Cancel</span></a>
          <button class="employee-career-button primary" id="staffExitSubmit" type="submit"><span>Submit</span><i class="fa-solid fa-paper-plane" aria-hidden="true"></i></button>
        </div>
      </form>
    </main>
    <div id="employeeCareerToast" class="employee-career-toast" role="status" aria-live="polite"></div>
    <phone-bottom-nav active="apps"></phone-bottom-nav>
  </div>
<script src="/web-adapter/translations.js" defer data-web-presentation></script><script src="/web-adapter/bridge.js" defer data-web-presentation></script><script type="module" src="/web-entry.js" data-web-presentation></script>
</body>
</html>
