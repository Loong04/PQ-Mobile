<!DOCTYPE html>
<html lang="en" data-theme="light" data-peoplehcm-web="" data-web-native="">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleHCM - Staff Retention</title>
  <script>(()=>{const q=new URLSearchParams(location.search).get('theme');document.documentElement.dataset.theme=q==='light'?'light':'dark';})();</script>
  <link href="/vendor/fonts.css" rel="stylesheet"><link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="../../../../css/theme.css">
  <link rel="stylesheet" href="../../../../css/app.css">
  <link rel="stylesheet" href="../../css/employee-career.css">
  <link rel="stylesheet" href="../../css/staff-list.css"><link rel="stylesheet" href="../../css/staff-retention.css">
  <script src="../../../../js/components.js"></script>
  <script src="../../../../js/app.js" defer></script>
  <script src="../../js/employee-career-option.js" defer></script>
  <script src="../../js/staff-list.js" defer></script>
<link rel="stylesheet" href="/web-adapter/desktop.css" data-web-presentation>
</head>
<body class="employee-career-option-page staff-list-page staff-retention-page" data-staff-report="retention"><preview-top-bar active-page="v2"></preview-top-bar><div class="phone-container">
  <header class="employee-career-header">
    <phone-status-bar time="9:41"></phone-status-bar>
    <div class="employee-career-header-row">
      <a id="staffListBack" class="employee-career-back" data-option-back href="../../index.html?scope=team" aria-label="Back to Employee and Career"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></a>
      <div class="employee-career-heading"><h1 id="staffListTitle">Staff Retention</h1></div>
      <span class="employee-career-header-spacer"></span>
    </div>
  </header>
  <main class="main-content employee-career-content">
    <section id="staffListTableView" aria-label="Staff retention listing">
      <div class="staff-list-filter-summary filter-summary-bar">
        <div><small>Current Filter</small><strong id="staffListFilterSummary">All Employees</strong></div>
        <button type="button" id="staffListFilterTrigger" title="Open Filter Options" aria-label="Open staff filter" aria-haspopup="dialog" aria-controls="staffListFilterOverlay"><i class="fa-solid fa-sliders" aria-hidden="true"></i></button>
      </div>
      <div class="staff-list-action-summary action-summary-bar">
        <div class="staff-list-summary-row">
          <div><span class="staff-list-summary-label">Total Records</span><strong id="staffListTotalRecords" class="staff-list-summary-count">0</strong></div>
          <button type="button" id="staffListViewChart" class="view-chart-btn"><i class="fa-solid fa-chart-pie" aria-hidden="true"></i><span>View Chart</span></button>
        </div>
        <div class="staff-list-summary-row">
          <div class="staff-retention-averages">
            <div><span class="staff-list-summary-label">Average Age</span><strong id="staffRetentionAverageAge" class="staff-list-summary-date">39.75</strong></div>
            <div><span class="staff-list-summary-label">Average YOS</span><strong id="staffRetentionAverageYos" class="staff-list-summary-date">6.58</strong></div>
          </div>
          <div class="staff-list-export-actions">
            <button type="button" id="staffListExportPdf" title="Export PDF" aria-label="Export PDF"><i class="fa-solid fa-file-pdf" aria-hidden="true"></i></button>
            <button type="button" id="staffListExportExcel" title="Export Excel" aria-label="Export Excel"><i class="fa-solid fa-file-excel" aria-hidden="true"></i></button>
          </div>
        </div>
      </div>
      <div class="staff-list-table-card">
        <div class="staff-list-table-scroll" role="region" aria-label="Staff table, scroll horizontally for more columns" tabindex="0">
          <table id="staffListTable"><thead><tr><th scope="col">Emp#</th><th scope="col">Name</th><th scope="col"><abbr title="Years of Service">YOS</abbr></th><th scope="col">Branch</th><th scope="col">Department</th><th scope="col">Position</th></tr></thead><tbody></tbody></table>
        </div>
        <div id="staffListEmpty" class="staff-list-empty" hidden><i class="fa-solid fa-users" aria-hidden="true"></i><h2>No Staff Found</h2><p>Adjust the filters to find employees.</p></div>
      </div>
    </section>
    <section id="staffListChartView" aria-label="Staff analysis" hidden>
      <div class="staff-list-breakdown-card">
        <label for="staffListChartMetric">Breakdown By</label>
        <div class="staff-list-select"><select id="staffListChartMetric"><option value="branch">Branch</option><option value="department">Department</option><option value="section">Section</option><option value="job">Job</option><option value="skillGroup">Skill Group</option><option value="yos">Years of Service</option></select><i class="fa-solid fa-chevron-down" aria-hidden="true"></i></div>
      </div>
      <div class="staff-list-donut-card">
        <div class="staff-list-chart-heading"><h2 id="staffListChartTitle">Retained staff by branch</h2><p>Share of retained staff</p></div>
        <div class="staff-list-donut">
          <svg id="staffListChartDonut" viewBox="0 0 180 180" role="img" aria-label="Retained staff by branch"><circle cx="90" cy="90" r="70" fill="none" stroke="var(--border-subtle)" stroke-width="22"></circle><g id="staffListChartSegments"></g></svg>
          <div class="staff-list-donut-center"><strong id="staffListChartTotal">0</strong><span>Retained Staff</span></div>
        </div>
        <p id="staffListChartNote" class="staff-list-chart-note"></p>
      </div>
      <div class="staff-list-legend-card">
        <div class="staff-list-legend-head"><span id="staffListChartColumn">Branch</span><span>Staff</span><span>% of Total</span></div>
        <div id="staffListChartLegend" class="staff-list-legend"></div>
        <div id="staffListChartViewAllFooter" class="staff-list-legend-footer"><button type="button" id="staffListChartViewAll" aria-expanded="false"><span>View all branches</span><i class="fa-solid fa-chevron-down" aria-hidden="true"></i></button></div>
      </div>
    </section>
  </main>
  <phone-bottom-nav active="apps"></phone-bottom-nav>
  <left-profile-drawer></left-profile-drawer><notification-sheet></notification-sheet><favourite-sheet></favourite-sheet>
  <div id="staffListFilterOverlay" class="staff-list-filter-overlay standard-filter-sheet" hidden>
    <form id="staffListFilterForm" class="staff-list-filter-panel standard-filter-panel" data-standard-filter-ready="true" role="dialog" aria-modal="true" aria-labelledby="staffListFilterTitle">
      <div class="standard-filter-handle" aria-hidden="true"></div>
      <header class="standard-filter-header"><h2 id="staffListFilterTitle">Filter</h2><div class="standard-filter-header-actions"><button type="button" id="staffListResetFilter" class="standard-filter-reset"><i class="fa-solid fa-rotate-left" aria-hidden="true"></i><span>Reset</span></button><button type="button" id="staffListCloseFilter" class="standard-filter-close" aria-label="Close staff filter"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button></div></header>
      <div class="staff-list-filter-fields">
        <div><label for="staffListFilterKeyword">Search Keyword</label><input id="staffListFilterKeyword" type="search" placeholder="Employee Number or Name" maxlength="150"></div>
        <div><label for="staffListFilterServiceYears">Service Years &gt;=</label><input id="staffListFilterServiceYears" type="number" min="0" step="0.01" value="0" placeholder="Minimum years of service"></div>
        <div><label for="staffListFilterBranch">Branch</label><select id="staffListFilterBranch"></select></div>
        <div><label for="staffListFilterDepartment">Department</label><select id="staffListFilterDepartment"></select></div>
        <div><label for="staffListFilterSection">Section</label><select id="staffListFilterSection"></select></div><div><label for="staffListFilterJob">Job</label><select id="staffListFilterJob"></select></div><div><label for="staffListFilterSkillGroup">Skill Group</label><select id="staffListFilterSkillGroup"></select></div>
      </div>
      <footer class="standard-filter-footer"><button type="submit" id="staffListApplyFilter" class="standard-filter-apply">Apply Filter</button></footer>
    </form>
  </div>
</div><script src="/web-adapter/translations.js" defer data-web-presentation></script><script src="/web-adapter/bridge.js" defer data-web-presentation></script><script type="module" src="/web-entry.js" data-web-presentation></script>
</body></html>
