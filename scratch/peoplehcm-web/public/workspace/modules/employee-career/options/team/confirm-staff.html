<!DOCTYPE html>
<html lang="en" data-theme="light" data-peoplehcm-web="" data-web-native="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleHCM - Confirm Staff</title>
  <script>(()=>{const q=new URLSearchParams(location.search).get('theme');document.documentElement.dataset.theme=q==='light'?'light':'dark';})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="/vendor/fonts.css" rel="stylesheet">
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="../../../../css/theme.css">
  <link rel="stylesheet" href="../../../../css/app.css">
  <link rel="stylesheet" href="../../css/employee-career.css">
  <link rel="stylesheet" href="../../css/employee-career-forms.css">
  <script src="../../../../js/components.js"></script>
  <script src="../../../../js/app.js" defer></script>
  <script src="../../js/employee-career-forms.js" defer></script>
  <link rel="stylesheet" href="../../../../css/form-section-headings.css">
<link rel="stylesheet" href="/web-adapter/desktop.css" data-web-presentation>
</head>
<body class="employee-career-option-page employee-career-form-page employee-career-team-form-page">
  <preview-top-bar active-page="v2"></preview-top-bar>
  <div class="phone-container">
    <header class="employee-career-header">
      <phone-status-bar time="9:41"></phone-status-bar>
      <div class="employee-career-header-row">
        <a class="employee-career-back" data-option-back href="../../index.html?scope=team" aria-label="Back to Employee and Career"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></a>
        <div class="employee-career-heading"><h1>Confirm Staff</h1></div>
        <span class="employee-career-header-spacer" aria-hidden="true"></span>
      </div>
    </header>
    <main class="main-content employee-career-content">
      <form id="confirmStaffForm" novalidate>
        <div class="employee-career-form-card">
        <section class="employee-career-form-section" aria-labelledby="confirmEmployeeHeading">
          <h2 class="form-section-heading" id="confirmEmployeeHeading">Employee Details</h2>
          <div class="employee-career-field">
            <label for="confirmEmployee">Employee #</label>
            <select id="confirmEmployee" class="employee-career-control">
              <option value="">Select Employee</option>
              <option value="EBB01">#EBB01 — Aina Rahman</option>
              <option value="EBB02">#EBB02 — Daniel Wong</option>
              <option value="EBB03">#EBB03 — Nur Izzati</option>
            </select>
          </div>
          <div class="employee-career-field"><label for="confirmName">Name</label><input id="confirmName" class="employee-career-control employee-career-readonly" type="text" placeholder="Selected employee name" readonly></div>
          <div class="employee-career-field"><label for="confirmPosition">Position</label><input id="confirmPosition" class="employee-career-control employee-career-readonly" type="text" placeholder="Selected employee position" readonly></div>
          <div class="employee-career-form-grid">
            <div class="employee-career-field"><label for="confirmHireDate">Hire Date</label><input id="confirmHireDate" class="employee-career-control employee-career-readonly" type="text" placeholder="—" readonly></div>
            <div class="employee-career-field"><label for="confirmEmploymentType">Employment Type</label><input id="confirmEmploymentType" class="employee-career-control employee-career-readonly" type="text" placeholder="—" readonly></div>
          </div>
          <div class="employee-career-field"><label for="confirmDue">Confirmation Due</label><input id="confirmDue" class="employee-career-control employee-career-readonly" type="text" placeholder="—" readonly></div>
        </section>
        <section class="employee-career-form-section" aria-labelledby="confirmAssessmentHeading">
          <h2 class="form-section-heading" id="confirmAssessmentHeading">Confirmation Assessment</h2>
            <div class="employee-career-field"><label for="confirmAssessmentScore">Assessment Score</label><input id="confirmAssessmentScore" class="employee-career-control" type="number" min="0" max="100" value="0"></div>
            <div class="employee-career-field"><label for="confirmRecommendation">Recommendation</label><select id="confirmRecommendation" class="employee-career-control"><option value="">Select Recommended Action</option><option>Confirm Employment</option><option>Extend Probation</option><option>Further Review</option><option>Do Not Confirm</option></select></div>
          <div class="employee-career-form-grid">
            <div class="employee-career-field"><label for="confirmEffectiveDate">Effective Date</label><input id="confirmEffectiveDate" class="employee-career-control" type="date"></div>
            <div class="employee-career-field"><label for="confirmExtensionMonths">Extension Months</label><input id="confirmExtensionMonths" class="employee-career-control" type="number" min="0" value="0"></div>
          </div>
          <div class="employee-career-field"><label for="confirmAdjustment">Adjustment</label><input id="confirmAdjustment" class="employee-career-control" type="number" step="0.01" value="0"></div>
          <div class="employee-career-field"><label for="confirmRemarks">Remarks</label><textarea id="confirmRemarks" class="employee-career-control" placeholder="Add confirmation remarks"></textarea></div>
        </section>
        <fieldset class="employee-career-field employee-career-fieldset">
          <legend class="form-section-heading">Upload Attachments</legend>
          <div class="employee-career-upload-actions">
            <button class="employee-career-upload-button" type="button" data-file-picker="confirmFiles"><span class="employee-career-upload-icon"><i class="fa-solid fa-file-arrow-up" aria-hidden="true"></i></span><span>Select File(s)</span></button>
            <button class="employee-career-upload-button" type="button" data-file-picker="confirmCamera"><span class="employee-career-upload-icon"><i class="fa-solid fa-camera" aria-hidden="true"></i></span><span>Take a Picture</span></button>
          </div>
          <input id="confirmFiles" type="file" multiple hidden>
          <input id="confirmCamera" type="file" accept="image/*" capture="environment" hidden>
          <div id="confirmAttachments" class="form-attachment-list" aria-live="polite"></div>
        </fieldset>
        </div>
        <div class="employee-career-form-actions">
          <a class="form-cancel-btn" data-option-back href="../../index.html?scope=team"><i class="fa-solid fa-xmark" aria-hidden="true"></i><span>Cancel</span></a>
          <button class="employee-career-button primary" id="confirmStaffSubmit" type="submit"><span>Submit</span><i class="fa-solid fa-paper-plane" aria-hidden="true"></i></button>
        </div>
      </form>
    </main>
    <div id="employeeCareerToast" class="employee-career-toast" role="status" aria-live="polite"></div>
    <phone-bottom-nav active="apps"></phone-bottom-nav>
  </div>
<script src="/web-adapter/translations.js" defer data-web-presentation></script><script src="/web-adapter/bridge.js" defer data-web-presentation></script><script type="module" src="/web-entry.js" data-web-presentation></script>
</body>
</html>
