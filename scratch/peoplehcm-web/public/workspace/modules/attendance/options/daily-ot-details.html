<!DOCTYPE html>
<html lang="en" data-theme="light" data-peoplehcm-web="" data-web-native="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleHCM - Daily OT Approval</title>
  <script>
    (() => {
      const theme = new URLSearchParams(window.location.search).get('theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
    })();
  </script>
  <script src="../../../js/components.js"></script>
  <script src="../../../js/app.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="/vendor/fonts.css" rel="stylesheet">
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="../../../css/theme.css">
  <link rel="stylesheet" href="../../../css/app.css">
  <link rel="stylesheet" href="daily-ot-details.css">
<link rel="stylesheet" href="/web-adapter/desktop.css" data-web-presentation>
</head>
<body>
  <preview-top-bar active-page="attendance"></preview-top-bar>

  <div class="phone-container">
    <header class="daily-ot-header">
      <phone-status-bar time="9:41" style="color: #ffffff;"></phone-status-bar>
      <div class="daily-ot-header-row">
        <a id="dailyOtBack" class="header-back-button" href="daily-ot.html" aria-label="Back to Daily OT">
          <i class="fa-solid fa-chevron-left"></i>
        </a>
        <h1 id="dailyOtDetailTitle">Daily OT Approval</h1>
      </div>
    </header>

    <main class="daily-ot-detail-content">
      <div id="dailyOtRecords" class="daily-ot-records"></div>
    </main>

    <div id="dailyOtActions" class="detail-actions">
      <button id="dailyOtUpdate" class="primary-action" type="button">Update</button>
    </div>
    <phone-bottom-nav active="apps"></phone-bottom-nav>
    <div id="dailyOtToast" class="detail-toast" role="status" aria-live="polite">Daily OT updated</div>
  </div>

  <script src="daily-ot-data.js"></script>
  <script src="daily-ot-details.js"></script>
<script src="/web-adapter/translations.js" defer data-web-presentation></script><script src="/web-adapter/bridge.js" defer data-web-presentation></script><script type="module" src="/web-entry.js" data-web-presentation></script>
</body>
</html>
