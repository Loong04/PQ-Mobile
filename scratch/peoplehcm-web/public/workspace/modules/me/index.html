<!DOCTYPE html>
<html lang="en" data-theme="light" data-peoplehcm-web="" data-web-native="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleHCM - Employee Dossier Module</title>
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
  <script src="../../js/components.js"></script>
  <script src="../../js/app.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="/vendor/fonts.css" rel="stylesheet">
  <link rel="stylesheet" href="../../css/theme.css">
  <link rel="stylesheet" href="../../css/app.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-page);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: var(--text-primary);
      padding: 20px 0;
    }

    .phone-container {
      width: 100%;
      max-width: 420px;
      height: 900px;
      background: var(--bg-phone);
      border-radius: 44px;
      overflow: hidden;
      box-shadow: var(--shadow-phone);
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 110px 16px 90px;
      position: relative;
      z-index: 10;
      scrollbar-width: none;
    }
    .main-content::-webkit-scrollbar { display: none; }

    .bonus-top-header {
      background: linear-gradient(135deg, #4c1d95 0%, #6d28d9 50%, #7c3aed 100%);
      padding: 0 16px 14px;
      color: #ffffff;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
    }

    .module-option-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .module-option-card {
      padding: 18px;
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      background: var(--bg-card);
      color: var(--text-primary);
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .module-option-icon {
      width: 44px;
      height: 44px;
      border: 1px solid rgba(124, 58, 237, 0.24);
      border-radius: 14px;
      background: rgba(124, 58, 237, 0.14);
      color: #7c3aed;
      font-size: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .module-option-title {
      color: var(--text-primary);
      font-size: 13.5px;
      font-weight: 800;
      text-align: center;
    }
  </style>
<link rel="stylesheet" href="/web-adapter/desktop.css" data-web-presentation>
</head>
<body>

  <preview-top-bar active-page="me"></preview-top-bar>

  <div class="phone-container">
    
    <!-- Top Header -->
    <div class="bonus-top-header">
      <phone-status-bar time="9:41" style="color: #ffffff;"></phone-status-bar>

      <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 4px;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <button class="me-back-btn" onclick="javascript:history.back()" aria-label="Back" title="Back"
            style="background: rgba(255, 255, 255, 0.18); border: 1px solid rgba(255, 255, 255, 0.25); width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #ffffff;">
            <i class="fa-solid fa-chevron-left" style="font-size: 16px;"></i>
          </button>
          <h1 style="font-size: 18px; font-weight: 800; color: #ffffff; margin: 0;">Employee Profile (Me)</h1>
        </div>
      </div>
    </div>

    <div class="main-content">

      <!-- Dossier Options -->
      <div style="font-size: 14.5px; font-weight: 800; color: var(--text-primary); margin-bottom: 14px;">Profile Options</div>

      <div class="module-option-grid">
         <a class="module-option-card" href="options/personal.html">
            <div class="module-option-icon"><i class="fa-solid fa-user" aria-hidden="true"></i></div>
            <div class="module-option-title">Personal Details</div>
         </a>
         <a class="module-option-card" href="options/qualification.html">
            <div class="module-option-icon"><i class="fa-solid fa-graduation-cap" aria-hidden="true"></i></div>
            <div class="module-option-title">Qualification</div>
         </a>
         <a class="module-option-card" href="options/payroll.html">
            <div class="module-option-icon"><i class="fa-solid fa-credit-card" aria-hidden="true"></i></div>
            <div class="module-option-title">Payroll & Statutory</div>
         </a>
         <a class="module-option-card" href="options/contacts.html">
            <div class="module-option-icon"><i class="fa-solid fa-location-dot" aria-hidden="true"></i></div>
            <div class="module-option-title">Contacts & Address</div>
         </a>
         <a class="module-option-card" href="options/family.html">
            <div class="module-option-icon"><i class="fa-solid fa-people-roof" aria-hidden="true"></i></div>
            <div class="module-option-title">Family Details</div>
         </a>
         <a class="module-option-card" href="options/change-request.html">
            <div class="module-option-icon"><i class="fa-solid fa-pen-to-square" aria-hidden="true"></i></div>
            <div class="module-option-title">Change Request</div>
         </a>
      </div>

    </div>

    <phone-bottom-nav active="me"></phone-bottom-nav>
    <left-profile-drawer></left-profile-drawer>
  </div>
<script src="/web-adapter/translations.js" defer data-web-presentation></script><script src="/web-adapter/bridge.js" defer data-web-presentation></script><script type="module" src="/web-entry.js" data-web-presentation></script>
</body>
</html>
