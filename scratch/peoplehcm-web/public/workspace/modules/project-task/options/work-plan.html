<!DOCTYPE html>
<html lang="en" data-theme="light" data-peoplehcm-web="" data-web-native="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleHCM - Work Plan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="/vendor/fonts.css" rel="stylesheet">
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="../../../css/theme.css">
  <link rel="stylesheet" href="../../../css/app.css">
  <link rel="stylesheet" href="../../../css/project-task.css">
  <link rel="stylesheet" href="../../../css/project-task-forms.css">
  <script src="../../../js/components.js"></script>
  <script src="../../../js/app.js" defer></script>
  <script src="../../../js/project-task/project-task-app.js" defer></script>
  <script src="../../../js/project-task/project-task-forms.js" defer></script>
  <link rel="stylesheet" href="../../../css/form-section-headings.css">
<link rel="stylesheet" href="/web-adapter/desktop.css" data-web-presentation>
</head>
<body class="project-task-page project-form-page">
  <preview-top-bar active-page="project-task"></preview-top-bar>
  <div class="phone-container">
    <header class="project-header">
      <phone-status-bar time="9:41"></phone-status-bar>
      <div class="project-header-row">
        <a class="project-back" href="../index.html?scope=individual" aria-label="Back to Project and Task"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></a>
        <div class="project-header-title"><h1>Work Plan</h1></div>
        <span aria-hidden="true"></span>
      </div>
    </header>
    <main class="main-content project-task-content">
      <form id="workPlanForm" novalidate>
        <section class="form-card" aria-labelledby="workPlanDetailsHeading">
          <div class="section-header-bar"><span class="section-title-accent" aria-hidden="true"></span><h2 class="section-title-text" id="workPlanDetailsHeading">Work Plan Details</h2></div>
          <div class="field-group"><label class="field-label" for="workPlanTitle">Title <span class="req">*</span></label><input id="workPlanTitle" name="title" class="form-ctrl" maxlength="200" required></div>
          <div class="field-group"><label class="field-label" for="workPlanDescription">Description <span class="req">*</span></label><textarea id="workPlanDescription" name="description" class="form-ctrl" rows="3" required></textarea></div>
          <div class="field-group"><label class="field-label" for="workPlanProject">Project</label><div class="select-wrapper"><select id="workPlanProject" name="project" class="form-ctrl" data-project-select></select></div></div>
          <div class="field-group"><label class="field-label" for="workPlanMilestone">Milestone</label><input id="workPlanMilestone" name="milestone" class="form-ctrl"></div>
          <fieldset class="field-group"><legend class="field-label form-section-heading">Schedule</legend><div class="project-form-grid">
            <div><input type="date" id="workPlanScheduleFrom" name="scheduleFrom" class="form-ctrl" aria-label="Schedule start date" data-today></div>
            <div><input type="date" id="workPlanScheduleTo" name="scheduleTo" class="form-ctrl" aria-label="Schedule end date" data-today></div>
          </div></fieldset>
          <div class="field-group"><label class="field-label" for="workPlanDeadline">Deadline <span class="req">*</span></label><input type="date" id="workPlanDeadline" name="deadline" class="form-ctrl" data-today required></div>
          <div class="field-group"><label class="field-label" for="workPlanTaskCategory">Task Category</label><div class="select-wrapper"><select id="workPlanTaskCategory" name="taskCategory" class="form-ctrl" data-task-category-select></select></div></div>
          <div class="field-group"><label class="field-label" for="workPlanTask">Task</label><div class="select-wrapper"><select id="workPlanTask" name="task" class="form-ctrl" data-task-select></select></div></div>
          <div class="project-form-grid">
            <div class="field-group"><label class="field-label" for="workPlanPriority">Priority</label><input type="number" id="workPlanPriority" name="priority" class="form-ctrl" value="0" min="0" step="1"></div>
            <div class="field-group"><label class="field-label" for="workPlanAllocatedHours">Allocated Hours</label><input type="number" id="workPlanAllocatedHours" name="allocatedHours" class="form-ctrl" value="0" min="0" step="0.01"></div>
          </div>
          <div class="field-group"><label class="field-label" for="workPlanRemarks">Remarks</label><textarea id="workPlanRemarks" name="remarks" class="form-ctrl" rows="3"></textarea></div>
          <div class="field-group">
            <span class="field-label form-section-heading">Upload Attachments</span>
            <div class="project-upload-actions">
              <button type="button" class="project-upload-button" data-pick-file="workPlanFiles"><span class="project-upload-icon"><i class="fa-solid fa-file-arrow-up" aria-hidden="true"></i></span><span>Select File(s)</span></button>
              <button type="button" class="project-upload-button" data-pick-file="workPlanCamera"><span class="project-upload-icon"><i class="fa-solid fa-camera" aria-hidden="true"></i></span><span>Take a Picture</span></button>
            </div>
            <input type="file" id="workPlanFiles" multiple hidden>
            <input type="file" id="workPlanCamera" accept="image/*" capture="environment" hidden>
            <div id="workPlanAttachments" class="attachment-upload-list" aria-live="polite"></div>
          </div>
        </section>
        <div class="project-form-actions">
          <button type="button" class="form-cancel-btn" data-page-form-cancel onclick="window.location.href='../index.html?scope=individual'"><i class="fa-solid fa-xmark" aria-hidden="true"></i><span>Cancel</span></button>
          <button type="submit" class="btn-submit-primary" id="submitWorkPlan"><span>Submit</span><i class="fa-solid fa-paper-plane" aria-hidden="true"></i></button>
        </div>
        <p class="project-form-feedback" id="workPlanFeedback" role="status" hidden></p>
      </form>
    </main>
    <phone-bottom-nav active="apps"></phone-bottom-nav>
    <left-profile-drawer></left-profile-drawer>
    <notification-sheet></notification-sheet>
    <favourite-sheet></favourite-sheet>
  </div>
<script src="/web-adapter/translations.js" defer data-web-presentation></script><script src="/web-adapter/bridge.js" defer data-web-presentation></script><script type="module" src="/web-entry.js" data-web-presentation></script>
</body>
</html>
