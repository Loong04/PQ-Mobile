
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css"><!DOCTYPE html>
<html lang="en" data-theme="light" data-peoplehcm-web="" data-web-native="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claims - Submit Claim Option</title>
  <script src="../../../js/components.js"></script>
  <script src="../../../js/app.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="/vendor/fonts.css" rel="stylesheet">
  <link rel="stylesheet" href="../../../css/theme.css">
  <link rel="stylesheet" href="../../../css/app.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-page);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: var(--text-primary);
      padding: 20px 0;
    }

    .phone-container {
      width: 100%;
      max-width: 420px;
      height: 900px;
      background: var(--bg-phone);
      border-radius: 44px;
      overflow: hidden;
      box-shadow: var(--shadow-phone);
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 110px 16px 90px;
      position: relative;
      z-index: 10;
      scrollbar-width: none;
    }
    .main-content::-webkit-scrollbar { display: none; }

    .bonus-top-header {
      background: linear-gradient(135deg, #4c1d95 0%, #6d28d9 50%, #7c3aed 100%);
      padding: 0 16px 14px;
      color: #ffffff;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 20px;
      padding: 18px;
      box-shadow: var(--shadow-card);
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 6px;
      display: block;
    }

    .form-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-input);
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 600;
      outline: none;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      border-radius: 16px;
      background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
      color: #ffffff;
      font-size: 14px;
      font-weight: 800;
      border: none;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(124, 58, 237, 0.35);
    }
  </style>
  <link rel="stylesheet" href="../../../css/form-section-headings.css">
<link rel="stylesheet" href="/web-adapter/desktop.css" data-web-presentation>
</head>
<body>

  <preview-top-bar active-page="claims"></preview-top-bar>

  <div class="phone-container">
    
    <!-- Top Header -->
    <div class="bonus-top-header">
      <phone-status-bar time="9:41" style="color: #ffffff;"></phone-status-bar>

      <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 4px;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <a href="../index.html" class="me-back-btn" aria-label="Back" title="Back"
            style="background: rgba(255, 255, 255, 0.18); border: 1px solid rgba(255, 255, 255, 0.25); width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #ffffff; text-decoration: none;">
            <i class="fa-solid fa-chevron-left" style="font-size: 16px;"></i>
          </a>
          <h1 style="font-size: 18px; font-weight: 800; color: #ffffff; margin: 0;">Submit Claim</h1>
        </div>
      </div>
    </div>

    <div class="main-content">

      <div class="card">
        <h3 class="form-section-heading" style="font-size: 16px; font-weight: 800; color: var(--text-primary); margin-bottom: 16px;">New Expense Claim</h3>

        <div class="form-group">
          <label class="form-label">Category</label>
          <select class="form-input">
            <option>🚗 Travel & Transport</option>
            <option>🍱 Meal & Entertainment</option>
            <option>🏥 Medical & Health</option>
            <option>📱 Mobile & Internet</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Expense Amount (RM)</label>
          <input type="number" class="form-input" placeholder="0.00" step="0.01">
        </div>

        <div class="form-group">
          <label class="form-label">Date of Expense</label>
          <input type="date" class="form-input" value="2026-09-15">
        </div>

        <div class="form-group">
          <label class="form-label">Description / Remarks</label>
          <input type="text" class="form-input" placeholder="Enter reason or vendor details...">
        </div>

        <div class="form-group">
          <label class="form-label form-section-heading">Attachment (Receipt)</label>
          <div style="border: 2px dashed var(--border-subtle); padding: 18px 16px; border-radius: 14px; text-align: center; color: var(--text-muted); font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;">
             <i class="fa-solid fa-file-arrow-up" style="font-size: 16px; color: #7c3aed;"></i>
             <span>Select File(s) (Receipt photo or PDF)</span>
          </div>
        </div>

        <button class="btn-submit" onclick="alert('Claim submitted successfully!')">Submit Request</button>
      </div>

    </div>

    <phone-bottom-nav active="apps"></phone-bottom-nav>
  </div>
<script src="/web-adapter/translations.js" defer data-web-presentation></script><script src="/web-adapter/bridge.js" defer data-web-presentation></script><script type="module" src="/web-entry.js" data-web-presentation></script>
</body>
</html>
