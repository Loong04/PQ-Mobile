
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PeopleHCM - EBB01 Bonus History</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="js/components.js"></script>
  <script src="js/app.js" defer></script>
</head>

<body>

  <!-- Desktop Switcher Bar (Light/Dark Mode outside phone frame) -->
  <preview-top-bar active-page="me"></preview-top-bar>

  <div class="phone-container">
    <!-- Top Executive Header Block (Purple Gradient) -->
    <div class="bonus-top-header">
      <!-- Status Bar -->
      <phone-status-bar time="9:41" style="color: #ffffff;"></phone-status-bar>

      <!-- Navigation Header -->
      <div class="bonus-nav-bar">
        <button class="bonus-back-btn" onclick="window.location.href='me.html'" aria-label="Back to Profile" title="Back">
          <i class="fa-solid fa-chevron-left" style="font-size: 16px;"></i>
        </button>
        <div class="bonus-title-wrap">
          <h2 class="bonus-title-main">Bonus History</h2>
        </div>
        <button class="me-options-btn" onclick="openAuditLog()" aria-label="More Options" title="Options">
          <i class="fa-solid fa-ellipsis-vertical" style="font-size: 16px;"></i>
        </button>
      </div>

      <!-- Hero Executive Dossier Card -->
      <div class="bonus-hero-card">
        <div class="bonus-hero-user">
          <div class="bonus-user-left">
            <div class="bonus-user-avatar" style="background: linear-gradient(135deg, #059669 0%, #10b981 100%); color: #ffffff; font-weight: 800; font-size: 15px; display: flex; align-items: center; justify-content: center;">SJ</div>
            <div>
              <div class="bonus-user-name">Sarah Jenkins</div>
              <div class="employee-id-standard">#EBB01</div>
              <div class="bonus-user-role">SENIOR PRODUCT DESIGNER</div>
            </div>
          </div>
        </div>

        <!-- 2 KPI Metric Summary Grid (Total Records & Avg Factor Only) -->
        <div class="bonus-kpi-grid">
          <div class="bonus-kpi-tile">
            <div class="bonus-kpi-label">Total Records</div>
            <div class="bonus-kpi-val">3</div>
            <div class="bonus-kpi-sub">FY2021 – 2023</div>
          </div>
          <div class="bonus-kpi-tile">
            <div class="bonus-kpi-label">Avg Factor</div>
            <div class="bonus-kpi-val">0.32</div>
            <div class="bonus-kpi-sub">~0.32 Months</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Scrollable Main Body Content -->
    <div class="main-content" style="padding: 0 0 90px;">

      <!-- Export Actions Bar -->
      <div class="bonus-controls-bar" style="justify-content: flex-end;">
        <div class="bonus-export-group">
          <button class="bonus-export-pill pdf" onclick="triggerExport('PDF')">
            <span>Export PDF</span>
          </button>
          <button class="bonus-export-pill excel" onclick="triggerExport('Excel')">
            <span>Excel</span>
          </button>
        </div>
      </div>



      <!-- Data Table View Only (No Footer Summary Row) -->
      <div class="bonus-table-wrapper" id="tableViewSection">
        <table class="bonus-data-table">
          <thead>
            <tr>
              <th>Year</th>
              <th style="text-align: right;">Basic Pay</th>
              <th style="text-align: right;">Bonus</th>
              <th style="text-align: center;">Bonus Factor</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="bonus-table-year">2021</td>
              <td class="bonus-table-num" style="text-align: right;">9,400.00</td>
              <td class="bonus-table-num" style="text-align: right; color: #10b981; font-weight: 800;">2,000.00</td>
              <td style="text-align: center;"><span class="bonus-table-factor-badge">0.21</span></td>
            </tr>
            <tr>
              <td class="bonus-table-year">2022</td>
              <td class="bonus-table-num" style="text-align: right;">9,400.00</td>
              <td class="bonus-table-num" style="text-align: right; color: #10b981; font-weight: 800;">3,000.00</td>
              <td style="text-align: center;"><span class="bonus-table-factor-badge">0.32</span></td>
            </tr>
            <tr>
              <td class="bonus-table-year">2023</td>
              <td class="bonus-table-num" style="text-align: right;">9,400.00</td>
              <td class="bonus-table-num" style="text-align: right; color: #10b981; font-weight: 800;">4,000.00</td>
              <td style="text-align: center;"><span class="bonus-table-factor-badge">0.43</span></td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>

    <!-- Phone Bottom Navigation Bar -->
    <phone-bottom-nav active="me"></phone-bottom-nav>

    <!-- Side Drawers & Modals -->
    <left-profile-drawer></left-profile-drawer>
    <notification-sheet></notification-sheet>
    <indicators-sheet></indicators-sheet>

    <!-- Interactive Toast Alert -->
    <div class="bonus-toast" id="bonusToast">
      <i id="toastIcon" class="fa-solid fa-file-lines" aria-hidden="true"></i>
      <span id="toastMessage">Preparing download...</span>
    </div>
  </div>

  <script>
    function tableRows() {
      return [...document.querySelectorAll('.bonus-data-table tr')].map(row => [...row.cells].map(cell => cell.textContent.trim()));
    }

    function openAuditLog() {
      document.getElementById('historyAuditDialog')?.remove();
      const dialog = document.createElement('div');
      dialog.id = 'historyAuditDialog';
      dialog.setAttribute('role', 'dialog');
      dialog.setAttribute('aria-modal', 'true');
      dialog.style.cssText = 'position:absolute;inset:0;z-index:1200;display:flex;align-items:flex-end;background:rgba(15,23,42,.7);';
      const panel = document.createElement('section');
      panel.style.cssText = 'width:100%;padding:20px;border-radius:24px 24px 0 0;background:var(--bg-card);color:var(--text-primary);';
      const heading = document.createElement('h2');
      heading.textContent = 'Bonus History Audit Log';
      const details = document.createElement('p');
      details.textContent = tableRows().slice(1).length + ' records reviewed for Sarah Jenkins (#EBB01). Last opened ' + new Date().toLocaleString();
      const close = document.createElement('button');
      close.type = 'button'; close.textContent = 'Close Audit Log'; close.className = 'bonus-export-pill'; close.onclick = () => dialog.remove();
      panel.append(heading, details, close); dialog.appendChild(panel); dialog.onclick = event => { if (event.target === dialog) dialog.remove(); };
      document.querySelector('.phone-container').appendChild(dialog);
    }

    function triggerExport(format) {
      const fileBase = 'EBB01_Bonus_History';
      if (format === 'PDF') {
        document.body.classList.add('history-print-view');
        window.print();
        setTimeout(() => document.body.classList.remove('history-print-view'), 0);
        showToast('fa-file-pdf', 'Print dialog opened for ' + fileBase + '.pdf');
        return;
      }
      const csv = tableRows().map(row => row.map(value => '"' + value.replace(/"/g, '""') + '"').join(',')).join('\r\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a'); link.href = url; link.download = fileBase + '.csv'; link.click();
      setTimeout(() => URL.revokeObjectURL(url), 0);
      showToast('fa-file-excel', 'Downloaded ' + fileBase + '.csv');
    }
    function showToast(icon, msg) {
      const toast = document.getElementById('bonusToast');
      const iconEl = document.getElementById('toastIcon');
      const msgEl = document.getElementById('toastMessage');

      iconEl.className = 'fa-solid ' + icon;
      msgEl.innerText = msg;

      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }
  </script>
</body>

</html>
