<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PeopleHCM - EBB12 Bonus History</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="js/components.js"></script>
  <script src="js/app.js" defer></script>
</head>

<body>

  <!-- Desktop Switcher Bar (Light/Dark Mode outside phone frame) -->
  <preview-top-bar active-page="me"></preview-top-bar>

  <div class="phone-container">
    <!-- Top Executive Header Block (Purple Gradient) -->
    <div class="bonus-top-header">
      <!-- Status Bar -->
      <phone-status-bar time="9:41" style="color: #ffffff;"></phone-status-bar>

      <!-- Navigation Header -->
      <div class="bonus-nav-bar">
        <button class="bonus-back-btn" onclick="window.location.href='me.html'" aria-label="Back to Profile" title="Back">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
        <div class="bonus-title-wrap">
          <span class="bonus-title-sub">EXECUTIVE DOSSIER</span>
          <h2 class="bonus-title-main">Bonus History</h2>
        </div>
        <button class="me-options-btn" onclick="alert('Bonus History Audit Log loaded.')" aria-label="More Options" title="Options">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="1.5"></circle>
            <circle cx="12" cy="5" r="1.5"></circle>
            <circle cx="12" cy="19" r="1.5"></circle>
          </svg>
        </button>
      </div>

      <!-- Hero Executive Dossier Card -->
      <div class="bonus-hero-card">
        <div class="bonus-hero-user">
          <div class="bonus-user-left">
            <div class="bonus-user-avatar">?</div>
            <div>
              <div class="bonus-user-name">Farhan binti rahmat</div>
              <div class="bonus-user-role">GROUP HR MANAGER • EBB12</div>
            </div>
          </div>
        </div>

        <!-- 2 KPI Metric Summary Grid (Total Records & Avg Factor Only) -->
        <div class="bonus-kpi-grid">
          <div class="bonus-kpi-tile">
            <div class="bonus-kpi-label">Total Records</div>
            <div class="bonus-kpi-val">3</div>
            <div class="bonus-kpi-sub">FY2021 – 2023</div>
          </div>
          <div class="bonus-kpi-tile">
            <div class="bonus-kpi-label">Avg Factor</div>
            <div class="bonus-kpi-val">0.32</div>
            <div class="bonus-kpi-sub">~0.32 Months</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Scrollable Main Body Content -->
    <div class="main-content" style="padding: 0 0 90px;">

      <!-- Export Actions Bar -->
      <div class="bonus-controls-bar" style="justify-content: flex-end;">
        <div class="bonus-export-group">
          <button class="bonus-export-pill pdf" onclick="triggerExport('PDF')">
            <span>📄 Export PDF</span>
          </button>
          <button class="bonus-export-pill excel" onclick="triggerExport('Excel')">
            <span>✳️ Excel</span>
          </button>
        </div>
      </div>



      <!-- Data Table View Only (No Footer Summary Row) -->
      <div class="bonus-table-wrapper" id="tableViewSection">
        <table class="bonus-data-table">
          <thead>
            <tr>
              <th>Year</th>
              <th style="text-align: right;">Basic Pay</th>
              <th style="text-align: right;">Bonus</th>
              <th style="text-align: center;">Bonus Factor</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="bonus-table-year">2021</td>
              <td class="bonus-table-num" style="text-align: right;">9,400.00</td>
              <td class="bonus-table-num" style="text-align: right; color: #10b981; font-weight: 800;">2,000.00</td>
              <td style="text-align: center;"><span class="bonus-table-factor-badge">0.21</span></td>
            </tr>
            <tr>
              <td class="bonus-table-year">2022</td>
              <td class="bonus-table-num" style="text-align: right;">9,400.00</td>
              <td class="bonus-table-num" style="text-align: right; color: #10b981; font-weight: 800;">3,000.00</td>
              <td style="text-align: center;"><span class="bonus-table-factor-badge">0.32</span></td>
            </tr>
            <tr>
              <td class="bonus-table-year">2023</td>
              <td class="bonus-table-num" style="text-align: right;">9,400.00</td>
              <td class="bonus-table-num" style="text-align: right; color: #10b981; font-weight: 800;">4,000.00</td>
              <td style="text-align: center;"><span class="bonus-table-factor-badge">0.43</span></td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>

    <!-- Phone Bottom Navigation Bar -->
    <phone-bottom-nav active="me"></phone-bottom-nav>

    <!-- Side Drawers & Modals -->
    <left-profile-drawer></left-profile-drawer>
    <notification-sheet></notification-sheet>
    <indicators-sheet></indicators-sheet>

    <!-- Interactive Toast Alert -->
    <div class="bonus-toast" id="bonusToast">
      <span id="toastIcon">📄</span>
      <span id="toastMessage">Preparing download...</span>
    </div>
  </div>

  <script>
    // Export handler
    function triggerExport(format) {
      showToast(format === 'PDF' ? '📕' : '📗', `Generating EBB12_Bonus_History.${format.toLowerCase()}...`);
    }

    function showToast(icon, msg) {
      const toast = document.getElementById('bonusToast');
      const iconEl = document.getElementById('toastIcon');
      const msgEl = document.getElementById('toastMessage');

      iconEl.innerText = icon;
      msgEl.innerText = msg;

      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }
  </script>
</body>

</html>
