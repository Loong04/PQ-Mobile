
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><!DOCTYPE html>

      <!-- Status Bar (White icons on Purple) -->
      <phone-status-bar time="9:41" style="color: #ffffff;"></phone-status-bar>

      <!-- Calendar Navigation Title -->
      <div style="display: flex; align-items: center; gap: 12px; margin-top: 4px;">
        <button class="me-back-btn" onclick="navTo('home', event)" aria-label="Back to Home" title="Back" style="background: rgba(255, 255, 255, 0.18); border: 1px solid rgba(255, 255, 255, 0.25); width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #ffffff;">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <h1 style="font-size: 19px; font-weight: 800; color: #ffffff; margin: 0;">My Calendar</h1>
      </div>
    </div>

    <!-- Sub-Calendar Category Selector Strip (Ultra-short pill labels: All, Leave, Roster, Book, Train, Meet, Staff) -->

      <button class="cal-category-pill active" id="pillSubAll" onclick="setSubCalendar('all')">
        <i class="fa-solid fa-layer-group"></i> All
      </button>
      <button class="cal-category-pill" id="pillSubLeave" onclick="setSubCalendar('leave')">
        <i class="fa-solid fa-umbrella-beach"></i> Leave
      </button>
      <button class="cal-category-pill" id="pillSubRoster" onclick="setSubCalendar('roster')">
        <i class="fa-solid fa-clock"></i> Roster
      </button>
      <button class="cal-category-pill" id="pillSubBooking" onclick="setSubCalendar('booking')">
        <i class="fa-solid fa-building"></i> Book
      </button>
      <button class="cal-category-pill" id="pillSubTraining" onclick="setSubCalendar('training')">
        <i class="fa-solid fa-graduation-cap"></i> Train
      </button>
      <button class="cal-category-pill" id="pillSubMeeting" onclick="setSubCalendar('meeting')">
        <i class="fa-solid fa-handshake"></i> Meet
      </button>
      <button class="cal-category-pill" id="pillSubSubordinate" onclick="setSubCalendar('subordinate')">
        <i class="fa-solid fa-users"></i> Staff
      </button>
    </div>

    <!-- Scrollable Main Content -->
    <div class="main-content" style="padding: 10px 0 90px;">

      <!-- Interactive Month Calendar Card (Matching User Reference Screenshot) -->
      <div class="cal-card-box">
        <!-- Top Header & Controls Strip -->
        <div class="cal-card-header-bar">
          <div class="cal-card-title-group" style="display: flex; align-items: center; gap: 8px;">
            <h2 class="cal-card-month-text" id="calMonthTitleText">August 2026</h2>
            <!-- Arrow Stepper (< >) -->
            <div class="cal-stepper-wrap">
              <button class="cal-stepper-btn" onclick="shiftPeriod(-1)" title="Previous">
                <i class="fa-solid fa-chevron-left"></i>
              </button>
              <button class="cal-stepper-btn" onclick="shiftPeriod(1)" title="Next">
                <i class="fa-solid fa-chevron-right"></i>
              </button>
            </div>
          </div>

          <div class="cal-card-ctrls">
            <!-- Month / Week Switcher -->
            <div class="cal-view-switch">
              <button class="cal-switch-btn active" id="btnViewMonth" onclick="setViewMode('month')">Month</button>
              <button class="cal-switch-btn" id="btnViewWeek" onclick="setViewMode('week')">Week</button>
            </div>

            <!-- Filter Bottom Sheet Trigger Button -->
            <button class="cal-filter-btn" onclick="openCalFilter()" title="Filter Settings">
              <i class="fa-solid fa-sliders"></i>
            </button>
          </div>
        </div>

        <!-- Active Filter Status Sub-header -->
        <div style="text-align: center; margin-bottom: 6px;">

          <span class="cal-weekday-name">Thu</span>

        <span style="display: flex; align-items: center; gap: 4px;"><span style="width: 7px; height: 7px; border-radius: 50%; background: #64748b; display: inline-block;"></span> Draft</span>
        <span style="display: flex; align-items: center; gap: 4px;"><span style="width: 7px; height: 7px; border-radius: 50%; background: #3b82f6; display: inline-block;"></span> Submitted</span>
        <span style="display: flex; align-items: center; gap: 4px;"><span style="width: 7px; height: 7px; border-radius: 50%; background: #f59e0b; display: inline-block;"></span> Pending</span>

    <!-- Calendar Filter Bottom Sheet (Matching Screenshot 2) -->

        <div class="cal-filter-drag-handle"></div>

          <span class="cal-filter-title">Filter</span>

        </div>


        <!-- Status Section (Draft, Submitted, Pending Next/Final, Approved, Rejected) -->
        <div class="cal-filter-section">
          <div class="cal-filter-label">Status</div>
          <div class="cal-filter-pill-group" style="flex-wrap: wrap;">
            <button class="cal-filter-option-pill active" id="filterStatusAll" onclick="selectFilterStatus('All')">

            </button>
            <button class="cal-filter-option-pill" id="filterStatusApproved" onclick="selectFilterStatus('Approved')">
              ✅ Approved
            </button>
            <button class="cal-filter-option-pill" id="filterStatusRejected" onclick="selectFilterStatus('Rejected')">

        <!-- Period Section -->

            <i class="fa-solid fa-calendar-days" style="margin-right: 4px;"></i>
            Period

          <div class="cal-filter-select-row">
            <select class="cal-filter-select" id="selectFilterYear" onchange="updatePeriodFromSelect()">

              <option value="2027">2027</option>
            </select>

              <option value="September">September</option>
              <option value="October">October</option>
            </select>
          </div>
        </div>

        <!-- Apply Filter Primary Button -->
        <button class="cal-filter-apply-btn" onclick="applyCalFilter()">Apply Filter</button>
      </div>
    </div>

    <!-- Date Event Detail Bottom Sheet (Slide-up Card on Date Click) -->
    <div class="cal-event-sheet-overlay" id="calEventSheetOverlay" onclick="closeCalEventSheet()">

          </button>
        </div>
      </div>
    </div>

  </div>

    // Render Calendar Grid
    function renderCalendar() {
      const grid = document.getElementById('calDaysGrid');
      const titleEl = document.getElementById('calMonthTitleText');
      const subEl = document.getElementById('calActiveFilterSub');
      grid.innerHTML = '';
      const subNameMap = { all: 'All Summary', leave: 'Leave', roster: 'Roster', booking: 'Book', training: 'Train', meeting: 'Meet', subordinate: 'Staff' };
      const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      const monthIndex = monthNames.indexOf(filterState.month);
      const year = Number(filterState.year);
      const dayCount = new Date(year, monthIndex + 1, 0).getDate();
      titleEl.innerText = filterState.month + ' ' + filterState.year;
      subEl.innerText = subNameMap[activeSubCalendar] + ' ? Status: ' + filterState.status + ' ? ' + filterState.month + ' ' + filterState.year;
      const source = year === 2026 && filterState.month === 'August' ? AUGUST_2026_DAYS : year === 2026 && filterState.month === 'September' ? SEPTEMBER_2026_DAYS : [];
      const events = new Map(source.map(item => [item.day, item]));
      let displayDays = Array.from({ length: dayCount }, (_, index) => index + 1);
      const leadCount = viewMode === 'month' ? new Date(year, monthIndex, 1).getDay() : 0;
      if (viewMode === 'week') displayDays = displayDays.slice(15, 22);
      for (let index = 0; index < leadCount; index++) {
        const emptyCell = document.createElement('div'); emptyCell.className = 'cal-day-cell other-month'; grid.appendChild(emptyCell);
      }
      displayDays.forEach(day => {
        const item = events.get(day) || { day, type: 'work', cat: 'roster', full: 'Working Shift (09:00 - 18:00)' };
        const dateStr = String(year) + '-' + String(monthIndex + 1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
        const categoryMatches = activeSubCalendar === 'all' || item.cat === activeSubCalendar;
        const statusMatches = filterState.status === 'All' || item.status === filterState.status;
        const highlighted = categoryMatches && statusMatches;
        const cellEl = document.createElement('div');
        cellEl.className = highlighted ? 'cal-day-cell status-' + item.type : 'cal-day-cell';
        if (dateStr === selectedDateStr) cellEl.classList.add('selected');
        const statusDot = highlighted && item.status ? '<span class="cal-status-dot dot-' + item.status.toLowerCase() + '" title="Status: ' + item.status + '"></span>' : '';
        cellEl.innerHTML = '<span class="cal-date-num">' + day + '</span>' + (highlighted && item.label ? '<span class="cal-cell-tag">' + item.label + '</span>' : '') + statusDot;
        cellEl.onclick = () => selectDate(dateStr, item);
        grid.appendChild(cellEl);
      });
    }

    // Select date cell & trigger the Event Detail Bottom Sheet
    function selectDate(dateStr, itemData) {
      selectedDateStr = dateStr;
      currentSelectedData = itemData;
      renderCalendar();
      openCalEventSheet(dateStr, itemData);
    }

    // Open Event Detail Bottom Sheet
    function openCalEventSheet(dateStr, itemData) {
      const overlay = document.getElementById('calEventSheetOverlay');
      const titleEl = document.getElementById('sheetDateTitle');
      const subEl = document.getElementById('sheetDateSubtitle');
      const contentEl = document.getElementById('sheetEventContent');
      const actionIcon = document.getElementById('sheetActionIcon');
      const actionText = document.getElementById('sheetPrimaryActionText');

      const d = new Date(dateStr);
      const options = { weekday: 'long', day: 'numeric', month: 'short', year: 'numeric' };
      const formattedDate = d.toLocaleDateString('en-US', options);

      titleEl.innerText = formattedDate;

      const st = itemData ? (itemData.status || 'Approved') : 'Approved';
      subEl.innerText = `Status: ${st} • Event & Shift Details`;

      // Status Badge HTML Helper
      const getStatusBadgeHTML = (statusStr) => {
        if (statusStr === 'Draft') return `<span class="sheet-tag-badge amber">📝 Draft</span>`;
        if (statusStr === 'Submitted') return `<span class="sheet-tag-badge blue">📩 Submitted</span>`;
        if (statusStr === 'Pending') return `<span class="sheet-tag-badge amber">⏳ Pending Approval</span>`;
        if (statusStr === 'Rejected') return `<span class="sheet-tag-badge red">❌ Rejected</span>`;
        return `<span class="sheet-tag-badge green">✅ Approved</span>`;
      };

      const type = itemData ? itemData.type : 'work';

      if (type === 'al') {
        actionIcon.innerText = '📄';
        actionText.innerText = 'View Leave Application';
        contentEl.innerHTML = `
          <div class="cal-detail-card" style="border-left: 4.5px solid #f97316;">
            <div class="cal-detail-badge-strip">
              <div class="cal-detail-icon-title">
                <div class="cal-detail-icon al">🌴</div>
                <div>
                  <div class="cal-detail-name">Annual Leave (Full Day)</div>
                  <div class="cal-detail-time">All Day • 8.0 hrs deducted</div>
                </div>
              </div>
              ${getStatusBadgeHTML(st)}
            </div>
            <div class="cal-detail-info-grid">
              <div class="cal-info-item">
                <span class="cal-info-label">Approver</span>

    // Close Event Detail Bottom Sheet
    function closeCalEventSheet() {
      const overlay = document.getElementById('calEventSheetOverlay');
      if (overlay) overlay.classList.remove('open');
    }

    // Primary Action Handler
    function handleSheetPrimaryAction() {
      if (currentSelectedData && currentSelectedData.type === 'al') {
        window.location.href = 'leave.html';
      } else if (currentSelectedData && currentSelectedData.type === 'work') {
        window.location.href = 'leave.html';
      } else {
        closeCalEventSheet();
      }
    }

    // Switch Month / Week view mode
    function setViewMode(mode) {
      viewMode = mode;
      document.getElementById('btnViewMonth').classList.toggle('active', mode === 'month');
      document.getElementById('btnViewWeek').classList.toggle('active', mode === 'week');
      renderCalendar();
    }

    // Shift period stepper arrows (< >)
    function shiftPeriod(delta) {
      const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      let index = monthNames.indexOf(filterState.month) + delta;
      let year = Number(filterState.year);
      if (index < 0) { index = 11; year -= 1; }
      if (index > 11) { index = 0; year += 1; }
      filterState.month = monthNames[index];
      filterState.year = String(year);
      const monthSelect = document.getElementById('selectFilterMonth');
      if (![...monthSelect.options].some(option => option.value === filterState.month)) {
        const option = document.createElement('option'); option.value = filterState.month; option.textContent = filterState.month; monthSelect.appendChild(option);
      }
      document.getElementById('selectFilterYear').value = filterState.year;
      monthSelect.value = filterState.month;
      renderCalendar();
    }

    // Open & Close Filter Bottom Sheet Drawer
    function openCalFilter() {
      document.getElementById('calFilterOverlay').classList.add('open');
    }

    function closeCalFilter() {
      document.getElementById('calFilterOverlay').classList.remove('open');
    }

    // Select Status Pill inside Filter Drawer
    function selectFilterStatus(statusVal) {
      filterState.status = statusVal;
      const statusPills = ['All', 'Draft', 'Submitted', 'Pending', 'Approved', 'Rejected'];
      statusPills.forEach(st => {
        const btn = document.getElementById(`filterStatus${st}`);
        if (btn) btn.classList.toggle('active', statusVal === st);
      });
    }

    // Update dropdown selections
    function updatePeriodFromSelect() {
      filterState.year = document.getElementById('selectFilterYear').value;
      filterState.month = document.getElementById('selectFilterMonth').value;
    }

    // Reset filter to defaults (All Status, 2026 August)
    function resetCalFilter() {
      selectFilterStatus('All');
      document.getElementById('selectFilterYear').value = '2026';
      document.getElementById('selectFilterMonth').value = 'August';
      updatePeriodFromSelect();
    }

    // Apply Filter Button Action
    function applyCalFilter() {
      updatePeriodFromSelect();
      renderCalendar();
      closeCalFilter();
    }

    // Initialize on page load
    document.addEventListener('DOMContentLoaded', () => {
      renderCalendar();
    });
