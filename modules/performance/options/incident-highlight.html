<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleHCM - Incident Highlight</title>
  <script>(() => { document.documentElement.dataset.theme = new URLSearchParams(location.search).get('theme') === 'light' ? 'light' : 'dark'; })();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../css/theme.css">
  <link rel="stylesheet" href="../../../css/app.css">
  <link rel="stylesheet" href="../../../css/attendance-highlight-report.css">
  <link rel="stylesheet" href="../../../css/detail-popout.css">
  <link rel="stylesheet" href="../css/performance.css">
  <link rel="stylesheet" href="../css/performance-highlight.css">
  <link rel="stylesheet" href="../css/incident-highlight.css">
  <script src="../../../js/components.js"></script>
  <script src="../../../js/app.js" defer></script>
  <script src="../js/work-incident-data.js" defer></script>
  <script src="../js/incident-highlight-data.js" defer></script>
  <script src="../js/highlight-export.js" defer></script>
  <script src="../js/incident-highlight.js" defer></script>
</head>
<body class="attendance-highlight-page performance-highlight-page incident-highlight-page">
  <preview-top-bar active-page="performance"></preview-top-bar>
  <div class="phone-container">
    <header class="performance-header"><phone-status-bar time="9:41"></phone-status-bar><div class="performance-header-row"><a id="incidentHighlightBack" class="performance-back" href="../index.html?scope=team" aria-label="Back to Performance"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></a><h1 id="incidentHighlightTitle" data-print-title="Incident Highlight">Incident Highlight</h1><span class="performance-header-spacer" aria-hidden="true"></span></div></header>
    <main class="main-content performance-highlight-content">
      <section id="incidentHighlightReportView" aria-label="Employee incident totals">
        <div class="filter-summary-bar performance-highlight-filter-summary"><div><small>Current Filter</small><strong id="incidentHighlightFilterSummary"></strong></div><button type="button" id="incidentHighlightFilterTrigger" aria-label="Open Incident Highlight filter" aria-haspopup="dialog" aria-controls="incidentHighlightFilterOverlay"><i class="fa-solid fa-sliders" aria-hidden="true"></i></button></div>
        <div class="attendance-report-summary record-summary-card" aria-live="polite">
          <div class="attendance-report-summary-row"><div class="record-summary-metric"><span class="record-summary-label">Total Records</span><strong id="incidentHighlightTotalRecords" class="record-summary-value">0</strong></div><button type="button" id="incidentHighlightViewChart" class="view-chart-btn"><i class="fa-solid fa-chart-pie" aria-hidden="true"></i><span>View Chart</span></button></div>
          <div class="attendance-report-summary-row"><div><span class="attendance-report-summary-label">Total Points</span><strong id="incidentHighlightTotalPoints" class="performance-highlight-average">0</strong></div><div class="performance-highlight-export-actions"><button type="button" id="incidentHighlightExportPdf" class="performance-highlight-export-pdf" title="Export PDF" aria-label="Export PDF"><i class="fa-solid fa-file-pdf" aria-hidden="true"></i></button><button type="button" id="incidentHighlightExportExcel" class="performance-highlight-export-excel" title="Export Excel" aria-label="Export Excel"><i class="fa-solid fa-file-excel" aria-hidden="true"></i></button></div></div>
        </div>
        <section class="attendance-report-table-card"><div class="attendance-report-table-scroll"><table id="incidentHighlightTable" class="attendance-report-table" aria-label="Employee incident points"><thead><tr><th scope="col">Emp #</th><th scope="col">Name</th><th scope="col">Total</th><th scope="col">Branch</th><th scope="col">Department</th><th scope="col">Position</th></tr></thead><tbody></tbody></table></div></section>
      </section>
      <section id="incidentHighlightChartView" class="attendance-report-chart" aria-label="Incident analysis" hidden>
        <section class="attendance-report-breakdown"><label for="incidentHighlightChartMetric">BREAKDOWN BY</label><select id="incidentHighlightChartMetric"></select></section>
        <section class="attendance-report-chart-card"><h3 id="incidentHighlightChartTitle"></h3><p id="incidentHighlightChartSubtitle">Share of filtered incidents</p><div class="attendance-report-donut"><svg id="incidentHighlightChartDonut" viewBox="0 0 180 180" role="img"><circle cx="90" cy="90" r="70" fill="none" stroke="var(--border-subtle)" stroke-width="22"></circle><g id="incidentHighlightChartSegments"></g></svg><div class="attendance-report-donut-center"><strong id="incidentHighlightChartTotal">0</strong><small>Total Points</small></div></div><p id="incidentHighlightChartNote" class="attendance-report-note"></p></section>
        <section class="attendance-report-legend"><div class="attendance-report-legend-head"><span id="incidentHighlightChartColumn">Incident Type</span><span>Points</span><span>% Records</span></div><div id="incidentHighlightChartLegend"></div></section>
      </section>
    </main>
    <phone-bottom-nav active="apps"></phone-bottom-nav>
    <div id="incidentHighlightFilterOverlay" class="performance-highlight-filter-overlay standard-filter-sheet" aria-hidden="true" hidden>
      <form id="incidentHighlightFilterForm" class="standard-filter-panel" data-standard-filter-ready="true" role="dialog" aria-modal="true" aria-labelledby="incidentHighlightFilterTitle" novalidate>
        <div class="standard-filter-handle" aria-hidden="true"></div>
        <header class="standard-filter-header"><h2 id="incidentHighlightFilterTitle">Filter</h2><div class="standard-filter-header-actions"><button type="button" id="incidentHighlightResetFilter" class="standard-filter-reset"><i class="fa-solid fa-rotate-left" aria-hidden="true"></i><span>Reset</span></button><button type="button" id="incidentHighlightCloseFilter" class="standard-filter-close" aria-label="Close filter"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button></div></header>
        <div class="performance-highlight-filter-fields">
          <div><label for="incidentHighlightKeyword">Search Keyword</label><input id="incidentHighlightKeyword" name="keyword" type="search" placeholder="Search name, employee ID, branch or position"></div>
          <div class="incident-highlight-date-range"><div><label for="incidentHighlightStartDate">Start Date</label><input id="incidentHighlightStartDate" name="startDate" type="date" aria-describedby="incidentHighlightFilterError"></div><div><label for="incidentHighlightEndDate">End Date</label><input id="incidentHighlightEndDate" name="endDate" type="date" aria-describedby="incidentHighlightFilterError"></div></div>
          <div><label for="incidentHighlightCompany">Company</label><select id="incidentHighlightCompany" name="company"><option value="">All Companies</option></select></div>
          <div><label for="incidentHighlightBranch">Branch</label><select id="incidentHighlightBranch" name="branch"><option value="">All Branches</option></select></div>
          <div><label for="incidentHighlightDepartment">Department</label><select id="incidentHighlightDepartment" name="department"><option value="">All Departments</option></select></div>
          <div><label for="incidentHighlightIncidentType">Incident Type</label><select id="incidentHighlightIncidentType" name="incidentType"><option value="">All Incident Types</option></select></div>
          <div><label for="incidentHighlightMeritType">Merit Type</label><select id="incidentHighlightMeritType" name="meritType"><option value="">All Merit Types</option><option value="merit">Merit</option><option value="demerit">Demerit</option></select></div>
          <div role="group" aria-labelledby="incidentHighlightPointRangeLabel"><label id="incidentHighlightPointRangeLabel" for="incidentHighlightPointMin">Point Range</label><div class="performance-highlight-score-range"><input id="incidentHighlightPointMin" name="pointMin" type="number" step="any" placeholder="Min" aria-label="Minimum points" aria-describedby="incidentHighlightFilterError"><span aria-hidden="true">–</span><input id="incidentHighlightPointMax" name="pointMax" type="number" step="any" placeholder="Max" aria-label="Maximum points" aria-describedby="incidentHighlightFilterError"></div></div>
          <p id="incidentHighlightFilterError" class="performance-highlight-error" role="alert" hidden></p>
        </div>
        <footer class="standard-filter-footer"><button type="submit" id="incidentHighlightApplyFilter" class="standard-filter-apply">Apply Filter</button></footer>
      </form>
    </div>
    <div id="incidentHighlightDetailsOverlay" class="performance-highlight-details-overlay detail-popout-overlay" aria-hidden="true" hidden>
      <section class="detail-popout-panel" role="dialog" aria-modal="true" aria-labelledby="incidentHighlightDetailName">
        <header class="detail-popout-header"><span class="detail-popout-header-contents"><h2 id="incidentHighlightDetailName" class="detail-popout-title"></h2><span id="incidentHighlightDetailEmpNo" class="detail-popout-subtitle"></span></span><button type="button" id="incidentHighlightCloseDetails" class="detail-popout-close" aria-label="Close incident details"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button></header>
        <div class="detail-popout-body"><div id="incidentHighlightDetailsList"></div></div>
      </section>
    </div>
  </div>
</body>
</html>
