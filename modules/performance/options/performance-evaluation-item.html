<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleHCM - Update Evaluation</title>
  <script>(() => { document.documentElement.dataset.theme = new URLSearchParams(location.search).get('theme') === 'light' ? 'light' : 'dark'; })();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../css/theme.css">
  <link rel="stylesheet" href="../../../css/app.css">
  <link rel="stylesheet" href="../css/performance.css">
  <link rel="stylesheet" href="../css/goal-plan.css">
  <link rel="stylesheet" href="../css/performance-goal.css">
  <link rel="stylesheet" href="../css/self-evaluation.css">
  <link rel="stylesheet" href="../css/performance-evaluation.css">
  <script src="../../../js/components.js"></script>
  <script src="../../../js/app.js" defer></script>
  <script src="../js/self-evaluation-data.js" defer></script>
  <script src="../js/performance-evaluation-data.js" defer></script>
  <script src="../js/performance-evaluation-store.js" defer></script>
  <script src="../js/performance-evaluation.js" defer></script>
</head>
<body class="performance-page performance-goal-page self-evaluation-page performance-evaluation-page evaluation-item-page" data-evaluation-page="item">
  <preview-top-bar active-page="performance"></preview-top-bar>
  <div class="phone-container">
    <header class="performance-header">
      <phone-status-bar time="9:41"></phone-status-bar>
      <div class="performance-header-row">
        <a id="evaluationBack" class="performance-back" href="performance-evaluation.html" data-evaluation-link aria-label="Cancel and return to evaluation"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></a>
        <h1 id="evaluationPageTitle">Update Evaluation</h1>
        <span class="performance-header-spacer" aria-hidden="true"></span>
      </div>
    </header>
    <main class="main-content performance-content performance-goal-content">
      <form id="evaluationItemForm" aria-label="Update evaluation item" novalidate>
        <div id="evaluationItemContext" class="evaluation-context" aria-label="Employee and evaluation reference"></div>
        <section class="goal-form-panel performance-goal-form self-evaluation-section" aria-labelledby="evaluationItemSectionTitle">
          <header class="goal-form-header performance-goal-form-header"><div class="self-evaluation-heading"><h2 id="evaluationItemSectionTitle">Evaluation Item</h2></div></header>
          <div class="goal-form-body">
            <div class="goal-form-field"><label for="evaluationItemTitle">Title</label><textarea id="evaluationItemTitle" rows="1" readonly></textarea></div>
            <div class="goal-form-grid evaluation-edit-metrics">
              <div class="goal-form-field"><label for="evaluationItemWeightage">Weightage</label><input id="evaluationItemWeightage" type="text" readonly></div>
              <div class="goal-form-field"><label for="evaluationItemRating">Rating</label><input id="evaluationItemRating" name="rating" type="number" min="0" max="5" step="0.01" inputmode="decimal" aria-describedby="evaluationRatingScale evaluationItemError" required><p id="evaluationRatingScale" class="evaluation-rating-scale">Out of 5</p></div>
            </div>
            <div class="goal-form-field"><label for="evaluationItemRemark">Remark</label><textarea id="evaluationItemRemark" name="remark" rows="4" maxlength="2000" aria-describedby="evaluationItemError"></textarea></div>
            <p id="evaluationItemError" class="goal-form-error" role="alert" hidden></p>
          </div>
          <footer class="goal-form-footer">
            <a id="evaluationItemCancel" class="goal-form-cancel" href="performance-evaluation.html" data-evaluation-link>Cancel</a>
            <button id="evaluationItemUpdate" class="goal-form-save" type="submit">Update</button>
          </footer>
        </section>
      </form>
      <div id="evaluationNotFound" class="evaluation-empty" role="alert" hidden><h2>Evaluation item not found</h2><p id="evaluationNotFoundMessage"></p></div>
    </main>
    <phone-bottom-nav active="apps"></phone-bottom-nav>
  </div>
</body>
</html>
