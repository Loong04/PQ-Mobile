<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleHCM - Update Self Evaluation</title>
  <script>(() => { document.documentElement.dataset.theme = new URLSearchParams(location.search).get('theme') === 'light' ? 'light' : 'dark'; })();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../css/theme.css">
  <link rel="stylesheet" href="../../../css/app.css">
  <link rel="stylesheet" href="../css/performance.css">
  <link rel="stylesheet" href="../css/goal-plan.css">
  <link rel="stylesheet" href="../css/performance-goal.css">
  <link rel="stylesheet" href="../css/self-evaluation.css">
  <script src="../../../js/components.js"></script>
  <script src="../../../js/app.js" defer></script>
  <script src="../js/self-evaluation-data.js" defer></script>
  <script src="../js/self-evaluation-store.js" defer></script>
  <script src="../js/self-evaluation-item.js" defer></script>
</head>
<body class="performance-page performance-goal-page self-evaluation-page self-evaluation-item-page">
  <preview-top-bar active-page="performance"></preview-top-bar>
  <div class="phone-container">
    <header class="performance-header">
      <phone-status-bar time="9:41"></phone-status-bar>
      <div class="performance-header-row">
        <a id="selfEvaluationItemBack" class="performance-back" href="self-evaluation.html" aria-label="Cancel and return to Self Evaluation"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></a>
        <h1 id="selfEvaluationItemPageTitle">Update Self Evaluation</h1>
        <span class="performance-header-spacer" aria-hidden="true"></span>
      </div>
    </header>
    <main class="main-content performance-content performance-goal-content self-evaluation-content">
      <form id="selfEvaluationItemForm" class="goal-form-panel performance-goal-form self-evaluation-section" aria-label="Update Self Evaluation item" novalidate>
        <header class="goal-form-header performance-goal-form-header">
          <div class="self-evaluation-heading"><h2 id="selfEvaluationItemSectionTitle">Evaluation Item</h2></div>
        </header>
        <div class="goal-form-body">
          <div class="goal-form-field"><label for="selfEvaluationItemTitle">Title</label><textarea id="selfEvaluationItemTitle" rows="1" readonly></textarea></div>
          <div class="goal-form-grid self-evaluation-edit-metrics">
            <div class="goal-form-field"><label for="selfEvaluationItemWeightage">Weightage</label><input id="selfEvaluationItemWeightage" type="text" readonly></div>
            <div class="goal-form-field"><label for="selfEvaluationItemRating">Rating</label><input id="selfEvaluationItemRating" name="rating" type="number" min="0" max="5" step="0.01" inputmode="decimal" aria-describedby="selfEvaluationRatingScale selfEvaluationItemError" required><p id="selfEvaluationRatingScale" class="self-evaluation-rating-scale">Out of 5</p></div>
          </div>
          <div class="goal-form-field"><label for="selfEvaluationItemRemark">Remark</label><textarea id="selfEvaluationItemRemark" name="remark" rows="4" maxlength="2000" aria-describedby="selfEvaluationItemError"></textarea></div>
          <p id="selfEvaluationItemError" class="goal-form-error" role="alert" hidden></p>
        </div>
        <footer class="goal-form-footer">
          <a id="selfEvaluationItemCancel" class="form-cancel-btn" href="self-evaluation.html"><i class="fa-solid fa-xmark" aria-hidden="true"></i><span>Cancel</span></a>
          <button id="selfEvaluationItemSave" class="goal-form-save" type="submit"><i class="fa-solid fa-floppy-disk" aria-hidden="true"></i><span>Update</span></button>
        </footer>
      </form>
      <div id="selfEvaluationItemNotFound" class="self-evaluation-empty" role="alert" hidden><strong>Evaluation item not found</strong><p>Return to Self Evaluation and select another item.</p></div>
    </main>
    <phone-bottom-nav active="apps"></phone-bottom-nav>
  </div>
</body>
</html>
