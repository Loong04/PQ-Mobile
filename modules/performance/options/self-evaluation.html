<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleHCM - Self Evaluation</title>
  <script>(() => { const theme = new URLSearchParams(location.search).get('theme'); document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark'; })();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../css/theme.css">
  <link rel="stylesheet" href="../../../css/app.css">
  <link rel="stylesheet" href="../css/performance.css">
  <link rel="stylesheet" href="../css/goal-plan.css">
  <link rel="stylesheet" href="../css/self-evaluation.css">
  <link rel="stylesheet" href="../../../css/form-section-headings.css">
  <script src="../../../js/components.js"></script>
  <script src="../../../js/app.js" defer></script>
  <script src="../js/self-evaluation-data.js" defer></script>
  <script src="../js/self-evaluation-store.js" defer></script>
  <script src="../js/self-evaluation.js" defer></script>
</head>
<body class="performance-page goal-plan-page self-evaluation-page">
  <preview-top-bar active-page="performance"></preview-top-bar>
  <div class="phone-container">
    <header class="performance-header">
      <phone-status-bar time="9:41"></phone-status-bar>
      <div class="performance-header-row">
        <a id="selfEvaluationBack" class="performance-back" href="../index.html?scope=individual" aria-label="Back to Performance"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></a>
        <h1 id="selfEvaluationPageTitle">Self Evaluation</h1>
        <span class="performance-header-spacer" aria-hidden="true"></span>
      </div>
    </header>
    <main class="main-content performance-content self-evaluation-content">
      <div id="selfEvaluationGeneralView">
        <section class="goal-plan-employee-form" aria-labelledby="selfEvaluationEmployeeHeading">
          <h2 id="selfEvaluationEmployeeHeading" class="form-section-heading">Employee Details</h2>
          <div class="goal-form-field"><label for="selfEvaluationName">Name</label><input id="selfEvaluationName" type="text" readonly></div>
          <div class="goal-form-field"><label for="selfEvaluationPosition">Position</label><input id="selfEvaluationPosition" type="text" readonly></div>
          <div class="goal-form-field"><label for="selfEvaluationDepartment">Department</label><input id="selfEvaluationDepartment" type="text" readonly></div>
          <div class="goal-form-field"><label for="selfEvaluationSupervisor">Supervisor</label><input id="selfEvaluationSupervisor" type="text" readonly></div>
          <div class="goal-form-field"><label for="selfEvaluationReportTo">Reporting To</label><input id="selfEvaluationReportTo" type="text" readonly></div>
          <div class="goal-form-field"><label for="selfEvaluationRef">Evaluation Ref#</label><input id="selfEvaluationRef" type="text" readonly></div>
          <div class="goal-form-grid">
            <div class="goal-form-field"><label for="selfEvaluationPeriod">Period</label><input id="selfEvaluationPeriod" type="text" readonly></div>
            <div class="goal-form-field"><label for="selfEvaluationType">Type</label><input id="selfEvaluationType" type="text" readonly></div>
          </div>
        </section>
        <section class="goal-plan-sections" aria-label="Self Evaluation details">
          <button type="button" class="goal-plan-section-card" data-evaluation-section="goals"><span class="goal-plan-section-icon"><i class="fa-solid fa-bullseye" aria-hidden="true"></i></span><span class="goal-plan-section-copy"><strong class="goal-plan-section-name">Goal</strong><small id="selfEvaluationGoalsSummary"></small></span><span class="goal-plan-section-link">Details <i class="fa-solid fa-chevron-right" aria-hidden="true"></i></span></button>
          <button type="button" class="goal-plan-section-card" data-evaluation-section="competencies"><span class="goal-plan-section-icon"><i class="fa-solid fa-award" aria-hidden="true"></i></span><span class="goal-plan-section-copy"><strong class="goal-plan-section-name">Competency</strong><small id="selfEvaluationCompetenciesSummary"></small></span><span class="goal-plan-section-link">Details <i class="fa-solid fa-chevron-right" aria-hidden="true"></i></span></button>
        </section>
        <div class="goal-plan-footer self-evaluation-actions" aria-label="Self Evaluation actions">
          <a id="selfEvaluationCancel" class="form-cancel-btn goal-plan-cancel-action" href="../index.html?scope=individual"><i class="fa-solid fa-xmark" aria-hidden="true"></i><span>Cancel</span></a>
          <button id="selfEvaluationDraft" type="button" class="goal-plan-secondary-action"><i class="fa-solid fa-floppy-disk" aria-hidden="true"></i><span>Draft</span></button>
          <button id="selfEvaluationSubmit" type="button" class="goal-plan-primary-action"><span>Submit</span><i class="fa-solid fa-paper-plane" aria-hidden="true"></i></button>
        </div>
      </div>
      <section id="selfEvaluationDetailView" aria-labelledby="selfEvaluationListTitle" hidden>
        <div class="goal-plan-detail-card">
          <div class="goal-plan-list-heading"><span id="selfEvaluationListIcon" class="goal-plan-section-icon" aria-hidden="true"></span><h2 id="selfEvaluationListTitle" class="form-section-heading"></h2><button type="button" id="selfEvaluationAdd" class="goal-plan-add" aria-label="Add Goal"><span class="goal-plan-add-glyph" aria-hidden="true">+</span></button></div>
          <div id="selfEvaluationCards" class="goal-plan-cards"></div>
        </div>
      </section>
    </main>
    <div id="selfEvaluationToast" class="app-toast" role="status" aria-live="polite"></div>
    <phone-bottom-nav active="apps"></phone-bottom-nav>
  </div>
</body>
</html>
