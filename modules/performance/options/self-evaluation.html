<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleHCM - Self Evaluation</title>
  <script>(() => { const theme = new URLSearchParams(location.search).get('theme'); document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark'; })();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../css/theme.css">
  <link rel="stylesheet" href="../../../css/app.css">
  <link rel="stylesheet" href="../css/performance.css">
  <link rel="stylesheet" href="../css/goal-plan.css">
  <link rel="stylesheet" href="../css/performance-goal.css">
  <link rel="stylesheet" href="../css/self-evaluation.css">
  <script src="../../../js/components.js"></script>
  <script src="../../../js/app.js" defer></script>
  <script src="../js/self-evaluation-data.js" defer></script>
  <script src="../js/self-evaluation.js" defer></script>
</head>
<body class="performance-page performance-goal-page self-evaluation-page">
  <preview-top-bar active-page="performance"></preview-top-bar>
  <div class="phone-container">
    <header class="performance-header">
      <phone-status-bar time="9:41"></phone-status-bar>
      <div class="performance-header-row">
        <a id="selfEvaluationBack" class="performance-back" href="../index.html?scope=individual" aria-label="Back to Performance"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></a>
        <h1>Self Evaluation</h1>
        <span class="performance-header-spacer" aria-hidden="true"></span>
      </div>
    </header>
    <main class="main-content performance-content performance-goal-content self-evaluation-content">
      <form id="selfEvaluationForm" aria-label="Self Evaluation">
        <section id="selfEvaluationGeneral" class="goal-form-panel performance-goal-form self-evaluation-section" aria-labelledby="selfEvaluationGeneralTitle">
          <header class="goal-form-header performance-goal-form-header">
            <div class="self-evaluation-heading"><h2 id="selfEvaluationGeneralTitle">General</h2></div>
          </header>
          <div class="goal-form-body">
            <div class="goal-form-field"><label for="selfEvaluationName">Name</label><input id="selfEvaluationName" type="text" readonly><span id="selfEvaluationEmployeeId" class="self-evaluation-employee-id"></span></div>
            <div class="goal-form-field"><label for="selfEvaluationPosition">Position</label><input id="selfEvaluationPosition" type="text" readonly></div>
            <div class="goal-form-field"><label for="selfEvaluationDepartment">Department</label><input id="selfEvaluationDepartment" type="text" readonly></div>
            <div class="goal-form-field"><label for="selfEvaluationSupervisor">Supervisor</label><input id="selfEvaluationSupervisor" type="text" readonly><span id="selfEvaluationSupervisorId" class="self-evaluation-employee-id"></span></div>
            <div class="goal-form-field"><label for="selfEvaluationReportTo">Report To</label><input id="selfEvaluationReportTo" type="text" readonly><span id="selfEvaluationReportToId" class="self-evaluation-employee-id"></span></div>
            <div class="goal-form-field"><label for="selfEvaluationRef">Evaluation Ref#</label><input id="selfEvaluationRef" type="text" readonly></div>
            <div class="goal-form-grid">
              <div class="goal-form-field"><label for="selfEvaluationPeriod">Period</label><input id="selfEvaluationPeriod" type="text" readonly></div>
              <div class="goal-form-field"><label for="selfEvaluationType">Type</label><input id="selfEvaluationType" type="text" readonly></div>
            </div>
          </div>
        </section>
        <section id="selfEvaluationGoal" class="goal-form-panel performance-goal-form self-evaluation-section" aria-labelledby="selfEvaluationGoalTitle">
          <header class="goal-form-header performance-goal-form-header">
            <div class="self-evaluation-heading"><h2 id="selfEvaluationGoalTitle">Goal</h2></div>
          </header>
          <div id="selfEvaluationGoalItems" class="self-evaluation-items"></div>
        </section>
        <section id="selfEvaluationCompetency" class="goal-form-panel performance-goal-form self-evaluation-section" aria-labelledby="selfEvaluationCompetencyTitle">
          <header class="goal-form-header performance-goal-form-header">
            <div class="self-evaluation-heading"><h2 id="selfEvaluationCompetencyTitle">Competency</h2></div>
          </header>
          <div id="selfEvaluationCompetencyItems" class="self-evaluation-items"></div>
        </section>
      </form>
    </main>
    <phone-bottom-nav active="apps"></phone-bottom-nav>
  </div>
</body>
</html>
