<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleHCM - Performance Evaluation</title>
  <script>(() => { document.documentElement.dataset.theme = new URLSearchParams(location.search).get('theme') === 'light' ? 'light' : 'dark'; })();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../css/theme.css">
  <link rel="stylesheet" href="../../../css/app.css">
  <link rel="stylesheet" href="../css/performance.css">
  <link rel="stylesheet" href="../css/performance-evaluation.css">
  <script src="../../../js/components.js"></script>
  <script src="../../../js/app.js" defer></script>
  <script src="../js/self-evaluation-data.js" defer></script>
  <script src="../js/performance-evaluation-data.js" defer></script>
  <script src="../js/performance-evaluation-store.js" defer></script>
  <script src="../js/performance-evaluation.js" defer></script>
</head>
<body class="performance-page performance-evaluation-page" data-evaluation-page="list">
  <preview-top-bar active-page="performance"></preview-top-bar>
  <div class="phone-container">
    <header class="performance-header">
      <phone-status-bar time="9:41"></phone-status-bar>
      <div class="performance-header-row">
        <a id="evaluationBack" class="performance-back" href="../index.html?scope=team" data-evaluation-link aria-label="Back to Performance Team"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></a>
        <h1>Performance Evaluation</h1>
        <span class="performance-header-spacer" aria-hidden="true"></span>
      </div>
    </header>
    <main class="main-content performance-content evaluation-list-content">
      <div class="evaluation-filter-bar">
        <div><small>Current Filter</small><strong id="evaluationFilterSummary">All Performance Evaluations</strong></div>
        <button id="evaluationFilterTrigger" type="button" aria-label="Open Performance Evaluation filter" aria-haspopup="dialog" aria-controls="evaluationFilterOverlay" aria-expanded="false"><i class="fa-solid fa-sliders" aria-hidden="true"></i></button>
      </div>
      <section class="record-summary-card evaluation-total" aria-label="Performance Evaluation totals" aria-live="polite">
        <div class="record-summary-metric"><span class="record-summary-label">Total Records</span><strong id="evaluationTotalRecords" class="record-summary-value">0</strong></div>
      </section>
      <div id="evaluationCards" class="evaluation-cards" aria-label="Employee evaluations"></div>
      <div id="evaluationEmpty" class="evaluation-empty" hidden><h2>No evaluations found</h2><p>Try another keyword or reset the filters.</p></div>
    </main>
    <phone-bottom-nav active="apps"></phone-bottom-nav>
    <div id="evaluationFilterOverlay" class="evaluation-overlay standard-filter-sheet" hidden>
      <form id="evaluationFilterForm" class="standard-filter-panel" data-standard-filter-ready="true" role="dialog" aria-modal="true" aria-labelledby="evaluationFilterTitle">
        <div class="standard-filter-handle" aria-hidden="true"></div>
        <header class="standard-filter-header">
          <h2 id="evaluationFilterTitle">Filter</h2>
          <div class="standard-filter-header-actions">
            <button id="evaluationResetFilter" class="standard-filter-reset" type="button"><i class="fa-solid fa-rotate-left" aria-hidden="true"></i><span>Reset</span></button>
            <button id="evaluationCloseFilter" class="standard-filter-close" type="button" aria-label="Close filter"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
          </div>
        </header>
        <div class="standard-filter-inline-body">
          <div><label for="evaluationFilterKeyword">Search Keyword</label><input id="evaluationFilterKeyword" name="keyword" type="search" maxlength="200" placeholder="Search employee, ID or reference"></div>
          <div><label for="evaluationFilterCompany">Company</label><select id="evaluationFilterCompany" name="company"><option value="">All Companies</option></select></div>
          <div><label for="evaluationFilterDepartment">Department</label><select id="evaluationFilterDepartment" name="department"><option value="">All Departments</option></select></div>
          <div><label for="evaluationFilterJob">Job</label><select id="evaluationFilterJob" name="job"><option value="">All Jobs</option></select></div>
          <div><label for="evaluationFilterPeriod">Period</label><select id="evaluationFilterPeriod" name="period"><option value="">All Periods</option></select></div>
          <div><label for="evaluationFilterType">Type</label><select id="evaluationFilterType" name="type"><option value="">All Types</option></select></div>
        </div>
        <footer class="standard-filter-footer"><button id="evaluationApplyFilter" class="standard-filter-apply" type="submit">Apply Filter</button></footer>
      </form>
    </div>
  </div>
</body>
</html>
