<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleHCM - Performance Goal</title>
  <script>(() => { const theme = new URLSearchParams(location.search).get('theme'); document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark'; })();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../css/theme.css">
  <link rel="stylesheet" href="../../../css/app.css">
  <link rel="stylesheet" href="../css/performance.css">
  <link rel="stylesheet" href="../css/goal-plan.css">
  <link rel="stylesheet" href="../css/performance-goal.css">
  <script src="../../../js/components.js"></script>
  <script src="../../../js/app.js" defer></script>
  <script src="../js/goal-plan-data.js" defer></script>
  <script src="../js/performance-goal.js" defer></script>
</head>
<body class="performance-page performance-goal-page">
  <preview-top-bar active-page="performance"></preview-top-bar>
  <div class="phone-container">
    <header class="performance-header">
      <phone-status-bar time="9:41"></phone-status-bar>
      <div class="performance-header-row">
        <a id="performanceGoalBack" class="performance-back" href="goal-plan.html" aria-label="Back to Goal Plan"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></a>
        <h1 id="performanceGoalTitle">Performance Goal</h1>
        <span class="performance-header-spacer" aria-hidden="true"></span>
      </div>
    </header>
    <main class="main-content performance-content performance-goal-content">
      <form id="goalForm" class="goal-form-panel performance-goal-form" novalidate>
        <div class="goal-form-body">
          <div class="goal-form-field"><label for="goalTitleInput">Goal Title <span aria-hidden="true">*</span></label><input id="goalTitleInput" name="goalTitle" type="text" maxlength="120" autocomplete="off" required></div>
          <div class="goal-form-field"><label for="goalTypeInput">Goal Type <span aria-hidden="true">*</span></label><select id="goalTypeInput" name="goalType" required><option value="">Select Goal Type</option></select></div>
          <div class="goal-form-field"><label for="goalDescriptionInput">Goal Description</label><textarea id="goalDescriptionInput" name="goalDescription" rows="3" maxlength="600"></textarea></div>
          <div class="goal-form-field"><label for="goalTargetInput">Target Description <span aria-hidden="true">*</span></label><textarea id="goalTargetInput" name="targetDescription" rows="3" maxlength="400" placeholder="Base Target: 100%&#10;Stretch Target: 110%" required></textarea></div>
          <div class="goal-form-grid">
            <div class="goal-form-field"><label for="goalDeadlineInput">Deadline <span aria-hidden="true">*</span></label><input id="goalDeadlineInput" name="deadline" type="date" value="2026-12-31" required></div>
            <div class="goal-form-field"><label for="goalWeightageInput">Weightage <span aria-hidden="true">*</span></label><div class="goal-form-number"><input id="goalWeightageInput" name="weightage" type="number" min="0.01" max="100" step="0.01" inputmode="decimal" required><span>%</span></div></div>
            <div class="goal-form-field" id="goalRatingField" hidden><label for="goalRatingInput">Rating <span aria-hidden="true">*</span></label><div class="goal-form-number"><input id="goalRatingInput" name="rating" type="number" min="0" max="5" step="0.1" inputmode="decimal"><span>/ 5</span></div></div>
          </div>
          <div class="goal-form-field"><label for="goalBudgetHoursInput">Budget Hours</label><input id="goalBudgetHoursInput" name="budgetHours" type="number" min="0" step="0.5" inputmode="decimal" value="0"></div>
          <div class="goal-form-field"><label for="goalRemarkInput">Remark</label><textarea id="goalRemarkInput" name="remark" rows="3" maxlength="500"></textarea></div>
          <p id="goalFormError" class="goal-form-error" role="alert" hidden></p>
        </div>
        <footer class="goal-form-footer">
          <button type="button" id="goalFormCancel" class="goal-form-cancel form-cancel-btn"><i class="fa-solid fa-xmark" aria-hidden="true"></i><span>Cancel</span></button>
          <button type="submit" id="goalFormSave" class="goal-form-save"><i class="fa-solid fa-floppy-disk" aria-hidden="true"></i><span>Save</span></button>
        </footer>
      </form>
    </main>
    <phone-bottom-nav active="apps"></phone-bottom-nav>
  </div>
</body>
</html>
