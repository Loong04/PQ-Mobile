<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleHCM - Staff Incident</title>
  <script>(() => { document.documentElement.dataset.theme = new URLSearchParams(location.search).get('theme') === 'light' ? 'light' : 'dark'; })();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../css/theme.css">
  <link rel="stylesheet" href="../../../css/app.css">
  <link rel="stylesheet" href="../../employee-career/css/employee-career.css">
  <link rel="stylesheet" href="../../employee-career/css/employee-career-forms.css">
  <link rel="stylesheet" href="../../../css/form-section-headings.css">
  <link rel="stylesheet" href="../css/performance.css">
  <link rel="stylesheet" href="../css/staff-incident.css">
  <script src="../../../js/components.js"></script>
  <script src="../../../js/app.js" defer></script>
  <script src="../js/work-incident-data.js" defer></script>
  <script src="../js/incident-highlight-data.js" defer></script>
  <script src="../js/staff-incident-preview-store.js" defer></script>
  <script src="../js/staff-incident.js" defer></script>
</head>
<body class="performance-page employee-career-form-page employee-career-team-form-page staff-incident-page">
  <preview-top-bar active-page="performance"></preview-top-bar>
  <div class="phone-container">
    <header class="performance-header"><phone-status-bar time="9:41"></phone-status-bar><div class="performance-header-row"><a id="staffIncidentBack" class="performance-back" href="../index.html?scope=team" aria-label="Back to Performance"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></a><h1>Staff Incident</h1><span class="performance-header-spacer" aria-hidden="true"></span></div></header>
    <main class="main-content employee-career-content">
      <form id="staffIncidentForm" novalidate>
        <div class="employee-career-form-card">
          <p id="staffIncidentError" class="staff-incident-error" role="alert" hidden></p>
          <section class="employee-career-form-section" aria-labelledby="staffIncidentEmployeeHeading">
            <h2 id="staffIncidentEmployeeHeading" class="form-section-heading">Employee Details</h2>
            <div class="employee-career-field"><label for="staffIncidentEmployee">Employee <span class="staff-incident-required" aria-hidden="true">*</span></label><div class="employee-career-form-select"><select id="staffIncidentEmployee" name="employee" class="employee-career-control" required aria-describedby="staffIncidentError"><option value="">Select Employee</option></select></div></div>
            <div class="employee-career-field"><label for="staffIncidentName">Name</label><input id="staffIncidentName" name="name" class="employee-career-control employee-career-readonly" type="text" placeholder="Selected employee name" readonly></div>
            <div class="employee-career-field"><label for="staffIncidentPosition">Position</label><input id="staffIncidentPosition" name="position" class="employee-career-control employee-career-readonly" type="text" placeholder="Selected employee position" readonly></div>
          </section>
          <section class="employee-career-form-section" aria-labelledby="staffIncidentDetailsHeading">
            <h2 id="staffIncidentDetailsHeading" class="form-section-heading">Incident Details</h2>
            <div class="employee-career-field"><label for="staffIncidentDate">Incident Date <span class="staff-incident-required" aria-hidden="true">*</span></label><input id="staffIncidentDate" name="incidentDate" class="employee-career-control" type="date" required aria-describedby="staffIncidentError"></div>
            <div class="employee-career-field"><label for="staffIncidentType">Incident Type <span class="staff-incident-required" aria-hidden="true">*</span></label><div class="employee-career-form-select"><select id="staffIncidentType" name="incidentType" class="employee-career-control" required aria-describedby="staffIncidentError"><option value="">Select Incident Type</option></select></div></div>
            <div class="employee-career-field"><label for="staffIncidentActionType">Action Type <span class="staff-incident-required" aria-hidden="true">*</span></label><div class="employee-career-form-select"><select id="staffIncidentActionType" name="actionType" class="employee-career-control" required disabled aria-describedby="staffIncidentError"><option value="">Select Action Type</option></select></div></div>
            <div class="employee-career-field"><label for="staffIncidentValueMeasure">Value / Measure <span class="staff-incident-required" aria-hidden="true">*</span></label><input id="staffIncidentValueMeasure" name="measureValue" class="employee-career-control" type="text" maxlength="160" placeholder="Enter value or measure" required aria-describedby="staffIncidentError"></div>
            <div class="employee-career-field"><label for="staffIncidentRemarks">Remarks</label><textarea id="staffIncidentRemarks" name="remarks" class="employee-career-control" rows="3" maxlength="5000" placeholder="Add incident remarks"></textarea></div>
          </section>
          <fieldset class="employee-career-field employee-career-fieldset">
            <legend class="form-section-heading">Upload Attachments</legend>
            <div class="employee-career-upload-actions"><button class="employee-career-upload-button" type="button" data-file-picker="staffIncidentFiles"><span class="employee-career-upload-icon"><i class="fa-solid fa-file-arrow-up" aria-hidden="true"></i></span><span>Select File(s)</span></button><button class="employee-career-upload-button" type="button" data-file-picker="staffIncidentCamera"><span class="employee-career-upload-icon"><i class="fa-solid fa-camera" aria-hidden="true"></i></span><span>Take a Picture</span></button></div>
            <input id="staffIncidentFiles" type="file" multiple hidden><input id="staffIncidentCamera" type="file" accept="image/*" capture="environment" hidden>
            <div id="staffIncidentAttachments" class="form-attachment-list" aria-live="polite"></div>
          </fieldset>
        </div>
        <div class="employee-career-form-actions"><a id="staffIncidentCancel" class="form-cancel-btn" href="../index.html?scope=team"><i class="fa-solid fa-xmark" aria-hidden="true"></i><span>Cancel</span></a><button id="staffIncidentSubmit" type="submit" class="employee-career-button primary"><span>Submit</span><i class="fa-solid fa-paper-plane" aria-hidden="true"></i></button></div>
        <p id="staffIncidentStatus" class="staff-incident-status" role="status" aria-live="polite" hidden></p>
      </form>
    </main>
    <phone-bottom-nav active="apps"></phone-bottom-nav>
  </div>
</body>
</html>
