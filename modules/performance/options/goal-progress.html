<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleHCM - Goal Progress</title>
  <script>(() => { const theme = new URLSearchParams(location.search).get('theme'); document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark'; })();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../css/theme.css">
  <link rel="stylesheet" href="../../../css/app.css">
  <link rel="stylesheet" href="../../../css/claim-forms.css">
  <link rel="stylesheet" href="../css/performance.css">
  <link rel="stylesheet" href="../css/goal-progress.css">
  <script src="../../../js/components.js"></script>
  <script src="../../../js/app.js" defer></script>
  <script src="../js/goal-progress-data.js" defer></script>
  <script src="../js/goal-progress.js" defer></script>
</head>
<body class="performance-page goal-progress-page">
  <preview-top-bar active-page="performance"></preview-top-bar>
  <div class="phone-container">
    <header class="performance-header">
      <phone-status-bar time="9:41"></phone-status-bar>
      <div class="performance-header-row">
        <a id="goalProgressBack" class="performance-back" href="../index.html?scope=individual" aria-label="Back to Performance"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></a>
        <h1 id="goalProgressTitle">Goal Progress</h1>
        <span class="performance-header-spacer" aria-hidden="true"></span>
      </div>
    </header>

    <main class="main-content performance-content goal-progress-content">
      <section id="goalProgressListView" aria-labelledby="goalProgressSummaryTitle">
        <h2 id="goalProgressSummaryTitle" class="sr-only">Goal progress summary</h2>
        <button id="goalProgressFilterTrigger" class="claim-filter-bar" type="button" aria-haspopup="dialog" aria-controls="goalProgressFilterModal" aria-expanded="false"><span class="claim-filter-copy"><span class="claim-eyebrow">Current Filter</span><span class="claim-filter-value"><i class="fa-solid fa-filter" aria-hidden="true"></i><span id="goalProgressFilterSummary">All Periods &bull; All Evaluation Types</span></span></span><span class="claim-icon-button" aria-hidden="true"><i class="fa-solid fa-sliders"></i></span></button>

        <div class="goal-progress-total-row record-summary-metric record-summary-card"><span class="record-summary-label">Total Records</span><strong id="goalProgressTotal" class="record-summary-value" aria-live="polite">0</strong></div>
        <div id="goalProgressCards" class="goal-progress-cards"></div>
        <div id="goalProgressEmpty" class="goal-progress-empty" hidden>
          <span><i class="fa-solid fa-filter-circle-xmark" aria-hidden="true"></i></span>
          <h3>No goals found</h3>
          <p>Try another period or evaluation type.</p>
        </div>
      </section>

      <section id="goalProgressUpdateView" class="goal-progress-update-view" aria-label="Update Goal Progress" hidden>
        <div id="goalProgressOverviewView">
        <article class="goal-progress-form-card goal-progress-context-card">
          <div class="goal-progress-section-heading"><span></span><h2>Goal Details</h2><span id="goalProgressDraftStatus" class="goal-progress-status">Draft</span></div>
          <header class="goal-progress-context-header">
            <span id="goalProgressCategory" class="goal-progress-context-line"></span>
            <h2 id="goalProgressFormHeading" class="goal-progress-context-line"></h2>
            <span id="goalProgressUnit" class="goal-progress-context-line"></span>
          </header>
        </article>
        <section class="goal-progress-history" aria-labelledby="goalProgressHistoryTitle">
          <div class="goal-progress-history-heading">
            <span class="goal-progress-section-icon"><i class="fa-solid fa-chart-line" aria-hidden="true"></i></span>
            <div><h2 id="goalProgressHistoryTitle">Progress Details</h2><span id="goalProgressHistoryCount" aria-live="polite">0 records · Total Hours: 0 hrs</span></div>
            <button id="goalProgressNew" class="goal-progress-new" type="button" aria-label="Add Progress Details" title="Add Progress Details"><i class="fa-solid fa-plus" aria-hidden="true"></i></button>
          </div>
          <div class="goal-progress-history-content">
            <div id="goalProgressEntries"></div>
            <div id="goalProgressHistoryEmpty" class="goal-progress-history-empty"><span class="goal-progress-empty-icon"><i class="fa-solid fa-chart-line" aria-hidden="true"></i></span><h3>No entries yet</h3><p>Tap + to add your progress details.</p></div>
          </div>
        </section>
        <p id="goalProgressOverviewError" class="goal-progress-form-error" role="alert" hidden></p>
        <div class="goal-progress-page-actions">
          <button id="goalProgressCancel" class="goal-progress-secondary" type="button"><i class="fa-solid fa-xmark" aria-hidden="true"></i><span>Cancel</span></button>
          <button id="goalProgressSaveDraft" class="goal-progress-secondary" type="button"><i class="fa-solid fa-floppy-disk" aria-hidden="true"></i><span>Save Draft</span></button>
          <button id="goalProgressSubmit" class="goal-progress-primary" type="button"><span>Submit</span><i class="fa-solid fa-paper-plane" aria-hidden="true"></i></button>
        </div>
        </div>
        <section id="goalProgressEntryView" aria-labelledby="goalProgressEntryHeading" hidden>
        <article class="goal-progress-form-card">
          <form id="goalProgressForm" class="goal-progress-form" novalidate>
            <div class="goal-progress-section-heading"><span></span><h2 id="goalProgressEntryHeading">Add Progress Details</h2></div>
            <p id="goalProgressEntryContext" class="goal-progress-entry-context"></p>
            <div class="goal-progress-form-grid">
              <div class="goal-progress-field"><label for="goalProgressDate">Date <span aria-hidden="true">*</span></label><input id="goalProgressDate" name="date" type="date" required></div>
              <div class="goal-progress-field"><label for="goalProgressHours">Hours Spent <span aria-hidden="true">*</span></label><input id="goalProgressHours" name="hours" type="number" min="0.1" step="0.1" inputmode="decimal" required></div>
              <div class="goal-progress-field"><label for="goalProgressAchievedValue">Achieved Value <span aria-hidden="true">*</span></label><div class="goal-progress-input-suffix"><input id="goalProgressAchievedValue" name="achievedValue" type="number" min="0" step="0.01" inputmode="decimal" required><span id="goalProgressValueUnit">MT</span></div></div>
              <div class="goal-progress-field"><label for="goalProgressAchievedPercent">Achieved % <span aria-hidden="true">*</span></label><div class="goal-progress-input-suffix"><input id="goalProgressAchievedPercent" name="achievedPercent" type="number" min="0" max="100" step="0.01" inputmode="decimal" required><span>%</span></div></div>
            </div>
            <div class="goal-progress-field"><label for="goalProgressRemark">Remark</label><textarea id="goalProgressRemark" name="remark" rows="3" maxlength="500" placeholder="Add a short progress note"></textarea></div>
            <p id="goalProgressFormError" class="goal-progress-form-error" role="alert" hidden></p>
          </form>
        </article>
        <div class="goal-progress-entry-actions">
          <button id="goalProgressEntryCancel" class="goal-progress-secondary" type="button"><i class="fa-solid fa-xmark" aria-hidden="true"></i><span>Cancel</span></button>
          <button id="goalProgressSaveItem" class="goal-progress-primary" type="submit" form="goalProgressForm"><i class="fa-solid fa-floppy-disk" aria-hidden="true"></i><span>Save Item</span></button>
        </div>
        </section>
      </section>
    </main>
    <div id="goalProgressToast" class="app-toast" role="status" aria-live="polite"></div>
    <phone-bottom-nav active="apps"></phone-bottom-nav>
    <div id="goalProgressFilterModal" class="claim-filter-sheet" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="goalProgressFilterTitle">
      <form id="goalProgressFilterForm" class="claim-filter-panel">
        <div class="claim-filter-handle" aria-hidden="true"></div>
        <div class="claim-filter-header"><h2 id="goalProgressFilterTitle" class="claim-filter-title">Filter</h2><div class="claim-filter-header-actions"><button id="goalProgressResetFilter" class="claim-filter-reset" type="button"><i class="fa-solid fa-rotate-left" aria-hidden="true"></i><span>Reset</span></button><button id="goalProgressCloseFilter" class="claim-filter-close" type="button" aria-label="Close Goal Progress filter"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button></div></div>
        <div class="claim-filter-fields">
          <div class="goal-progress-filter"><label for="goalProgressPeriodFilter" class="claim-filter-label">Period</label><div class="claim-filter-select-wrap"><select id="goalProgressPeriodFilter" class="claim-filter-select"><option value="">All Periods</option></select><i class="fa-solid fa-chevron-down claim-filter-chevron" aria-hidden="true"></i></div></div>
          <div class="goal-progress-filter"><label for="goalProgressEvaluationFilter" class="claim-filter-label">Evaluation Type</label><div class="claim-filter-select-wrap"><select id="goalProgressEvaluationFilter" class="claim-filter-select"><option value="">All Evaluation Types</option></select><i class="fa-solid fa-chevron-down claim-filter-chevron" aria-hidden="true"></i></div></div>
        </div>
        <button id="goalProgressApplyFilter" class="claim-filter-apply" type="submit">Apply Filter</button>
      </form>
    </div>
  </div>
</body>
</html>
