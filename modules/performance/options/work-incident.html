<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleHCM - Work Incident</title>
  <script>(() => { const theme = new URLSearchParams(location.search).get('theme'); document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark'; })();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../css/theme.css">
  <link rel="stylesheet" href="../../../css/app.css">
  <link rel="stylesheet" href="../../../css/detail-popout.css">
  <link rel="stylesheet" href="../../../css/attendance-highlight-report.css">
  <link rel="stylesheet" href="../css/performance.css">
  <link rel="stylesheet" href="../css/work-incident.css">
  <script src="../../../js/components.js"></script>
  <script src="../../../js/app.js" defer></script>
  <script src="../js/work-incident-data.js" defer></script>
  <script src="../js/work-incident.js" defer></script>
</head>
<body class="performance-page work-incident-page">
  <preview-top-bar active-page="performance"></preview-top-bar>
  <div class="phone-container">
    <header class="performance-header">
      <phone-status-bar time="9:41"></phone-status-bar>
      <div class="performance-header-row">
        <a id="workIncidentBack" class="performance-back" href="../index.html?scope=individual" aria-label="Back to Performance"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></a>
        <h1>Work Incident</h1><span class="performance-header-spacer" aria-hidden="true"></span>
      </div>
    </header>
    <main class="main-content performance-content">
      <section class="work-incident-filter-bar" aria-label="Current filter">
        <div><small>Current Filter</small><strong id="workIncidentFilterSummary">All Incident Types &bull; All Dates</strong></div>
        <button type="button" id="workIncidentFilterTrigger" aria-label="Open Work Incident filter" aria-haspopup="dialog" aria-controls="workIncidentFilterOverlay"><i class="fa-solid fa-sliders" aria-hidden="true"></i></button>
      </section>
      <section class="attendance-report-summary" aria-label="Work Incident totals" aria-live="polite">
        <div class="attendance-report-summary-row"><div><span class="attendance-report-summary-label">Total Records</span><strong id="workIncidentTotalRecords" class="attendance-report-summary-value">0</strong></div></div>
        <div class="attendance-report-summary-row"><div><span class="attendance-report-summary-label">Total Points</span><strong id="workIncidentTotalPoints" class="attendance-report-summary-value">0</strong></div></div>
      </section>
      <section class="work-incident-table-card" aria-label="Work incidents">
        <table class="work-incident-table"><colgroup><col style="width:29%"><col style="width:51%"><col style="width:20%"></colgroup>
          <thead><tr><th scope="col">Date</th><th scope="col">Incident Type</th><th scope="col">Point</th></tr></thead>
          <tbody id="workIncidentRows"></tbody>
        </table>
        <div id="workIncidentEmpty" class="work-incident-empty" hidden><i class="fa-solid fa-clipboard-list" aria-hidden="true"></i><h2>No Work Incidents Found</h2><p>Try another incident type or date range.</p></div>
      </section>
      <p class="work-incident-note">Sample records &bull; Select a row to view details</p>
    </main>
    <phone-bottom-nav active="apps"></phone-bottom-nav>
    <div id="workIncidentFilterOverlay" class="work-incident-overlay standard-filter-sheet" hidden>
      <form id="workIncidentFilterForm" class="standard-filter-panel" data-standard-filter-ready="true" role="dialog" aria-modal="true" aria-labelledby="workIncidentFilterTitle" novalidate>
        <div class="standard-filter-handle" aria-hidden="true"></div>
        <header class="standard-filter-header"><h2 id="workIncidentFilterTitle">Filter</h2><div class="standard-filter-header-actions">
          <button type="button" id="workIncidentResetFilter" class="standard-filter-reset"><i class="fa-solid fa-rotate-left" aria-hidden="true"></i><span>Reset</span></button>
          <button type="button" id="workIncidentCloseFilter" class="standard-filter-close" aria-label="Close Work Incident filter"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
        </div></header>
        <div class="standard-filter-inline-body">
          <div><label for="workIncidentFilterType">Incident type</label><select id="workIncidentFilterType" name="incidentType"><option value="">All Incident Types</option></select></div>
          <div><label for="workIncidentFilterStart">Start date</label><input id="workIncidentFilterStart" name="startDate" type="date" aria-describedby="workIncidentFilterError"></div>
          <div><label for="workIncidentFilterEnd">End date</label><input id="workIncidentFilterEnd" name="endDate" type="date" aria-describedby="workIncidentFilterError"></div>
          <p id="workIncidentFilterError" class="work-incident-error" role="alert" hidden></p>
        </div>
        <footer class="standard-filter-footer"><button type="submit" id="workIncidentApplyFilter" class="standard-filter-apply">Apply Filter</button></footer>
      </form>
    </div>
    <div id="workIncidentDetailsOverlay" class="work-incident-overlay detail-popout-overlay" hidden>
      <section class="detail-popout-panel" role="dialog" aria-modal="true" aria-labelledby="workIncidentDetailsTitle">
        <header class="detail-popout-header"><h2 id="workIncidentDetailsTitle" class="detail-popout-title">Work Incident Details</h2><button type="button" id="workIncidentDetailsClose" class="detail-popout-close" aria-label="Close Work Incident details"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button></header>
        <div class="detail-popout-body" tabindex="0" role="region" aria-label="Work Incident information"><table class="detail-popout-table" aria-label="Incident details"><tbody id="workIncidentDetailsRows"></tbody></table></div>
      </section>
    </div>
  </div>
</body>
</html>
