<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleHCM - Goal Plan</title>
  <script>(() => { const theme = new URLSearchParams(location.search).get('theme'); document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark'; })();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../css/theme.css">
  <link rel="stylesheet" href="../../../css/app.css">
  <link rel="stylesheet" href="../../../css/detail-popout.css">
  <link rel="stylesheet" href="../css/performance.css">
  <link rel="stylesheet" href="../css/goal-plan.css">
  <link rel="stylesheet" href="../../../css/form-section-headings.css">
  <script src="../../../js/components.js"></script>
  <script src="../../../js/app.js" defer></script>
  <script src="../js/goal-plan-data.js" defer></script>
  <script src="../js/goal-plan.js" defer></script>
</head>
<body class="performance-page goal-plan-page">
  <preview-top-bar active-page="performance"></preview-top-bar>
  <div class="phone-container">
    <header class="performance-header">
      <phone-status-bar time="9:41"></phone-status-bar>
      <div class="performance-header-row">
        <a id="goalPlanBack" class="performance-back" href="../index.html?scope=individual" aria-label="Back to Performance"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></a>
        <h1 id="goalPlanTitle">Goal Plan</h1>
        <span class="goal-plan-header-spacer" aria-hidden="true"></span>
      </div>
    </header>

    <main class="main-content performance-content goal-plan-content">
      <div id="goalPlanGeneral">
        <section class="goal-plan-employee-form" aria-labelledby="goalPlanEmployeeHeading">
          <h2 id="goalPlanEmployeeHeading" class="form-section-heading">Employee Details</h2>
          <div class="goal-form-field"><label for="goalPlanEmployeeName">Name</label><input id="goalPlanEmployeeName" type="text" readonly></div>
          <div class="goal-form-field"><label for="goalPlanPosition">Position</label><input id="goalPlanPosition" type="text" readonly></div>
          <div class="goal-form-field"><label for="goalPlanDepartment">Department</label><input id="goalPlanDepartment" type="text" readonly></div>
          <div class="goal-form-field"><label for="goalPlanSupervisorName">Supervisor</label><input id="goalPlanSupervisorName" type="text" readonly></div>
          <div class="goal-form-field"><label for="goalPlanReportingName">Reporting To</label><input id="goalPlanReportingName" type="text" readonly></div>
          <div class="goal-form-grid">
            <div class="goal-form-field"><label for="goalPlanPeriod">Period</label><input id="goalPlanPeriod" type="text" readonly></div>
            <div class="goal-form-field"><label for="goalPlanAppraisalType">Appraisal Type</label><input id="goalPlanAppraisalType" type="text" readonly></div>
          </div>
        </section>
        <section class="goal-plan-sections" aria-label="Goal Plan details">
          <button type="button" class="goal-plan-section-card" data-plan-section="goals">
            <span class="goal-plan-section-icon" aria-hidden="true"><i class="fa-solid fa-bullseye"></i></span>
            <span class="goal-plan-section-copy"><strong class="goal-plan-section-name">Performance Goal</strong><small id="goalPlanGoalsSummary">0 items added</small></span>
            <span class="goal-plan-section-link">Details <i class="fa-solid fa-chevron-right" aria-hidden="true"></i></span>
          </button>
          <button type="button" class="goal-plan-section-card" data-plan-section="competencies">
            <span class="goal-plan-section-icon" aria-hidden="true"><i class="fa-solid fa-award"></i></span>
            <span class="goal-plan-section-copy"><strong class="goal-plan-section-name">Competency</strong><small id="goalPlanCompetenciesSummary">0 items added</small></span>
            <span class="goal-plan-section-link">Details <i class="fa-solid fa-chevron-right" aria-hidden="true"></i></span>
          </button>
        </section>
        <aside class="goal-plan-footer" aria-label="Goal Plan actions">
          <a id="goalPlanCancel" class="form-cancel-btn goal-plan-cancel-action" href="../index.html?scope=individual"><i class="fa-solid fa-xmark" aria-hidden="true"></i><span>Cancel</span></a>
          <button type="button" id="goalPlanSaveDraft" class="goal-plan-secondary-action"><i class="fa-solid fa-floppy-disk" aria-hidden="true"></i><span>Draft</span></button>
          <button type="button" id="goalPlanSubmit" class="goal-plan-primary-action"><span>Submit</span><i class="fa-solid fa-paper-plane" aria-hidden="true"></i></button>
        </aside>
      </div>
      <section id="goalPlanDetailView" aria-labelledby="goalPlanListTitle" hidden>
        <div class="goal-plan-detail-card">
        <div class="goal-plan-list-heading">
          <span id="goalPlanListIcon" class="goal-plan-section-icon" aria-hidden="true"><i class="fa-solid fa-bullseye"></i></span>
          <h2 id="goalPlanListTitle" class="form-section-heading">Performance Goal</h2>
          <button type="button" id="goalPlanAdd" class="goal-plan-add" aria-label="Add Goal"><span class="goal-plan-add-glyph" aria-hidden="true">+</span></button>
        </div>
        <div id="goalPlanCards" class="goal-plan-cards"></div>
        <div id="goalPlanEmpty" class="goal-plan-empty" hidden><i class="fa-solid fa-list-check" aria-hidden="true"></i><h3>No items added yet</h3><p id="goalPlanEmptyMessage">Click "+" above to add your first record.</p></div>
        </div>
      </section>
    </main>
    <div id="goalPlanToast" class="app-toast" role="status" aria-live="polite"></div>
    <phone-bottom-nav active="apps"></phone-bottom-nav>

    <div id="goalDeleteOverlay" class="goal-plan-overlay goal-delete-overlay" hidden>
      <section class="goal-delete-dialog" role="alertdialog" aria-modal="true" aria-labelledby="goalDeleteTitle" aria-describedby="goalDeleteMessage">
        <span class="goal-delete-icon"><i class="fa-solid fa-trash" aria-hidden="true"></i></span>
        <h2 id="goalDeleteTitle">Delete Goal?</h2>
        <p id="goalDeleteMessage">This goal will be removed from your plan.</p>
        <div><button type="button" id="goalDeleteCancel">Keep Goal</button><button type="button" id="goalDeleteConfirm">Delete</button></div>
      </section>
    </div>
  </div>
</body>
</html>
