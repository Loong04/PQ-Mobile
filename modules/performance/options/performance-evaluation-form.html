<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleHCM - Performance Evaluation</title>
  <script>(() => { document.documentElement.dataset.theme = new URLSearchParams(location.search).get('theme') === 'light' ? 'light' : 'dark'; })();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../css/theme.css">
  <link rel="stylesheet" href="../../../css/app.css">
  <link rel="stylesheet" href="../css/performance.css">
  <link rel="stylesheet" href="../css/goal-plan.css">
  <link rel="stylesheet" href="../css/performance-goal.css">
  <link rel="stylesheet" href="../css/self-evaluation.css">
  <link rel="stylesheet" href="../css/performance-evaluation.css">
  <script src="../../../js/components.js"></script>
  <script src="../../../js/app.js" defer></script>
  <script src="../js/self-evaluation-data.js" defer></script>
  <script src="../js/performance-evaluation-data.js" defer></script>
  <script src="../js/performance-evaluation-store.js" defer></script>
  <script src="../js/performance-evaluation.js" defer></script>
</head>
<body class="performance-page performance-goal-page self-evaluation-page performance-evaluation-page" data-evaluation-page="details">
  <preview-top-bar active-page="performance"></preview-top-bar>
  <div class="phone-container">
    <header class="performance-header">
      <phone-status-bar time="9:41"></phone-status-bar>
      <div class="performance-header-row">
        <a id="evaluationBack" class="performance-back" href="performance-evaluation.html" data-evaluation-link aria-label="Back to Performance Evaluation list"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></a>
        <h1>Performance Evaluation</h1>
        <span class="performance-header-spacer" aria-hidden="true"></span>
      </div>
    </header>
    <main class="main-content performance-content performance-goal-content">
      <form id="evaluationDetailsForm" aria-label="Employee Performance Evaluation">
        <div id="evaluationGeneralView">
          <section id="evaluationGeneral" class="goal-form-panel performance-goal-form self-evaluation-section evaluation-form-section" aria-labelledby="evaluationGeneralTitle">
            <header class="goal-form-header performance-goal-form-header"><div class="self-evaluation-heading"><h2 id="evaluationGeneralTitle">General</h2></div></header>
            <div id="evaluationGeneralFields" class="goal-form-body"></div>
          </section>
          <section class="goal-plan-sections evaluation-section-links" aria-label="Evaluation sections">
            <button type="button" class="goal-plan-section-card" data-evaluation-details="goals"><span class="goal-plan-section-icon"><i class="fa-solid fa-bullseye" aria-hidden="true"></i></span><span class="goal-plan-section-copy"><strong class="goal-plan-section-name">Goal</strong><small id="evaluationGoalsSummary"></small></span><span class="goal-plan-section-link">Details <i class="fa-solid fa-chevron-right" aria-hidden="true"></i></span></button>
            <button type="button" class="goal-plan-section-card" data-evaluation-details="competencies"><span class="goal-plan-section-icon"><i class="fa-solid fa-award" aria-hidden="true"></i></span><span class="goal-plan-section-copy"><strong class="goal-plan-section-name">Competency</strong><small id="evaluationCompetenciesSummary"></small></span><span class="goal-plan-section-link">Details <i class="fa-solid fa-chevron-right" aria-hidden="true"></i></span></button>
          </section>
        </div>
        <section id="evaluationDetailView" aria-labelledby="evaluationListTitle" hidden>
          <div class="goal-plan-detail-card">
            <div class="goal-plan-list-heading"><span id="evaluationListIcon" class="goal-plan-section-icon" aria-hidden="true"></span><h2 id="evaluationListTitle" class="form-section-heading"></h2><button type="button" id="evaluationAdd" class="goal-plan-add" aria-label="Add Goal"><span class="goal-plan-add-glyph" aria-hidden="true">+</span></button></div>
            <div id="evaluationSectionItems" class="goal-plan-cards"></div>
          </div>
        </section>
      </form>
      <div id="evaluationNotFound" class="evaluation-empty" role="alert" hidden><h2>Evaluation not found</h2><p id="evaluationNotFoundMessage"></p></div>
    </main>
    <phone-bottom-nav active="apps"></phone-bottom-nav>
    <div id="evaluationDeleteOverlay" class="goal-plan-overlay goal-delete-overlay" hidden>
      <section class="goal-delete-dialog" role="alertdialog" aria-modal="true" aria-labelledby="evaluationDeleteTitle" aria-describedby="evaluationDeleteMessage">
        <span class="goal-delete-icon"><i class="fa-solid fa-trash" aria-hidden="true"></i></span>
        <h2 id="evaluationDeleteTitle">Delete Goal?</h2>
        <p id="evaluationDeleteMessage">This goal will be removed from the evaluation.</p>
        <div><button type="button" id="evaluationDeleteCancel">Keep Goal</button><button type="button" id="evaluationDeleteConfirm">Delete</button></div>
      </section>
    </div>
  </div>
</body>
</html>
