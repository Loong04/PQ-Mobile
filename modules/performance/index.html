<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleHCM - Performance</title>
  <script>(() => { const theme = new URLSearchParams(location.search).get('theme'); document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark'; })();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../css/theme.css">
  <link rel="stylesheet" href="../../css/app.css">
  <link rel="stylesheet" href="css/performance.css">
  <script src="../../js/components.js"></script>
  <script src="../../js/app.js" defer></script>
  <script src="js/performance-app.js" defer></script>
</head>
<body class="performance-page">
  <preview-top-bar active-page="performance"></preview-top-bar>
  <div class="phone-container">
    <header class="performance-header">
      <phone-status-bar time="9:41"></phone-status-bar>
      <div class="performance-header-row">
        <a id="performanceBack" class="performance-back" href="../../appdark.html" aria-label="Back to Apps"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></a>
        <h1>Performance</h1>
        <span class="performance-header-spacer" aria-hidden="true"></span>
      </div>
    </header>
    <main class="main-content performance-content">
      <div class="performance-scope" role="tablist" aria-label="Performance scope">
        <button id="performanceTabIndividual" class="performance-scope-tab active" type="button" role="tab" aria-selected="true" aria-controls="performanceIndividualPanel"><i class="fa-solid fa-user" aria-hidden="true"></i><span>Individual</span></button>
        <button id="performanceTabTeam" class="performance-scope-tab" type="button" role="tab" aria-selected="false" aria-controls="performanceTeamPanel" tabindex="-1"><i class="fa-solid fa-users" aria-hidden="true"></i><span>Team</span></button>
      </div>
      <div id="performanceIndividualPanel" class="performance-panel" role="tabpanel" aria-labelledby="performanceTabIndividual">
        <section class="performance-section" aria-labelledby="performanceStatusTitle">
          <h2 id="performanceStatusTitle" class="performance-section-title">My Document Status</h2>
          <div class="performance-status-grid">
            <button type="button" class="performance-status-card" data-status="submitted" aria-label="Submitted, count unavailable. Performance history coming soon"><strong>&mdash;</strong><span>Submitted</span><small>In Review</small></button>
            <button type="button" class="performance-status-card" data-status="resubmit" aria-label="Resubmit, count unavailable. Performance history coming soon"><strong>&mdash;</strong><span>Resubmit</span><small>Needs Action</small></button>
            <button type="button" class="performance-status-card" data-status="approved" aria-label="Approved, count unavailable. Performance history coming soon"><strong>&mdash;</strong><span>Approved</span><small>Confirmed</small></button>
            <button type="button" class="performance-status-card" data-status="rejected" aria-label="Rejected, count unavailable. Performance history coming soon"><strong>&mdash;</strong><span>Rejected</span><small>Declined</small></button>
          </div>
        </section>
        <section class="performance-section" aria-labelledby="performanceQuickTitle">
          <h2 id="performanceQuickTitle" class="performance-section-title">Quick Options</h2>
          <ul class="performance-options">
            <li><a class="performance-option" data-option-id="goal-plan" href="options/goal-plan.html"><span class="performance-option-icon" aria-hidden="true"><i class="fa-solid fa-bullseye"></i></span><span class="performance-option-title">Goal Plan</span></a></li>
            <li><a class="performance-option" data-option-id="goal-progress" href="options/goal-progress.html"><span class="performance-option-icon" aria-hidden="true"><i class="fa-solid fa-chart-line"></i></span><span class="performance-option-title">Goal Progress</span></a></li>
            <li><button type="button" class="performance-option" data-option-id="self-evaluation"><span class="performance-option-icon" aria-hidden="true"><i class="fa-solid fa-clipboard-check"></i></span><span class="performance-option-title">Self Evaluation</span></button></li>
            <li><a class="performance-option" data-option-id="work-incident" href="options/work-incident.html"><span class="performance-option-icon" aria-hidden="true"><i class="fa-solid fa-triangle-exclamation"></i></span><span class="performance-option-title">Work Incident</span></a></li>
          </ul>
        </section>
      </div>
      <div id="performanceTeamPanel" class="performance-panel" role="tabpanel" aria-labelledby="performanceTabTeam" hidden>
        <section class="performance-section" aria-labelledby="performanceTeamTitle">
          <h2 id="performanceTeamTitle" class="performance-section-title">Quick Options</h2>
          <ul class="performance-options">
            <li><a class="performance-option" data-option-id="goal-summary" href="options/goal-summary.html"><span class="performance-option-icon" aria-hidden="true"><i class="fa-solid fa-list-check"></i></span><span class="performance-option-title">Goal Summary</span></a></li>
            <li><button type="button" class="performance-option" data-option-id="performance-evaluation"><span class="performance-option-icon" aria-hidden="true"><i class="fa-solid fa-user-check"></i></span><span class="performance-option-title">Performance Evaluation</span></button></li>
            <li><a class="performance-option" data-option-id="performance-highlight" href="options/performance-highlight.html"><span class="performance-option-icon" aria-hidden="true"><i class="fa-solid fa-chart-pie"></i></span><span class="performance-option-title">Performance Highlight</span></a></li>
            <li><a class="performance-option" data-option-id="staff-incident" href="options/staff-incident.html"><span class="performance-option-icon" aria-hidden="true"><i class="fa-solid fa-user-shield"></i></span><span class="performance-option-title">Staff Incident</span></a></li>
            <li><a class="performance-option" data-option-id="incident-highlight" href="options/incident-highlight.html"><span class="performance-option-icon" aria-hidden="true"><i class="fa-solid fa-chart-pie"></i></span><span class="performance-option-title">Incident Highlight</span></a></li>
            <li><a class="performance-option" data-option-id="history" href="options/history.html"><span class="performance-option-icon" aria-hidden="true"><i class="fa-solid fa-clock-rotate-left"></i></span><span class="performance-option-title">History</span></a></li>
          </ul>
        </section>
      </div>
    </main>
    <div id="appToast" class="app-toast" role="status" aria-live="polite"></div>
    <phone-bottom-nav active="apps"></phone-bottom-nav>
    <left-profile-drawer></left-profile-drawer>
    <notification-sheet></notification-sheet>
  </div>
</body>
</html>
