<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleHCM - Payroll Pending Approval</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../css/theme.css">
  <link rel="stylesheet" href="../../../css/app.css">
  <link rel="stylesheet" href="../../../css/payroll-pending-approval.css">
  <link rel="stylesheet" href="../../../css/approval-actions.css">
  <link rel="stylesheet" href="../../../css/pending-approval-filter.css">
  <script src="../../../js/components.js"></script>
  <script src="../../../js/app.js" defer></script>
  <script src="../../../js/pending-approval-filter.js" defer></script>
  <script src="../../../js/payroll/payroll-pending-data.js" defer></script>
  <script src="../../../js/payroll/payroll-pending-approval.js" defer></script>
</head>
<body class="payroll-pending-page unified-approval-actions">
  <preview-top-bar active-page="payroll"></preview-top-bar>
  <div class="phone-container">
    <header class="payroll-pending-header">
      <phone-status-bar time="9:41"></phone-status-bar>
      <div class="payroll-pending-header-row">
        <a class="payroll-pending-back" id="payrollPendingBack" href="../index.html?scope=team" aria-label="Back to Payroll Team"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></a>
        <h1>Pending Approval</h1>
      </div>
    </header>
    <main class="payroll-pending-content">
      <div class="payroll-pending-tabs" role="tablist" aria-label="Payroll request type">
        <button type="button" class="filter-pill active" id="payrollPendingTab-tax" data-payroll-tab="tax" role="tab" aria-selected="true" aria-controls="payrollPendingPanel">Tax Relief</button>
        <button type="button" class="filter-pill" id="payrollPendingTab-deduction" data-payroll-tab="deduction" role="tab" aria-selected="false" aria-controls="payrollPendingPanel" tabindex="-1">Deduction Request</button>
      </div>
      <div class="approval-filter-summary">
        <div class="payroll-pending-summary-copy"><small>Current Filter</small><div class="payroll-pending-summary-value"><i class="fa-solid fa-filter" aria-hidden="true"></i><span id="payrollPendingFilterSummary">All Requests &bull; All Dates</span></div></div>
        <button type="button" id="payrollPendingFilterTrigger" aria-label="Open pending approval filter" aria-haspopup="dialog" aria-controls="payrollPendingFilter"><i class="fa-solid fa-sliders" aria-hidden="true"></i></button>
      </div>
      <section id="payrollPendingPanel" role="tabpanel" aria-labelledby="payrollPendingTab-tax">
        <div class="payroll-pending-list-heading"><h2>Pending Approvals (<span id="payrollPendingCount">0</span>)</h2><label class="payroll-pending-select-all"><input type="checkbox" id="payrollPendingSelectAll">Select All</label></div>
        <div id="payrollPendingQueue"></div>
      </section>
    </main>
    <aside id="payrollPendingBulk" class="payroll-pending-bulk" aria-label="Selected requests" hidden>
      <strong><span id="payrollPendingSelectedCount">0</span> selected</strong>
      <div class="pending-action-grid">
        <button type="button" class="action-btn-approve" data-payroll-action="approve"><i class="fa-solid fa-check" aria-hidden="true"></i>Approve</button>
        <button type="button" class="action-btn-resubmit" data-payroll-action="resubmit"><i class="fa-solid fa-rotate-left" aria-hidden="true"></i>Resubmit</button>
        <button type="button" class="action-btn-reject" data-payroll-action="reject"><i class="fa-solid fa-xmark" aria-hidden="true"></i>Reject</button>
      </div>
    </aside>
    <phone-bottom-nav active="apps"></phone-bottom-nav>
    <left-profile-drawer></left-profile-drawer>
    <notification-sheet></notification-sheet>
    <favourite-sheet></favourite-sheet>

    <div id="payrollPendingMenu" class="payroll-approval-overlay" hidden>
      <section class="payroll-approval-panel payroll-approval-menu" role="dialog" aria-modal="true" aria-labelledby="payrollPendingMenuTitle">
        <div class="payroll-approval-handle" aria-hidden="true"></div>
        <div class="payroll-approval-menu-heading"><h2 id="payrollPendingMenuTitle">Request Options</h2><button type="button" class="payroll-approval-close" data-close-payroll-sheet aria-label="Close request options"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button></div>
        <button type="button" class="payroll-approval-menu-option" id="payrollPendingViewDetails"><i class="fa-solid fa-eye" aria-hidden="true"></i><span>View Details</span><i class="fa-solid fa-chevron-right" aria-hidden="true"></i></button>
      </section>
    </div>
    <div id="payrollPendingDetails" class="payroll-approval-overlay" hidden>
      <section class="payroll-approval-panel" role="dialog" aria-modal="true" aria-labelledby="payrollPendingDetailsTitle">
        <header class="payroll-approval-details-header">
          <button type="button" class="payroll-approval-close" data-close-payroll-sheet aria-label="Back to pending approvals"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></button>
          <div><h2 id="payrollPendingDetailsTitle">Tax Relief Approval</h2><p>Review payroll request details</p></div>
          <button type="button" class="payroll-approval-close" data-close-payroll-sheet aria-label="Close approval details"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
        </header>
        <div class="payroll-approval-details-body"><h3>General</h3><div class="payroll-approval-table-wrap"><table class="payroll-approval-table" id="payrollPendingDetailsTable"><tbody></tbody></table></div></div>
        <footer class="payroll-approval-details-footer pending-action-grid">
          <button type="button" class="action-btn-approve" data-payroll-action="approve"><i class="fa-solid fa-check" aria-hidden="true"></i>Approve</button>
          <button type="button" class="action-btn-resubmit" data-payroll-action="resubmit"><i class="fa-solid fa-rotate-left" aria-hidden="true"></i>Resubmit</button>
          <button type="button" class="action-btn-cancel" data-close-payroll-sheet><i class="fa-solid fa-ban" aria-hidden="true"></i>Cancel</button>
          <button type="button" class="action-btn-reject" data-payroll-action="reject"><i class="fa-solid fa-xmark" aria-hidden="true"></i>Reject</button>
        </footer>
      </section>
    </div>
  </div>
</body>
</html>
