<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PeopleHCM - Team Tax Relief</title>
  <script src="../../../js/components.js"></script>
  <script src="../../../js/app.js" defer></script>
  <script src="../../../js/payroll/team-tax-relief.js?v=20261002-screenshot-data" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../css/theme.css">
  <link rel="stylesheet" href="../../../css/app.css">
  <link rel="stylesheet" href="../../../css/team-tax-relief.css?v=20261002-screenshot-data">
</head>
<body>
  <preview-top-bar active-page="payroll"></preview-top-bar>

  <div class="tax-relief-phone phone-container">
    <header class="tax-relief-header">
      <phone-status-bar time="9:41" style="color:#fff"></phone-status-bar>
      <div class="tax-relief-header-row">
        <button class="tax-relief-header-btn" type="button" onclick="window.location.href='../index.html?scope=team'" aria-label="Back">
          <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
        </button>
        <div class="tax-relief-header-copy">
          <h1>Team Tax Relief</h1>
          <p>Employee relief records</p>
        </div>
        <span class="tax-relief-header-spacer" aria-hidden="true"></span>
      </div>
    </header>

    <main class="tax-relief-content">
      <button id="taxReliefFilterTrigger" class="tax-relief-filter-trigger" type="button" aria-haspopup="dialog" aria-controls="taxReliefFilterModal">
        <span>
          <small>DATA FILTER</small>
          <strong id="taxReliefFilterSummary">3 records · 01 Jan–03 Oct 2026</strong>
        </span>
        <i class="fa-solid fa-sliders" aria-hidden="true"></i>
      </button>

      <div class="tax-relief-list-heading">
        <h2>Tax Relief Records</h2>
        <span id="taxReliefRecordCount" aria-live="polite">3 Records</span>
      </div>
      <section id="taxReliefRecords" aria-label="Employee tax relief records"></section>
      <div id="taxReliefEmpty" class="tax-relief-empty" hidden>
        <i class="fa-regular fa-folder-open" aria-hidden="true"></i>
        <strong>No tax relief records</strong>
        <span>Reset the filter to view all employee records.</span>
      </div>
    </main>

    <div id="taxReliefFilterModal" class="modal-overlay standard-filter-sheet" role="dialog" aria-modal="true" aria-labelledby="taxReliefFilterTitle">
      <form class="standard-filter-panel tax-relief-filter-panel">
        <div class="standard-filter-handle" aria-hidden="true"></div>
        <div class="standard-filter-header">
          <h2 id="taxReliefFilterTitle">Data Filter</h2>
          <div class="standard-filter-header-actions">
            <button class="standard-filter-reset" type="button" data-filter-reset><i class="fa-solid fa-rotate-left" aria-hidden="true"></i> Reset</button>
            <button class="standard-filter-close" type="button" data-filter-close aria-label="Close filter"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
          </div>
        </div>
        <div class="tax-relief-filter-body">
          <div class="tax-relief-filter-field full">
            <label for="taxReliefSearch">Search Keyword</label>
            <input id="taxReliefSearch" name="keyword" type="search" placeholder="Employee Number or Name">
          </div>
          <div class="tax-relief-filter-grid">
            <div class="tax-relief-filter-field">
              <label for="taxReliefStartDate">Start Date</label>
              <input id="taxReliefStartDate" name="startDate" type="date">
            </div>
            <div class="tax-relief-filter-field">
              <label for="taxReliefEndDate">End Date</label>
              <input id="taxReliefEndDate" name="endDate" type="date">
            </div>
            <div class="tax-relief-filter-field full">
              <label for="taxReliefItem">Rebate Item</label>
              <select id="taxReliefItem" name="item">
                <option value="all">All Rebate Items</option>
                <option value="TXR02">TXR02 – Basic Supporting Equipment</option>
                <option value="TXR05">TXR05 – Complete Medical Examination</option>
              </select>
            </div>
            <div class="tax-relief-filter-field full">
              <label for="taxReliefStatus">Status</label>
              <select id="taxReliefStatus" name="status">
                <option value="all">All Status</option>
                <option value="submitted">Submitted</option>
              </select>
            </div>
            <div class="tax-relief-filter-field full">
              <label for="taxReliefDescription">Description</label>
              <textarea id="taxReliefDescription" name="description" rows="2"></textarea>
            </div>
          </div>
          <p id="taxReliefFilterError" class="tax-relief-filter-error" role="alert" hidden></p>
        </div>
        <div class="tax-relief-filter-footer">
          <button class="standard-filter-apply" type="submit">Search</button>
        </div>
      </form>
    </div>

    <div id="taxReliefDetailModal" class="tax-relief-detail-overlay" role="dialog" aria-modal="true" aria-labelledby="taxReliefDetailTitle">
      <section class="tax-relief-detail-modal">
        <header class="tax-relief-detail-header">
          <h2 id="taxReliefDetailTitle">Tax Relief Detail</h2>
          <button class="tax-relief-detail-close" type="button" data-detail-close aria-label="Close details">
            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
          </button>
        </header>
        <div class="tax-relief-detail-scroll">
          <div id="taxReliefDetailTable" class="tax-relief-detail-table"></div>
        </div>
      </section>
    </div>

    <app-bottom-nav active="hub"></app-bottom-nav>
  </div>
</body>
</html>
