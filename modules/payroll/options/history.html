<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleHCM - Payroll History</title>
  <script src="../../../js/components.js"></script>
  <script src="../../../js/app.js" defer></script>
  <script src="../../../js/payroll/payroll-config.js" defer></script>
  <script src="../../../js/payroll/payroll-history-data.js" defer></script>
  <script src="../../../js/payroll/payroll-history.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../css/theme.css">
  <link rel="stylesheet" href="../../../css/app.css">
  <link rel="stylesheet" href="../../../css/claim-forms.css">
  <link rel="stylesheet" href="../../../css/history-cards.css">
  <link rel="stylesheet" href="../../../css/payroll-history.css">
</head>
<body>
  <preview-top-bar active-page="payroll"></preview-top-bar>
  <div class="phone-container payroll-history-phone">
    <header class="cal-top-header">
      <phone-status-bar time="9:41" style="color: #ffffff;"></phone-status-bar>
      <div class="history-title-row">
        <a class="history-back" href="../index.html?scope=individual" aria-label="Back to Payroll"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></a>
        <h1>Payroll History</h1>
        <span aria-hidden="true"></span>
      </div>
    </header>
    <main class="main-content">
      <div class="me-jump-bar-container history-categories" aria-label="History categories">
        <div class="me-jump-bar">
          <button class="me-jump-pill active" type="button" data-history-kind="tax" aria-pressed="true">Tax Relief</button>
          <button class="me-jump-pill" type="button" data-history-kind="deduction" aria-pressed="false">Deduction Request</button>
        </div>
      </div>
      <button id="historyFilterTrigger" class="claim-filter-bar" type="button" aria-haspopup="dialog" aria-controls="historyFilterModal">
        <span class="claim-filter-copy"><span class="claim-eyebrow">Current Filter</span><span id="historyFilterSummary" class="claim-filter-value"></span></span>
        <span class="claim-icon-button" aria-hidden="true"><i class="fa-solid fa-sliders"></i></span>
      </button>
      <div class="history-section-heading"><h2 id="historyCategoryTitle">Tax Relief History</h2><span id="historyRecordCount" aria-live="polite"></span></div>
      <p id="historyStorageNotice" class="history-notice" role="status" hidden></p>
      <div id="payrollHistoryList" aria-busy="true"></div>
      <div id="historyEmptyState" class="history-empty" hidden>
        <i class="fa-regular fa-folder-open" aria-hidden="true"></i><h3>No records found</h3>
        <p id="historyEmptyText">Try another date range or filter.</p>
        <a id="historyCreateRequest" href="tax-relief-request.html">Create Tax Relief Request <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></a>
      </div>
    </main>
    <phone-bottom-nav active="apps"></phone-bottom-nav>
    <div id="historyFilterModal" class="claim-filter-sheet" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="historyFilterTitle">
      <form id="historyFilterForm" class="claim-filter-panel">
        <div class="claim-filter-handle" aria-hidden="true"></div>
        <div class="claim-filter-header">
          <h2 id="historyFilterTitle" class="claim-filter-title">Filter</h2>
          <div class="claim-filter-header-actions">
            <button id="resetHistoryFilter" type="button" class="claim-filter-reset"><i class="fa-solid fa-rotate-left" aria-hidden="true"></i><span>Reset</span></button>
            <button id="closeHistoryFilter" type="button" class="claim-filter-close" aria-label="Close filter"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
          </div>
        </div>
        <div class="claim-filter-fields">
          <div class="history-date-fields">
            <div><label id="historyDateFromLabel" for="historyDateFrom" class="claim-filter-label">Date From</label><input id="historyDateFrom" class="claim-control" type="date" required></div>
            <div><label id="historyDateToLabel" for="historyDateTo" class="claim-filter-label">Date To</label><input id="historyDateTo" class="claim-control" type="date" required></div>
          </div>
          <p id="historyDateHelp" class="history-filter-help">Uses Submit Date, or Transaction Date when no Submit Date is recorded.</p>
          <div><label id="historyItemLabel" for="historyRebateItem" class="claim-filter-label">Rebate Item</label><div class="claim-filter-select-wrap"><select id="historyRebateItem" class="claim-filter-select"></select><i class="fa-solid fa-chevron-down claim-filter-chevron" aria-hidden="true"></i></div></div>
          <div id="historyStatusField"><label for="historyStatus" class="claim-filter-label">Status</label><div class="claim-filter-select-wrap"><select id="historyStatus" class="claim-filter-select"><option value="all">All Status</option><option value="submitted">Submitted</option><option value="draft">Draft</option><option value="approved">Approved</option><option value="rejected">Rejected</option><option value="cancelled">Cancelled</option></select><i class="fa-solid fa-chevron-down claim-filter-chevron" aria-hidden="true"></i></div></div>
          <div id="historyDescriptionField"><label id="historyDescriptionLabel" for="historyDescription" class="claim-filter-label">Description</label><input id="historyDescription" class="claim-control" type="search" placeholder="Search description" maxlength="2000"></div>
          <p id="historyFilterError" class="history-filter-error" role="alert" hidden></p>
        </div>
        <button id="applyHistoryFilter" class="claim-filter-apply" type="submit">Apply Filter</button>
      </form>
    </div>
    <div id="historyDetailsModal" class="history-detail-overlay" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="historyDetailTitle">
      <section class="history-detail-panel">
        <div class="history-detail-header"><h2 id="historyDetailTitle">Tax Relief Detail</h2><button id="closeHistoryDetails" type="button" aria-label="Close details"><i class="fa-solid fa-circle-xmark" aria-hidden="true"></i></button></div>
        <div id="historyDetailBody" class="history-detail-body"></div>
      </section>
    </div>
  </div>
</body>
</html>
