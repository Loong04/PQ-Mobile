<!DOCTYPE html>
<html lang='en' data-theme='dark'>
<head>
  <meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no'>
  <title>PeopleHCM - Career Plan</title>
  <link href='https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap' rel='stylesheet'><link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css'>
  <link rel='stylesheet' href='../../../../css/theme.css'><link rel='stylesheet' href='../../../../css/app.css'><link rel='stylesheet' href='../../css/employee-career.css'><link rel='stylesheet' href='../../css/employee-career-forms.css'><link rel='stylesheet' href='../../../../css/form-section-headings.css'>
  <script src='../../../../js/components.js'></script><script src='../../../../js/app.js' defer></script><script src='../../js/employee-career-forms.js' defer></script>
</head>
<body class='employee-career-option-page employee-career-form-page career-plan-page'><preview-top-bar active-page='v2'></preview-top-bar><div class='phone-container'>
  <header class='employee-career-header'><phone-status-bar time='9:41'></phone-status-bar><div class='employee-career-header-row'><a class='employee-career-back' data-option-back href='../../index.html?scope=individual' aria-label='Back to Employee and Career'><i class='fa-solid fa-chevron-left' aria-hidden='true'></i></a><div class='employee-career-heading'><h1>Career Plan</h1></div><span class='employee-career-header-spacer' aria-hidden='true'></span></div></header>
  <main class='main-content employee-career-content'><form id='careerPlanForm' novalidate><div class='employee-career-form-card'>
    <section class='employee-career-form-section' aria-labelledby='careerPlanEmployeeHeading'><h2 id='careerPlanEmployeeHeading' class='form-section-heading'>Employee Details</h2>
      <div class='employee-career-form-grid career-plan-profile-grid'><div class='employee-career-field'><label for='careerPlanName'>Name</label><input id='careerPlanName' class='employee-career-control employee-career-readonly' type='text' value='Aina Rahman' readonly></div><div class='employee-career-field'><label for='careerPlanPosition'>Position</label><input id='careerPlanPosition' class='employee-career-control employee-career-readonly' type='text' value='People Operations Executive' readonly></div></div>
      <div class='employee-career-field'><label for='careerPlanDepartment'>Department</label><input id='careerPlanDepartment' class='employee-career-control employee-career-readonly' type='text' value='People &amp; Culture' readonly></div>
    </section>
    <section class='employee-career-form-section' aria-labelledby='careerPlanDirectionHeading'><h2 id='careerPlanDirectionHeading' class='form-section-heading'>Career Direction</h2>
      <div class='employee-career-form-grid'><div class='employee-career-field'><label for='careerPlanPath'>Career Path</label><select id='careerPlanPath' class='employee-career-control'><option value=''>Select Career Path</option><option value='leadership'>Leadership</option><option value='specialist'>Specialist</option><option value='cross-functional'>Cross-functional</option></select></div><div class='employee-career-field'><label for='careerPlanNextPosition'>Next Position</label><select id='careerPlanNextPosition' class='employee-career-control' disabled><option value=''>Select Next Position</option></select></div></div>
      <div class='employee-career-field'><label for='careerPlanTargetDate'>Target Date</label><input id='careerPlanTargetDate' class='employee-career-control' type='date'></div>
      <div class='employee-career-field'><label for='careerPlanJustification'>Justification</label><textarea id='careerPlanJustification' class='employee-career-control' placeholder='Explain why this career direction is important'></textarea></div>
    </section>
    <section class='employee-career-form-section' aria-labelledby='careerPlanDevelopmentHeading'><h2 id='careerPlanDevelopmentHeading' class='form-section-heading'>Development Plan</h2>
      <div class='employee-career-field'><label for='careerPlanActionPlan'>Action Plan</label><textarea id='careerPlanActionPlan' class='employee-career-control' placeholder='List the steps and milestones for this plan'></textarea></div>
      <div class='employee-career-field'><label for='careerPlanDevelopmentNeeds'>Development Needs</label><textarea id='careerPlanDevelopmentNeeds' class='employee-career-control' placeholder='Add required skills, coaching, or training'></textarea></div>
      <div class='employee-career-field'><label for='careerPlanRemarks'>Remarks</label><textarea id='careerPlanRemarks' class='employee-career-control' placeholder='Add any supporting remarks'></textarea></div>
    </section>
    <fieldset class='employee-career-field employee-career-fieldset'><legend class='form-section-heading'>Upload Attachments</legend><div class='employee-career-upload-actions'><button class='employee-career-upload-button' type='button' data-file-picker='careerPlanFiles'><span class='employee-career-upload-icon'><i class='fa-solid fa-file-arrow-up' aria-hidden='true'></i></span><span>Select File(s)</span></button><button class='employee-career-upload-button' type='button' data-file-picker='careerPlanCamera'><span class='employee-career-upload-icon'><i class='fa-solid fa-camera' aria-hidden='true'></i></span><span>Take a Picture</span></button></div><input id='careerPlanFiles' type='file' multiple hidden><input id='careerPlanCamera' type='file' accept='image/*' capture='environment' hidden><div id='careerPlanAttachments' class='form-attachment-list' aria-live='polite'></div></fieldset>
  </div>
  <div class='employee-career-form-actions'><a id='careerPlanCancel' class='form-cancel-btn' data-option-back href='../../index.html?scope=individual'><i class='fa-solid fa-xmark' aria-hidden='true'></i><span>Cancel</span></a><button id='careerPlanSubmit' class='employee-career-button primary' type='submit'><span>Update</span><i class='fa-solid fa-paper-plane' aria-hidden='true'></i></button></div>
  </form></main><div id='employeeCareerToast' class='employee-career-toast' role='status' aria-live='polite'></div><phone-bottom-nav active='apps'></phone-bottom-nav>
</div></body></html>
