<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PeopleHCM - My Event</title>
  <script>(()=>{const q=new URLSearchParams(location.search).get('theme');document.documentElement.dataset.theme=q==='light'?'light':'dark';})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../../css/theme.css">
  <link rel="stylesheet" href="../../../../css/app.css">
  <link rel="stylesheet" href="../../css/employee-career.css">
  <link rel="stylesheet" href="../../css/my-event.css">
  <script src="../../../../js/components.js"></script>
  <script src="../../../../js/app.js" defer></script>
  <script src="../../js/employee-career-option.js" defer></script>
  <script src="../../js/my-event.js" defer></script>
</head>
<body class="employee-career-option-page my-event-page">
  <preview-top-bar active-page="v2"></preview-top-bar>
  <div class="phone-container">
    <header class="employee-career-header">
      <phone-status-bar time="9:41"></phone-status-bar>
      <div class="employee-career-header-row">
        <a class="employee-career-back" data-option-back href="../../index.html?scope=individual" aria-label="Back to Employee and Career"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></a>
        <div class="employee-career-heading"><h1>My Event</h1></div>
        <span class="employee-career-header-spacer" aria-hidden="true"></span>
      </div>
    </header>
    <main class="main-content employee-career-content">
      <div class="my-event-filter-summary filter-summary-bar">
        <div><small>Filter</small><strong id="myEventFilterSummary">All Dates · All Event Types</strong></div>
        <button type="button" id="myEventFilterTrigger" aria-label="Open event filter" aria-haspopup="dialog" aria-controls="myEventFilterOverlay"><i class="fa-solid fa-sliders" aria-hidden="true"></i></button>
      </div>
      <div class="my-event-table-card">
        <table id="myEventTable" aria-label="My events">
          <colgroup><col style="width:42%"><col style="width:38%"><col style="width:20%"></colgroup>
          <thead><tr><th scope="col">Event Type</th><th scope="col">Date</th><th scope="col">Days</th></tr></thead>
          <tbody aria-live="polite"><tr><td colspan="3" class="my-event-empty">No events found</td></tr></tbody>
        </table>
      </div>
    </main>
    <phone-bottom-nav active="apps"></phone-bottom-nav>
    <div id="myEventFilterOverlay" class="my-event-filter-overlay standard-filter-sheet" aria-hidden="true" hidden>
      <form id="myEventFilterForm" class="standard-filter-panel" data-standard-filter-ready="true" role="dialog" aria-modal="true" aria-labelledby="myEventFilterTitle">
        <div class="standard-filter-handle" aria-hidden="true"></div>
        <header class="standard-filter-header">
          <h2 id="myEventFilterTitle">Filter</h2>
          <div class="standard-filter-header-actions">
            <button type="button" id="myEventResetFilter" class="standard-filter-reset"><i class="fa-solid fa-rotate-left" aria-hidden="true"></i><span>Reset</span></button>
            <button type="button" id="myEventCloseFilter" class="standard-filter-close" aria-label="Close event filter"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
          </div>
        </header>
        <div class="my-event-filter-fields">
          <div><label for="myEventStartDate">Start Date</label><input id="myEventStartDate" type="date"></div>
          <div><label for="myEventEndDate">End Date</label><input id="myEventEndDate" type="date"></div>
          <div><label for="myEventType">Event Type</label><select id="myEventType"><option value="">All Event Types</option></select></div>
        </div>
        <footer class="standard-filter-footer"><button type="submit" id="myEventApplyFilter" class="standard-filter-apply">Apply Filter</button></footer>
      </form>
    </div>
  </div>
</body>
</html>
