<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleHCM - New User Details</title>
  <script>(()=>{const q=new URLSearchParams(location.search).get('theme');document.documentElement.dataset.theme=q==='light'?'light':'dark';})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../../css/theme.css">
  <link rel="stylesheet" href="../../../../css/app.css">
  <link rel="stylesheet" href="../../css/employee-career.css">
  <link rel="stylesheet" href="../../css/employee-career-forms.css">
  <link rel="stylesheet" href="../../css/confirm-new-user-details.css">
  <script src="../../../../js/components.js"></script>
  <script src="../../../../js/app.js" defer></script>
  <script src="../../js/confirm-new-user-data.js" defer></script>
  <script src="../../js/confirm-new-user-details.js" defer></script>
</head>
<body class="employee-career-option-page employee-career-form-page employee-career-team-form-page">
  <preview-top-bar active-page="v2"></preview-top-bar>
  <div class="phone-container">
    <header class="employee-career-header">
      <phone-status-bar time="9:41"></phone-status-bar>
      <div class="employee-career-header-row">
        <a class="employee-career-back" id="newUserBackLink" href="confirm-new-user.html" aria-label="Back to Confirm New User"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></a>
        <div class="employee-career-heading"><h1>New User Details</h1></div>
        <span class="employee-career-header-spacer" aria-hidden="true"></span>
      </div>
    </header>

    <main class="main-content employee-career-content">
      <section class="new-user-profile-card" aria-label="Selected new user">
        <span class="new-user-profile-avatar" id="newUserProfileAvatar" aria-hidden="true">NU</span>
        <div class="new-user-profile-copy">
          <h2 class="new-user-profile-name" id="newUserProfileName">New User</h2>
          <p class="new-user-profile-id" id="newUserProfileId">—</p>
        </div>
      </section>

      <nav class="new-user-stepper-card" aria-label="New user detail steps">
        <div class="new-user-stepper-track" role="tablist" aria-label="New user detail steps">
          <span class="new-user-stepper-line" aria-hidden="true"></span>
          <span class="new-user-stepper-fill" id="newUserStepperFill" aria-hidden="true" style="width: 0%;"></span>
          <button class="new-user-stepper-item active" id="newUserStep1" type="button" role="tab" data-step="1" tabindex="0" aria-current="step" aria-selected="true" aria-controls="newUserBasicPanel">
            <span class="new-user-stepper-circle">1</span>
            <span class="new-user-stepper-label">Basic Information</span>
          </button>
          <button class="new-user-stepper-item" id="newUserStep2" type="button" role="tab" data-step="2" tabindex="-1" aria-selected="false" aria-controls="newUserContactPanel">
            <span class="new-user-stepper-circle">2</span>
            <span class="new-user-stepper-label">Contact</span>
          </button>
        </div>
      </nav>

      <form class="new-user-details-form" id="newUserDetailsForm">
        <section class="new-user-step-panel" id="newUserBasicPanel" role="tabpanel" data-step-panel="1" aria-labelledby="newUserStep1">
          <div class="new-user-form-card">
            <h2 id="newUserBasicHeading">Basic Information</h2>
            <div class="new-user-details-grid">
              <label class="new-user-details-field new-user-details-field-wide"><span>Name <b>*</b></span><input class="new-user-details-control" id="newUserName" type="text" required></label>
              <label class="new-user-details-field"><span>Alias</span><input class="new-user-details-control" id="newUserAlias" type="text"></label>
              <label class="new-user-details-field"><span>NRIC/Passport #</span><input class="new-user-details-control" id="newUserIdentity" type="text"></label>
              <label class="new-user-details-field"><span>Birth Date</span><input class="new-user-details-control" id="newUserBirthDate" type="date"></label>
              <label class="new-user-details-field"><span>Gender</span><select class="new-user-details-control" id="newUserGender"><option value="">Select gender</option><option>Male</option><option>Female</option></select></label>
              <label class="new-user-details-field"><span>Nationality</span><input class="new-user-details-control" id="newUserNationality" type="text"></label>
              <label class="new-user-details-field"><span>Race</span><input class="new-user-details-control" id="newUserRace" type="text"></label>
              <label class="new-user-details-field"><span>Religion</span><input class="new-user-details-control" id="newUserReligion" type="text"></label>
              <label class="new-user-details-field"><span>Qualification Level</span><input class="new-user-details-control" id="newUserQualification" type="text"></label>
              <label class="new-user-details-field"><span>Marital Status</span><input class="new-user-details-control" id="newUserMaritalStatus" type="text"></label>
            </div>
          </div>

          <div class="new-user-form-card">
            <h2>Employment & Payroll</h2>
            <div class="new-user-details-grid">
              <label class="new-user-details-field"><span>Payment Mode</span><input class="new-user-details-control" id="newUserPaymentMode" type="text"></label>
              <label class="new-user-details-field"><span>Bank</span><input class="new-user-details-control" id="newUserBank" type="text"></label>
              <label class="new-user-details-field new-user-details-field-wide"><span>Bank Account #</span><input class="new-user-details-control" id="newUserBankAccount" type="text"></label>
              <label class="new-user-details-field"><span>EPF #</span><input class="new-user-details-control" id="newUserEpf" type="text"></label>
              <label class="new-user-details-field"><span>Income Tax #</span><input class="new-user-details-control" id="newUserIncomeTax" type="text"></label>
              <label class="new-user-details-field"><span>Hire Date <b>*</b></span><input class="new-user-details-control" id="newUserHireDate" type="date" required></label>
              <label class="new-user-details-field"><span>Basic Pay <b>*</b></span><input class="new-user-details-control" id="newUserBasicPay" type="number" step="0.01" required></label>
              <label class="new-user-details-field"><span>Company <b>*</b></span><select class="new-user-details-control" id="newUserCompany" required><option value="">Select company</option><option>PeopleQuest</option></select></label>
              <label class="new-user-details-field"><span>Branch <b>*</b></span><select class="new-user-details-control" id="newUserBranch" required><option value="">Select branch</option><option>Head Office</option></select></label>
              <label class="new-user-details-field"><span>Department <b>*</b></span><select class="new-user-details-control" id="newUserDepartment" required><option value="">Select department</option><option>Operations</option></select></label>
              <label class="new-user-details-field"><span>Job Type <b>*</b></span><select class="new-user-details-control" id="newUserJobType" required><option value="">Select job type</option><option>Part Time</option></select></label>
              <label class="new-user-details-field"><span>Job Position <b>*</b></span><input class="new-user-details-control" id="newUserJobPosition" type="text" required></label>
              <label class="new-user-details-field"><span>Reporting Group <b>*</b></span><select class="new-user-details-control" id="newUserReportingGroup" required><option value="">Select reporting group</option><option>GROUP A</option></select></label>
              <label class="new-user-details-field"><span>Supervisor <b>*</b></span><select class="new-user-details-control" id="newUserSupervisor" required><option value="">Select supervisor</option><option>EBB04</option></select></label>
              <label class="new-user-details-field new-user-details-field-wide"><span>Shift Group <b>*</b></span><select class="new-user-details-control" id="newUserShiftGroup" required><option value="">Select shift group</option><option>GROUP A</option></select></label>
              <div class="new-user-details-field new-user-details-field-wide"><span>Probation Period</span><div class="new-user-probation-grid"><label><input class="new-user-details-control" id="newUserProbationMonths" type="number" min="0"><small>Months</small></label><label><input class="new-user-details-control" id="newUserProbationDays" type="number" min="0"><small>Days</small></label></div></div>
              <div class="new-user-details-field new-user-details-field-wide">
                <span>Attachments</span>
                <div class="new-user-attachment-list" id="newUserAttachmentList" aria-live="polite"></div>
              </div>
            </div>
          </div>

          <div class="new-user-step-actions new-user-step-actions-end">
            <button class="new-user-action-button new-user-next-button" id="newUserNext" type="button"><span>Next</span><i class="fa-solid fa-arrow-right" aria-hidden="true"></i></button>
          </div>
        </section>

        <section class="new-user-step-panel" id="newUserContactPanel" role="tabpanel" data-step-panel="2" aria-labelledby="newUserStep2" hidden>
          <div class="new-user-form-card">
            <h2 id="newUserContactHeading">Contact</h2>
            <div class="new-user-details-grid">
              <label class="new-user-details-field new-user-details-field-wide"><span>Name</span><input class="new-user-details-control" id="newUserContactName" type="text"></label>
              <label class="new-user-details-field"><span>Phone #</span><input class="new-user-details-control" id="newUserPhone" type="tel"></label>
              <label class="new-user-details-field"><span>E-Mail</span><input class="new-user-details-control" id="newUserEmail" type="email"></label>
              <label class="new-user-details-field new-user-details-field-wide"><span>Address Line 1 <b>*</b></span><input class="new-user-details-control" id="newUserAddress1" type="text" required></label>
              <label class="new-user-details-field new-user-details-field-wide"><span>Address Line 2 <b>*</b></span><input class="new-user-details-control" id="newUserAddress2" type="text" required></label>
              <label class="new-user-details-field new-user-details-field-wide"><span>Address Line 3 <b>*</b></span><input class="new-user-details-control" id="newUserAddress3" type="text" required></label>
              <label class="new-user-details-field"><span>Post Code <b>*</b></span><input class="new-user-details-control" id="newUserPostCode" type="text" required></label>
            </div>
          </div>

          <div class="new-user-form-card">
            <h2>Emergency Contact</h2>
            <div class="new-user-details-grid">
              <label class="new-user-details-field"><span>Contact Name</span><input class="new-user-details-control" id="newUserEmergencyName" type="text"></label>
              <label class="new-user-details-field"><span>Contact Phone #</span><input class="new-user-details-control" id="newUserEmergencyPhone" type="tel"></label>
              <label class="new-user-details-field new-user-details-field-wide"><span>Address Line 1 <b>*</b></span><input class="new-user-details-control" id="newUserEmergencyAddress1" type="text" required></label>
              <label class="new-user-details-field new-user-details-field-wide"><span>Address Line 2 <b>*</b></span><input class="new-user-details-control" id="newUserEmergencyAddress2" type="text" required></label>
              <label class="new-user-details-field new-user-details-field-wide"><span>Address Line 3 <b>*</b></span><input class="new-user-details-control" id="newUserEmergencyAddress3" type="text" required></label>
              <label class="new-user-details-field"><span>Post Code <b>*</b></span><input class="new-user-details-control" id="newUserEmergencyPostCode" type="text" required></label>
            </div>
          </div>

          <div class="new-user-step-actions">
            <button class="new-user-action-button secondary" id="newUserPrevious" type="button"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i><span>Back</span></button>
            <a class="new-user-action-button secondary" id="newUserCancel" href="confirm-new-user.html"><i class="fa-solid fa-xmark" aria-hidden="true"></i><span>Cancel</span></a>
            <a class="new-user-action-button" id="newUserSubmit" href="../../index.html?scope=team"><span>Submit</span><i class="fa-solid fa-paper-plane" aria-hidden="true"></i></a>
          </div>
        </section>
      </form>
    </main>
    <phone-bottom-nav active="apps"></phone-bottom-nav>
  </div>
</body>
</html>
