<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PeopleHCM - Key Staff Nomination</title>
  <script>(()=>{const q=new URLSearchParams(location.search).get('theme');document.documentElement.dataset.theme=q==='light'?'light':'dark';})();</script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../../css/theme.css"><link rel="stylesheet" href="../../../../css/app.css"><link rel="stylesheet" href="../../css/employee-career.css"><link rel="stylesheet" href="../../css/employee-career-forms.css"><link rel="stylesheet" href="../../css/key-staff-nomination.css"><link rel="stylesheet" href="../../../../css/form-section-headings.css">
  <script src="../../../../js/components.js"></script><script src="../../../../js/app.js" defer></script><script src="../../js/employee-career-forms.js" defer></script><script src="../../js/key-staff-nomination.js" defer></script>
</head>
<body class="employee-career-option-page employee-career-form-page employee-career-team-form-page key-staff-nomination-page"><preview-top-bar active-page="v2"></preview-top-bar><div class="phone-container">
  <header class="employee-career-header"><phone-status-bar time="9:41"></phone-status-bar><div class="employee-career-header-row"><a class="employee-career-back" data-option-back href="../../index.html?scope=team" aria-label="Back to Employee and Career"><i class="fa-solid fa-chevron-left"></i></a><div class="employee-career-heading"><h1>Key Staff Nomination</h1><p>Team</p></div><span class="employee-career-header-spacer"></span></div></header>
  <main class="main-content employee-career-content">
    <form id="keyStaffNominationForm" novalidate>
      <div class="employee-career-form-card">
        <section class="employee-career-form-section" aria-labelledby="nominationEmployeeHeading">
          <h2 id="nominationEmployeeHeading" class="form-section-heading">Employee Details</h2>
          <div class="employee-career-field"><label for="nominationEmployee">Employee # <span class="nomination-required" aria-hidden="true">*</span></label><select id="nominationEmployee" class="employee-career-control" required><option value="">Select Employee</option><option value="EBB01">Aina Rahman (#EBB01)</option><option value="EBB02">Daniel Wong (#EBB02)</option><option value="EBB03">Nur Izzati (#EBB03)</option></select></div>
          <div class="employee-career-field"><label for="nominationName">Name</label><input id="nominationName" class="employee-career-control employee-career-readonly" type="text" placeholder="Selected employee name" readonly><span id="nominationEmployeeId" class="nomination-employee-id" hidden></span></div>
          <div class="employee-career-field"><label for="nominationPosition">Position</label><input id="nominationPosition" class="employee-career-control employee-career-readonly" type="text" placeholder="Selected employee position" readonly></div>
        </section>
        <section class="employee-career-form-section" aria-labelledby="nominationDetailsHeading">
          <h2 id="nominationDetailsHeading" class="form-section-heading">Nomination Details</h2>
          <div class="employee-career-field"><label for="nominationDate">Nomination Date <span class="nomination-required" aria-hidden="true">*</span></label><input id="nominationDate" class="employee-career-control" type="date" required></div>
          <div class="employee-career-field"><label for="nominationTalentPool">Talent Pool <span class="nomination-required" aria-hidden="true">*</span></label><select id="nominationTalentPool" class="employee-career-control" required><option value="">Select Talent Pool</option><option value="leadership">Leadership</option><option value="specialist">Specialist</option><option value="high-potential">High Potential</option></select></div>
          <div class="employee-career-field"><label for="nominationKeyLevel">Key Staff Level <span class="nomination-required" aria-hidden="true">*</span></label><select id="nominationKeyLevel" class="employee-career-control" required><option value="">All Key Levels</option><option value="3">Key Level 3</option><option value="2">Key Level 2</option><option value="1">Key Level 1</option></select></div>
          <div class="employee-career-field"><label for="nominationJustification">Justification <span class="nomination-required" aria-hidden="true">*</span></label><textarea id="nominationJustification" class="employee-career-control" placeholder="Explain the nomination" maxlength="5000" required></textarea></div>
          <div class="employee-career-field"><label for="nominationRemarks">Remarks <span class="nomination-required" aria-hidden="true">*</span></label><textarea id="nominationRemarks" class="employee-career-control" placeholder="Add remarks" maxlength="5000" required></textarea></div>
        </section>
        <fieldset class="employee-career-field employee-career-fieldset">
          <legend class="form-section-heading">Upload Attachments</legend>
          <div class="employee-career-upload-actions">
            <button class="employee-career-upload-button" type="button" data-file-picker="nominationFiles"><span class="employee-career-upload-icon"><i class="fa-solid fa-file-arrow-up" aria-hidden="true"></i></span><span>Select File(s)</span></button>
            <button class="employee-career-upload-button" type="button" data-file-picker="nominationCamera"><span class="employee-career-upload-icon"><i class="fa-solid fa-camera" aria-hidden="true"></i></span><span>Take a Picture</span></button>
          </div>
          <input id="nominationFiles" type="file" multiple hidden>
          <input id="nominationCamera" type="file" accept="image/*" capture="environment" hidden>
          <div id="nominationAttachments" class="form-attachment-list" aria-live="polite"></div>
        </fieldset>
      </div>
      <p id="nominationDraftStatus" class="nomination-draft-status" role="status" aria-live="polite" hidden></p>
      <div class="employee-career-form-actions">
        <a id="nominationCancel" class="form-cancel-btn" data-option-back href="../../index.html?scope=team"><i class="fa-solid fa-xmark" aria-hidden="true"></i><span>Cancel</span></a>
        <button id="nominationSaveDraft" class="employee-career-button nomination-save-draft" type="button"><i class="fa-solid fa-floppy-disk" aria-hidden="true"></i><span>Save Draft</span></button>
        <button id="nominationSubmit" class="employee-career-button primary" type="submit"><span>Submit</span><i class="fa-solid fa-paper-plane" aria-hidden="true"></i></button>
      </div>
    </form>
  </main>
  <div id="employeeCareerToast" class="employee-career-toast" role="status" aria-live="polite"></div>
  <phone-bottom-nav active="apps"></phone-bottom-nav>
</div></body></html>
