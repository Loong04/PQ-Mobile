<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleHCM - Team History</title>
  <script>(()=>{const q=new URLSearchParams(location.search).get('theme');document.documentElement.dataset.theme=q==='light'?'light':'dark';})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../../css/theme.css">
  <link rel="stylesheet" href="../../../../css/app.css">
  <link rel="stylesheet" href="../../../../css/history-cards.css">
  <link rel="stylesheet" href="../../../../css/payroll-history.css">
  <link rel="stylesheet" href="../../css/employee-career.css">
  <link rel="stylesheet" href="../../css/employee-career-team-history.css">
  <script src="../../../../js/components.js"></script>
  <script src="../../../../js/app.js" defer></script>
  <script src="../../js/employee-career-option.js" defer></script>
  <script src="../../js/employee-career-team-history-data.js" defer></script>
  <script src="../../js/employee-career-team-history.js" defer></script>
</head>
<body class="employee-career-option-page team-history-page">
  <preview-top-bar active-page="v2"></preview-top-bar>
  <div class="phone-container payroll-history-phone team-history-phone">
    <header class="employee-career-header">
      <phone-status-bar time="9:41"></phone-status-bar>
      <div class="employee-career-header-row">
        <a class="employee-career-back" data-option-back href="../../index.html?scope=team" aria-label="Back to Employee and Career"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></a>
        <div class="employee-career-heading"><h1>History</h1></div>
        <span class="employee-career-header-spacer" aria-hidden="true"></span>
      </div>
    </header>
    <main class="main-content employee-career-content">
      <div class="history-categories team-history-categories" aria-label="Team history categories">
        <div class="me-jump-bar team-history-tabs">
          <button class="me-jump-pill active" type="button" data-team-history-kind="staff-confirmation" aria-pressed="true">Staff Confirmation</button>
          <button class="me-jump-pill" type="button" data-team-history-kind="staff-exit" aria-pressed="false">Staff Exit</button>
          <button class="me-jump-pill" type="button" data-team-history-kind="staff-request" aria-pressed="false">Staff Request</button>
          <button class="me-jump-pill" type="button" data-team-history-kind="staff-engagement" aria-pressed="false">Staff Engagement</button>
        </div>
      </div>
      <section id="teamConfirmationFilterBar" class="team-history-filter-summary filter-summary-bar" aria-label="Current Staff Confirmation filter">
        <div>
          <small>Current Filter</small>
          <strong id="teamConfirmationFilterSummary">All Submission Dates</strong>
        </div>
        <button type="button" id="teamConfirmationFilterTrigger" aria-label="Open Staff Confirmation date filter" aria-haspopup="dialog" aria-controls="teamConfirmationFilterOverlay"><i class="fa-solid fa-sliders" aria-hidden="true"></i></button>
      </section>
      <div class="history-total-records-card">
        <span class="history-total-records-label">Total Records</span>
        <strong id="teamHistoryRecordCount" class="history-total-records-value" aria-live="polite">0</strong>
      </div>
      <div class="team-history-section-heading">
        <h2 id="teamHistoryCategoryTitle">Staff Confirmation History</h2>
      </div>
      <div id="teamHistoryList" class="team-history-list" aria-live="polite"></div>
      <div id="teamHistoryEmpty" class="team-history-empty" hidden>
        <i class="fa-regular fa-folder-open" aria-hidden="true"></i>
        <h3>No records found</h3>
        <p id="teamHistoryEmptyCopy">There are no records in this category yet.</p>
      </div>
    </main>
    <phone-bottom-nav active="apps"></phone-bottom-nav>
    <div id="teamConfirmationFilterOverlay" class="team-history-filter-overlay standard-filter-sheet" aria-hidden="true" hidden>
      <form id="teamConfirmationFilterForm" class="standard-filter-panel" data-standard-filter-ready="true" role="dialog" aria-modal="true" aria-labelledby="teamConfirmationFilterTitle" novalidate>
        <div class="standard-filter-handle" aria-hidden="true"></div>
        <header class="standard-filter-header">
          <h2 id="teamConfirmationFilterTitle">Filter</h2>
          <div class="standard-filter-header-actions">
            <button type="button" id="teamConfirmationResetFilter" class="standard-filter-reset"><i class="fa-solid fa-rotate-left" aria-hidden="true"></i><span>Reset</span></button>
            <button type="button" id="teamConfirmationCloseFilter" class="standard-filter-close" aria-label="Close Staff Confirmation date filter"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
          </div>
        </header>
        <div class="team-history-filter-fields">
          <div><label for="teamConfirmationStartDate">Start Date</label><input id="teamConfirmationStartDate" name="startDate" type="date" aria-describedby="teamConfirmationFilterError"></div>
          <div><label for="teamConfirmationEndDate">End Date</label><input id="teamConfirmationEndDate" name="endDate" type="date" aria-describedby="teamConfirmationFilterError"></div>
          <p id="teamConfirmationFilterError" class="team-history-filter-error" role="alert" hidden></p>
        </div>
        <footer class="standard-filter-footer"><button type="submit" id="teamConfirmationApplyFilter" class="standard-filter-apply">Apply Filter</button></footer>
      </form>
    </div>
  </div>
</body>
</html>
