<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleHCM - Applicant Listing</title>
  <script>(()=>{const q=new URLSearchParams(location.search).get('theme');document.documentElement.dataset.theme=q==='light'?'light':'dark';})();</script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../../css/theme.css">
  <link rel="stylesheet" href="../../../../css/app.css">
  <link rel="stylesheet" href="../../css/employee-career.css">
  <link rel="stylesheet" href="../../css/vacancy-summary.css">
  <script src="../../../../js/components.js"></script>
  <script src="../../../../js/app.js" defer></script>
  <script src="../../js/employee-career-option.js" defer></script>
  <script src="../../js/vacancy-data.js" defer></script>
  <script src="../../js/vacancy-summary.js" defer></script>
</head>
<body class="employee-career-option-page recruitment-page" data-recruitment-view="applicants">
  <preview-top-bar active-page="v2"></preview-top-bar>
  <div class="phone-container">
    <header class="employee-career-header">
      <phone-status-bar time="9:41"></phone-status-bar>
      <div class="employee-career-header-row">
        <a id="recruitmentBack" class="employee-career-back" data-option-back href="vacancy-summary.html" aria-label="Back to Vacancy Summary"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></a>
        <div class="employee-career-heading"><h1>Applicant Listing</h1></div>
        <span class="employee-career-header-spacer" aria-hidden="true"></span>
      </div>
    </header>
    <main class="main-content employee-career-content">
      <div class="recruitment-filter-summary filter-summary-bar">
        <div><small>Current Filter</small><strong id="recruitmentFilterSummary"></strong></div>
        <button type="button" id="recruitmentFilterTrigger" aria-label="Open applicant filter" aria-haspopup="dialog" aria-controls="recruitmentFilter"><i class="fa-solid fa-sliders" aria-hidden="true"></i></button>
      </div>
      <div class="history-total-records-card" role="status"><span class="history-total-records-label">Total Records</span><strong id="recruitmentTotal" class="history-total-records-value">0</strong></div>
      <div id="recruitmentCards" class="recruitment-cards" aria-label="Applicants for selected vacancy"></div>
      <section id="recruitmentEmpty" class="recruitment-empty" hidden>
        <i class="fa-solid fa-user-group" aria-hidden="true"></i>
        <h2>No Applicants Found</h2>
        <p id="recruitmentEmptyText">Adjust your filters to see applicants.</p>
      </section>
    </main>
    <phone-bottom-nav active="apps"></phone-bottom-nav>
    <left-profile-drawer></left-profile-drawer>
    <notification-sheet></notification-sheet>
    <favourite-sheet></favourite-sheet>
    <dialog id="recruitmentFilter" class="recruitment-filter" aria-labelledby="recruitmentFilterTitle">
      <form id="recruitmentFilterForm" data-standard-filter-ready="true" novalidate>
        <header class="standard-filter-header">
          <h2 id="recruitmentFilterTitle">Filter</h2>
          <div class="standard-filter-header-actions">
            <button type="button" id="recruitmentReset" class="standard-filter-reset"><i class="fa-solid fa-rotate-left" aria-hidden="true"></i><span>Reset</span></button>
            <button type="button" id="recruitmentClose" class="standard-filter-close" aria-label="Close filter"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
          </div>
        </header>
        <div id="recruitmentFilterFields" class="recruitment-filter-fields"></div>
        <p id="recruitmentError" class="recruitment-filter-error" role="alert" hidden>Start Date must be on or before End Date.</p>
        <footer class="recruitment-filter-footer"><button type="submit" id="recruitmentApply" class="standard-filter-apply">Search</button></footer>
      </form>
    </dialog>
  </div>
</body>
</html>
