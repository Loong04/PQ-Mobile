<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PeopleHCM - Staff Whereabout</title>
  <script>(()=>{const q=new URLSearchParams(location.search).get('theme');document.documentElement.dataset.theme=q==='light'?'light':'dark';})();</script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../../css/theme.css"><link rel="stylesheet" href="../../../../css/app.css"><link rel="stylesheet" href="../../css/employee-career.css"><link rel="stylesheet" href="../../css/staff-whereabout.css">
  <script src="../../../../js/components.js"></script><script src="../../../../js/app.js" defer></script><script src="../../js/employee-career-option.js" defer></script><script src="../../js/staff-whereabout.js" defer></script>
</head>
<body class="employee-career-option-page staff-whereabout-page"><preview-top-bar active-page="v2"></preview-top-bar><div class="phone-container">
  <header class="employee-career-header"><phone-status-bar time="9:41"></phone-status-bar><div class="employee-career-header-row"><a class="employee-career-back" data-option-back href="../../index.html?scope=team" aria-label="Back to Employee and Career"><i class="fa-solid fa-chevron-left"></i></a><div class="employee-career-heading"><h1>Staff Whereabout</h1><p>Team</p></div><span class="employee-career-header-spacer"></span></div></header>
  <main class="main-content employee-career-content">
    <div class="staff-whereabout-filter-summary filter-summary-bar"><div><small>Current Filter</small><strong id="staffWhereaboutFilterSummary">All Employees</strong></div><button type="button" id="staffWhereaboutFilterTrigger" aria-label="Open Data Filter" aria-haspopup="dialog" aria-controls="staffWhereaboutFilterOverlay"><i class="fa-solid fa-sliders" aria-hidden="true"></i></button></div>
    <div class="staff-whereabout-list-heading"><h2>Staff Whereabout</h2><span id="staffWhereaboutTotal" aria-live="polite">0 records</span></div>
    <div id="staffWhereaboutRecords" class="staff-whereabout-records"></div>
    <div id="staffWhereaboutEmpty" class="staff-whereabout-empty" hidden><i class="fa-solid fa-calendar-day" aria-hidden="true"></i><h2>No records found</h2><p>Try another date or adjust the filters.</p></div>
  </main>
  <phone-bottom-nav active="apps"></phone-bottom-nav>
  <left-profile-drawer></left-profile-drawer><notification-sheet></notification-sheet><favourite-sheet></favourite-sheet>
  <div id="staffWhereaboutFilterOverlay" class="staff-whereabout-filter-overlay standard-filter-sheet" aria-hidden="true" hidden>
    <form id="staffWhereaboutFilterForm" class="standard-filter-panel" data-standard-filter-ready="true" role="dialog" aria-modal="true" aria-labelledby="staffWhereaboutFilterTitle" novalidate>
      <div class="standard-filter-handle" aria-hidden="true"></div>
      <header class="standard-filter-header"><h2 id="staffWhereaboutFilterTitle">Data Filter</h2><div class="standard-filter-header-actions"><button type="button" id="staffWhereaboutResetFilter" class="standard-filter-reset"><i class="fa-solid fa-rotate-left" aria-hidden="true"></i><span>Reset</span></button><button type="button" id="staffWhereaboutCloseFilter" class="standard-filter-close" aria-label="Close Data Filter"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button></div></header>
      <div class="staff-whereabout-filter-fields">
        <div><label for="staffWhereaboutDate">Date</label><input id="staffWhereaboutDate" type="date" aria-describedby="staffWhereaboutFilterError"></div>
        <div><label for="staffWhereaboutKeyword">Search Keyword</label><input id="staffWhereaboutKeyword" type="search" placeholder="Employee Number or Name" maxlength="150"></div>
        <div><label for="staffWhereaboutBranch">Branch</label><select id="staffWhereaboutBranch"><option value="">All Branches</option></select></div>
        <div><label for="staffWhereaboutDepartment">Department</label><select id="staffWhereaboutDepartment"><option value="">All Departments</option></select></div>
        <div><label for="staffWhereaboutType">Whereabout</label><select id="staffWhereaboutType"><option value="">All Whereabouts</option></select></div>
        <p id="staffWhereaboutFilterError" class="staff-whereabout-filter-error" role="alert" hidden>Select a valid Date.</p>
      </div>
      <footer class="standard-filter-footer"><button type="submit" id="staffWhereaboutApplyFilter" class="standard-filter-apply">Apply Filter</button></footer>
    </form>
  </div>
</div></body></html>
