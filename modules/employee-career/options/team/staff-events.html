<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PeopleHCM - Staff Events</title>
  <script>(()=>{const q=new URLSearchParams(location.search).get('theme');document.documentElement.dataset.theme=q==='light'?'light':'dark';})();</script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../../css/theme.css"><link rel="stylesheet" href="../../../../css/app.css"><link rel="stylesheet" href="../../../../css/detail-popout.css"><link rel="stylesheet" href="../../css/employee-career.css"><link rel="stylesheet" href="../../css/staff-events.css">
  <script src="../../../../js/components.js"></script><script src="../../../../js/app.js" defer></script><script src="../../js/employee-career-option.js" defer></script><script src="../../js/staff-events-data.js" defer></script><script src="../../js/staff-events.js" defer></script>
</head>
<body class="employee-career-option-page staff-events-page"><preview-top-bar active-page="v2"></preview-top-bar><div class="phone-container">
  <header class="employee-career-header"><phone-status-bar time="9:41"></phone-status-bar><div class="employee-career-header-row"><a class="employee-career-back" data-option-back href="../../index.html?scope=team" aria-label="Back to Employee and Career"><i class="fa-solid fa-chevron-left"></i></a><div class="employee-career-heading"><h1>Staff Events</h1><p>Team</p></div><span class="employee-career-header-spacer"></span></div></header>
  <main class="main-content employee-career-content">
    <div class="staff-event-filter-summary filter-summary-bar">
      <div><small>Current Filter</small><strong id="staffEventFilterSummary">All Employees</strong></div>
      <button type="button" id="staffEventFilterTrigger" aria-label="Open Data Filter" aria-haspopup="dialog" aria-controls="staffEventFilterOverlay"><i class="fa-solid fa-sliders" aria-hidden="true"></i></button>
    </div>
    <div id="staffEventOverview" aria-live="polite"></div>
    <div id="staffEventSectionHeading" class="staff-event-section-heading"><h2>Events</h2><span id="staffEventCategoryCount">6 categories</span></div>
    <div id="staffEventCategories" class="staff-event-categories" aria-live="polite"></div>
  </main>
  <phone-bottom-nav active="apps"></phone-bottom-nav>
  <left-profile-drawer></left-profile-drawer><notification-sheet></notification-sheet><favourite-sheet></favourite-sheet>
  <div id="staffEventDetails" class="staff-event-overlay detail-popout-overlay" aria-hidden="true" hidden>
    <section class="detail-popout-panel" role="dialog" aria-modal="true" aria-labelledby="staffEventDetailsTitle">
      <header class="detail-popout-header"><h2 id="staffEventDetailsTitle" class="detail-popout-title"></h2><button type="button" id="staffEventCloseDetails" class="detail-popout-close" aria-label="Close event details">×</button></header>
      <div class="staff-event-detail-summary"><div><span>Total Records</span><strong id="staffEventDetailsCount">0</strong></div></div>
      <div class="detail-popout-body">
        <table class="staff-event-table" aria-labelledby="staffEventDetailsTitle">
          <colgroup><col><col class="staff-event-date-column"></colgroup>
          <thead><tr><th scope="col">Employee</th><th scope="col">Date</th></tr></thead>
          <tbody id="staffEventPeople"></tbody>
        </table>
        <div id="staffEventDetailsEmpty" class="staff-event-empty" hidden><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i><h3>No matching employees</h3><p>Try a different name or employee number.</p></div>
      </div>
    </section>
  </div>
  <div id="staffEventFilterOverlay" class="staff-event-overlay standard-filter-sheet" aria-hidden="true" hidden>
    <form id="staffEventFilterForm" class="standard-filter-panel" data-standard-filter-ready="true" role="dialog" aria-modal="true" aria-labelledby="staffEventFilterTitle">
      <div class="standard-filter-handle" aria-hidden="true"></div>
      <header class="standard-filter-header"><h2 id="staffEventFilterTitle">Data Filter</h2><div class="standard-filter-header-actions"><button type="button" id="staffEventResetFilter" class="standard-filter-reset"><i class="fa-solid fa-rotate-left" aria-hidden="true"></i><span>Reset</span></button><button type="button" id="staffEventCloseFilter" class="standard-filter-close" aria-label="Close Data Filter"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button></div></header>
      <div class="staff-event-filter-fields">
        <div><label for="staffEventKeyword">Search Keyword</label><input id="staffEventKeyword" type="search" placeholder="Employee Number or Name" maxlength="150"></div>
        <div><label for="staffEventStartDate">Start Date</label><input id="staffEventStartDate" type="date"></div>
        <div><label for="staffEventEndDate">End Date</label><input id="staffEventEndDate" type="date" aria-describedby="staffEventFilterError"></div>
        <div><label for="staffEventType">Event Type</label><select id="staffEventType"><option value="">All Event Types</option></select></div>
        <p id="staffEventFilterError" class="staff-event-filter-error" role="alert" hidden>End Date must be on or after Start Date.</p>
      </div>
      <footer class="standard-filter-footer"><button type="submit" id="staffEventApplyFilter" class="standard-filter-apply">Apply Filter</button></footer>
    </form>
  </div>
</div></body></html>
