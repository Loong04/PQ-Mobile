<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleHCM - Staff Engagement</title>
  <script>(()=>{const q=new URLSearchParams(location.search).get('theme');document.documentElement.dataset.theme=q==='light'?'light':'dark';})();</script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../../css/theme.css">
  <link rel="stylesheet" href="../../../../css/app.css">
  <link rel="stylesheet" href="../../css/employee-career.css">
  <link rel="stylesheet" href="../../css/employee-career-forms.css">
  <link rel="stylesheet" href="../../css/staff-engagement.css">
  <link rel="stylesheet" href="../../../../css/form-section-headings.css">
  <script src="../../../../js/components.js"></script>
  <script src="../../../../js/app.js" defer></script>
  <script src="../../js/employee-career-forms.js" defer></script>
</head>
<body class="employee-career-option-page employee-career-form-page employee-career-team-form-page staff-engagement-page"><preview-top-bar active-page="v2"></preview-top-bar><div class="phone-container">
  <header class="employee-career-header"><phone-status-bar time="9:41"></phone-status-bar><div class="employee-career-header-row"><a class="employee-career-back" data-option-back href="../../index.html?scope=team" aria-label="Back to Employee and Career"><i class="fa-solid fa-chevron-left"></i></a><div class="employee-career-heading"><h1>Staff Engagement</h1></div><span class="employee-career-header-spacer"></span></div></header>
  <main class="main-content employee-career-content">
    <form id="staffEngagementForm">
      <div class="employee-career-form-card">
        <section class="employee-career-form-section" aria-labelledby="engagementEmployeeHeading">
          <h2 id="engagementEmployeeHeading" class="form-section-heading">Employee Details</h2>
          <div class="employee-career-field">
            <label for="engagementEmployee">Employee # <span class="engagement-required" aria-hidden="true">*</span></label>
            <select id="engagementEmployee" name="employee" class="employee-career-control" required>
              <option value="">Select Employee</option>
              <option value="EBB01">Aina Rahman (#EBB01)</option>
              <option value="EBB02">Daniel Wong (#EBB02)</option>
              <option value="EBB03">Nur Izzati (#EBB03)</option>
            </select>
          </div>
          <div class="employee-career-field">
            <label for="engagementName">Name</label>
            <input id="engagementName" name="name" class="employee-career-control employee-career-readonly" type="text" placeholder="Selected employee name" readonly>
            <span id="engagementEmployeeId" class="engagement-employee-id" hidden></span>
          </div>
          <div class="employee-career-field"><label for="engagementPosition">Position</label><input id="engagementPosition" name="position" class="employee-career-control employee-career-readonly" type="text" placeholder="Selected employee position" readonly></div>
        </section>
        <section class="employee-career-form-section" aria-labelledby="engagementDetailsHeading">
          <h2 id="engagementDetailsHeading" class="form-section-heading">Engagement Details</h2>
          <div class="employee-career-field"><label for="engagementInterviewDate">Interview Date <span class="engagement-required" aria-hidden="true">*</span></label><input id="engagementInterviewDate" name="interviewDate" class="employee-career-control" type="date" required></div>
          <div class="employee-career-field"><label for="engagementPositiveFeedback">Positive Feedback</label><textarea id="engagementPositiveFeedback" name="positiveFeedback" class="employee-career-control" placeholder="Add positive feedback from the interview" maxlength="5000"></textarea></div>
          <div class="employee-career-field"><label for="engagementNegativeFeedback">Negative Feedback</label><textarea id="engagementNegativeFeedback" name="negativeFeedback" class="employee-career-control" placeholder="Add concerns or negative feedback" maxlength="5000"></textarea></div>
          <div class="employee-career-field">
            <label for="engagementFlightRisk">Flight Risk <span class="engagement-required" aria-hidden="true">*</span></label>
            <select id="engagementFlightRisk" name="flightRisk" class="employee-career-control" required><option value="">Select Flight Risk</option><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option></select>
          </div>
          <div class="employee-career-field">
            <label for="engagementRecommendation">Recommendation <span class="engagement-required" aria-hidden="true">*</span></label>
            <select id="engagementRecommendation" name="recommendation" class="employee-career-control" required><option value="">Select Recommendation</option><option value="retain">Retain Staff</option><option value="career-development">Career Development</option><option value="training">Training &amp; Development</option><option value="compensation-review">Compensation Review</option><option value="further-review">Further Review</option></select>
          </div>
          <div class="employee-career-field"><label for="engagementMitigationAction">Mitigation Action</label><textarea id="engagementMitigationAction" name="mitigationAction" class="employee-career-control" placeholder="Describe the follow-up actions" maxlength="5000"></textarea></div>
          <div class="employee-career-field"><label for="engagementRemarks">Remarks</label><textarea id="engagementRemarks" name="remarks" class="employee-career-control" placeholder="Add remarks" maxlength="5000"></textarea></div>
        </section>
        <fieldset class="employee-career-field employee-career-fieldset">
          <legend class="form-section-heading">Upload Attachments</legend>
          <div class="employee-career-upload-actions">
            <button class="employee-career-upload-button" type="button" data-file-picker="engagementFiles"><span class="employee-career-upload-icon"><i class="fa-solid fa-file-arrow-up" aria-hidden="true"></i></span><span>Select File(s)</span></button>
            <button class="employee-career-upload-button" type="button" data-file-picker="engagementCamera"><span class="employee-career-upload-icon"><i class="fa-solid fa-camera" aria-hidden="true"></i></span><span>Take a Picture</span></button>
          </div>
          <input id="engagementFiles" type="file" multiple hidden>
          <input id="engagementCamera" type="file" accept="image/*" capture="environment" hidden>
          <div id="engagementAttachments" class="form-attachment-list" aria-live="polite"></div>
        </fieldset>
      </div>
      <div class="employee-career-form-actions">
        <a id="engagementCancel" class="form-cancel-btn" data-option-back href="../../index.html?scope=team"><i class="fa-solid fa-xmark" aria-hidden="true"></i><span>Cancel</span></a>
        <button id="engagementSubmit" class="employee-career-button primary" type="submit"><span>Submit</span><i class="fa-solid fa-paper-plane" aria-hidden="true"></i></button>
      </div>
    </form>
  </main>
  <div id="employeeCareerToast" class="employee-career-toast" role="status" aria-live="polite"></div>
  <phone-bottom-nav active="apps"></phone-bottom-nav>
</div></body></html>
