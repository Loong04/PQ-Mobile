<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleHCM - Review Feedback</title>
  <script>(()=>{const q=new URLSearchParams(location.search).get('theme');document.documentElement.dataset.theme=q==='light'?'light':'dark';})();</script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../../css/theme.css"><link rel="stylesheet" href="../../../../css/app.css">
  <link rel="stylesheet" href="../../css/employee-career.css"><link rel="stylesheet" href="../../css/employee-career-forms.css">
  <link rel="stylesheet" href="../../../../css/form-section-headings.css"><link rel="stylesheet" href="../../css/staff-feedback.css">
  <script src="../../../../js/components.js"></script><script src="../../../../js/app.js" defer></script><script src="../../js/staff-feedback.js" defer></script>
</head>
<body class="employee-career-option-page employee-career-form-page employee-career-team-form-page staff-feedback-review-page">
  <preview-top-bar active-page="v2"></preview-top-bar>
  <div class="phone-container">
    <header class="employee-career-header">
      <phone-status-bar time="9:41"></phone-status-bar>
      <div class="employee-career-header-row">
        <a id="staffFeedbackReviewBack" class="employee-career-back" href="staff-feedback.html" aria-label="Back to Staff Feedback"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></a>
        <div class="employee-career-heading"><h1 id="staffFeedbackReviewTitle" tabindex="-1">Review Feedback</h1></div>
        <span class="employee-career-header-spacer" aria-hidden="true"></span>
      </div>
    </header>
    <main class="main-content employee-career-content">
      <form id="staffFeedbackReviewForm" novalidate>
      <div class="staff-feedback-review-body">
        <section class="staff-feedback-review-section" aria-labelledby="staffFeedbackReviewDetailsHeading">
          <h3 id="staffFeedbackReviewDetailsHeading" class="form-section-heading form-section-heading--new">Feedback Details</h3>
          <div class="staff-feedback-review-grid">
            <div class="staff-feedback-review-field"><label for="staffFeedbackReviewEmployeeId">Employee ID</label><input id="staffFeedbackReviewEmployeeId" class="staff-feedback-review-control" type="text" readonly></div>
            <div class="staff-feedback-review-field"><label for="staffFeedbackReviewName">Name</label><input id="staffFeedbackReviewName" class="staff-feedback-review-control" type="text" readonly></div>
            <div class="staff-feedback-review-field"><label for="staffFeedbackReviewType">Type</label><input id="staffFeedbackReviewType" class="staff-feedback-review-control" type="text" readonly></div>
            <div class="staff-feedback-review-field"><label for="staffFeedbackReviewCategory">Category</label><input id="staffFeedbackReviewCategory" class="staff-feedback-review-control" type="text" readonly></div>
            <div class="staff-feedback-review-field is-wide"><label for="staffFeedbackReviewFeedbackTitle">Title</label><input id="staffFeedbackReviewFeedbackTitle" class="staff-feedback-review-control" type="text" readonly></div>
            <div class="staff-feedback-review-field"><label for="staffFeedbackReviewDate1">Feedback Date 1</label><input id="staffFeedbackReviewDate1" class="staff-feedback-review-control" type="text" readonly></div>
            <div class="staff-feedback-review-field"><label for="staffFeedbackReviewDate2">Feedback Date 2</label><input id="staffFeedbackReviewDate2" class="staff-feedback-review-control" type="text" readonly></div>
            <div class="staff-feedback-review-field is-wide"><label for="staffFeedbackReviewReference1">Reference 1</label><input id="staffFeedbackReviewReference1" class="staff-feedback-review-control" type="text" readonly></div>
          </div>
        </section>
        <section class="staff-feedback-review-section staff-feedback-review-editable" aria-labelledby="staffFeedbackReviewDecisionHeading">
          <h3 id="staffFeedbackReviewDecisionHeading" class="form-section-heading form-section-heading--new">Review Details</h3>
          <div class="staff-feedback-review-field">
            <label for="staffFeedbackReward">Reward <span class="staff-feedback-required" aria-hidden="true">*</span></label>
            <select id="staffFeedbackReward" class="staff-feedback-review-control" aria-describedby="staffFeedbackReviewError" required>
              <option value="">Select Reward</option><option>No Reward</option><option>RM 20.00</option><option>RM 50.00</option><option>RM 100.00</option><option>Recognition Letter</option>
            </select>
          </div>
          <div class="staff-feedback-review-field">
            <label for="staffFeedbackRating">Rating <span class="staff-feedback-required" aria-hidden="true">*</span></label>
            <select id="staffFeedbackRating" class="staff-feedback-review-control" aria-describedby="staffFeedbackReviewError" required>
              <option value="">Select Rating</option><option value="1">1 - Needs Improvement</option><option value="2">2 - Fair</option><option value="3">3 - Good</option><option value="4">4 - Very Good</option><option value="5">5 - Excellent</option>
            </select>
          </div>
          <div class="staff-feedback-review-field">
            <label for="staffFeedbackComments">Comments <span class="staff-feedback-required" aria-hidden="true">*</span></label>
            <textarea id="staffFeedbackComments" class="staff-feedback-review-control" rows="4" maxlength="2000" placeholder="Add review comments" aria-describedby="staffFeedbackReviewError" required></textarea>
          </div>
          <p id="staffFeedbackReviewError" class="staff-feedback-review-error" role="alert" hidden></p>
        </section>
      </div>
        <div class="employee-career-form-actions staff-feedback-review-actions">
          <a id="staffFeedbackCancelReview" class="form-cancel-btn" href="staff-feedback.html"><i class="fa-solid fa-xmark" aria-hidden="true"></i><span>Cancel</span></a>
          <button type="submit" id="staffFeedbackSubmitReview" class="employee-career-button primary"><span>Submit</span><i class="fa-solid fa-paper-plane" aria-hidden="true"></i></button>
        </div>
      </form>
    </main>
    <phone-bottom-nav active="apps"></phone-bottom-nav>
  </div>
</body>
</html>
