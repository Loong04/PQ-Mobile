<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PeopleHCM - Staff Career Plan</title>
  <script>(()=>{const q=new URLSearchParams(location.search).get('theme');document.documentElement.dataset.theme=q==='light'?'light':'dark';})();</script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../../css/theme.css"><link rel="stylesheet" href="../../../../css/app.css"><link rel="stylesheet" href="../../../../css/claim-forms.css">
  <link rel="stylesheet" href="../../css/employee-career.css"><link rel="stylesheet" href="../../css/staff-list.css"><link rel="stylesheet" href="../../css/staff-career-plan.css">
  <script src="../../../../js/components.js"></script><script src="../../../../js/app.js" defer></script><script src="../../js/employee-career-option.js" defer></script><script src="../../js/staff-career-plan-data.js" defer></script><script src="../../js/staff-career-plan.js" defer></script>
</head>
<body class="employee-career-option-page staff-list-page staff-career-plan-page"><preview-top-bar active-page="v2"></preview-top-bar><div class="phone-container">
  <header class="employee-career-header"><phone-status-bar time="9:41"></phone-status-bar><div class="employee-career-header-row"><a id="staffCareerPlanBack" class="employee-career-back" data-option-back href="../../index.html?scope=team" aria-label="Back to Employee and Career"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></a><div class="employee-career-heading"><h1 id="staffCareerPlanTitle">Staff Career Plan</h1></div><span class="employee-career-header-spacer" aria-hidden="true"></span></div></header>
  <main class="main-content employee-career-content">
    <section id="staffCareerPlanListView" aria-label="Staff career plans">
      <div class="staff-list-filter-summary filter-summary-bar"><div><small>Current Filter</small><strong id="staffCareerPlanFilterSummary"></strong></div><button type="button" id="staffCareerPlanFilterTrigger" title="Open Filter Options" aria-label="Open staff career plan filter" aria-haspopup="dialog" aria-controls="staffCareerPlanFilterOverlay"><i class="fa-solid fa-sliders" aria-hidden="true"></i></button></div>
      <div class="staff-list-action-summary action-summary-bar"><div class="staff-list-summary-row"><div><span class="staff-list-summary-label">Total Records</span><strong id="staffCareerPlanTotalRecords" class="staff-list-summary-count">0</strong></div><button type="button" id="staffCareerPlanViewChart" class="view-chart-btn"><i class="fa-solid fa-chart-pie" aria-hidden="true"></i><span>View Chart</span></button></div></div>
      <div id="staffCareerPlanCards" class="staff-career-plan-cards"></div>
      <div id="staffCareerPlanEmpty" class="staff-career-plan-empty" hidden><i class="fa-solid fa-route" aria-hidden="true"></i><h2>No Career Plans Found</h2><p>Adjust the filters to find a staff career plan.</p></div>
    </section>

    <section id="staffCareerPlanChartView" aria-label="Staff career plan analysis" hidden>
      <div class="staff-list-breakdown-card"><label for="staffCareerPlanChartMetric">Breakdown By</label><div class="staff-list-select"><select id="staffCareerPlanChartMetric"><option value="branch">Branch</option><option value="department">Department</option><option value="careerPath">Career Path</option></select><i class="fa-solid fa-chevron-down" aria-hidden="true"></i></div></div>
      <article class="staff-list-donut-card">
        <div class="staff-list-chart-heading"><h2 id="staffCareerPlanChartTitle">Career plans by branch</h2><p id="staffCareerPlanChartPeriod"></p></div>
        <div class="staff-list-donut"><svg id="staffCareerPlanChartDonut" viewBox="0 0 180 180" role="img" aria-label="Career plans by branch"><circle cx="90" cy="90" r="70" fill="none" stroke="var(--border-subtle)" stroke-width="22"></circle><g id="staffCareerPlanChartSegments"></g></svg><div class="staff-list-donut-center"><strong id="staffCareerPlanChartTotal">0</strong><span>Career Plans</span></div></div>
        <p id="staffCareerPlanChartNote" class="staff-list-chart-note"></p>
      </article>
      <section class="staff-list-legend-card" aria-label="Career plan chart breakdown"><div class="staff-list-legend-head"><span id="staffCareerPlanChartColumn">Branch</span><span>Plans</span><span>% of Total</span></div><div id="staffCareerPlanChartLegend" class="staff-list-legend"></div><p id="staffCareerPlanChartEmpty" class="staff-career-plan-chart-empty" hidden>No career plans to chart. Adjust your filters to see results.</p></section>
    </section>
  </main>
  <phone-bottom-nav active="apps"></phone-bottom-nav><left-profile-drawer></left-profile-drawer><notification-sheet></notification-sheet><favourite-sheet></favourite-sheet>
  <div id="staffCareerPlanFilterOverlay" class="staff-list-filter-overlay standard-filter-sheet" hidden>
    <form id="staffCareerPlanFilterForm" class="staff-list-filter-panel standard-filter-panel" data-standard-filter-ready="true" role="dialog" aria-modal="true" aria-labelledby="staffCareerPlanFilterTitle">
      <div class="standard-filter-handle" aria-hidden="true"></div>
      <header class="standard-filter-header"><h2 id="staffCareerPlanFilterTitle">Filter</h2><div class="standard-filter-header-actions"><button type="button" id="staffCareerPlanResetFilter" class="standard-filter-reset"><i class="fa-solid fa-rotate-left" aria-hidden="true"></i><span>Reset</span></button><button type="button" id="staffCareerPlanCloseFilter" class="standard-filter-close" aria-label="Close staff career plan filter"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button></div></header>
      <div class="staff-list-filter-fields">
        <div><label for="staffCareerPlanFilterKeyword">Search keyword</label><input id="staffCareerPlanFilterKeyword" type="search" placeholder="Employee Number or Name" maxlength="150"></div>
        <div><label for="staffCareerPlanFilterStartDate">Start date</label><input id="staffCareerPlanFilterStartDate" type="date"></div>
        <div><label for="staffCareerPlanFilterEndDate">End date</label><input id="staffCareerPlanFilterEndDate" type="date"></div>
        <div><label for="staffCareerPlanFilterCareerPath">Career path</label><select id="staffCareerPlanFilterCareerPath"></select></div>
        <div><label for="staffCareerPlanFilterNextPosition">Next position</label><select id="staffCareerPlanFilterNextPosition"></select></div>
        <div><label for="staffCareerPlanFilterBranch">Branch</label><select id="staffCareerPlanFilterBranch"></select></div>
        <div><label for="staffCareerPlanFilterDepartment">Department</label><select id="staffCareerPlanFilterDepartment"></select></div>
      </div>
      <p id="staffCareerPlanFilterError" class="staff-career-plan-filter-error" role="alert" hidden>Start Date must be on or before End Date.</p>
      <footer class="standard-filter-footer"><button type="submit" id="staffCareerPlanApplyFilter" class="standard-filter-apply">Apply Filter</button></footer>
    </form>
  </div>
</div></body></html>
