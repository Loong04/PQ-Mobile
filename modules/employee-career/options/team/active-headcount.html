<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PeopleHCM - Active Headcount</title>
  <script>(()=>{const q=new URLSearchParams(location.search).get('theme');document.documentElement.dataset.theme=q==='light'?'light':'dark';})();</script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../../css/theme.css">
  <link rel="stylesheet" href="../../../../css/app.css">
  <link rel="stylesheet" href="../../../../css/history-cards.css">
  <link rel="stylesheet" href="../../css/employee-career.css">
  <link rel="stylesheet" href="../../css/staff-list.css">
  <link rel="stylesheet" href="../../css/manpower-statistics.css">
  <link rel="stylesheet" href="../../css/active-headcount.css">
  <script src="../../../../js/components.js"></script>
  <script src="../../../../js/app.js" defer></script>
  <script src="../../js/employee-career-option.js" defer></script>
  <script src="../../js/active-headcount-data.js"></script>
  <script src="../../js/active-headcount.js" defer></script>
</head>
<body class="employee-career-option-page staff-list-page active-headcount-page">
  <preview-top-bar active-page="v2"></preview-top-bar>
  <div class="phone-container">
    <header class="employee-career-header">
      <phone-status-bar time="9:41"></phone-status-bar>
      <div class="employee-career-header-row">
        <a id="activeHeadcountBack" class="employee-career-back" data-option-back href="../../index.html?scope=team" aria-label="Back to Employee and Career">
          <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
        </a>
        <div class="employee-career-heading"><h1 id="activeHeadcountTitle">Active Headcount</h1></div>
        <span class="employee-career-header-spacer" aria-hidden="true"></span>
      </div>
    </header>

    <main class="main-content employee-career-content">
      <section id="activeHeadcountChartView" aria-label="Active headcount chart">
        <button type="button" id="activeHeadcountDetails" class="active-headcount-details-button">
          <span>Details</span>
        </button>
        <article class="staff-list-donut-card active-headcount-chart-card">
          <div class="staff-list-chart-heading">
            <h2>Active Headcount by Status</h2>
            <p id="activeHeadcountAsAt"></p>
          </div>
          <div class="staff-list-donut">
            <svg id="activeHeadcountChartDonut" viewBox="0 0 180 180" role="img" aria-label="Active headcount by status">
              <circle cx="90" cy="90" r="70" fill="none" stroke="var(--border-subtle)" stroke-width="22"></circle>
              <g id="activeHeadcountChartSegments"></g>
            </svg>
            <div class="staff-list-donut-center">
              <strong id="activeHeadcountChartTotal">0</strong>
              <span>Headcount</span>
            </div>
          </div>
          <p class="staff-list-chart-note">Status distribution as at the selected date</p>
        </article>
        <section class="staff-list-legend-card" aria-label="Active headcount chart legend">
          <div class="staff-list-legend-head active-headcount-legend-grid">
            <span>Status</span><span>Headcount</span><span>% of Total</span>
          </div>
          <div id="activeHeadcountChartLegend" class="staff-list-legend"></div>
        </section>
      </section>

      <section id="activeHeadcountSummaryView" aria-label="Staff summary by status" hidden>
        <div class="history-total-records-card">
          <span class="history-total-records-label">Total Records</span>
          <strong id="activeHeadcountSummaryTotalRecords" class="history-total-records-value">0</strong>
        </div>
        <div id="activeHeadcountSummaryList" class="active-headcount-summary-list"></div>
      </section>

      <section id="activeHeadcountStaffView" aria-label="Active staff records" hidden>
        <div class="history-total-records-card">
          <span class="history-total-records-label">Total Records</span>
          <strong id="activeHeadcountStaffTotalRecords" class="history-total-records-value">0</strong>
        </div>
        <div id="activeHeadcountStaffList" class="active-headcount-staff-list"></div>
      </section>
    </main>

    <phone-bottom-nav active="apps"></phone-bottom-nav>
    <left-profile-drawer></left-profile-drawer>
    <notification-sheet></notification-sheet>
    <favourite-sheet></favourite-sheet>

    <p id="activeHeadcountStatus" class="manpower-drilldown-status" aria-live="polite"></p>
    <div id="activeHeadcountEmployeeOverlay" class="manpower-detail-overlay active-headcount-detail-overlay" role="dialog" aria-modal="true" aria-labelledby="activeHeadcountEmployeeDialogTitle" aria-hidden="true" hidden>
      <section class="manpower-detail-panel active-headcount-detail-panel">
        <header class="manpower-detail-header active-headcount-detail-header">
          <h2 id="activeHeadcountEmployeeDialogTitle">Employee Details</h2>
          <button type="button" id="activeHeadcountEmployeeClose" class="manpower-detail-close active-headcount-detail-close" aria-label="Close employee details">
            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
          </button>
        </header>
        <div class="manpower-detail-body active-headcount-detail-body">
          <div id="activeHeadcountEmployeePortrait" class="manpower-employee-portrait active-headcount-employee-portrait"></div>
          <table id="activeHeadcountEmployeeDetails" class="manpower-detail-table active-headcount-detail-table"><tbody></tbody></table>
        </div>
      </section>
    </div>
  </div>
</body>
</html>
