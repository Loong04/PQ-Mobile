<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PeopleHCM - Employee &amp; Career</title>
  <script>(()=>{const q=new URLSearchParams(location.search).get('theme');document.documentElement.dataset.theme=q==='light'?'light':'dark';})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../css/theme.css">
  <link rel="stylesheet" href="../../css/app.css">
  <link rel="stylesheet" href="css/employee-career.css">
  <script src="../../js/components.js"></script>
  <script src="../../js/app.js" defer></script>
  <script src="js/employee-career-config.js"></script>
  <script src="js/employee-career-app.js" defer></script>
</head>
<body class="employee-career-page">
  <preview-top-bar active-page="v2"></preview-top-bar>
  <div class="phone-container">
    <header class="employee-career-header">
      <phone-status-bar time="9:41"></phone-status-bar>
      <div class="employee-career-header-row">
        <a class="employee-career-back" id="employeeCareerBack" href="../../appdark.html" aria-label="Back to App"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></a>
        <div class="employee-career-heading"><h1 id="employeeCareerTitle">Employee &amp; Career</h1><p id="employeeCareerSubtitle">Individual</p></div>
        <span class="employee-career-header-spacer" aria-hidden="true"></span>
      </div>
    </header>
    <main class="main-content employee-career-content">
      <div class="employee-career-scope" role="tablist" aria-label="Employee and Career scope">
        <button type="button" id="employeeCareerTabIndividual" class="employee-career-scope-tab active" role="tab" aria-selected="true"><i class="fa-solid fa-user" aria-hidden="true"></i><span>Individual</span></button>
        <button type="button" id="employeeCareerTabTeam" class="employee-career-scope-tab" role="tab" aria-selected="false" tabindex="-1"><i class="fa-solid fa-users" aria-hidden="true"></i><span>Team</span></button>
      </div>
      <section class="employee-career-quick" aria-labelledby="employeeCareerQuickTitle">
        <h2 id="employeeCareerQuickTitle">Quick Options</h2>
        <div id="employeeCareerOptions" class="employee-career-grid" role="list"></div>
      </section>
    </main>
    <div id="employeeCareerAllOptions" class="employee-career-sheet-overlay" aria-hidden="true">
      <section class="employee-career-sheet" role="dialog" aria-modal="true" aria-labelledby="employeeCareerAllOptionsTitle">
        <div class="employee-career-sheet-handle" aria-hidden="true"></div>
        <header class="employee-career-sheet-header">
          <div><span>Team directory</span><h2 id="employeeCareerAllOptionsTitle">All Team Options</h2></div>
          <button type="button" id="employeeCareerCloseAll" class="employee-career-sheet-close" aria-label="Close all Team options"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
        </header>
        <div id="employeeCareerAllOptionsGrid" class="employee-career-grid employee-career-all-grid" role="list"></div>
      </section>
    </div>
    <phone-bottom-nav active="apps"></phone-bottom-nav>
    <left-profile-drawer></left-profile-drawer>
    <notification-sheet></notification-sheet>
  </div>
</body>
</html>
