<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PeopleHCM - Attendance Individual</title>
  <script src="../../js/components.js"></script>
  <script src="../../js/app.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/theme.css">
  <link rel="stylesheet" href="../../css/app.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-page);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: var(--text-primary);
      padding: 20px 0;
    }

    .phone-container {
      width: 100%;
      max-width: 420px;
      height: 900px;
      background: var(--bg-phone);
      border-radius: 44px;
      overflow: hidden;
      box-shadow: var(--shadow-phone);
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 0 16px 90px;
      position: relative;
      z-index: 10;
      scrollbar-width: none;
    }
    .main-content::-webkit-scrollbar { display: none; }

    .cal-top-header {
      background: linear-gradient(135deg, #4c1d95 0%, #6d28d9 50%, #7c3aed 100%);
      padding: 12px 16px 14px;
      border-bottom-left-radius: 22px;
      border-bottom-right-radius: 22px;
      box-shadow: 0 8px 24px rgba(76, 29, 149, 0.28);
      position: relative;
      z-index: 20;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 20px;
      padding: 18px;
      box-shadow: var(--shadow-card);
      margin-bottom: 20px;
    }

    .cal-cell {
      background: var(--bg-card);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 8px 0;
      min-height: 60px;
      border-bottom: 1px solid var(--border-subtle);
      border-right: 1px solid var(--border-subtle);
      position: relative;
    }
    .cal-cell:nth-child(7n) { border-right: none; }
    .cal-cell:nth-last-child(-n+7) { border-bottom: none; }
    
    .cal-date { font-size: 13.5px; font-weight: 700; color: var(--text-primary); margin-bottom: 4px; z-index: 2; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
    .cal-cell.active .cal-date { background: var(--purple-primary); color: #ffffff; }

    .cal-d { background: var(--tag-blue-bg); color: var(--tag-blue-text); font-size: 9.5px; font-weight: 800; padding: 1px 6px; border-radius: 6px; margin-bottom: 2px; }
    .cal-n { background: var(--tag-teal-bg); color: var(--tag-teal-text); font-size: 9.5px; font-weight: 800; padding: 1px 6px; border-radius: 6px; margin-bottom: 2px; }
    .cal-off { font-size: 10px; font-weight: 600; color: var(--text-caption); }
    .cal-ot { color: var(--tag-violet-text); font-size: 9px; font-weight: 700; margin-top: 1px; }

    .cal-ot-badge { background: var(--tag-violet-bg); color: var(--tag-violet-text); font-size: 9.5px; font-weight: 800; padding: 1px 6px; border-radius: 6px; }

    /* Custom Switcher */
    .view-mode-switcher {
      display: flex;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      padding: 4px;
      border-radius: 20px;
      margin-bottom: 24px;
    }
    .view-mode-tab {
      flex: 1;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .view-mode-tab.active {
      background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(124, 58, 237, 0.4);
    }
  </style>
</head>
<body>

  <preview-top-bar active-page="attendance"></preview-top-bar>

  <div class="phone-container">
    
    <!-- Executive Purple Header -->
    <div class="cal-top-header">
      <phone-status-bar time="9:41" style="color: #ffffff;"></phone-status-bar>

      <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 4px;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <button class="me-back-btn" onclick="javascript:history.back()" aria-label="Back"
            style="background: rgba(255, 255, 255, 0.18); border: 1px solid rgba(255, 255, 255, 0.25); width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #ffffff;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </button>
          <h1 style="font-size: 19px; font-weight: 800; color: #ffffff; margin: 0;">Attendance Dashboard</h1>
        </div>
        
        <div style="display: flex; gap: 16px;">
          <button style="background: transparent; border: none; cursor: pointer; color: #ffffff; display: flex; align-items: center; justify-content: center;">
             <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
          </button>
        </div>
      </div>
    </div>

    <div class="main-content" style="padding-top: 20px;">

      <!-- Module Option Tabs Switcher -->
      <div class="view-mode-switcher">
         <a href="index.html" class="view-mode-tab active">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            Individual
         </a>
         <a href="options/team.html" class="view-mode-tab">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
            Team
         </a>
      </div>

      <!-- Quick Actions Grid -->
      <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-bottom: 24px;">
         <a href="options/clocking.html" class="card" style="margin-bottom: 0; padding: 14px 8px; display: flex; flex-direction: column; align-items: center; text-align: center; text-decoration: none; flex: 0 0 calc((100% - 24px) / 3); box-sizing: border-box;">
            <div style="width: 40px; height: 40px; border-radius: 12px; background: rgba(124, 58, 237, 0.15); color: var(--purple-primary); display: flex; align-items: center; justify-content: center; margin-bottom: 10px;">
               <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line>
               </svg>
            </div>
            <span style="font-size: 13px; font-weight: 800; color: var(--text-primary); line-height: 1.2;">Clocking</span>
         </a>
         <a href="options/attendance.html" class="card" style="margin-bottom: 0; padding: 14px 8px; display: flex; flex-direction: column; align-items: center; text-align: center; text-decoration: none; flex: 0 0 calc((100% - 24px) / 3); box-sizing: border-box;">
            <div style="width: 40px; height: 40px; border-radius: 12px; background: rgba(16, 185, 129, 0.15); color: #10b981; display: flex; align-items: center; justify-content: center; margin-bottom: 10px;">
               <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline>
               </svg>
            </div>
            <span style="font-size: 13px; font-weight: 800; color: var(--text-primary); line-height: 1.2;">Attendance</span>
         </a>

         <a href="options/overtime.html" class="card" style="margin-bottom: 0; padding: 14px 8px; display: flex; flex-direction: column; align-items: center; text-align: center; text-decoration: none; flex: 0 0 calc((100% - 24px) / 3); box-sizing: border-box;">
            <div style="width: 40px; height: 40px; border-radius: 12px; background: rgba(245, 158, 11, 0.15); color: #f59e0b; display: flex; align-items: center; justify-content: center; margin-bottom: 10px;">
               <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline>
               </svg>
            </div>
            <span style="font-size: 13px; font-weight: 800; color: var(--text-primary); line-height: 1.2;">Overtime</span>
         </a>

         <a href="options/hours-summary.html" class="card" style="margin-bottom: 0; padding: 14px 8px; display: flex; flex-direction: column; align-items: center; text-align: center; text-decoration: none; flex: 0 0 calc((100% - 24px) / 3); box-sizing: border-box;">
            <div style="width: 40px; height: 40px; border-radius: 12px; background: rgba(59, 130, 246, 0.15); color: #3b82f6; display: flex; align-items: center; justify-content: center; margin-bottom: 10px;">
               <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line>
               </svg>
            </div>
            <span style="font-size: 13px; font-weight: 800; color: var(--text-primary); line-height: 1.2;">Hours<br>Summary</span>
         </a>
         
         <a href="options/clocking-history.html" class="card" style="margin-bottom: 0; padding: 14px 8px; display: flex; flex-direction: column; align-items: center; text-align: center; text-decoration: none; flex: 0 0 calc((100% - 24px) / 3); box-sizing: border-box;">
            <div style="width: 40px; height: 40px; border-radius: 12px; background: rgba(236, 72, 153, 0.15); color: #ec4899; display: flex; align-items: center; justify-content: center; margin-bottom: 10px;">
               <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                  <path d="M3 3v5h5"></path>
                  <polyline points="12 7 12 12 15 15"></polyline>
               </svg>
            </div>
            <span style="font-size: 13px; font-weight: 800; color: var(--text-primary); line-height: 1.2;">Clocking<br>History</span>
         </a>
      </div>

      <h2 style="font-size: 20px; font-weight: 800; color: var(--text-primary); margin-bottom: 16px; padding: 0 4px;">September 2026</h2>
      
      <!-- Attendance Requests Card -->
      <div class="card">
         <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px;">
            <h3 style="font-size: 16px; font-weight: 800; color: var(--text-primary);">Attendance Requests</h3>
            <span style="font-size: 11.5px; font-weight: 700; padding: 4px 10px; border-radius: 12px; background: var(--bg-input); color: var(--text-muted);">9 Total</span>
         </div>
         <div style="display: flex; align-items: flex-start; justify-content: space-between;">
            <div style="text-align: center; flex: 1; border-right: 1px solid var(--border-subtle);">
               <div style="font-size: 28px; font-weight: 800; color: #f59e0b; line-height: 1;">2</div>
               <div style="font-size: 12.5px; font-weight: 600; color: var(--text-secondary); margin-top: 8px; line-height: 1.2;">Pending<br>Feedback</div>
            </div>
            <div style="text-align: center; flex: 1; border-right: 1px solid var(--border-subtle);">
               <div style="font-size: 28px; font-weight: 800; color: #3b82f6; line-height: 1;">3</div>
               <div style="font-size: 12.5px; font-weight: 600; color: var(--text-secondary); margin-top: 8px; line-height: 1.2;">Submitted<br>&nbsp;</div>
            </div>
            <div style="text-align: center; flex: 1;">
               <div style="font-size: 28px; font-weight: 800; color: #10b981; line-height: 1;">4</div>
               <div style="font-size: 12.5px; font-weight: 600; color: var(--text-secondary); margin-top: 8px; line-height: 1.2;">Approved<br>&nbsp;</div>
            </div>
         </div>
         <div style="text-align: right; margin-top: 16px;">
            <a href="#" style="font-size: 13.5px; font-weight: 700; color: var(--purple-primary); text-decoration: none; display: inline-flex; align-items: center; gap: 4px;">
              View requests 
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M12 5l7 7-7 7"></path></svg>
            </a>
         </div>
      </div>

      <!-- Shift Roster Removed as requested -->

    </div>

    <!-- Add bottom navigation -->
    <phone-bottom-nav active="apps"></phone-bottom-nav>
  </div>
</body>
</html>
