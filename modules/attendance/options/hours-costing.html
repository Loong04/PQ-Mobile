<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleHCM - Hours Costing</title>
  <script src="../../../js/components.js"></script>
  <script src="../../../js/app.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../css/theme.css">
  <link rel="stylesheet" href="../../../css/app.css">
  <link rel="stylesheet" href="../../../css/attendance-highlight-report.css">
  <link rel="stylesheet" href="../../../css/attendance-hours-highlight.css">
  <link rel="stylesheet" href="../../../css/attendance-hours-costing.css">
</head>
<body class="attendance-highlight-page hours-highlight-page hours-costing-page">
  <preview-top-bar active-page="attendance"></preview-top-bar>
  <div class="phone-container">
    <div class="cal-top-header">
      <phone-status-bar time="9:41" style="color:#fff"></phone-status-bar>
      <div class="hours-highlight-header">
        <button type="button" class="header-btn-icon" onclick="window.location.href='team.html'" aria-label="Back"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></button>
        <h1>Hours Costing</h1>
      </div>
    </div>
    <div class="main-content">
      <div class="highlight-report-view">
        <div class="filter-summary-bar highlight-filter-card">
          <div class="hours-highlight-filter-copy">
            <div class="filter-bar-label">CURRENT FILTER</div>
            <div class="filter-bar-value"><i class="fa-solid fa-filter" aria-hidden="true"></i><span id="highlightFilterSummaryText"></span></div>
          </div>
          <button type="button" id="highlightFilterTrigger" class="filter-trigger-btn" onclick="openHighlightFilterModal()" aria-label="Open Filter Options"><i class="fa-solid fa-sliders" aria-hidden="true"></i></button>
        </div>
        <div class="attendance-report-summary highlight-summary-card">
          <div class="attendance-report-summary-row"><div><span class="attendance-report-summary-label">Total Records</span><strong class="attendance-report-summary-value" id="totalRecordsVal">0</strong></div></div>
          <div class="attendance-report-summary-row"><div><span class="attendance-report-summary-label">Total Cost</span><strong class="highlight-summary-total" id="totalCostVal">RM 0.00</strong></div></div>
        </div>
        <div class="attendance-report-table-card highlight-table-card">
          <div class="attendance-report-table-scroll">
            <table class="attendance-report-table">
              <thead><tr><th scope="col">Date</th><th scope="col">Name</th><th scope="col" class="hours-number">Amount</th></tr></thead>
              <tbody id="employeeCostingList"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
    <div id="highlightFilterModal" class="modal-overlay highlight-filter-overlay" hidden onclick="closeHighlightFilterModal(event)">
      <section class="highlight-filter-sheet" role="dialog" aria-modal="true" aria-labelledby="highlightFilterTitle" onclick="event.stopPropagation()">
        <div class="highlight-filter-handle"></div>
        <div class="highlight-filter-header">
          <h2 id="highlightFilterTitle">Filter</h2>
          <div class="standard-filter-header-actions">
            <button type="button" id="highlightResetFilter" class="standard-filter-reset" onclick="resetHighlightFilterModal()"><i class="fa-solid fa-rotate-left" aria-hidden="true"></i><span>Reset</span></button>
            <button type="button" class="standard-filter-close" onclick="closeHighlightFilterModal()" aria-label="Close filter"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
          </div>
        </div>
        <form id="highlightFilterForm" class="highlight-filter-form">
          <div><label for="filterKeywordInput">Keywords</label><input type="text" id="filterKeywordInput" placeholder="Search staff name or #ID..."></div>
          <div><label for="filterStartDateInput">Start Date</label><input type="date" id="filterStartDateInput" required></div>
          <div><label for="filterEndDateInput">End Date</label><input type="date" id="filterEndDateInput" required></div>
          <div><label for="filterCostingTypeSelect">Costing Type</label><select id="filterCostingTypeSelect"><option value="Total Work hours">Total Work hours</option><option value="Regular Work hours">Regular Work hours</option><option value="Overtime hours">Overtime hours</option></select></div>
          <div><label for="filterCostCenterSelect">Cost Center</label><select id="filterCostCenterSelect"><option value="all">All Cost Centers</option></select></div>
          <button type="submit" id="highlightApplyFilter" class="standard-filter-apply">Apply Filter</button>
        </form>
      </section>
    </div>
    <phone-bottom-nav active="apps"></phone-bottom-nav>
  </div>
  <script src="../../../js/attendance-hours-costing-data.js"></script>
  <script src="../../../js/attendance-hours-costing.js"></script>
</body>
</html>
