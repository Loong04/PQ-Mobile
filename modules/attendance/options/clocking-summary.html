<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PeopleHCM - Clocking Summary</title>
  <script src="../../../js/components.js"></script>
  <script src="../../../js/app.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../css/theme.css">
  <link rel="stylesheet" href="../../../css/app.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg-page); display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; color: var(--text-primary); padding: 20px 0; }
    .phone-container { width: 100%; max-width: 420px; height: 900px; background: var(--bg-phone); border-radius: 44px; overflow: hidden; box-shadow: var(--shadow-phone); position: relative; display: flex; flex-direction: column; }
    .main-content { flex: 1; overflow-y: auto; padding: 14px 14px 90px; position: relative; z-index: 10; scrollbar-width: none; }
    .main-content::-webkit-scrollbar { display: none; }
    
    /* Top Header Bar */
    .cal-top-header {
      background: linear-gradient(135deg, #2e1065 0%, #4c1d95 100%);
      padding: 12px 16px 14px;
      border-bottom-left-radius: 22px;
      border-bottom-right-radius: 22px;
      box-shadow: 0 8px 24px rgba(46, 16, 101, 0.3);
      position: relative;
      z-index: 20;
    }
    .header-btn-icon {
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.25);
      width: 36px;
      height: 36px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #ffffff;
      transition: transform 0.15s ease;
      backdrop-filter: blur(4px);
    }
    .header-btn-icon:active { transform: scale(0.94); }

    /* Executive Filter Summary Bar */
    .filter-summary-bar {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      padding: 12px 16px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .filter-summary-bar:hover {
      border-color: rgba(124, 58, 237, 0.35);
      box-shadow: 0 4px 14px rgba(124, 58, 237, 0.08);
    }
    .filter-bar-label {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--purple-primary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
      display: flex;
      align-items: center;
    }
    .filter-bar-value {
      font-size: 13.5px;
      font-weight: 800;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 270px;
    }
    .filter-trigger-btn {
      width: 40px;
      height: 40px;
      border-radius: 13px;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      color: var(--purple-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s ease;
      flex-shrink: 0;
    }
    .filter-trigger-btn:active { transform: scale(0.92); }

    /* Executive Date Navigation Card */
    .date-switcher-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      padding: 6px 8px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      box-shadow: var(--shadow-sm);
    }
    .date-nav-btn {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }
    .date-nav-btn:hover {
      background: var(--purple-subtle);
      color: var(--purple-primary);
      border-color: var(--purple-border);
    }
    .date-nav-btn:active { transform: scale(0.92); }
    .date-current-badge {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 13.5px;
      font-weight: 800;
      color: var(--text-primary);
      padding: 6px 12px;
      border-radius: 12px;
    }

    /* Summary Stats Row */
    .summary-info-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 12px;
      padding: 0 4px 10px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .summary-counts-col {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .count-label-line {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-primary);
    }
    .count-label-line strong {
      font-weight: 800;
      color: var(--purple-primary);
    }

    .view-chart-btn {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.35);
      color: #f59e0b;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.15s ease;
    }
    .view-chart-btn:active { transform: scale(0.95); }

    /* Modern Summary Table */
    .summary-table-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      margin-bottom: 16px;
    }
    .summary-table-hdr {
      display: grid;
      grid-template-columns: 1.6fr 1.6fr 1fr;
      background: rgba(124, 58, 237, 0.18);
      padding: 14px 16px;
      font-size: 13px;
      font-weight: 800;
      color: #a78bfa;
      border-bottom: 1px solid var(--border-subtle);
    }
    .summary-table-hdr div:last-child {
      text-align: right;
    }

    .summary-table-row {
      display: grid;
      grid-template-columns: 1.6fr 1.6fr 1fr;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-subtle);
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-primary);
      align-items: center;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .summary-table-row:last-child { border-bottom: none; }
    .summary-table-row:hover { background: var(--bg-input); }
    .summary-table-row:active { transform: scale(0.995); }

    .cell-section { font-weight: 800; color: var(--text-primary); }
    .cell-cc { color: var(--text-muted); font-size: 12.5px; }
    .cell-count { text-align: right; font-weight: 900; color: var(--purple-primary); }

    /* Modal Overlay & Bottom Sheet */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 9000;
      display: none;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      border-radius: 44px;
      overflow: hidden;
    }
    .modal-overlay.active { opacity: 1; }

    /* Centered Popout Modal Dialog styling */
    .modal-overlay.popout-mode {
      align-items: center !important;
      justify-content: center !important;
      padding: 18px;
    }
    .popout-dialog-card {
      width: 100%;
      max-width: 380px;
      max-height: 82vh;
      background: var(--bg-card);
      border-radius: 22px;
      border: 1px solid var(--border-subtle);
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.65);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform: scale(0.9);
      opacity: 0;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s ease;
      box-sizing: border-box;
    }
    .modal-overlay.active .popout-dialog-card {
      transform: scale(1);
      opacity: 1;
    }

    /* Executive Colored Header Bar */
    .popout-hdr-colored {
      background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
      padding: 14px 18px;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }
    .popout-hdr-title {
      font-size: 15.5px;
      font-weight: 800;
      color: #ffffff;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 9px;
      letter-spacing: 0.3px;
    }
    .popout-close-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.15s ease, transform 0.15s ease;
    }
    .popout-close-btn:hover { background: rgba(255, 255, 255, 0.35); }
    .popout-close-btn:active { transform: scale(0.92); }

    .popout-body-content {
      padding: 14px 18px;
      overflow-y: auto;
      flex: 1;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .popout-body-content::-webkit-scrollbar,
    #detailsListContainer::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }
    #detailsListContainer {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .bottom-sheet-content {
      width: 100%;
      max-width: 420px;
      background: var(--bg-card);
      border-top-left-radius: 28px;
      border-top-right-radius: 28px;
      border: 1px solid var(--border-subtle);
      border-bottom: none;
      padding: 16px 20px 28px;
      box-shadow: 0 -12px 36px rgba(0, 0, 0, 0.45);
      transform: translateY(100%);
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      max-height: 84vh;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }
    .modal-overlay.active .bottom-sheet-content { transform: translateY(0); }
    .sheet-handle-pill {
      width: 38px;
      height: 4px;
      background: var(--border-subtle);
      border-radius: 4px;
      margin: 0 auto 16px;
      opacity: 0.7;
    }

    /* Personnel Card in Details List */
    .staff-clock-card {
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 12px 14px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .staff-avatar-bubble {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      background: rgba(124, 58, 237, 0.15);
      border: 1px solid rgba(124, 58, 237, 0.25);
      color: var(--purple-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      flex-shrink: 0;
    }
    .staff-info-col { flex: 1; min-width: 0; }
    .staff-name-text { font-size: 14px; font-weight: 800; color: var(--text-primary); line-height: 1.25; }
    
    /* REPOSITORY RULE (AGENTS.md):
       Employee ID placed directly BELOW name with leading # and muted typography */
    .staff-emp-badge {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-muted);
      opacity: 0.8;
      font-family: monospace, sans-serif;
      margin-bottom: 4px;
      display: block;
    }
    
    .staff-meta-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .clock-type-tag {
      font-size: 11px;
      font-weight: 800;
      padding: 4px 9px;
      border-radius: 10px;
      white-space: nowrap;
    }
    .type-in { background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); }
    .type-out { background: rgba(244, 63, 94, 0.15); color: #f43f5e; border: 1px solid rgba(244, 63, 94, 0.3); }

    /* Filter Form Elements */
    .filter-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .filter-modal-title { font-size: 18px; font-weight: 800; color: var(--text-primary); margin: 0; }
    .filter-reset-btn {
      padding: 6px 14px;
      border-radius: 20px;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .form-group-item { margin-bottom: 14px; }
    .form-field-label {
      font-size: 11px;
      font-weight: 800;
      color: var(--purple-primary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      display: block;
    }
    .form-field-select {
      width: 100%;
      padding: 12px 36px 12px 14px;
      border-radius: 14px;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 700;
      outline: none;
      box-sizing: border-box;
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      cursor: pointer;
    }
    .form-field-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 14px;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 700;
      outline: none;
      box-sizing: border-box;
      font-family: inherit;
    }
    .form-field-input::-webkit-calendar-picker-indicator {
      filter: invert(0.8);
      cursor: pointer;
    }
    .select-chevron-icon {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--purple-primary);
      font-size: 11px;
      font-weight: 900;
    }
    .form-apply-btn {
      width: 100%;
      margin-top: 10px;
      padding: 14px;
      border-radius: 16px;
      background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
      color: #ffffff;
      font-size: 14.5px;
      font-weight: 800;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 8px 24px rgba(124, 58, 237, 0.35);
    }

    .feedback-toast {
      position: absolute;
      bottom: 85px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #0f172a;
      color: #ffffff;
      padding: 9px 18px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.15);
      z-index: 10000;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .feedback-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <preview-top-bar active-page="attendance"></preview-top-bar>

  <div class="phone-container">
    
    <!-- Top Executive Header -->
    <div class="cal-top-header">
      <phone-status-bar time="13:10" style="color: #ffffff;"></phone-status-bar>
      <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 4px;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <button class="header-btn-icon" onclick="handleHeaderBack()" aria-label="Back" title="Back">
            <i class="fa-solid fa-chevron-left" style="font-size: 16px;"></i>
          </button>
          <div>
            <h1 id="pageHeaderTitle" style="font-size: 18.5px; font-weight: 800; color: #ffffff; margin: 0;">Clocking Summary</h1>
          </div>
        </div>
      </div>
    </div>

    <!-- Main Content Area -->
    <div class="main-content">
      
      <!-- ================= VIEW 1: SUMMARY TABLE VIEW ================= -->
      <div id="view-summary" style="display: block;">
        
        <!-- 1. Executive Filter Summary Bar -->
        <div class="filter-summary-bar" id="filterBarContainer" onclick="openFilterModal()" title="Click to filter clocking records">
          <div style="flex: 1; min-width: 0; padding-right: 8px;">
            <div class="filter-bar-label">
              <span>CURRENT FILTER</span>
            </div>
            <div class="filter-bar-value" id="filterSummaryText">
              20 Sep 2026 • All Companies
            </div>
          </div>
          <button type="button" class="filter-trigger-btn" onclick="event.stopPropagation(); openFilterModal();" title="Filter Options" aria-label="Filter Options">
            <i class="fa-solid fa-sliders" style="font-size: 15px;"></i>
          </button>
        </div>

        <!-- Summary Executive KPI Stats & View Chart Row -->
        <div class="summary-info-row" style="display: flex; align-items: stretch; justify-content: space-between; margin-bottom: 14px; gap: 8px; border-bottom: none; padding: 0 2px;">
          
          <!-- KPI 1: Total Records -->
          <div style="background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 14px; padding: 8px 10px; display: flex; align-items: center; gap: 8px; box-shadow: var(--shadow-sm); flex: 1; min-width: 0;">
            <div style="width: 32px; height: 32px; border-radius: 10px; background: rgba(124, 58, 237, 0.15); border: 1px solid rgba(124, 58, 237, 0.25); color: var(--purple-primary); display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0;">
              <i class="fa-solid fa-list-check"></i>
            </div>
            <div style="display: flex; flex-direction: column; min-width: 0;">
              <span style="font-size: 10px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.4px; white-space: nowrap;">Records</span>
              <span id="totalRecordsVal" style="font-size: 15px; font-weight: 900; color: var(--text-primary); line-height: 1.1;">4</span>
            </div>
          </div>

          <!-- KPI 2: Total Count -->
          <div style="background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 14px; padding: 8px 10px; display: flex; align-items: center; gap: 8px; box-shadow: var(--shadow-sm); flex: 1.1; min-width: 0;">
            <div style="width: 32px; height: 32px; border-radius: 10px; background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.25); color: #10b981; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0;">
              <i class="fa-solid fa-user-clock"></i>
            </div>
            <div style="display: flex; flex-direction: column; min-width: 0;">
              <span style="font-size: 10px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.4px; white-space: nowrap;">Total Count</span>
              <span id="totalCountVal" style="font-size: 15px; font-weight: 900; color: #10b981; line-height: 1.1;">24</span>
            </div>
          </div>

          <!-- View Chart Action Button -->
          <button type="button" class="view-chart-btn" onclick="showSectionView('chart')" style="padding: 8px 11px; border-radius: 14px; border: 1px solid rgba(245, 158, 11, 0.35); background: rgba(245, 158, 11, 0.15); color: #f59e0b; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; flex-shrink: 0; cursor: pointer;">
            <i class="fa-solid fa-chart-pie"></i>
            <span>View Chart</span>
          </button>
        </div>

        <!-- Section & Cost Centre Table -->
        <div class="summary-table-card">
          <div class="summary-table-hdr">
            <div>Section</div>
            <div>Cost Centre</div>
            <div style="text-align: right;">Count</div>
          </div>
          <div id="summaryTableBody">
            <!-- Dynamically populated table rows -->
          </div>
        </div>
      </div>

      <!-- ================= VIEW 2: DEDICATED CHART PAGE VIEW ================= -->
      <div id="view-chart" style="display: none;">
        <!-- Top Action Bar inside Chart Page -->
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; padding: 0 4px;">
          <div style="font-size: 13.5px; font-weight: 800; color: var(--text-primary); display: flex; align-items: center; gap: 6px;">
            <i class="fa-solid fa-chart-pie" style="color: #f59e0b;"></i>
            <span>Clocking Distribution Chart</span>
          </div>
        </div>

        <!-- SVG Donut Chart Card -->
        <div style="background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 24px; padding: 20px 16px; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; align-items: center; margin-bottom: 14px;">
          <div style="display: flex; align-items: center; justify-content: center; position: relative; width: 210px; height: 210px; margin: 6px 0 14px;">
            <svg id="summaryDonutSvg" width="210" height="210" viewBox="0 0 180 180" style="transform: rotate(-90deg); filter: drop-shadow(0 6px 20px rgba(124, 58, 237, 0.18));">
              <circle cx="90" cy="90" r="70" fill="transparent" stroke="var(--border-subtle)" stroke-width="22"></circle>
              <g id="summaryDonutCircles"></g>
            </svg>
            <div style="position: absolute; text-align: center; pointer-events: none; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 120px;">
              <div id="summaryCenterTotal" style="font-size: 24px; font-weight: 900; color: var(--text-primary); line-height: 1.1; letter-spacing: -0.3px;">24</div>

    <!-- MODAL 2: PERSONNEL CLOCKING DETAILS MODAL (CENTER POPOUT DIALOG WITH COLORED HEADER) -->

  </div>

  <script>
    const masterClockingTableDataset = [
      {
        id: 1,
        branch: 'HQ - KL Main',
        dept: 'HUMAN RESOURCE',
        section: 'BENEFITS',
        costCenter: 'MANAGEMENT',
        count: 3,
        details: [
          { empNo: '#EBB15', name: 'Asmawi idris', date: '20 Sep 2026', startTime: '08:04 AM', endTime: '05:30 PM', time: '08:04 AM', type: 'Clock In', mode: 'Manual Input(People HR)', typeClass: 'type-in', branch: 'HQ - KL Main', dept: 'HUMAN RESOURCE', section: 'BENEFITS', costCenter: 'MANAGEMENT' },
          { empNo: '#A0001', name: 'Natasha thean mei hoi', date: '20 Sep 2026', startTime: '08:00 AM', endTime: '05:30 PM', time: '08:00 AM', type: 'Clock In', mode: 'Manual Input(People HR)', typeClass: 'type-in', branch: 'HQ - KL Main', dept: 'HUMAN RESOURCE', section: 'BENEFITS', costCenter: 'MANAGEMENT' },
          { empNo: '#EBB12', name: 'Farhan binti rahmat', date: '20 Sep 2026', startTime: '07:34 AM', endTime: '05:30 PM', time: '07:34 AM', type: 'Clock In', mode: 'Manual Input(People HR)', typeClass: 'type-in', branch: 'HQ - KL Main', dept: 'HUMAN RESOURCE', section: 'BENEFITS', costCenter: 'MANAGEMENT' }
        ]
      },
      {
        id: 2,
        branch: 'HQ - KL Main',
        dept: 'HUMAN RESOURCE',
        section: 'CORPORATE',
        costCenter: 'CC-101 MANAGEMENT',
        count: 8,
        details: [
          { empNo: '#EBB01', name: 'Lee Soon Hock', date: '20 Sep 2026', startTime: '08:00 AM', endTime: '05:30 PM', time: '08:00 AM', type: 'Clock In', mode: 'Face Kiosk', typeClass: 'type-in', branch: 'HQ - KL Main', dept: 'HUMAN RESOURCE', section: 'CORPORATE', costCenter: 'CC-101 MANAGEMENT' },
          { empNo: '#004177', name: 'Siti Nurhaliza', date: '20 Sep 2026', startTime: '08:15 AM', endTime: '05:45 PM', time: '08:15 AM', type: 'Clock In', mode: 'Mobile Geofence', typeClass: 'type-in', branch: 'HQ - KL Main', dept: 'HUMAN RESOURCE', section: 'CORPORATE', costCenter: 'CC-101 MANAGEMENT' },
          { empNo: '#0000101', name: 'Tan Wei Ming', date: '20 Sep 2026', startTime: '08:30 AM', endTime: '05:30 PM', time: '05:30 PM', type: 'Clock Out', mode: 'Face Kiosk', typeClass: 'type-out', branch: 'HQ - KL Main', dept: 'HUMAN RESOURCE', section: 'CORPORATE', costCenter: 'CC-101 MANAGEMENT' }
        ]
      },
      {
        id: 3,
        branch: 'Penang Branch',
        dept: 'HUMAN RESOURCE',
        section: 'GENERAL HR',
        costCenter: 'CC-501 HR & OPS',
        count: 1,
        details: [
          { empNo: '#EBB02', name: 'Wong Kah Fai', date: '20 Sep 2026', startTime: '08:30 AM', endTime: '05:30 PM', time: '08:30 AM', type: 'Clock In', mode: 'Mobile Geofence', typeClass: 'type-in', branch: 'Penang Branch', dept: 'HUMAN RESOURCE', section: 'GENERAL HR', costCenter: 'CC-501 HR & OPS' }
        ]
      },
      {
        id: 4,
        branch: 'Johor Bahru Branch',
        dept: 'PLANT OPERATIONS',
        section: 'ASSEMBLY',
        costCenter: 'CC-301 PRODUCTION',
        count: 12,
        details: [
          { empNo: '#EBB03', name: 'Chok Ching Hou', date: '20 Sep 2026', startTime: '07:45 AM', endTime: '05:15 PM', time: '07:45 AM', type: 'Clock In', mode: 'Biometric Scanner', typeClass: 'type-in', branch: 'Johor Bahru Branch', dept: 'PLANT OPERATIONS', section: 'ASSEMBLY', costCenter: 'CC-301 PRODUCTION' },
          { empNo: '#004199', name: 'Kavitha Raj', date: '20 Sep 2026', startTime: '07:50 AM', endTime: '05:20 PM', time: '07:50 AM', type: 'Clock In', mode: 'Biometric Scanner', typeClass: 'type-in', branch: 'Johor Bahru Branch', dept: 'PLANT OPERATIONS', section: 'ASSEMBLY', costCenter: 'CC-301 PRODUCTION' }
        ]
      }
    ];

    let currentDateObj = new Date(2026, 8, 20);
    let currentActiveSection = 'summary'; // 'summary' or 'chart'

    function handleHeaderBack() {
      if (currentActiveSection === 'chart') {
        showSectionView('summary');
      } else {
        javascript:history.back();
      }
    }

    function showSectionView(sec) {
      currentActiveSection = sec;
      const summaryView = document.getElementById('view-summary');
      const chartView = document.getElementById('view-chart');
      const pageTitle = document.getElementById('pageHeaderTitle');

      if (sec === 'chart') {
        if (summaryView) summaryView.style.display = 'none';
        if (chartView) chartView.style.display = 'block';
        if (pageTitle) pageTitle.innerText = 'Clocking Distribution Chart';
        renderDonutChartData();
      } else {
        if (chartView) chartView.style.display = 'none';
        if (summaryView) summaryView.style.display = 'block';
        if (pageTitle) pageTitle.innerText = 'Clocking Summary';
      }
    }

    function formatDateDisplay(d) {
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      const day = d.getDate();
      const month = months[d.getMonth()];
      const year = d.getFullYear();
      return `${day < 10 ? '0' + day : day} ${month} ${year}`;
    }

    function shiftDate(deltaDays) {
      currentDateObj.setDate(currentDateObj.getDate() + deltaDays);
      const displayStr = formatDateDisplay(currentDateObj);
      const dateElem = document.getElementById('currentDateDisplay');
      if (dateElem) dateElem.innerText = displayStr;
      
      const dateInput = document.getElementById('filterDateInput');
      if (dateInput) {
        const y = currentDateObj.getFullYear();
        const m = String(currentDateObj.getMonth() + 1).padStart(2, '0');
        const day = String(currentDateObj.getDate()).padStart(2, '0');
        dateInput.value = `${y}-${m}-${day}`;
      }

      updateFilterSummaryDisplay();
      renderTable();
      if (currentActiveSection === 'chart') {
        renderDonutChartData();
      }
      showToastNotification(`Date shifted to ${displayStr}`);
    }

    function updateFilterSummaryDisplay() {
      const dateVal = document.getElementById('filterDateInput')?.value;
      let displayDate = formatDateDisplay(currentDateObj);
      if (dateVal) {
        const p = dateVal.split('-');
        if (p.length === 3) {
          const parsed = new Date(parseInt(p[0]), parseInt(p[1]) - 1, parseInt(p[2]));
          if (!isNaN(parsed.getTime())) {
            displayDate = formatDateDisplay(parsed);
          }
        }
      }
      const branch = document.getElementById('filterBranchSelect')?.value || 'all';
      const dept = document.getElementById('filterDeptSelect')?.value || 'all';
      const sec = document.getElementById('filterSectionSelect')?.value || 'all';
      const cc = document.getElementById('filterCostCenterSelect')?.value || 'all';
      const type = document.getElementById('filterClockTypeSelect')?.value || 'all';

      let parts = [displayDate];
      if (branch !== 'all') parts.push(branch);
      if (dept !== 'all') parts.push(dept);
      if (sec !== 'all') parts.push(sec);
      if (cc !== 'all') parts.push(cc);
      if (type !== 'all') parts.push(type);

      if (parts.length === 1) parts.push('All Branches');

      document.getElementById('filterSummaryText').innerText = parts.join(' • ');
    }

    function renderTable() {
      const branchFilter = document.getElementById('filterBranchSelect')?.value || 'all';
      const deptFilter = document.getElementById('filterDeptSelect')?.value || 'all';
      const sectionFilter = document.getElementById('filterSectionSelect')?.value || 'all';
      const costCenterFilter = document.getElementById('filterCostCenterSelect')?.value || 'all';
      const clockTypeFilter = document.getElementById('filterClockTypeSelect')?.value || 'all';

      const filtered = masterClockingTableDataset.filter(item => {
        const matchBranch = (branchFilter === 'all' || item.branch === branchFilter);
        const matchDept = (deptFilter === 'all' || item.dept === deptFilter);
        const matchSection = (sectionFilter === 'all' || item.section === sectionFilter);
        const matchCostCenter = (costCenterFilter === 'all' || item.costCenter === costCenterFilter);
        
        let matchClockType = true;
        if (clockTypeFilter !== 'all') {
          matchClockType = item.details && item.details.some(d => d.type === clockTypeFilter);
        }
        return matchBranch && matchDept && matchSection && matchCostCenter && matchClockType;
      });

      let totalCount = 0;
      filtered.forEach(item => { totalCount += item.count; });
      
      document.getElementById('totalRecordsVal').innerText = filtered.length;
      document.getElementById('totalCountVal').innerText = totalCount;

      const container = document.getElementById('summaryTableBody');
      if (!container) return;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; padding: 30px 16px; color: var(--text-muted); font-size: 13px;">
            No clocking summary records found matching filters.
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(item => `
        <div class="summary-table-row" onclick="openDetailsModal(${item.id})">
          <div class="cell-section">${item.section}</div>
          <div class="cell-cc">${item.costCenter}</div>
          <div class="cell-count">${item.count}</div>
        </div>
      `).join('');
    }

    function renderDonutChartData() {
      const branchFilter = document.getElementById('filterBranchSelect')?.value || 'all';
      const deptFilter = document.getElementById('filterDeptSelect')?.value || 'all';
      const sectionFilter = document.getElementById('filterSectionSelect')?.value || 'all';
      const costCenterFilter = document.getElementById('filterCostCenterSelect')?.value || 'all';
      const clockTypeFilter = document.getElementById('filterClockTypeSelect')?.value || 'all';

      const filtered = masterClockingTableDataset.filter(item => {
        const matchBranch = (branchFilter === 'all' || item.branch === branchFilter);
        const matchDept = (deptFilter === 'all' || item.dept === deptFilter);
        const matchSection = (sectionFilter === 'all' || item.section === sectionFilter);
        const matchCostCenter = (costCenterFilter === 'all' || item.costCenter === costCenterFilter);

        let matchClockType = true;
        if (clockTypeFilter !== 'all') {
          matchClockType = item.details && item.details.some(d => d.type === clockTypeFilter);
        }
        return matchBranch && matchDept && matchSection && matchCostCenter && matchClockType;
      });

      // Group counts by Branch ("下面是 branch")
      const branchMap = {};
      let grandTotal = 0;
      filtered.forEach(item => {
        const b = item.branch || 'HQ - KL Main';
        branchMap[b] = (branchMap[b] || 0) + item.count;
        grandTotal += item.count;
      });

      // Center number & label ("chart 是 3 clock transaction")
      document.getElementById('summaryCenterTotal').innerText = grandTotal;
      const centerBadge = document.getElementById('summaryCenterBadge');
      if (centerBadge) centerBadge.innerText = 'Clock Transactions';

      const colors = ['#7c3aed', '#10b981', '#f59e0b', '#3b82f6', '#ec4899', '#8b5cf6'];
      const branchKeys = Object.keys(branchMap);

      const chartItems = branchKeys.map((bName, idx) => {
        const val = branchMap[bName];
        const pct = grandTotal > 0 ? (val / grandTotal) * 100 : 0;
        return {
          name: bName,
          val: val,
          pct: pct,
          color: colors[idx % colors.length]
        };
      });

      // Render SVG Donut Slices
      const svgGroup = document.getElementById('summaryDonutCircles');
      if (svgGroup) {
        const C = 439.82; // 2 * PI * 70
        let currentOffset = 0;
        let circlesHtml = '';

        chartItems.forEach(item => {
          const pctFraction = item.pct / 100;
          const dashLen = pctFraction * C;
          const dashOffset = -currentOffset;
          currentOffset += dashLen;

          circlesHtml += `<circle cx="90" cy="90" r="70" fill="transparent" stroke="${item.color}" stroke-width="22" stroke-dasharray="${dashLen.toFixed(2)} ${(C - dashLen).toFixed(2)}" stroke-dashoffset="${dashOffset.toFixed(2)}" style="transition: all 0.5s ease;"></circle>`;
        });
        svgGroup.innerHTML = circlesHtml;
      }

      // Render Legend Grid Rows (by Branch)
      const grid = document.getElementById('summaryChartLegendGrid');
      if (grid) {
        let listHtml = '';
        chartItems.forEach(item => {
          listHtml += `
            <div style="display: grid; grid-template-columns: 1fr 60px 75px; gap: 10px; align-items: center;">
              <div style="display: flex; align-items: center; gap: 10px; overflow: hidden;">
                <span style="width: 8px; height: 8px; border-radius: 50%; background: ${item.color}; flex-shrink: 0;"></span>
                <span style="font-size: 13px; font-weight: 700; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${item.name}</span>
              </div>
              <div style="font-size: 13px; font-weight: 800; color: var(--text-primary); text-align: right;">${item.val}</div>
              <div style="font-size: 12.5px; font-weight: 700; color: var(--purple-primary); text-align: right;">${item.pct.toFixed(1)}%</div>
            </div>
          `;
        });
        grid.innerHTML = listHtml;
      }
    }

    function openDetailsModal(id) {
      const item = masterClockingTableDataset.find(x => x.id === id);
      if (!item) return;

      document.getElementById('modalSectionTitle').innerText = item.section;
      document.getElementById('modalSectionMeta').innerText = `Branch: ${item.branch} • Cost Centre: ${item.costCenter}`;

      const details = item.details || [];
      document.getElementById('modalRecordCount').innerText = `${details.length} Record${details.length === 1 ? '' : 's'}`;

      const container = document.getElementById('detailsListContainer');
      if (details.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; padding: 24px; color: var(--text-muted); font-size: 13px;">
            No detailed personnel records for this section.
          </div>
        `;
      } else {
        container.innerHTML = details.map(d => `
          <div class="staff-clock-card" style="background: var(--bg-input); border: 1px solid var(--border-subtle); border-radius: 18px; padding: 14px 16px; margin-bottom: 12px; display: flex; flex-direction: column; align-items: stretch; gap: 0;">
            <!-- Top Row: Avatar, Name, Employee ID (below name per AGENTS.md), and Clock Type Badge -->
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%;">
              <div style="display: flex; align-items: center; gap: 12px;">
                <div class="staff-avatar-bubble" style="width: 40px; height: 40px; border-radius: 12px; font-size: 15px; flex-shrink: 0;">
                  <i class="fa-solid fa-user"></i>
                </div>
                <div>
                  <div class="staff-name-text" style="font-size: 14px; font-weight: 800; color: var(--text-primary); line-height: 1.2;">${d.name}</div>
                  <!-- REPOSITORY RULE (AGENTS.md): Employee ID placed directly BELOW name with leading # -->
                  <div class="staff-emp-badge" style="margin: 2px 0 0 0;">${d.empNo}</div>
                </div>
              </div>
              <div class="clock-type-tag ${d.typeClass || (d.type === 'Clock Out' ? 'type-out' : 'type-in')}" style="padding: 5px 12px; font-size: 11.5px; flex-shrink: 0;">
                ${d.type}
              </div>
            </div>

            <!-- Subtle Horizontal Divider -->
            <div style="height: 1px; background: var(--border-subtle); margin: 10px 0 10px; opacity: 0.6;"></div>

            <!-- Structured Metadata Grid: 2 Columns -->
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; font-size: 11.5px;">
              <div style="display: flex; align-items: center; gap: 6px; color: var(--text-muted); overflow: hidden;">
                <i class="fa-regular fa-calendar" style="color: var(--purple-primary); font-size: 11px; flex-shrink: 0;"></i>
                <span style="font-weight: 700; color: var(--text-primary); white-space: nowrap;">${d.date || '20 Sep 2026'}</span>
              </div>
              <div style="display: flex; align-items: center; gap: 6px; color: var(--text-muted); overflow: hidden;">
                <i class="fa-regular fa-clock" style="color: var(--purple-primary); font-size: 11px; flex-shrink: 0;"></i>
                <span style="font-weight: 700; color: var(--text-primary); white-space: nowrap;">${d.startTime || '08:00 AM'} - ${d.endTime || '05:30 PM'}</span>
              </div>
              <div style="display: flex; align-items: center; gap: 6px; color: var(--text-muted); overflow: hidden;">
                <i class="fa-solid fa-building" style="color: var(--purple-primary); font-size: 10.5px; flex-shrink: 0;"></i>
                <span style="font-weight: 700; color: var(--text-primary); white-space: nowrap; text-overflow: ellipsis; overflow: hidden;">${d.branch || item.branch}</span>
              </div>
              <div style="display: flex; align-items: center; gap: 6px; color: var(--text-muted); overflow: hidden;">
                <i class="fa-solid fa-sitemap" style="color: var(--purple-primary); font-size: 10.5px; flex-shrink: 0;"></i>
                <span style="font-weight: 700; color: var(--text-primary); white-space: nowrap; text-overflow: ellipsis; overflow: hidden;">${d.dept || item.dept}</span>
              </div>
              <div style="display: flex; align-items: center; gap: 6px; color: var(--text-muted); overflow: hidden;">
                <i class="fa-solid fa-layer-group" style="color: var(--purple-primary); font-size: 10.5px; flex-shrink: 0;"></i>
                <span style="font-weight: 700; color: var(--text-primary); white-space: nowrap; text-overflow: ellipsis; overflow: hidden;">${d.section || item.section}</span>
              </div>
              <div style="display: flex; align-items: center; gap: 6px; color: var(--text-muted); overflow: hidden;">
                <i class="fa-solid fa-wallet" style="color: var(--purple-primary); font-size: 10.5px; flex-shrink: 0;"></i>
                <span style="font-weight: 700; color: var(--text-primary); white-space: nowrap; text-overflow: ellipsis; overflow: hidden;">${d.costCenter || item.costCenter}</span>
              </div>
            </div>

            <!-- Footer Badge: Clock Mode -->
            <div style="margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--border-subtle); display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--text-muted);">
              <span style="display: flex; align-items: center; gap: 6px; font-weight: 700;">
                <i class="fa-solid fa-mobile-screen" style="font-size: 10px; color: var(--purple-primary);"></i>
                <span>${d.mode}</span>
              </span>
            </div>
          </div>
        `).join('');
      }

      const modal = document.getElementById('detailsModal');
      if (!modal) return;
      modal.style.display = 'flex';
      setTimeout(() => { modal.classList.add('active'); }, 10);
    }

    function closeDetailsModal(e) {
      if (e && e.target !== e.currentTarget) return;
      closeDetailsModalDirect();
    }

    function closeDetailsModalDirect() {
      const modal = document.getElementById('detailsModal');
      if (!modal) return;
      modal.classList.remove('active');
      setTimeout(() => { modal.style.display = 'none'; }, 260);
    }

    function openFilterModal() {
      const modal = document.getElementById('filterModal');
      if (!modal) return;
      modal.style.display = 'flex';
      setTimeout(() => { modal.classList.add('active'); }, 10);
    }

    function closeFilterModal(e) {
      if (e && e.target !== e.currentTarget) return;
      const modal = document.getElementById('filterModal');
      if (!modal) return;
      modal.classList.remove('active');
      setTimeout(() => { modal.style.display = 'none'; }, 260);
    }

    function resetFilterModal() {
      if (document.getElementById('filterDateInput')) document.getElementById('filterDateInput').value = '2026-09-20';
      if (document.getElementById('filterStartTimeInput')) document.getElementById('filterStartTimeInput').value = '00:00';
      if (document.getElementById('filterEndTimeInput')) document.getElementById('filterEndTimeInput').value = '23:59';
      if (document.getElementById('filterBranchSelect')) document.getElementById('filterBranchSelect').value = 'all';
      if (document.getElementById('filterDeptSelect')) document.getElementById('filterDeptSelect').value = 'all';
      if (document.getElementById('filterSectionSelect')) document.getElementById('filterSectionSelect').value = 'all';
      if (document.getElementById('filterCostCenterSelect')) document.getElementById('filterCostCenterSelect').value = 'all';
      if (document.getElementById('filterClockTypeSelect')) document.getElementById('filterClockTypeSelect').value = 'all';
      updateFilterSummaryDisplay();
      closeFilterModal();
      renderTable();
      if (currentActiveSection === 'chart') {
        renderDonutChartData();
      }
      showToastNotification('Filters reset to default');
    }

    function applyFilterModal() {
      updateFilterSummaryDisplay();
      closeFilterModal();
      renderTable();
      if (currentActiveSection === 'chart') {
        renderDonutChartData();
      }
      showToastNotification('Filter applied successfully');
    }

    function showToastNotification(msg) {
      const toast = document.getElementById('feedbackToast');
      const text = document.getElementById('toastMessage');
      if (!toast || !text) return;
      text.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => { toast.classList.remove('show'); }, 2200);
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeFilterModal();
        closeDetailsModalDirect();
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      updateFilterSummaryDisplay();
      renderTable();
    });
  </script>
</body>
</html>
