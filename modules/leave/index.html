<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PeopleHCM - Leave Management Module</title>
  <script src="../../js/components.js"></script>
  <script src="../../js/app.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/theme.css">
  <link rel="stylesheet" href="../../css/app.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-page);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: var(--text-primary);
      padding: 20px 0;
    }

    .phone-container {
      width: 100%;
      max-width: 420px;
      height: 900px;
      background: var(--bg-phone);
      border-radius: 44px;
      overflow: hidden;
      box-shadow: var(--shadow-phone);
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 110px 16px 90px;
      position: relative;
      z-index: 10;
      scrollbar-width: none;
    }
    .main-content::-webkit-scrollbar { display: none; }

    .bonus-top-header {
      background: linear-gradient(135deg, #4c1d95 0%, #6d28d9 50%, #7c3aed 100%);
      padding: 0 16px 14px;
      color: #ffffff;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
    }
  </style>
</head>
<body>

  <preview-top-bar active-page="leave"></preview-top-bar>

  <div class="phone-container">
    
    <!-- Top Header -->
    <div class="bonus-top-header">
      <phone-status-bar time="9:41" style="color: #ffffff;"></phone-status-bar>

      <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 4px;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <button class="me-back-btn" onclick="javascript:history.back()" aria-label="Back" title="Back"
            style="background: rgba(255, 255, 255, 0.18); border: 1px solid rgba(255, 255, 255, 0.25); width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #ffffff;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </button>
          <h1 style="font-size: 18px; font-weight: 800; color: #ffffff; margin: 0;">Leave Management</h1>
        </div>
      </div>
    </div>

    <div class="main-content">

      <!-- Module Option Cards -->
      <div style="font-size: 14.5px; font-weight: 800; color: var(--text-primary); margin-bottom: 14px;">Leave Options</div>

      <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;">
         <a href="options/apply.html" style="background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 20px; padding: 18px; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 10px;">
            <div style="font-size: 28px;">🌴</div>
            <div style="font-size: 13.5px; font-weight: 800; color: var(--text-primary);">Apply Leave</div>
         </a>
         <a href="options/balance.html" style="background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 20px; padding: 18px; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 10px;">
            <div style="font-size: 28px;">📊</div>
            <div style="font-size: 13.5px; font-weight: 800; color: var(--text-primary);">Leave Balance</div>
         </a>
         <a href="options/history.html" style="background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 20px; padding: 18px; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 10px;">
            <div style="font-size: 28px;">🕒</div>
            <div style="font-size: 13.5px; font-weight: 800; color: var(--text-primary);">Leave History</div>
         </a>
         <a href="options/team.html" style="background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 20px; padding: 18px; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 10px;">
            <div style="font-size: 28px;">👥</div>
            <div style="font-size: 13.5px; font-weight: 800; color: var(--text-primary);">Team Leave</div>
         </a>
      </div>

    </div>

    <phone-bottom-nav active="apps"></phone-bottom-nav>
    <left-profile-drawer></left-profile-drawer>
  </div>
</body>
</html>
