<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleHCM - Project &amp; Task</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../css/theme.css">
  <link rel="stylesheet" href="../../css/app.css">
  <link rel="stylesheet" href="../../css/project-task.css">
  <script src="../../js/components.js"></script>
  <script src="../../js/app.js" defer></script>
  <script src="../../js/project-task/project-task-app.js" defer></script>
</head>
<body class="project-task-page">
  <preview-top-bar active-page="project-task"></preview-top-bar>
  <div class="phone-container">
    <header class="project-header">
      <phone-status-bar time="9:41"></phone-status-bar>
      <div class="project-header-row">
        <a class="project-back" href="../../appdark.html" onclick="navTo('nav_apps', event)" aria-label="Back to apps"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></a>
        <div class="project-header-title">
          <h1>Project &amp; Task</h1>
          <div class="project-header-scope" id="projectHeaderScope">Individual</div>
        </div>
        <span aria-hidden="true"></span>
      </div>
    </header>
    <main class="main-content project-task-content">
      <div class="project-scope-tabs" role="tablist" aria-label="Project and task scope">
        <button type="button" class="project-scope-tab" id="projectTab-individual" role="tab" aria-selected="true" aria-controls="projectPanel-individual"><i class="fa-solid fa-user" aria-hidden="true"></i>Individual</button>
        <button type="button" class="project-scope-tab" id="projectTab-team" role="tab" aria-selected="false" aria-controls="projectPanel-team" tabindex="-1"><i class="fa-solid fa-users" aria-hidden="true"></i>Team</button>
      </div>
      <section class="project-scope-panel" id="projectPanel-individual" role="tabpanel" aria-labelledby="projectTab-individual">
        <div class="project-options-heading"><h2>Quick Options</h2><span class="project-options-count" aria-label="2 options">2</span></div>
        <div class="project-options-grid">
          <a class="project-option" href="options/work-plan.html">
            <span class="project-option-icon"><i class="fa-solid fa-calendar-check" aria-hidden="true"></i></span>
            <span class="project-option-label"><span class="project-option-title">Work Plan</span><i class="fa-solid fa-chevron-right" aria-hidden="true"></i></span>
          </a>
          <a class="project-option" href="options/time-sheet.html">
            <span class="project-option-icon"><i class="fa-solid fa-table-list" aria-hidden="true"></i></span>
            <span class="project-option-label"><span class="project-option-title">Time Sheet</span><i class="fa-solid fa-chevron-right" aria-hidden="true"></i></span>
          </a>
        </div>
      </section>
      <section class="project-scope-panel" id="projectPanel-team" role="tabpanel" aria-labelledby="projectTab-team" hidden>
        <div class="project-options-heading"><h2>Quick Options</h2><span class="project-options-count" aria-label="2 options">2</span></div>
        <div class="project-options-grid">
          <a class="project-option" href="options/work-assignment.html">
            <span class="project-option-icon"><i class="fa-solid fa-list-check" aria-hidden="true"></i></span>
            <span class="project-option-label"><span class="project-option-title">Work Assignment</span><i class="fa-solid fa-chevron-right" aria-hidden="true"></i></span>
          </a>
          <a class="project-option" href="options/timesheet-highlight.html">
            <span class="project-option-icon"><i class="fa-solid fa-chart-pie" aria-hidden="true"></i></span>
            <span class="project-option-label"><span class="project-option-title">Timesheet Highlight</span><i class="fa-solid fa-chevron-right" aria-hidden="true"></i></span>
          </a>
        </div>
      </section>
    </main>
    <phone-bottom-nav active="apps"></phone-bottom-nav>
    <left-profile-drawer></left-profile-drawer>
    <notification-sheet></notification-sheet>
    <favourite-sheet></favourite-sheet>
  </div>
</body>
</html>
