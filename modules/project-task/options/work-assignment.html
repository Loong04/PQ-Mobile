<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleHCM - Work Assignment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../css/theme.css">
  <link rel="stylesheet" href="../../../css/app.css">
  <link rel="stylesheet" href="../../../css/project-task.css">
  <link rel="stylesheet" href="../../../css/project-task-forms.css">
  <script src="../../../js/components.js"></script>
  <script src="../../../js/app.js" defer></script>
  <script src="../../../js/project-task/project-task-app.js" defer></script>
  <script src="../../../js/project-task/project-task-forms.js" defer></script>
</head>
<body class="project-task-page project-form-page">
  <preview-top-bar active-page="project-task"></preview-top-bar>
  <div class="phone-container">
    <header class="project-header">
      <phone-status-bar time="9:41"></phone-status-bar>
      <div class="project-header-row">
        <a class="project-back" href="../index.html?scope=team" aria-label="Back to Project and Task"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></a>
        <div class="project-header-title"><h1>Work Assignment</h1></div>
        <span aria-hidden="true"></span>
      </div>
    </header>
    <main class="main-content project-task-content">
      <form id="workAssignmentForm" novalidate>
        <section class="form-card" aria-labelledby="workAssignmentDetailsHeading">
          <div class="section-header-bar">
            <span class="section-title-accent" aria-hidden="true"></span>
            <h2 class="section-title-text" id="workAssignmentDetailsHeading">Assignment Details</h2>
          </div>
          <div class="field-group">
            <label class="field-label" for="workAssignmentTitle">Title <span class="req">*</span></label>
            <input id="workAssignmentTitle" name="title" class="form-ctrl" maxlength="200" autocomplete="off" required>
          </div>
          <div class="field-group">
            <label class="field-label" for="workAssignmentDescription">Description <span class="req">*</span></label>
            <textarea id="workAssignmentDescription" name="description" class="form-ctrl" rows="3" required></textarea>
          </div>
          <div class="field-group">
            <label class="field-label" for="workAssignmentProject">Project</label>
            <div class="select-wrapper"><select id="workAssignmentProject" name="project" class="form-ctrl" data-project-select></select></div>
          </div>
          <div class="field-group">
            <label class="field-label" for="workAssignmentMilestone">Milestone</label>
            <input id="workAssignmentMilestone" name="milestone" class="form-ctrl" autocomplete="off">
          </div>
          <fieldset class="field-group">
            <legend class="field-label">Schedule</legend>
            <div class="project-form-grid">
              <div><input type="date" id="workAssignmentScheduleFrom" name="scheduleFrom" class="form-ctrl" aria-label="Schedule start date" data-today></div>
              <div><input type="date" id="workAssignmentScheduleTo" name="scheduleTo" class="form-ctrl" aria-label="Schedule end date" data-today></div>
            </div>
          </fieldset>
          <div class="field-group">
            <label class="field-label" for="workAssignmentDeadline">Deadline <span class="req">*</span></label>
            <input type="date" id="workAssignmentDeadline" name="deadline" class="form-ctrl" data-today required>
          </div>
          <div class="field-group">
            <label class="field-label" for="workAssignmentTaskCategory">Task Category</label>
            <div class="select-wrapper"><select id="workAssignmentTaskCategory" name="taskCategory" class="form-ctrl" data-task-category-select></select></div>
          </div>
          <div class="field-group">
            <label class="field-label" for="workAssignmentTask">Main Task</label>
            <div class="select-wrapper"><select id="workAssignmentTask" name="task" class="form-ctrl" data-task-select></select></div>
          </div>
          <div class="field-group">
            <label class="field-label" for="workAssignmentPriority">Priority</label>
            <input type="number" id="workAssignmentPriority" name="priority" class="form-ctrl" value="0" min="0" step="1">
          </div>
          <div class="field-group">
            <label class="field-label" for="workAssignmentRemarks">Remarks</label>
            <textarea id="workAssignmentRemarks" name="remarks" class="form-ctrl" rows="3"></textarea>
          </div>
          <div class="field-group project-assignee-field">
            <span class="field-label" id="workAssignmentAssigneeLabel">Assignee(s)</span>
            <div class="project-assignee-picker">
              <button type="button" class="project-assignee-trigger" id="workAssignmentAssigneeTrigger" aria-expanded="false" aria-controls="workAssignmentAssigneeOptions">
                <span class="project-assignee-trigger-icon"><i class="fa-solid fa-users" aria-hidden="true"></i></span>
                <span id="workAssignmentAssigneeSummary">Select assignee(s)</span>
                <i class="fa-solid fa-chevron-down project-assignee-chevron" aria-hidden="true"></i>
              </button>
              <div class="project-assignee-options" id="workAssignmentAssigneeOptions" role="group" aria-labelledby="workAssignmentAssigneeLabel" hidden>
                <label class="project-assignee-option" for="workAssignmentAssignee-EBB12">
                  <input type="checkbox" id="workAssignmentAssignee-EBB12" value="EBB12">
                  <span class="project-assignee-check" aria-hidden="true"><i class="fa-solid fa-check"></i></span>
                  <span class="project-assignee-copy">
                    <strong class="project-assignee-name">Farhan binti rahmat</strong>
                    <span class="project-assignee-id">#EBB12</span>
                  </span>
                </label>
                <label class="project-assignee-option" for="workAssignmentAssignee-EBB27">
                  <input type="checkbox" id="workAssignmentAssignee-EBB27" value="EBB27">
                  <span class="project-assignee-check" aria-hidden="true"><i class="fa-solid fa-check"></i></span>
                  <span class="project-assignee-copy">
                    <strong class="project-assignee-name">Aina Rahman</strong>
                    <span class="project-assignee-id">#EBB27</span>
                  </span>
                </label>
                <label class="project-assignee-option" for="workAssignmentAssignee-EBB41">
                  <input type="checkbox" id="workAssignmentAssignee-EBB41" value="EBB41">
                  <span class="project-assignee-check" aria-hidden="true"><i class="fa-solid fa-check"></i></span>
                  <span class="project-assignee-copy">
                    <strong class="project-assignee-name">Daniel Lee</strong>
                    <span class="project-assignee-id">#EBB41</span>
                  </span>
                </label>
                <label class="project-assignee-option" for="workAssignmentAssignee-EBB36">
                  <input type="checkbox" id="workAssignmentAssignee-EBB36" value="EBB36">
                  <span class="project-assignee-check" aria-hidden="true"><i class="fa-solid fa-check"></i></span>
                  <span class="project-assignee-copy">
                    <strong class="project-assignee-name">Nur Izzati</strong>
                    <span class="project-assignee-id">#EBB36</span>
                  </span>
                </label>
              </div>
            </div>
            <div class="project-assignee-selection" id="workAssignmentAssigneeSelection" aria-live="polite"></div>
          </div>
          <div class="field-group">
            <span class="field-label">Upload Attachments</span>
            <div class="project-upload-actions">
              <button type="button" class="project-upload-button" data-pick-file="workAssignmentFiles"><span class="project-upload-icon"><i class="fa-solid fa-file-arrow-up" aria-hidden="true"></i></span><span>Select File(s)</span></button>
              <button type="button" class="project-upload-button" data-pick-file="workAssignmentCamera"><span class="project-upload-icon"><i class="fa-solid fa-camera" aria-hidden="true"></i></span><span>Take a Picture</span></button>
            </div>
            <input type="file" id="workAssignmentFiles" multiple hidden>
            <input type="file" id="workAssignmentCamera" accept="image/*" capture="environment" hidden>
            <div id="workAssignmentAttachments" class="attachment-upload-list" aria-live="polite"></div>
          </div>
        </section>
        <div class="project-form-actions">
          <button type="submit" class="btn-submit-primary" id="submitWorkAssignment"><span>Submit</span><i class="fa-solid fa-paper-plane" aria-hidden="true"></i></button>
        </div>
        <p class="project-form-feedback" id="workAssignmentFeedback" role="status" hidden></p>
      </form>
    </main>
    <phone-bottom-nav active="apps"></phone-bottom-nav>
    <left-profile-drawer></left-profile-drawer>
    <notification-sheet></notification-sheet>
    <favourite-sheet></favourite-sheet>
  </div>
</body>
</html>
