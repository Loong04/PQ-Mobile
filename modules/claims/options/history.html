<html lang="en" data-theme="dark">
<head>

  <script src="../../../js/app.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="../../../css/theme.css">
  <link rel="stylesheet" href="../../../css/app.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-page);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: var(--text-primary);
      padding: 20px 0;
    }

    .phone-container {
      width: 100%;
      max-width: 420px;
      height: 900px;
      background: var(--bg-phone);
      border-radius: 44px;
      overflow: hidden;
      box-shadow: var(--shadow-phone);
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 90px;
      position: relative;
      z-index: 10;
      scrollbar-width: none;
    }
    .main-content::-webkit-scrollbar { display: none; }

    .cal-top-header {
      background: linear-gradient(135deg, #4c1d95 0%, #6d28d9 50%, #7c3aed 100%);
      padding: 12px 16px 16px;
      border-bottom-left-radius: 24px;
      border-bottom-right-radius: 24px;
      box-shadow: 0 8px 24px rgba(76, 29, 149, 0.28);
      position: relative;
      z-index: 20;
    }



    /* Enterprise Filter Toast Bar (Matching Attendance History Screenshot 1) */
    .enterprise-toast-bar {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      padding: 12px 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
    }

    /* History Cards matching clocking-history.html design specification */
    .history-card-item {
      background: linear-gradient(135deg, rgba(16,185,129,0.08) 0%, rgba(52,211,153,0.03) 100%);
      border: 1px solid rgba(16,185,129,0.3);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 12px rgba(16,185,129,0.05);
      text-decoration: none;
      transition: transform 0.2s;
      cursor: pointer;
    }
    html[data-theme="dark"] .history-card-item,
    [data-theme="dark"] .history-card-item {
      background: linear-gradient(135deg, rgba(16,185,129,0.15) 0%, rgba(52,211,153,0.05) 100%);
      border-color: rgba(16,185,129,0.2);
    }
    .history-card-item:active {
      transform: scale(0.985);
    }

    .history-date-badge {
      width: 52px;
      height: 56px;
      border-radius: 14px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #059669;
      flex-shrink: 0;
    }
    html[data-theme="dark"] .history-date-badge,
    [data-theme="dark"] .history-date-badge {
      background: rgba(16, 185, 129, 0.2);
      border-color: rgba(16, 185, 129, 0.3);
      color: #34d399;
    }

    .history-date-month { font-size: 11px; font-weight: 800; text-transform: uppercase; line-height: 1; margin-bottom: 2px; }
    .history-date-day { font-size: 18px; font-weight: 900; line-height: 1; margin-bottom: 2px; }
    .history-date-year { font-size: 10px; font-weight: 700; line-height: 1; opacity: 0.9; }

    .status-pill {
      font-size: 10.5px;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 10px;
      white-space: nowrap;
    }
    .status-pill.submitted { background: rgba(59, 130, 246, 0.16); color: #3b82f6; border: 1px solid rgba(59, 130, 246, 0.3); }
    .status-pill.pending { background: rgba(245, 158, 11, 0.16); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.3); }
    .status-pill.approved { background: rgba(16, 185, 129, 0.16); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); }
    .status-pill.rejected { background: rgba(239, 68, 68, 0.16); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); }
    .status-pill.draft,
    .status-pill.cancelled { background: rgba(148, 163, 184, 0.16); color: #94a3b8; border: 1px solid rgba(148, 163, 184, 0.3); }

    /* Bottom Sheet Drawer Modal */
    .modal-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: none;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    .modal-overlay.active {
      display: flex;
      opacity: 1;
    }

    .modal-sheet {
      width: 100%;
      max-height: 85%;
      background: var(--bg-card);
      border-top-left-radius: 28px;
      border-top-right-radius: 28px;
      padding: 22px 18px 100px;
      overflow-y: auto;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: var(--shadow-sheet);
    }
    .modal-overlay.active .modal-sheet {
      transform: translateY(0);
    }

    .grid-tab-card {
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 14px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .grid-tab-card.active {
      background: rgba(124, 58, 237, 0.14);
      border-color: var(--purple-primary);
    }
  </style>
</head>

    function updateFilterDropdownOptions() {
      const select = document.getElementById('filterBenefitTypeSelect');
      const label = document.getElementById('filterBenefitTypeLabel');
      if (!select) return;

      const types = BENEFIT_TYPES_MAP[activeTabKey] || BENEFIT_TYPES_MAP.benefit;
      const catMeta = CATEGORIES.find(c => c.id === activeTabKey) || CATEGORIES[0];
      if (label) label.textContent = `${catMeta.name} Type:`;

      select.innerHTML = '';
      types.forEach(t => {
        const opt = document.createElement('option');
        opt.value = t.value;
        opt.textContent = t.text;
        if (t.value === activeBenefitType) opt.selected = true;
        select.appendChild(opt);
      });
    }

    function switchClaimTab(tabKey) {
      activeTabKey = tabKey;
      activeBenefitType = 'all';

      // Update horizontal scroll tab pills matching me.html
      document.querySelectorAll('.me-jump-pill').forEach(btn => {
        if (btn.getAttribute('data-tab') === tabKey) {
          btn.classList.add('active');
          btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        } else {
          btn.classList.remove('active');
        }
      });

      updateFilterDropdownOptions();
      updateFilterBannerDisplay();
      renderClaimHistoryList();
    }

    function renderClaimHistoryList() {
      const container = document.getElementById('claimHistoryListContainer');
      const headerTitle = document.getElementById('activeCategoryHeaderTitle');
      const countBadge = document.getElementById('categoryRecordsCountBadge');

      const catMeta = CATEGORIES.find(c => c.id === activeTabKey) || CATEGORIES[0];
      if (headerTitle) headerTitle.textContent = catMeta.title;

      let items = HISTORY_DATA[activeTabKey] || [];

      // 1. Filter by Benefit Type
      if (activeBenefitType !== 'all') {
        items = items.filter(i => i.title === activeBenefitType || i.title.toUpperCase().includes(activeBenefitType.toUpperCase()));
      }

      // 2. Filter by Start Date & End Date
      if (activeStartDate && activeEndDate) {
        items = items.filter(i => {
          if (!i.isoDate) return true;
          return i.isoDate >= activeStartDate && i.isoDate <= activeEndDate;
        });

      if (countBadge) countBadge.textContent = `${items.length} Records`;

    }

    function applyFilters() {
      const startEl = document.getElementById('filterStartDateInput');
      const endEl = document.getElementById('filterEndDateInput');
      const typeEl = document.getElementById('filterBenefitTypeSelect');

      if (startEl && startEl.value) activeStartDate = startEl.value;
      if (endEl && endEl.value) activeEndDate = endEl.value;
      if (typeEl) activeBenefitType = typeEl.value;

      updateFilterBannerDisplay();
      renderClaimHistoryList();
      closeDateFilterModal();
    }

    function updateFilterBannerDisplay() {
      const display = document.getElementById('currentFilterTextDisplay');
      if (!display) return;

      const formatDisplayDate = (iso) => {
        if (!iso) return '';
        const parts = iso.split('-');
        if (parts.length !== 3) return iso;
        return `${parts[2]}/${parts[1]}/${parts[0]}`;
      };

      const startStr = formatDisplayDate(activeStartDate);
      const endStr = formatDisplayDate(activeEndDate);

      const types = BENEFIT_TYPES_MAP[activeTabKey] || [];
      const selectedObj = types.find(t => t.value === activeBenefitType);
      const typeStr = selectedObj ? selectedObj.text : 'All Benefit Types';

      display.textContent = `${startStr} – ${endStr} • ${typeStr}`;
    }

    // Initialize Page
    document.addEventListener('DOMContentLoaded', () => {
      switchClaimTab('benefit');
    });
  </script>
</body>
</html>
