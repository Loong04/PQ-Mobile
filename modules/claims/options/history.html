<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PeopleHCM - Claim History</title>
  <script src="../../../js/components.js"></script>
  <script src="../../../js/app.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../css/theme.css">
  <link rel="stylesheet" href="../../../css/app.css">
  <link rel="stylesheet" href="../../../css/claim-forms.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-page);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: var(--text-primary);
      padding: 20px 0;
    }

    .phone-container {
      width: 100%;
      max-width: 420px;
      height: 900px;
      background: var(--bg-phone);
      border-radius: 44px;
      overflow: hidden;
      box-shadow: var(--shadow-phone);
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 90px;
      position: relative;
      z-index: 10;
      scrollbar-width: none;
    }
    .main-content::-webkit-scrollbar { display: none; }

    .cal-top-header {
      background: linear-gradient(135deg, #4c1d95 0%, #6d28d9 50%, #7c3aed 100%);
      padding: 12px 16px 16px;
      border-bottom-left-radius: 24px;
      border-bottom-right-radius: 24px;
      box-shadow: 0 8px 24px rgba(76, 29, 149, 0.28);
      position: relative;
      z-index: 20;
    }



    /* Enterprise Filter Toast Bar (Matching Attendance History Screenshot 1) */
    .enterprise-toast-bar {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      padding: 12px 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
    }

    .history-filter-period-grid {
      display: grid;
      grid-template-columns: 1fr 1.15fr;
      gap: 10px;
    }

    /* Claim History Cards matching the Leave History card system */
    .history-card-item {
      position: relative;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-left: 5px solid #64748b;
      border-radius: 20px;
      padding: 16px 18px;
      margin-bottom: 12px;
      display: block;
      box-shadow: var(--shadow-sm);
      text-decoration: none;
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
    }
    .history-card-item:hover { box-shadow: var(--shadow-card); }
    .history-card-item:active {
      transform: scale(0.985);
    }
    .history-card-item:focus-visible {
      outline: 3px solid rgba(124, 58, 237, 0.24);
      outline-offset: 2px;
    }
    .history-card-item[data-status="approved"] {
      border-left-color: #10b981;
      background: linear-gradient(135deg, var(--bg-card) 0%, rgba(16, 185, 129, 0.06) 100%);
    }
    .history-card-item[data-status="submitted"] {
      border-left-color: #f59e0b;
      background: linear-gradient(135deg, var(--bg-card) 0%, rgba(245, 158, 11, 0.06) 100%);
    }
    .history-card-item[data-status="draft"] {
      border-left-color: #7c3aed;
      background: linear-gradient(135deg, var(--bg-card) 0%, rgba(124, 58, 237, 0.06) 100%);
    }

    .history-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }
    .history-card-heading {
      min-width: 0;
      flex: 1;
    }
    .history-card-title-row {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      min-width: 0;
    }
    .history-card-type-icon {
      color: #38bdf8;
      font-size: 12px;
      line-height: 1.5;
      flex: 0 0 auto;
    }
    .history-card-title {
      min-width: 0;
      margin: 0;
      color: var(--text-primary);
      font-size: 14.5px;
      font-weight: 800;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }
    .history-card-ref {
      margin-top: 3px;
      color: var(--purple-text);
      font-size: 11px;
      font-weight: 700;
    }
    .history-card-details {
      margin-top: 10px;
      padding: 12px;
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      background: var(--bg-input);
    }
    .history-card-details > div {
      margin-top: 0 !important;
    }
    .history-card-item[data-status="approved"] .history-card-details {
      background: rgba(16, 185, 129, 0.05);
      border-color: rgba(16, 185, 129, 0.18);
    }
    .history-card-item[data-status="submitted"] .history-card-details {
      background: rgba(245, 158, 11, 0.05);
      border-color: rgba(245, 158, 11, 0.18);
    }
    .history-card-item[data-status="draft"] .history-card-details {
      background: rgba(124, 58, 237, 0.05);
      border-color: rgba(124, 58, 237, 0.18);
    }
    .history-card-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 12px;
    }
    .history-submit-btn {
      padding: 8px 16px;
      border: 0;
      border-radius: 20px;
      background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(124, 58, 237, 0.2);
      transition: transform 0.2s ease, filter 0.2s ease;
    }
    .history-submit-btn:hover { filter: brightness(1.08); }
    .history-submit-btn:active { transform: scale(0.96); }
    .history-submit-btn:focus-visible {
      outline: 2px solid var(--purple-text);
      outline-offset: 3px;
    }
    .history-cancel-btn {
      padding: 8px 16px;
      border: 1px solid #fda4af;
      border-radius: 20px;
      background: #fff1f2;
      color: #e11d48;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease;
    }
    .history-cancel-btn:hover { background: #ffe4e6; }
    .history-cancel-btn:active { transform: scale(0.96); }

    .history-date-badge {
      width: 52px;
      height: 56px;
      border-radius: 14px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #059669;
      flex-shrink: 0;
    }
    html[data-theme="dark"] .history-date-badge,
    [data-theme="dark"] .history-date-badge {
      background: rgba(16, 185, 129, 0.2);
      border-color: rgba(16, 185, 129, 0.3);
      color: #34d399;
    }

    .history-date-month { font-size: 11px; font-weight: 800; text-transform: uppercase; line-height: 1; margin-bottom: 2px; }
    .history-date-day { font-size: 18px; font-weight: 900; line-height: 1; margin-bottom: 2px; }
    .history-date-year { font-size: 10px; font-weight: 700; line-height: 1; opacity: 0.9; }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
      font-size: 11px;
      font-weight: 800;
      padding: 5px 10px;
      border-radius: 10px;
      white-space: nowrap;
    }
    .status-pill.submitted { background: rgba(245, 158, 11, 0.16); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.3); }
    .status-pill.approved { background: rgba(16, 185, 129, 0.16); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); }
    .status-pill.draft { background: rgba(124, 58, 237, 0.16); color: var(--purple-text); border: 1px solid rgba(124, 58, 237, 0.3); }

    /* Bottom Sheet Drawer Modal */
    .modal-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: none;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    .modal-overlay.active {
      display: flex;
      opacity: 1;
    }

    .modal-sheet {
      width: 100%;
      max-height: 85%;
      background: var(--bg-card);
      border-top-left-radius: 28px;
      border-top-right-radius: 28px;
      padding: 22px 18px 100px;
      overflow-y: auto;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: var(--shadow-sheet);
    }
    .modal-overlay.active .modal-sheet {
      transform: translateY(0);
    }

    .grid-tab-card {
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 14px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .grid-tab-card.active {
      background: rgba(124, 58, 237, 0.14);
      border-color: var(--purple-primary);
    }
  </style>
</head>
<body>

  <preview-top-bar active-page="claims"></preview-top-bar>

  <div class="phone-container">
    
    <!-- Top Header -->
    <div class="cal-top-header">
      <phone-status-bar time="9:41" style="color: #ffffff;"></phone-status-bar>
      
      <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 4px;">
        <a href="../index.html" class="me-back-btn" aria-label="Back" title="Back"
          style="background: rgba(255, 255, 255, 0.18); border: 1px solid rgba(255, 255, 255, 0.25); width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #ffffff; text-decoration: none;">

        <div style="width: 36px;"></div>
      </div>
    </div>

    <div class="main-content">
      
      <!-- Category Navigation Bar (Matching me.html tab jump bar) -->
      <div class="me-jump-bar-wrapper" style="position: relative; top: auto; z-index: 10; padding: 0 0 14px 0; background: transparent;">
        <div class="me-jump-bar-container">
          <div class="me-jump-bar" id="tabScrollContainer">
            <button type="button" class="me-jump-pill active" data-tab="benefit" onclick="switchClaimTab('benefit')">

            </button>
            <button type="button" class="me-jump-pill" data-tab="medical" onclick="switchClaimTab('medical')">

            <button type="button" class="me-jump-pill" data-tab="ot" onclick="switchClaimTab('ot')">

      </div>
    </div>

    <phone-bottom-nav active="apps"></phone-bottom-nav>
  </div>

    function getHistoryStatus(item) {
      const allowedStatuses = {
        approved: 'Approved',
        submitted: 'Submitted',
        draft: 'Draft'
      };
      const key = allowedStatuses[item.status] ? item.status : 'submitted';
      return { key, text: allowedStatuses[key] };
    }

    function updateFilterDropdownOptions() {
      const select = document.getElementById('filterBenefitTypeSelect');
      const label = document.getElementById('filterBenefitTypeLabel');
      const typeField = document.getElementById('filterTypeField');
      if (!select) return;

      const types = BENEFIT_TYPES_MAP[activeTabKey] || BENEFIT_TYPES_MAP.benefit;
      const catMeta = CATEGORIES.find(c => c.id === activeTabKey) || CATEGORIES[0];
      const typeLabels = {
        benefit: 'Benefit Type',
        medical: 'Benefit Type',
        travel: 'Benefit Type',
        travelRequest: 'Benefit Type',
        entertainment: 'Benefit Type',
        advance: 'Benefit Type',
        expense: 'Expense Type'
      };
      if (label) label.textContent = typeLabels[activeTabKey] || `${catMeta.name} Type`;
      if (typeField) typeField.style.display = activeTabKey === 'ot' ? 'none' : '';

      select.innerHTML = '';
      types.forEach(t => {
        const opt = document.createElement('option');
        opt.value = t.value;
        opt.textContent = t.text;
        if (t.value === activeBenefitType) opt.selected = true;
        select.appendChild(opt);
      });

      const setOptions = (element, options, selectedValue) => {
        if (!element) return;
        element.innerHTML = options.map(option => {
          const value = typeof option === 'string' ? option : option.value;
          const text = typeof option === 'string' ? option : option.text;
          return `<option value="${value}" ${value === selectedValue ? 'selected' : ''}>${text}</option>`;
        }).join('');
      };
      const startYear = activeStartPeriod.slice(0, 4);
      const startMonth = activeStartPeriod.slice(4, 6);
      const endYear = activeEndPeriod.slice(0, 4);
      const endMonth = activeEndPeriod.slice(4, 6);
      setOptions(document.getElementById('filterStartYearInput'), FILTER_YEARS, startYear);
      setOptions(document.getElementById('filterStartMonthInput'), FILTER_MONTHS, startMonth);
      setOptions(document.getElementById('filterEndYearInput'), FILTER_YEARS, endYear);
      setOptions(document.getElementById('filterEndMonthInput'), FILTER_MONTHS, endMonth);
    }

    function switchClaimTab(tabKey) {
      activeTabKey = tabKey;
      activeBenefitType = 'all';

      // Update horizontal scroll tab pills matching me.html
      document.querySelectorAll('.me-jump-pill').forEach(btn => {
        if (btn.getAttribute('data-tab') === tabKey) {
          btn.classList.add('active');
          btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        } else {
          btn.classList.remove('active');
        }
      });

      updateFilterDropdownOptions();
      updateFilterBannerDisplay();
      renderClaimHistoryList();
    }

    function renderClaimHistoryList() {
      const container = document.getElementById('claimHistoryListContainer');
      const headerTitle = document.getElementById('activeCategoryHeaderTitle');
      const countBadge = document.getElementById('categoryRecordsCountBadge');

      const catMeta = CATEGORIES.find(c => c.id === activeTabKey) || CATEGORIES[0];
      if (headerTitle) headerTitle.textContent = catMeta.title;

      let items = HISTORY_DATA[activeTabKey] || [];

      // 1. Filter by Benefit Type
      if (activeBenefitType !== 'all') {
        const selectedType = activeBenefitType.toUpperCase();
        items = items.filter(i => [i.title, i.subtype, i.benefitType]
          .filter(Boolean)
          .some(value => value.toUpperCase().includes(selectedType)));
      }

      // 2. Filter by selected claim periods, not individual receipt dates.
      if (activeStartPeriod && activeEndPeriod) {
        items = items.filter(i => {
          const recordPeriod = String(i.claimPeriod || (i.isoDate || '').slice(0, 7).replace('-', ''));
          if (!recordPeriod) return true;
          return recordPeriod >= activeStartPeriod && recordPeriod <= activeEndPeriod;
        });
      }

      if (countBadge) countBadge.textContent = `${items.length} Records`;

      container.innerHTML = '';
      if (items.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; padding: 36px 16px; background: var(--bg-card); border-radius: 20px; border: 1px dashed var(--border-subtle); margin-top: 10px;">
            <div style="font-size: 32px; margin-bottom: 8px;">📭</div>
            <div style="font-size: 14px; font-weight: 800; color: var(--text-primary);">No ${catMeta.name} Claim Records</div>
            <div style="font-size: 12px; color: var(--text-muted); margin-top: 4px;">There are no claim records found matching the selected filter criteria.</div>
          </div>
        `;
        return;
      }

      items.forEach(item => {
        const displayStatus = getHistoryStatus(item);
        const card = document.createElement('article');
        card.className = 'history-card-item';
        card.dataset.status = displayStatus.key;
        card.setAttribute('role', 'button');
        card.tabIndex = 0;
        card.onclick = () => openClaimDetailsModal(item);
        card.onkeydown = event => {
          if (event.target.closest('button')) return;
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            openClaimDetailsModal(item);
          }
        };

        const periodDisplay = item.claimPeriod
          ? (item.claimPeriod.length === 6 ? `${item.claimPeriod.substring(0,4)}-${item.claimPeriod.substring(4)}` : item.claimPeriod)
          : (item.paymentPeriod || item.benefitYear || '2026-09');

        let datesDisplay = item.date || '09 SEP 2026';
        if (item.dateFrom && item.dateTo) {
          datesDisplay = item.dateFrom === item.dateTo ? item.dateFrom : `${item.dateFrom} - ${item.dateTo}`;
        } else if (item.receiptDate) {
          datesDisplay = item.receiptDate;
        }

        let detailsBlock = '';
        const statusRow = '';

        if (activeTabKey === 'ot') {
          const timeDisplay = item.otTime || item.time || '18:00 - 00:00';
          const hoursDisplay = `${item.quantity || item.hours || '6.0'} Hours`;
          detailsBlock = `
            <div style="display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; margin-top: 6px;">
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="color: var(--text-muted); font-weight: 600;">Time :</span>
                <span style="color: var(--text-primary); font-weight: 700;">${timeDisplay}</span>
              </div>
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="color: var(--text-muted); font-weight: 600;">Hours :</span>
                <span style="font-size: 14px; font-weight: 900; color: var(--text-primary);">${hoursDisplay}</span>
              </div>
              ${statusRow}
            </div>
          `;
        } else if (activeTabKey === 'travelRequest') {
          const submitDateDisplay = item.submitDate || item.submittedDate || datesDisplay;

    function handleHistoryCancel(event, itemId) {
      event.stopPropagation();
      if (typeof showToast === 'function') {
        showToast(`Cancel selected for ${itemId}`);
      }
    }

    function handleHistorySubmit(event, itemId) {
      event.stopPropagation();
      if (typeof showToast === 'function') {
        showToast(`Submit selected for ${itemId}`);
      }
    }

    // Modal 1: Open 7-Category Quick Grid Sheet (Matching Screenshot 2)
    function openTabGridModal() {
      const modal = document.getElementById('gridModalOverlay');
      const container = document.getElementById('gridModalTabsContainer');
      if (!modal || !container) return;

      container.innerHTML = '';
      CATEGORIES.forEach(cat => {
        const itemsCount = (HISTORY_DATA[cat.id] || []).length;
        const isActive = cat.id === activeTabKey;

        const card = document.createElement('div');
        card.className = `grid-tab-card ${isActive ? 'active' : ''}`;
        card.onclick = () => {
          switchClaimTab(cat.id);
          closeTabGridModal();
        };

        card.innerHTML = `
          <div style="font-size: 22px; margin-bottom: 6px;">${cat.icon}</div>
          <div style="font-size: 12.5px; font-weight: 800; color: ${isActive ? 'var(--purple-primary)' : 'var(--text-primary)'};">${cat.name}</div>
          <span style="font-size: 10px; font-weight: 700; color: var(--text-muted); margin-top: 4px;">${itemsCount} Items</span>
        `;
        container.appendChild(card);
      });

      modal.style.display = 'flex';
      setTimeout(() => modal.classList.add('active'), 10);
    }

    function closeTabGridModal() {
      const modal = document.getElementById('gridModalOverlay');
      if (modal) {
        modal.classList.remove('active');
        setTimeout(() => modal.style.display = 'none', 300);
      }
    }

        `;
        const detailSection = (title, rows) => `
          <div style="margin: 14px 0 7px; font-size: 12px; font-weight: 800; color: var(--text-secondary);">${title}</div>
          <div style="border: 1px solid var(--border-subtle); border-left: 3px solid var(--purple-primary); border-radius: 10px; overflow: hidden; background: var(--bg-card);">
            ${detailTable(rows)}
          </div>
        `;
        const detail = item.claimDetails || {};
        const attachmentValue = item.attachments
          ? `<span style="display: inline-flex; align-items: center; gap: 6px; color: var(--text-primary);"><i class="fa-solid fa-paperclip" style="color: var(--purple-primary);"></i>${item.attachments}</span>`
          : 'No attachments';

        if (activeTabKey === 'expense') {
          bodyHtml = `
            ${detailTable([
              ['Reference #', item.id],
              ['Benefit Year', item.benefitYear],
              ['Claim Period', item.claimPeriod],
              ['Benefit Type', item.benefitType],
              ['Start Date', item.dateFrom || item.date],
              ['End Date', item.dateTo || item.date],
              ['Currency', item.currency],
              ['Total Amount', item.totalAmount || item.amount],
              ['Project', item.project],
              ['Cost Center', item.costCenter],
              ['Purpose', item.purpose],
              ['Status', detailStatus.text],
              ['Remark', item.remark]
            ])}
            ${detailSection('Claim Details', [
              ['Transaction Date', detail.transactionDate || item.dateFrom || item.date],
              ['Receipt No.', detail.receiptNo || item.receiptNo],
              ['Expense', detail.expense || item.expense || item.title],
              ['Amount', detail.amount || item.amount],
              ['Currency', detail.currency || item.currency],
              ['Forex Rate', detail.forexRate || item.forexRate || '1.00'],
              ['Claim Amount', detail.claimAmount || item.amount],
              ['Description', detail.description || item.description],
              ['Attachments', detail.attachments || attachmentValue],
              ['Upload Files', detail.uploadFiles || attachmentValue]
            ])}
          `;
        } else if (activeTabKey === 'advance') {
          bodyHtml = `
            ${detailTable([
              ['Reference #', item.id],
              ['Emp #', item.empNo ? `#${item.empNo}` : '—'],
              ['Name', item.empName],
              ['Status', detailStatus.text],
              ['Period', item.claimPeriod],
              ['Cost Center', item.costCenter],
              ['Start Date', item.dateFrom || item.date],
              ['End Date', item.dateTo || item.date],
              ['Claim Type', item.claimType],
              ['Benefit Type', item.benefitType],
              ['Project', item.project],
              ['Purpose', item.purpose],
              ['Amount', item.amount],
              ['Claim Currency', item.currency],
              ['Forex Rate', item.forexRate || '1.00'],
              ['Approved Amount', item.approvedAmount || item.amount],
              ['Remarks', item.remark]
            ])}
            ${detailSection('Expense', [
              ['Expense', detail.expense || item.expense],
              ['Project', detail.project || item.project],
              ['Description', detail.description || item.description],
              ['Currency', detail.currency || item.currency],
              ['Forex Rate', detail.forexRate || item.forexRate || '1.00'],
              ['Claim Amount', detail.claimAmount || item.amount],
              ['Local Amount', detail.localAmount || item.amount],
              ['Attachments', detail.attachments || attachmentValue],
              ['Upload Files', detail.uploadFiles || attachmentValue]
            ])}
          `;
        } else {
          bodyHtml = `
            ${detailTable([
              ['Reference #', item.id],
              ['Status', detailStatus.text],
              ['Emp #', item.empNo ? `#${item.empNo}` : '—'],
              ['Name', item.empName],
              ['Travel Mileage Claim #', item.travelMileageClaimNo],
              ['Claim Period', item.claimPeriod],
              ['Start Date', item.dateFrom || item.date],
              ['End Date', item.dateTo || item.date],
              ['Benefit Type', item.benefitType],
              ['Entitlement Year', item.benefitYear],
              ['Project', item.project],
              ['Cost Centre', item.costCenter],
              ['Entertained Person/Org', item.entertainedPerson],
              ['Place Entertained', item.placeEntertained],
              ['Purpose', item.purpose],
              ['Total Amount', item.totalAmount || item.amount],
              ['No. Internal Attendee', item.internalAttendees || '0'],
              ['No. External Attendee', item.externalAttendees || '0'],
              ['Avg Per Pax', item.averagePerPax || '0.00'],
              ['Board Approve', item.boardApprove || 'No'],
              ['Gift/Ent Declaration', item.giftDeclaration || 'No'],
              ['Trv/Hosp. Declaration', item.travelHospitalityDeclaration || 'No'],
              ['Remarks', item.remark],
              ['Declaration', item.declaration],
              ['Agree', item.agree || 'No'],
              ['Attachments', attachmentValue],
              ['Upload Files', item.uploadFiles || attachmentValue]
            ])}
            ${detailSection('Claim Details', [
              ['Date', detail.date || item.dateFrom || item.date],
              ['Expense', detail.expense || item.expense || 'ENTERTAINMENT'],
              ['Receipt No.', detail.receiptNo || item.receiptNo],
              ['Description', detail.description || item.description],
              ['Project', detail.project || item.project],
              ['Entertained Person/Org', detail.entertainedPerson || item.entertainedPerson],
              ['Place Entertained', detail.placeEntertained || item.placeEntertained],
              ['Local Amount', detail.localAmount || item.amount],
              ['Currency', detail.currency || item.currency],
              ['Forex Rate', detail.forexRate || item.forexRate || '1.00'],
              ['Amount', detail.amount || item.amount],
              ['Attachments', detail.attachments || attachmentValue],
              ['Upload Files', detail.uploadFiles || attachmentValue]
            ])}
            <div style="margin-top: 12px; color: var(--text-muted); font-size: 11.5px; font-weight: 700;">No Internal Attendees</div>
            <div style="margin-top: 8px; color: var(--text-muted); font-size: 11.5px; font-weight: 700;">No External Attendees</div>
          `;
        }
      } else {
        // Benefit Claim & General Claim Details Layout (Matching Screenshot 1)
        const renderCellVal = (val, isGrayBarIfEmpty = false) => {
          if (val === undefined || val === null || val === '') {
            if (isGrayBarIfEmpty) {
              return `<div style="height: 12px; background: var(--border-subtle); border-radius: 3px; width: 100%;"></div>`;
            }
            return '';
          }
          return val;
        };

        const renderRow = (label, val, isGrayBarIfEmpty = false) => {
          return `
            <tr>
              <td style="padding: 6px 10px; border: 1px solid var(--border-subtle); font-size: 11.5px; font-weight: 700; color: var(--text-muted); width: 40%; background: var(--bg-card); vertical-align: middle;">${label}</td>
              <td style="padding: 6px 10px; border: 1px solid var(--border-subtle); font-size: 11.5px; font-weight: 500; color: var(--text-primary); background: var(--bg-card); vertical-align: middle;">${renderCellVal(val, isGrayBarIfEmpty)}</td>
            </tr>
          `;
        };

        let attachmentDisplay = `<span style="color: var(--text-muted);">No Attachments</span>`;
        if (item.attachments) {
          attachmentDisplay = `
            <div style="display: flex; align-items: center; gap: 6px; color: var(--purple-primary); font-weight: 600; text-decoration: none;">
              <i class="fa-solid fa-file-image"></i>
              <span>${item.attachments}</span>
            </div>
          `;
        }

        bodyHtml = `
          <table style="width: 100%; border-collapse: collapse; font-family: sans-serif; font-size: 11.5px;">
            <tbody>
              ${renderRow('Reference #', item.id || 'CBF000000000220')}
              ${renderRow('Emp#', item.empNo ? `#${item.empNo}` : '#EBB12')}
              ${renderRow('Name', item.empName || 'Farhan binti rahmat')}
              ${renderRow('Status', detailStatus.text)}
              ${renderRow('Currency', item.currency || 'USD')}
              ${renderRow('Amount', item.amount || '12.00')}
              ${renderRow('Quantity', item.quantity || '5.00')}
              ${renderRow('Claim Period', item.claimPeriod || '202609')}
              ${renderRow('Start Date', item.dateFrom || item.date || '9 Sep 2026')}
              ${renderRow('End Date', item.dateTo || item.date || '9 Sep 2026')}
              ${renderRow('Benefit Year', item.benefitYear || '2026')}
              ${renderRow('Receipt No.', item.receiptNo || '5555555')}
              ${renderRow('Other Reference', item.otherRef, true)}
              ${renderRow('Purpose', item.purpose || 'Test')}
              ${renderRow('Remark', item.remark, true)}
              ${renderRow('Cancellation Remark', item.cancellationRemark, true)}
              ${renderRow('Attachments', attachmentDisplay)}
              ${renderRow('Upload Files', item.uploadFiles || attachmentDisplay)}
            </tbody>
          </table>
        `;
      }

      container.innerHTML = `
        <div style="background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%); padding: 14px 16px; display: flex; align-items: center; justify-content: space-between;">
          <h3 style="font-size: 16px; font-weight: 800; color: #ffffff; text-transform: uppercase; margin: 0; letter-spacing: 0.3px;">${headerTitle}</h3>
          <button type="button" onclick="closeDetailsModal()" style="background: transparent; border: none; color: #ffffff; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0;">
            <i class="fa-solid fa-circle-xmark"></i>
          </button>
        </div>
        <div style="padding: 12px 12px 24px; flex: 1 1 auto; min-height: 0; overflow-y: auto; background: var(--bg-card); color: var(--text-primary);">
          ${bodyHtml}
        </div>
      `;

      modal.classList.add('active');
    }

    function closeDetailsModal() {
      const modal = document.getElementById('detailsModalOverlay');
      if (modal) modal.classList.remove('active');
    }

    // Modal 3: Start Date, End Date & Benefit Type Filter Modal
    function openDateFilterModal() {
      updateFilterDropdownOptions();
      const modal = document.getElementById('filterModalOverlay');
      if (modal) modal.classList.add('active');
    }

    function closeDateFilterModal() {
      const modal = document.getElementById('filterModalOverlay');
      if (modal) modal.classList.remove('active');
    }

    function resetHistoryFilter() {
      activeStartPeriod = '202601';
      activeEndPeriod = '202612';
      activeBenefitType = 'all';
      updateFilterDropdownOptions();
    }

    function applyFilters() {
      const startYearEl = document.getElementById('filterStartYearInput');
      const startMonthEl = document.getElementById('filterStartMonthInput');
      const endYearEl = document.getElementById('filterEndYearInput');
      const endMonthEl = document.getElementById('filterEndMonthInput');
      const typeEl = document.getElementById('filterBenefitTypeSelect');

      if (startYearEl && startMonthEl) activeStartPeriod = `${startYearEl.value}${startMonthEl.value}`;
      if (endYearEl && endMonthEl) activeEndPeriod = `${endYearEl.value}${endMonthEl.value}`;
      if (typeEl && activeTabKey !== 'ot') activeBenefitType = typeEl.value;

      updateFilterBannerDisplay();
      renderClaimHistoryList();
      closeDateFilterModal();
    }

    function updateFilterBannerDisplay() {
      const display = document.getElementById('currentFilterTextDisplay');
      if (!display) return;

      const formatDisplayPeriod = (period) => {
        const year = period.slice(0, 4);
        const month = FILTER_MONTHS.find(item => item.value === period.slice(4, 6));
        return month ? `${month.text} ${year}` : period;
      };
      const filterTypes = BENEFIT_TYPES_MAP[activeTabKey] || [];
      const selectedFilterType = filterTypes.find(t => t.value === activeBenefitType);
      const summaryTypeStr = activeTabKey === 'ot' ? '' : (selectedFilterType ? selectedFilterType.text : 'All Types');
      display.textContent = [`${formatDisplayPeriod(activeStartPeriod)} - ${formatDisplayPeriod(activeEndPeriod)}`, summaryTypeStr]
        .filter(Boolean)
        .join(' | ');
      return;

      const formatDisplayDate = (iso) => {
        if (!iso) return '';
        const parts = iso.split('-');
        if (parts.length !== 3) return iso;
        return `${parts[2]}/${parts[1]}/${parts[0]}`;
      };

      const startStr = formatDisplayDate(activeStartDate);
      const endStr = formatDisplayDate(activeEndDate);

      const types = BENEFIT_TYPES_MAP[activeTabKey] || [];
      const selectedObj = types.find(t => t.value === activeBenefitType);
      const typeStr = selectedObj ? selectedObj.text : 'All Benefit Types';

      display.textContent = `${startStr} – ${endStr} • ${typeStr}`;
    }

    // Initialize Page
    document.addEventListener('DOMContentLoaded', () => {
      switchClaimTab('benefit');
    });
  </script>
</body>
</html>
