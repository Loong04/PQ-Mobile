<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Claims - Advance Request</title>
  <script src="../../../js/components.js"></script>
  <script src="../../../js/app.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../css/theme.css">
  <link rel="stylesheet" href="../../../css/app.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-page);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: var(--text-primary);
      padding: 20px 0;
    }

    .phone-container {
      width: 100%;
      max-width: 420px;
      height: 900px;
      background: var(--bg-phone);
      border-radius: 44px;
      overflow: hidden;
      box-shadow: var(--shadow-phone);
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 100px;
      position: relative;
      z-index: 10;
      scrollbar-width: none;
    }
    .main-content::-webkit-scrollbar { display: none; }

    .cal-top-header {
      background: linear-gradient(135deg, #4c1d95 0%, #6d28d9 50%, #7c3aed 100%);
      padding: 12px 16px 16px;
      border-bottom-left-radius: 24px;
      border-bottom-right-radius: 24px;
      box-shadow: 0 8px 24px rgba(76, 29, 149, 0.28);
      position: relative;
      z-index: 20;
    }

    /* STEPPER HEADER (① General —— ② Expense) */
    .stepper-container {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      position: relative;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 14px 40px; /* adjusted padding for 2 items */
      margin-bottom: 18px;
      box-shadow: var(--shadow-sm);
    }

    .stepper-line-bg {
      position: absolute;
      top: 27px;
      left: 70px;
      right: 70px;
      height: 2px;
      background: var(--border-subtle);
      z-index: 1;
    }

    .stepper-line-active {
      position: absolute;
      top: 27px;
      left: 70px;
      width: 0%;
      max-width: calc(100% - 140px);
      height: 2px;
      background: var(--purple-primary);
      z-index: 2;
      transition: width 0.3s ease;
    }

    .step-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      position: relative;
      z-index: 5;
      cursor: pointer;
      min-width: 44px;
    }

    .step-circle {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #1e1b4b;
      border: 1.5px solid var(--border-subtle);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 6;
      transition: all 0.25s ease;
    }

    .step-item.active .step-circle {
      background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
      border-color: #7c3aed;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(124, 58, 237, 0.45);
    }

    .step-item.completed .step-circle {
      background: #064e3b;
      border-color: #10b981;
      color: #10b981;
    }

    .step-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      transition: color 0.25s ease;
      text-align: center;
    }

    .step-item.active .step-title {
      color: var(--text-primary);
      font-weight: 800;
    }

    .form-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 22px;
      padding: 20px 18px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-card);
      position: relative;
    }

    .section-header-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-top: 14px;
      margin-top: 14px;
      margin-bottom: 18px;
      border-top: 1px dashed var(--border-subtle);
    }
    .section-header-bar.no-top-border {
      border-top: none;
      padding-top: 0;
      margin-top: 0;
    }
    .section-title-accent {
      width: 3.5px;
      height: 15px;
      background: #a855f7;
      border-radius: 2px;
      display: inline-block;
      flex-shrink: 0;
    }
    .section-title-text {
      font-size: 13px;
      font-weight: 800;
      color: var(--text-primary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .field-group {
      margin-bottom: 16px;
    }

    .field-label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .field-label .req {
      color: #ef4444;
      margin-left: 2px;
    }

    .form-ctrl {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-primary);
      outline: none;
      transition: all 0.2s ease;
      appearance: none;
      font-family: inherit;
    }
    .form-ctrl:focus {
      border-color: var(--purple-primary);
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15);
    }
    .form-ctrl[readonly] {
      opacity: 0.9;
      background: rgba(255, 255, 255, 0.03);
    }

    .select-wrapper {
      position: relative;
    }
    .select-wrapper::after {
      content: "\f0d7";
      font-family: "Font Awesome 6 Free";
      font-weight: 900;
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
      font-size: 12px;
    }

    .btn-step-back {
      padding: 10px 20px;
      border-radius: 20px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: var(--shadow-sm);
    }

    .btn-step-next {
      padding: 10px 24px;
      border-radius: 20px;
      background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
      border: none;
      color: #ffffff;
      font-size: 13.5px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 4px 16px rgba(124, 58, 237, 0.45);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-draft-bright {
      padding: 10px 22px;
      border-radius: 20px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: var(--shadow-sm);
    }

    .btn-submit-primary {
      padding: 10px 24px;
      border-radius: 20px;
      background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
      border: none;
      color: #ffffff;
      font-size: 13.5px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 4px 16px rgba(124, 58, 237, 0.45);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-add-purple {
      padding: 10px 24px;
      border-radius: 20px;
      background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
      border: none;
      color: #ffffff;
      font-size: 13.5px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 4px 14px rgba(124, 58, 237, 0.35);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .file-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(124, 58, 237, 0.12);
      border: 1px solid rgba(124, 58, 237, 0.25);
      color: var(--purple-primary);
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 700;
      margin-top: 6px;
    }

    .added-item-card {
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 12px;
      margin-top: 10px;
    }

    .toast-box {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #0f172a;
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 12.5px;
      font-weight: 700;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      white-space: nowrap;
    }
    .toast-box.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <preview-top-bar active-page="claims"></preview-top-bar>

  <div class="phone-container">
    
    <!-- Top Header -->
    <div class="cal-top-header">
      <phone-status-bar time="9:41" style="color: #ffffff;"></phone-status-bar>

      <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 4px;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <a href="../index.html" class="me-back-btn" aria-label="Back" title="Back"
            style="background: rgba(255, 255, 255, 0.18); border: 1px solid rgba(255, 255, 255, 0.25); width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #ffffff; text-decoration: none;">
            <i class="fa-solid fa-chevron-left" style="font-size: 16px;"></i>
          </a>
          <h1 style="font-size: 18px; font-weight: 800; color: #ffffff; margin: 0;">Advance Request</h1>
        </div>
        <!-- Removed three-dots button per user request -->
      </div>
    </div>

    <!-- Main Content Container -->
    <div class="main-content">
      
      <!-- STEPPER HEADER -->
      <div class="stepper-container">
        <div class="stepper-line-bg"></div>
        <div id="stepperLineActive" class="stepper-line-active" style="width: 0%;"></div>

        <!-- Step 1 -->
        <div id="stepHeader-1" class="step-item active" onclick="switchTab('general')">
          <div class="step-circle">1</div>
          <span class="step-title">General</span>
        </div>

        <!-- Step 2 -->
        <div id="stepHeader-2" class="step-item" onclick="switchTab('expense')">
          <div class="step-circle">2</div>
          <span class="step-title">Expense</span>
        </div>
      </div>

      <!-- ================= STEP 1: GENERAL ================= -->
      <div id="tabContent-general" style="display: block;">
        <div class="form-card">

          <!-- Claim Period : -->
          <div class="field-group">
            <label class="field-label">Claim Period :</label>
            <div style="display: grid; grid-template-columns: 1fr 1.2fr; gap: 10px;">
              <div class="select-wrapper">
                <select id="claimPeriodYear" class="form-ctrl">
                  <option value="2026" selected>2026</option>
                  <option value="2025">2025</option>
                </select>
              </div>
              <div class="select-wrapper">
                <select id="claimPeriodMonth" class="form-ctrl">
                  <option value="September" selected>September</option>
                  <option value="August">August</option>
                  <option value="July">July</option>
                </select>
              </div>
            </div>
          </div>

          <!-- Claim Date : -->
          <div class="field-group">
            <label class="field-label">Claim Date : <span class="req">*</span></label>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
              <input type="text" id="claimStartDate" class="form-ctrl" value="23/09/2026" />
              <input type="text" id="claimEndDate" class="form-ctrl" value="23/09/2026" />
            </div>
          </div>

          <!-- Cost Centre : -->
          <div class="field-group">
            <label class="field-label">Cost Centre : <span class="req">*</span></label>
            <div class="select-wrapper">
              <select id="costCentreSelect" class="form-ctrl">
                <option value="">- Select Cost Center -</option>
                <option value="MANAGEMENT" selected>MANAGEMENT</option>
                <option value="OPERATIONS">OPERATIONS</option>
              </select>
            </div>
          </div>

          <!-- Project : -->
          <div class="field-group">
            <label class="field-label">Project :</label>
            <div class="select-wrapper">
              <select id="projectSelect" class="form-ctrl">
                <option value="">- Select Project -</option>
                <option value="PROJ-01">Project Alpha</option>
                <option value="PROJ-02">Enterprise Migration</option>
              </select>
            </div>
          </div>

          <!-- Claim Type : -->
          <div class="field-group">
            <label class="field-label">Claim Type : <span class="req">*</span></label>
            <div class="select-wrapper">
              <select id="claimTypeSelect" class="form-ctrl">
                <option value="">- Select Claim Types -</option>
                <option value="OVERSEAS TRAVEL ADVANCE">OVERSEAS TRAVEL ADVANCE</option>
                <option value="PROJECT OOP ADVANCE">PROJECT OOP ADVANCE</option>
              </select>
            </div>
          </div>

          <!-- Benefit Type : -->
          <div class="field-group">
            <label class="field-label">Benefit Type : <span class="req">*</span></label>
            <div class="select-wrapper">
              <select id="benefitTypeSelect" class="form-ctrl">
                <option value="">- Select Benefit Type -</option>
                <option value="ADVANCE">ADVANCE</option>
              </select>
            </div>
          </div>

          <!-- Purpose : -->
          <div class="field-group">
            <label class="field-label">Purpose :</label>
            <input type="text" id="purposeInput" class="form-ctrl" placeholder="Enter purpose..." />
          </div>

          <!-- Claim Currency & Claim Total -->
          <div class="field-group">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
              <div>
                <label class="field-label">Claim Currency :</label>
                <div class="select-wrapper">
                  <select class="form-ctrl">
                    <option value="MYR" selected>RINGGIT MALAYSIA</option>
                    <option value="USD">US DOLLAR</option>
                  </select>
                </div>
              </div>
              <div>
                <label class="field-label">Claim Total :</label>
                <input type="number" id="claimTotalInput" class="form-ctrl" value="0.00" readonly style="color: var(--purple-primary); font-weight: 800;" />
              </div>
            </div>
          </div>

          <!-- Remarks : -->
          <div class="field-group">
            <label class="field-label">Remarks :</label>
            <input type="text" id="remarksInput" class="form-ctrl" placeholder="Enter remarks..." />
          </div>

        </div>

        <!-- Action Footer -->
        <div style="display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-top: 18px;">
          <button type="button" class="btn-draft-bright" onclick="saveDraft()">
            <i class="fa-solid fa-floppy-disk"></i>
            <span>Save Draft</span>
          </button>
          <button type="button" class="btn-step-next" onclick="switchTab('expense')">
            <span>Next: Expense</span>
            <i class="fa-solid fa-arrow-right"></i>
          </button>
        </div>
      </div>

      <!-- ================= STEP 2: EXPENSE ================= -->
      <div id="tabContent-expense" style="display: none;">
        <div class="form-card">
          
          <!-- Section Header Bar -->
          <div class="section-header-bar no-top-border">
            <span class="section-title-accent"></span>
            <span class="section-title-text">Expense Details</span>
          </div>

          <div class="field-group">
            <label class="field-label">Expense : <span class="req">*</span></label>
            <div class="select-wrapper">
              <select id="expenseTypeSelect" class="form-ctrl">
                <option value="">- Select Expense -</option>
                <option value="TRAVEL">TRAVEL EXPENSE</option>
                <option value="MEAL">MEAL ALLOWANCE</option>
                <option value="ACCOMMODATION">ACCOMMODATION</option>
              </select>
            </div>
          </div>

          <div class="field-group">
            <label class="field-label">Description :</label>
            <input type="text" id="expenseDescription" class="form-ctrl" placeholder="Enter expense description..." />
          </div>

          <div class="field-group">
            <label class="field-label">Project : <span class="req">*</span></label>
            <div class="select-wrapper">
              <select id="expenseProjectSelect" class="form-ctrl">
                <option value="">- Select Project -</option>
                <option value="PROJ-01">Project Alpha</option>
                <option value="PROJ-02">Enterprise Migration</option>
              </select>
            </div>
          </div>

          <div class="field-group">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
              <div>
                <label class="field-label">Amount :</label>
                <input type="number" id="expenseAmount" class="form-ctrl" placeholder="0" step="0.01" oninput="calcLocalAmount()" />
              </div>
              <div>
                <label class="field-label">Claim Currency : <span class="req">*</span></label>
                <div class="select-wrapper">
                  <select id="expenseCurrency" class="form-ctrl">
                    <option value="IDR" selected>INDONESIAN RUPIAH</option>
                    <option value="MYR">RINGGIT MALAYSIA</option>
                    <option value="USD">US DOLLAR</option>
                  </select>
                </div>
              </div>
            </div>
          </div>

          <div class="field-group">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
              <div>
                <label class="field-label">Forex Rate :</label>
                <input type="number" id="expenseForex" class="form-ctrl" value="1.0000" step="0.0001" oninput="calcLocalAmount()" />
              </div>
              <div>
                <label class="field-label">Local Amount :</label>
                <input type="number" id="expenseLocalAmount" class="form-ctrl" value="0.00" readonly style="color: var(--purple-primary); font-weight: 800;" />
              </div>
            </div>
          </div>

          <!-- Upload Attachments (Circular Buttons) -->
          <div style="margin-top: 14px;">
            <label class="field-label" style="font-size: 13px; font-weight: 700; color: var(--text-primary); margin-bottom: 10px; display: block;">Upload Attachments</label>
            
            <div style="display: flex; align-items: center; justify-content: center; gap: 36px; padding: 12px 0 6px;">
              <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer;" onclick="triggerFileUpload()">
                <div style="width: 58px; height: 58px; border-radius: 50%; background: rgba(124, 58, 237, 0.12); border: 1px solid rgba(124, 58, 237, 0.3); display: flex; align-items: center; justify-content: center; color: var(--purple-primary); font-size: 20px;">
                  <i class="fa-solid fa-file-arrow-up"></i>
                </div>
                <span style="font-size: 13px; font-weight: 700; color: var(--purple-primary);">Select File(s)</span>
              </div>

              <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer;" onclick="triggerFileUpload()">
                <div style="width: 58px; height: 58px; border-radius: 50%; background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%); display: flex; align-items: center; justify-content: center; color: #ffffff; font-size: 20px; box-shadow: 0 6px 18px rgba(124, 58, 237, 0.45);">
                  <i class="fa-solid fa-camera"></i>
                </div>
                <span style="font-size: 13px; font-weight: 800; color: var(--text-primary);">Take a Picture</span>
              </div>
            </div>

            <div id="fileChipsList" style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; justify-content: center;"></div>
          </div>

          <div style="margin-top: 14px; margin-bottom: 16px;">
            <button type="button" class="btn-add-purple" onclick="addExpenseItem()">
              <span>Add</span>
            </button>
          </div>
        </div>

        <!-- Added Details Container -->
        <div id="addedDetailsListContainer"></div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 18px;">
          <button type="button" class="btn-step-back" onclick="switchTab('general')">
            <i class="fa-solid fa-arrow-left"></i> <span>Back</span>
          </button>
          <div style="display: flex; gap: 10px;">
            <button type="button" class="btn-draft-bright" onclick="saveDraft()">
              <i class="fa-solid fa-floppy-disk"></i>
              <span>Save Draft</span>
            </button>
            <button type="button" class="btn-submit-primary" onclick="submitClaim()">
              <span>Submit</span>
              <i class="fa-solid fa-paper-plane"></i>
            </button>
          </div>
        </div>
      </div>

    </div>

    <!-- Hidden Native File Input -->
    <input type="file" id="hiddenFileInput" style="display: none;" onchange="handleFileSelected(this)" />

    <!-- Toast Notification -->
    <div id="toastNotification" class="toast-box">
      <span id="toastText">Action completed successfully</span>
    </div>

    <phone-bottom-nav active="apps"></phone-bottom-nav>
  </div>

  <script>
    let addedDetails = [];

    function showToast(msg) {
      const toast = document.getElementById('toastNotification');
      const text = document.getElementById('toastText');
      if (toast && text) {
        text.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2800);
      }
    }

    function switchTab(tabName) {
      const tabs = ['general', 'expense'];
      const lineActive = document.getElementById('stepperLineActive');
      
      if (lineActive) {
        if (tabName === 'general') lineActive.style.width = '0%';
        else if (tabName === 'expense') lineActive.style.width = '100%';
      }

      tabs.forEach((t, idx) => {
        const stepNum = idx + 1;
        const item = document.getElementById(`stepHeader-${stepNum}`);
        const content = document.getElementById(`tabContent-${t}`);
        
        if (!item || !content) return;

        if (t === tabName) {
          item.className = 'step-item active';
          content.style.display = 'block';
        } else if (tabs.indexOf(t) < tabs.indexOf(tabName)) {
          item.className = 'step-item completed';
          content.style.display = 'none';
        } else {
          item.className = 'step-item';
          content.style.display = 'none';
        }
      });
      window.scrollTo(0, 0);
    }

    function calcLocalAmount() {
      const amt = parseFloat(document.getElementById('expenseAmount')?.value || 0);
      const rate = parseFloat(document.getElementById('expenseForex')?.value || 1);
      const local = (amt * rate).toFixed(2);
      const locEl = document.getElementById('expenseLocalAmount');
      if (locEl) locEl.value = local;
    }

    function triggerFileUpload() {
      const input = document.getElementById('hiddenFileInput');
      if (input) input.click();
    }

    function handleFileSelected(input) {
      if (!input.files || !input.files[0]) return;
      const file = input.files[0];
      const container = document.getElementById('fileChipsList');
      if (container) {
        const chip = document.createElement('div');
        chip.className = 'file-chip';
        chip.innerHTML = `<i class="fa-solid fa-paperclip"></i> ${file.name} <i class="fa-solid fa-xmark" style="cursor:pointer; margin-left:4px;" onclick="this.parentElement.remove()"></i>`;
        container.appendChild(chip);
      }
      input.value = ''; // Reset input to allow selecting the same file again
    }

    function addExpenseItem() {
      const type = document.getElementById('expenseTypeSelect')?.value;
      const amt = parseFloat(document.getElementById('expenseLocalAmount')?.value || 0);
      const desc = document.getElementById('expenseDescription')?.value || type || 'Advance Expense';

      if (!type || amt <= 0) {
        showToast('⚠️ Please select expense type and enter valid amount.');
        return;
      }

      addedDetails.push({ type, amt, desc });
      renderAddedDetails();
      recalcGrandTotal();
      showToast(`✅ Added line item: RM ${amt.toFixed(2)}`);

      // Reset
      document.getElementById('expenseDescription').value = '';
      document.getElementById('expenseAmount').value = '';
      document.getElementById('expenseLocalAmount').value = '0.00';
    }

    function renderAddedDetails() {
      const container = document.getElementById('addedDetailsListContainer');
      if (!container) return;
      container.innerHTML = '';

      addedDetails.forEach((d, idx) => {
        const card = document.createElement('div');
        card.className = 'added-item-card';
        card.innerHTML = `
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <div>
              <div style="font-size: 13.5px; font-weight: 800; color: var(--text-primary);">${d.type}</div>
              <div style="font-size: 11px; font-weight: 600; color: var(--text-muted); margin-top: 2px;">${d.desc}</div>
            </div>
            <div style="display: flex; align-items: center; gap: 10px;">
              <div style="font-size: 14px; font-weight: 800; color: var(--purple-primary);">RM ${d.amt.toFixed(2)}</div>
              <button onclick="removeExpenseItem(${idx})" style="background: none; border: none; color: #ef4444; font-size: 14px; cursor: pointer;"><i class="fa-solid fa-trash-can"></i></button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function removeExpenseItem(idx) {
      addedDetails.splice(idx, 1);
      renderAddedDetails();
      recalcGrandTotal();
    }

    function recalcGrandTotal() {
      const total = addedDetails.reduce((sum, item) => sum + item.amt, 0);
      const totEl = document.getElementById('claimTotalInput');
      if (totEl) totEl.value = total.toFixed(2);
    }

    function saveDraft() {
      showToast('💾 Advance Request draft saved successfully!');
    }

    function submitClaim() {
      showToast(`✅ Advance Request submitted successfully!`);
      setTimeout(() => {
        window.location.href = '../index.html';
      }, 1200);
    }
  </script>
</body>
</html>
