<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PeopleHCM - Claim Summary</title>
  <script src="../../../js/components.js"></script>
  <script src="../../../js/app.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../css/theme.css">
  <link rel="stylesheet" href="../../../css/app.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-page);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: var(--text-primary);
      padding: 20px 0;
    }

    .phone-container {
      width: 100%;
      max-width: 420px;
      height: 900px;
      background: var(--bg-phone);
      border-radius: 44px;
      overflow: hidden;
      box-shadow: var(--shadow-phone);
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 90px;
      position: relative;
      z-index: 10;
      scrollbar-width: none;
    }
    .main-content::-webkit-scrollbar { display: none; }

    .cal-top-header {
      background: linear-gradient(135deg, #4c1d95 0%, #6d28d9 50%, #7c3aed 100%);
      padding: 12px 16px 16px;
      border-bottom-left-radius: 24px;
      border-bottom-right-radius: 24px;
      box-shadow: 0 8px 24px rgba(76, 29, 149, 0.28);
      position: relative;
      z-index: 20;
    }

    /* Standard Enterprise Filter Bar */
    .enterprise-toast-bar {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      padding: 12px 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
    }
    
    .filter-slider-btn {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      color: var(--purple-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* History Card Container Style */
    .history-card-item {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-sm);
      text-decoration: none;
      display: block;
      cursor: pointer;
    }

    .history-time-row {
      font-size: 15px;
      font-weight: 800;
      color: var(--text-primary);
    }

    .status-pill {
      font-size: 10.5px;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 10px;
      white-space: nowrap;
    }
    .status-pill.submitted { background: rgba(59, 130, 246, 0.16); color: #3b82f6; border: 1px solid rgba(59, 130, 246, 0.3); }
    .status-pill.pending { background: rgba(245, 158, 11, 0.16); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.3); }
    .status-pill.approved { background: rgba(16, 185, 129, 0.16); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); }
    .status-pill.rejected { background: rgba(239, 68, 68, 0.16); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); }

    /* Bottom Sheet Modal */
    .modal-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 100;
      display: none;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    .modal-overlay.active {
      display: flex;
      opacity: 1;
    }
    .modal-sheet {
      width: 100%;
      max-height: 85%;
      background: #0f172a; /* Solid dark background to prevent transparency bleed */
      border-top-left-radius: 28px;
      border-top-right-radius: 28px;
      padding: 22px 18px 30px;
      overflow-y: auto;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5);
    }
    .modal-overlay.active .modal-sheet {
      transform: translateY(0);
    }

    /* Remove unused checkbox CSS */

  </style>
</head>
<body>

  <preview-top-bar active-page="claims"></preview-top-bar>

  <div class="phone-container">
    
    <div class="cal-top-header">
      <phone-status-bar time="9:41" style="color: #ffffff;"></phone-status-bar>
      
      <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 4px;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <a href="../index.html" class="me-back-btn" aria-label="Back" title="Back"
            style="background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.2); width: 38px; height: 38px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #ffffff; text-decoration: none;">
            <i class="fa-solid fa-chevron-left" style="font-size: 16px;"></i>
          </a>
          <h1 style="font-size: 19px; font-weight: 800; color: #ffffff; margin: 0;">Claim Summary</h1>
        </div>
      </div>
    </div>

    <div class="main-content">
      
      <!-- Standard Enterprise Toast Bar -->
      <div class="enterprise-toast-bar" onclick="openFilterModal()">
        <div>
          <div style="font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px;">
            Filter
          </div>
          <div style="font-size: 14px; font-weight: 800; color: var(--text-primary); display: flex; align-items: center; gap: 8px;">
            <span style="color: var(--purple-primary);">ஃ</span>
            <span id="claimSummaryFilterText">Period: 202605 &bull; Include Pending</span>
          </div>
        </div>
        <button type="button" class="filter-slider-btn">
          <i class="fa-solid fa-sliders"></i>
        </button>
      </div>

      <!-- KPI Bar -->
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px;">
        <div style="background: var(--bg-input); border: 1px solid var(--border-subtle); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; justify-content: center;">
          <span style="font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px;">Total Claim Amount</span>
          <span id="totalAmountText" style="font-size: 20px; font-weight: 900; color: var(--text-primary);">RM 0.00</span>
        </div>
        <div style="background: var(--bg-input); border: 1px solid var(--border-subtle); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; justify-content: center;">
          <span style="font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px;">Total Records Found</span>
          <span id="totalRecordsCountText" style="font-size: 20px; font-weight: 900; color: var(--text-primary);">0</span>
        </div>
      </div>

      <!-- Summary Cards -->
      <div id="summaryCardsContainer"></div>

    </div>

    <!-- Filter Modal (Consistent Aesthetic) -->
    <div class="modal-overlay" id="filterModalOverlay" onclick="if(event.target===this) closeFilterModalForce()">
      <div class="modal-sheet" style="padding: 16px 20px 28px; max-height: 85vh; border: 1px solid var(--border-subtle); border-bottom: none; border-radius: 28px 28px 0 0; background: var(--bg-card); display: flex; flex-direction: column; box-sizing: border-box;">
        <div style="width: 38px; height: 4px; background: var(--border-subtle); border-radius: 4px; margin: 0 auto 16px; opacity: 0.7;"></div>
        
        <div style="display: flex; align-items: center; justify-content: space-between; padding-bottom: 12px; border-bottom: 1px solid var(--border-subtle); margin-bottom: 14px;">
          <h3 style="font-size: 18px; font-weight: 800; color: var(--text-primary); margin: 0;">Data Filter</h3>
          <button type="button" onclick="resetFilters()" style="background: transparent; border: 1px solid rgba(255,255,255,0.15); color: var(--text-primary); border-radius: 20px; font-size: 12px; font-weight: 800; padding: 5px 14px; display: flex; align-items: center; gap: 6px; cursor: pointer;">
            <i class="fa-solid fa-rotate-left" style="font-size: 11px;"></i> Reset
          </button>
        </div>

        <div style="display: flex; flex-direction: column; overflow-y: auto; flex: 1; padding-right: 2px; gap: 14px;">
          
          <div>
            <label style="display: block; font-size: 11px; font-weight: 800; color: var(--purple-primary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px;">PERIOD</label>
            <div style="position: relative;">
              <input type="month" id="periodInput" value="2026-05"
                style="width: 100%; padding: 12px 14px; border-radius: 12px; background: transparent; border: 1px solid var(--border-subtle); color: #ffffff; font-size: 14px; font-weight: 700; outline: none; -webkit-appearance: none; appearance: none; box-sizing: border-box;">
              <i class="fa-regular fa-calendar" style="position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 14px; pointer-events: none;"></i>
            </div>
          </div>

          <div>
            <label style="display: block; font-size: 11px; font-weight: 800; color: var(--purple-primary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px;">INCLUDE PENDING?</label>
            <div style="position: relative;">
              <select id="includePendingSelect" 
                style="width: 100%; padding: 12px 14px; border-radius: 12px; background: transparent; border: 1px solid var(--border-subtle); color: #ffffff; font-size: 14px; font-weight: 700; outline: none; -webkit-appearance: none; appearance: none; cursor: pointer; box-sizing: border-box;">
                <option value="yes" style="background: var(--bg-card); color: #fff;">Yes</option>
                <option value="no" style="background: var(--bg-card); color: #fff;">No</option>
              </select>
              <i class="fa-solid fa-chevron-down" style="position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--text-primary); font-size: 12px; pointer-events: none;"></i>
            </div>
          </div>

          <button type="button" onclick="applyFiltersAndClose()" style="width: 100%; margin-top: 6px; padding: 14px; border-radius: 16px; background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%); color: #ffffff; font-size: 14.5px; font-weight: 800; border: none; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; box-shadow: 0 4px 14px rgba(124, 58, 237, 0.4);">
            <i class="fa-solid fa-filter" style="font-size: 13px;"></i>
            <span>Apply Filter</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Category Details Modal -->
    <div class="modal-overlay" id="summaryDetailsModalOverlay" onclick="closeDetailsModal(event)">
      <div class="modal-sheet" onclick="event.stopPropagation()" style="padding-bottom: 100px; border-top-left-radius: 32px; border-top-right-radius: 32px; background: var(--bg-phone);">
        
        <div class="sheet-handle" style="width: 40px; height: 5px; background: rgba(255,255,255,0.2); border-radius: 3px; margin: 0 auto 20px;"></div>
        
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px;">
          <h2 id="modalCategoryTitle" style="font-size: 20px; font-weight: 900; color: #ffffff; margin: 0; text-transform: uppercase; letter-spacing: 0.5px;">Category Details</h2>
          <button type="button" onclick="closeDetailsModalForce()" style="width: 36px; height: 36px; border-radius: 12px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: #ffffff; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s;">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px;">
          <div style="background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 16px;">
            <div style="font-size: 11.5px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px;">Current Amount</div>
            <div id="modalCurrentAmt" style="font-size: 18px; font-weight: 900; color: #ffffff;">RM 0.00</div>
          </div>
          <div style="background: rgba(124, 58, 237, 0.15); border: 1px solid rgba(124, 58, 237, 0.3); border-radius: 20px; padding: 16px;">
            <div style="font-size: 11.5px; font-weight: 700; color: #a78bfa; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px;">YTD Total</div>
            <div id="modalYtdAmt" style="font-size: 18px; font-weight: 900; color: #ffffff;">RM 0.00</div>
          </div>
        </div>

        <div style="font-size: 14px; font-weight: 800; color: var(--text-muted); margin-bottom: 12px;">Itemized Records</div>
        <div id="modalRecordsListContainer" style="display: flex; flex-direction: column; gap: 12px;"></div>

      </div>
    </div>

    <phone-bottom-nav active="apps"></phone-bottom-nav>
  </div>

  <script>
    const SUMMARY_CATEGORIES = [
      {
        id: 'PHARMACY', title: 'PHARMACY', icon: '💊', period: '202605',
        currentAmount: 489.80, lastAmount: 450.00, averageAmount: 225.98, ytdAmount: 1129.90,
        records: [
          {
            dateRange: '01/05/2026 - 09/05/2026', period: '202605', expense: 'PHARMACY',
            empName: 'Farhan binti rahmat', empNo: 'EBB12', merchant: 'Guardian Pharmacy KLCC',
            amount: 69.90, status: 'approved', statusText: 'Approved'
          },
          {
            dateRange: '10/05/2026 - 20/05/2026', period: '202605', expense: 'PHARMACY',
            empName: 'Farhan binti rahmat', empNo: 'EBB12', merchant: 'Teo Seng Car Workshop',
            amount: 350.00, status: 'pending', statusText: 'Pending Approval'
          },
          {
            dateRange: '21/05/2026 - 25/05/2026', period: '202605', expense: 'PHARMACY',
            empName: 'Sarah Chen', empNo: 'EBB01', merchant: 'Watsons Mid Valley',
            amount: 70.00, status: 'rejected', statusText: 'Rejected'
          }
        ]
      },
      {
        id: 'MOBILE_PHONE', title: 'MOBILE PHONE', icon: '📱', period: '202605',
        currentAmount: 120.00, lastAmount: 120.00, averageAmount: 120.00, ytdAmount: 600.00,
        records: [
          {
            dateRange: '01/05/2026 - 01/05/2026', period: '202605', expense: 'MOBILE PHONE',
            empName: 'Farhan binti rahmat', empNo: 'EBB12', merchant: 'Maxis Mobile MY',
            amount: 120.00, status: 'approved', statusText: 'Approved'
          }
        ]
      },
      {
        id: 'CAR_MAINTENANCE', title: 'CAR MAINTENANCE', icon: '🚗', period: '202605',
        currentAmount: 350.00, lastAmount: 200.00, averageAmount: 170.00, ytdAmount: 850.00,
        records: [
          {
            dateRange: '10/05/2026 - 20/05/2026', period: '202605', expense: 'CAR MAINTENANCE',
            empName: 'Farhan binti rahmat', empNo: 'EBB12', merchant: 'Teo Seng Car Workshop',
            amount: 350.00, status: 'pending', statusText: 'Pending Approval'
          }
        ]
      },
      {
        id: 'CLIENT_ENTERTAINMENT', title: 'CLIENT ENTERTAINMENT', icon: '🍽️', period: '202605',
        currentAmount: 490.60, lastAmount: 650.00, averageAmount: 284.00, ytdAmount: 1420.00,
        records: [
          {
            dateRange: '12/05/2026 - 18/05/2026', period: '202605', expense: 'CLIENT ENTERTAINMENT',
            empName: 'Farhan binti rahmat', empNo: 'EBB12', merchant: 'Naughty Nuri’s Pavilion',
            amount: 270.60, status: 'approved', statusText: 'Approved'
          },
          {
            dateRange: '20/05/2026 - 25/05/2026', period: '202605', expense: 'CLIENT ENTERTAINMENT',
            empName: 'Farhan binti rahmat', empNo: 'EBB12', merchant: 'Chili’s KLCC',
            amount: 220.00, status: 'submitted', statusText: 'Submitted'
          }
        ]
      }
    ];

    let currentPeriod = '2026-05';

    function openFilterModal() {
      const modal = document.getElementById('filterModalOverlay');
      if (modal) {
        modal.style.display = 'flex';
        // Small delay to allow display to apply before fading in
        setTimeout(() => modal.classList.add('active'), 10);
      }
    }

    function closeFilterModalForce() {
      const modal = document.getElementById('filterModalOverlay');
      if (modal) {
        modal.classList.remove('active');
        setTimeout(() => modal.style.display = 'none', 300); // Wait for transition
      }
    }

    function resetFilters() {
      currentPeriod = '2026-05';
      document.getElementById('periodInput').value = currentPeriod;
      document.getElementById('includePendingSelect').value = 'yes';
      applyFilters();
      closeFilterModalForce();
    }

    function applyFiltersAndClose() {
      currentPeriod = document.getElementById('periodInput').value || '2026-05';
      applyFilters();
      closeFilterModalForce();
    }

    function applyFilters() {
      const includePending = document.getElementById('includePendingSelect').value === 'yes';
      
      let targetStatus = null;
      if (window.location.hash) {
        const hashParams = new URLSearchParams(window.location.hash.substring(1));
        targetStatus = hashParams.get('status');
      } else if (window.location.search) {
        const urlParams = new URLSearchParams(window.location.search);
        targetStatus = urlParams.get('status');
      }

      const container = document.getElementById('summaryCardsContainer');
      container.innerHTML = '';

      // Format currentPeriod (YYYY-MM to YYYYMM) for display compatibility
      let displayPeriod = currentPeriod.replace('-', '');
      let displayPeriodLabel = currentPeriod;
      
      // Convert "2026-05" into "May 2026" for the filter toast display
      if (currentPeriod.includes('-')) {
        const parts = currentPeriod.split('-');
        if (parts.length === 2) {
          const dateObj = new Date(parts[0], parseInt(parts[1]) - 1, 1);
          displayPeriodLabel = dateObj.toLocaleString('en-US', { month: 'short', year: 'numeric' });
        }
      }

      let totalCat = 0;
      let totalRec = 0;
      let totalAmt = 0;

      SUMMARY_CATEGORIES.forEach(cat => {
        const validRecords = cat.records.filter(r => {
          if (targetStatus && targetStatus !== 'all') {
            return r.status.toLowerCase() === targetStatus.toLowerCase();
          }
          return includePending || (r.status !== 'pending' && r.status !== 'submitted');
        });
        let catCurrentAmount = validRecords.reduce((sum, r) => sum + r.amount, 0);

        if (validRecords.length > 0) {
          totalCat++;
          totalRec += validRecords.length;
          totalAmt += catCurrentAmount;

          const card = document.createElement('div');
          card.className = 'history-card-item';
          card.onclick = () => openDetailsModal(cat.id, targetStatus);

          let variance = 0;
          if (cat.lastAmount > 0) {
            variance = ((catCurrentAmount - cat.lastAmount) / cat.lastAmount) * 100;
          }
          let varianceColor = 'var(--text-primary)';
          let varianceSign = '';
          if (variance > 0) {
            varianceColor = '#ef4444';
            varianceSign = '+';
          } else if (variance < 0) {
            varianceColor = '#10b981';
            varianceSign = '-';
          } else {
            varianceColor = 'var(--text-muted)';
            varianceSign = '';
          }
          let varianceDisplay = variance === 0 ? '-' : `${varianceSign}${Math.abs(variance).toFixed(1)}%`;

          card.innerHTML = `
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px;">
              <div class="history-time-row">${cat.icon} ${cat.title}</div>
              <i class="fa-solid fa-chevron-right" style="color: var(--text-muted); font-size: 13px;"></i>
            </div>
            <div style="display: flex; flex-direction: column; gap: 8px;">
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="font-size: 11.5px; font-weight: 700; color: var(--text-muted);">Current Amount</span>
                <span style="font-size: 14px; font-weight: 800; color: var(--text-primary);">RM ${catCurrentAmount.toFixed(2)}</span>
              </div>
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="font-size: 11.5px; font-weight: 700; color: var(--text-muted);">Last Amount</span>
                <span style="font-size: 13px; font-weight: 700; color: var(--text-primary);">RM ${cat.lastAmount.toFixed(2)}</span>
              </div>
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="font-size: 11.5px; font-weight: 700; color: var(--text-muted);">Variance</span>
                <span style="font-size: 13px; font-weight: 800; color: ${varianceColor};">${varianceDisplay}</span>
              </div>
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="font-size: 11.5px; font-weight: 700; color: var(--text-muted);">YTD Amount</span>
                <span style="font-size: 13px; font-weight: 700; color: var(--text-primary);">RM ${cat.ytdAmount.toFixed(2)}</span>
              </div>
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="font-size: 11.5px; font-weight: 700; color: var(--text-muted);">Average Amount</span>
                <span style="font-size: 13px; font-weight: 700; color: var(--text-primary);">RM ${cat.averageAmount.toFixed(2)}</span>
              </div>
            </div>
          `;
          container.appendChild(card);
        }
      });

      let statusFilterText = includePending ? 'Include Pending' : 'Approved Only';
      if (targetStatus && targetStatus !== 'all') {
        statusFilterText = `Status: ${targetStatus.charAt(0).toUpperCase() + targetStatus.slice(1)}`;
      }

      document.getElementById('claimSummaryFilterText').innerHTML = `Period: ${displayPeriodLabel} &bull; ${statusFilterText}`;
      if (document.getElementById('totalCategoriesCountText')) {
        document.getElementById('totalCategoriesCountText').textContent = totalCat;
      }
      document.getElementById('totalRecordsCountText').textContent = totalRec;
      document.getElementById('totalAmountText').textContent = `RM ${totalAmt.toFixed(2)}`;
    }

    function openDetailsModal(catId, targetStatus) {
      const cat = SUMMARY_CATEGORIES.find(c => c.id === catId);
      if (!cat) return;

      const includePending = document.getElementById('includePendingSelect').value === 'yes';
      const recordsToDisplay = cat.records.filter(r => {
        if (targetStatus && targetStatus !== 'all') {
          return r.status.toLowerCase() === targetStatus.toLowerCase();
        }
        return includePending || (r.status !== 'pending' && r.status !== 'submitted');
      });

      const modalAmt = recordsToDisplay.reduce((sum, r) => sum + r.amount, 0);

      document.getElementById('modalCategoryTitle').textContent = `${cat.icon} ${cat.title}`;
      document.getElementById('modalCurrentAmt').textContent = `RM ${modalAmt.toFixed(2)}`;
      document.getElementById('modalYtdAmt').textContent = `RM ${cat.ytdAmount.toFixed(2)}`;
      
      const recordsContainer = document.getElementById('modalRecordsListContainer');
      recordsContainer.innerHTML = '';
      
      recordsToDisplay.forEach(r => {
        const recItem = document.createElement('div');
        recItem.className = 'history-card-item';
        recItem.style.marginBottom = '0';
        recItem.style.cursor = 'default';
        
        recItem.innerHTML = `
          <div style="display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid var(--border-subtle); padding-bottom: 12px; margin-bottom: 12px;">
            <div>
              <div style="font-size: 15px; font-weight: 800; color: var(--text-primary);">${r.empName}</div>
              <div style="font-size: 11.5px; font-weight: 700; color: var(--text-muted); opacity: 0.8; font-family: monospace, sans-serif; margin-bottom: 4px;">#${r.empNo}</div>
              <div style="display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; color: var(--text-muted);">
                <i class="fa-solid fa-location-dot"></i> ${r.merchant}
              </div>
            </div>
            <div style="text-align: right;">
              <span class="status-pill ${r.status}" style="display: inline-block; margin-bottom: 8px;">${r.statusText}</span>
              <div style="font-size: 15px; font-weight: 900; color: var(--purple-primary);">RM ${r.amount.toFixed(2)}</div>
            </div>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
            <div style="display: flex; flex-direction: column;">
              <span style="font-size: 11px; font-weight: 700; color: var(--text-muted);">Period</span>
              <span style="font-size: 12.5px; font-weight: 800; color: var(--text-primary);">${r.period}</span>
            </div>
            <div style="display: flex; flex-direction: column;">
              <span style="font-size: 11px; font-weight: 700; color: var(--text-muted);">Date to Date</span>
              <span style="font-size: 12.5px; font-weight: 800; color: var(--text-primary);">${r.dateRange}</span>
            </div>
          </div>
        `;
        recordsContainer.appendChild(recItem);
      });

      document.getElementById('summaryDetailsModalOverlay').classList.add('active');
    }

    function closeDetailsModalForce() {
      document.getElementById('summaryDetailsModalOverlay').classList.remove('active');
    }

    document.addEventListener('DOMContentLoaded', applyFilters);
  </script>
</body>
</html>
