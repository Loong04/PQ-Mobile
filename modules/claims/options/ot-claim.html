<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Claims - OT Claim</title>
  <script src="../../../js/components.js"></script>
  <script src="../../../js/app.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../css/theme.css">
  <link rel="stylesheet" href="../../../css/app.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-page);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: var(--text-primary);
      padding: 20px 0;
    }

    .phone-container {
      width: 100%;
      max-width: 420px;
      height: 900px;
      background: var(--bg-phone);
      border-radius: 44px;
      overflow: hidden;
      box-shadow: var(--shadow-phone);
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 90px;
      position: relative;
      z-index: 10;
      scrollbar-width: none;
    }
    .main-content::-webkit-scrollbar { display: none; }

    .cal-top-header {
      background: linear-gradient(135deg, #4c1d95 0%, #6d28d9 50%, #7c3aed 100%);
      padding: 12px 16px 16px;
      border-bottom-left-radius: 24px;
      border-bottom-right-radius: 24px;
      box-shadow: 0 8px 24px rgba(76, 29, 149, 0.28);
      position: relative;
      z-index: 20;
    }

    .form-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 24px;
      padding: 20px;
      box-shadow: var(--shadow-card);
      margin-bottom: 16px;
    }

    .field-label {
      display: block;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .field-label span.req {
      color: #ef4444;
    }

    .form-input-ctrl {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.2s;
    }
    .form-input-ctrl:focus {
      border-color: var(--purple-primary);
    }

    .attach-btn-pill {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 14px;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.15s;
    }
    .attach-btn-pill:active {
      transform: scale(0.97);
    }


    /* Custom Checkbox Toggle for Cross Day */
    .cross-day-toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      padding: 10px 14px;
      border-radius: 14px;
    }

    .checkbox-circle {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid var(--purple-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .checkbox-circle.checked {
      background: var(--purple-primary);
    }
    .checkbox-circle.checked::after {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ffffff;
    }

    .item-chip-row {
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
  </style>
</head>
<body>

  <preview-top-bar active-page="claims"></preview-top-bar>

  <div class="phone-container">
    
    <!-- Top Header -->
    <div class="cal-top-header">
      <phone-status-bar time="23:59" style="color: #ffffff;"></phone-status-bar>

      <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 4px;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <a href="../index.html" class="me-back-btn" aria-label="Back" title="Back"
            style="background: rgba(255, 255, 255, 0.18); border: 1px solid rgba(255, 255, 255, 0.25); width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #ffffff; text-decoration: none;">
            <i class="fa-solid fa-chevron-left" style="font-size: 16px;"></i>
          </a>
          <h1 style="font-size: 18px; font-weight: 800; color: #ffffff; margin: 0;">OT Claim</h1>
        </div>
      </div>
    </div>

    <div class="main-content">
      
      <!-- FORM CARD CONTAINER (MATCHING BENEFIT & MEDICAL CLAIM) -->
      <div class="form-card">
        
        <!-- CLAIM PERIOD ROW -->
        <div style="margin-bottom: 18px;">
          <label class="field-label">Claim Period: <span class="req">*</span></label>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <select class="form-input-ctrl">
              <option value="2026" selected>2026</option>
              <option value="2025">2025</option>
            </select>
            <select class="form-input-ctrl">
              <option value="September" selected>September</option>
              <option value="August">August</option>
              <option value="July">July</option>
              <option value="June">June</option>
            </select>
          </div>
        </div>

        <!-- SUBTLE SECTION DIVIDER -->
        <div style="display: flex; align-items: center; gap: 8px; margin: 20px 0 16px; padding-top: 16px; border-top: 1px dashed var(--border-subtle);">
          <div style="width: 3px; height: 14px; background: var(--purple-primary); border-radius: 4px;"></div>
          <span style="font-size: 12.5px; font-weight: 800; color: var(--text-primary); text-transform: uppercase; letter-spacing: 0.5px;">OT Entry Details</span>
        </div>

        <div style="display: flex; flex-direction: column; gap: 16px;">
          
          <!-- 1. Date -->
          <div>
            <label class="field-label">Date: <span class="req">*</span></label>
            <input type="text" id="otDateInput" class="form-input-ctrl" value="22/09/2026" />
          </div>

          <!-- 2. OT Type -->
          <div>
            <label class="field-label">OT Type: <span class="req">*</span></label>
            <select id="otCodeSelect" class="form-input-ctrl">
              <option value="" selected>- Select OT Code -</option>
              <option value="OT 1.5x (Normal Working Day)">OT 1.5x (Normal Working Day)</option>
              <option value="OT 2.0x (Rest Day / Sunday)">OT 2.0x (Rest Day / Sunday)</option>
              <option value="OT 3.0x (Public Holiday)">OT 3.0x (Public Holiday)</option>
            </select>
          </div>

          <!-- 3. Start Time & End Time -->
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div>
              <label class="field-label">Start Time: <span class="req">*</span></label>
              <input type="text" id="startTimeInput" class="form-input-ctrl" value="23:53" oninput="calculateOTHours()" />
            </div>
            <div>
              <label class="field-label">End Time: <span class="req">*</span></label>
              <input type="text" id="endTimeInput" class="form-input-ctrl" value="23:53" oninput="calculateOTHours()" />
            </div>
          </div>

          <!-- 4. OT Hours & Cross Day? -->
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: end;">
            <div>
              <label class="field-label">OT Hours:</label>
              <input type="text" id="otHoursInput" class="form-input-ctrl" value="0" readonly style="opacity: 0.9;" />
            </div>
            <div>
              <label class="field-label">Cross Day?</label>
              <div class="cross-day-toggle" onclick="toggleCrossDay()">
                <div id="crossDayCircle" class="checkbox-circle"></div>
                <span style="font-size: 13px; font-weight: 700; color: var(--text-primary);">Cross Day</span>
              </div>
            </div>
          </div>

          <!-- 5. Break Hours & Break Minutes -->
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div>
              <label class="field-label">Break Hours: <span class="req">*</span></label>
              <select id="breakHoursSelect" class="form-input-ctrl" onchange="calculateOTHours()">
                <option value="" selected>- Select Hour -</option>
                <option value="0">0 Hour</option>
                <option value="1">1 Hour</option>
                <option value="2">2 Hours</option>
              </select>
            </div>
            <div>
              <label class="field-label">Break Minutes: <span class="req">*</span></label>
              <select id="breakMinutesSelect" class="form-input-ctrl" onchange="calculateOTHours()">
                <option value="" selected>- Select Minute -</option>
                <option value="0">0 Minute</option>
                <option value="15">15 Minutes</option>
                <option value="30">30 Minutes</option>
                <option value="45">45 Minutes</option>
              </select>
            </div>
          </div>

          <!-- 6. Project -->
          <div>
            <label class="field-label">Project:</label>
            <select id="projectSelect" class="form-input-ctrl">
              <option value="" selected>- Select Project -</option>
              <option value="Project Alpha (HCM Rebrand)">Project Alpha (HCM Rebrand)</option>
              <option value="Internal System Maintenance">Internal System Maintenance</option>
              <option value="Client Portal Upgrade">Client Portal Upgrade</option>
            </select>
          </div>

          <!-- 7. Reason -->
          <div>
            <label class="field-label">Reason: <span class="req">*</span></label>
            <select id="otReasonSelect" class="form-input-ctrl">
              <option value="" selected>- Select OT Reason -</option>
              <option value="Urgent System Deployment">Urgent System Deployment</option>
              <option value="Peak Period Processing">Peak Period Processing</option>
              <option value="Emergency After-Hours Support">Emergency After-Hours Support</option>
              <option value="Project Deadline Sprint">Project Deadline Sprint</option>
            </select>
          </div>

          <!-- 8. Meal Allowance Amount & Meal Allowance Select -->
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div>
              <label class="field-label">Meal Amount (RM):</label>
              <input type="number" id="mealAmountInput" class="form-input-ctrl" value="0.00" step="0.01" />
            </div>
            <div>
              <label class="field-label">Meal Allowance:</label>
              <select id="mealAllowanceSelect" class="form-input-ctrl" onchange="handleMealSelectChange(this.value)">
                <option value="" selected>- Select Meal Allowance -</option>
                <option value="Standard OT Meal (RM 20.00)" data-amount="20">Standard OT Meal (RM 20.00)</option>
                <option value="Late Night Shift Meal (RM 35.00)" data-amount="35">Late Night Shift Meal (RM 35.00)</option>
              </select>
            </div>
          </div>

          <!-- 9. Transport & Distance -->
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div>
              <label class="field-label">Transport:</label>
              <select id="transportSelect" class="form-input-ctrl">
                <option value="" selected>- Select Transport -</option>
                <option value="Own Vehicle">Own Vehicle</option>
                <option value="Grab / E-Hailing">Grab / E-Hailing</option>
                <option value="Public Transport">Public Transport</option>
              </select>
            </div>
            <div>
              <label class="field-label">Distance (km):</label>
              <input type="number" id="distanceInput" class="form-input-ctrl" value="0" />
            </div>
          </div>

          <!-- 10. Way -->
          <div>
            <label class="field-label">Way:</label>
            <select id="waySelect" class="form-input-ctrl">
              <option value="" selected>- Select Way -</option>
              <option value="One-Way">One-Way</option>
              <option value="Round-Trip">Round-Trip</option>
            </select>
          </div>

          <!-- 11. Mileage / OT Remarks -->
          <div>
            <label class="field-label">Mileage Amount Remarks:</label>
            <textarea id="otRemarksInput" rows="3" class="form-input-ctrl" placeholder="Enter remarks or mileage details..." style="font-family: inherit; resize: vertical;"></textarea>
          </div>

          <!-- 12. Upload Attachments (Matching User Screenshot Layout & Icons Exactly) -->
          <div style="margin-top: 6px;">
            <label class="field-label" style="font-size: 13px; font-weight: 700; color: var(--text-primary); margin-bottom: 10px; display: block;">Upload Attachments</label>
            
            <div style="display: flex; align-items: center; justify-content: center; gap: 36px; padding: 12px 0 6px;">
              <!-- Select File(s) Circle Button -->
              <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer;" onclick="triggerFileUpload()">
                <div style="width: 58px; height: 58px; border-radius: 50%; background: rgba(124, 58, 237, 0.12); border: 1px solid rgba(124, 58, 237, 0.3); display: flex; align-items: center; justify-content: center; color: var(--purple-primary); font-size: 20px; transition: transform 0.15s;" onmousedown="this.style.transform='scale(0.92)'" onmouseup="this.style.transform='scale(1)'">
                  <i class="fa-solid fa-file-arrow-up"></i>
                </div>
                <span style="font-size: 13px; font-weight: 700; color: var(--purple-primary);">Select File(s)</span>
              </div>

              <!-- Take a Picture Circle Button -->
              <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer;" onclick="triggerFileUpload()">
                <div style="width: 58px; height: 58px; border-radius: 50%; background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%); display: flex; align-items: center; justify-content: center; color: #ffffff; font-size: 20px; box-shadow: 0 6px 18px rgba(124, 58, 237, 0.45); transition: transform 0.15s;" onmousedown="this.style.transform='scale(0.92)'" onmouseup="this.style.transform='scale(1)'">
                  <i class="fa-solid fa-camera"></i>
                </div>
                <span style="font-size: 13px; font-weight: 800; color: var(--text-primary);">Take a Picture</span>
              </div>
            </div>

            <!-- Attached Files Chips Container -->
            <div id="otChipsList" style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; justify-content: center;"></div>
          </div>

          <!-- Add Button (Standard Full-Width Pill Style matching Medical Claim) -->
          <div style="margin-top: 6px;">
            <button type="button" onclick="addOTEntry()" style="width: 100%; padding: 12px; border-radius: 14px; background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%); color: #ffffff; font-size: 14px; font-weight: 800; border: none; cursor: pointer; box-shadow: 0 4px 14px rgba(124, 58, 237, 0.35); display: flex; align-items: center; justify-content: center; gap: 8px; transition: transform 0.15s;" onmousedown="this.style.transform='scale(0.98)'" onmouseup="this.style.transform='scale(1)'">
              <i class="fa-solid fa-plus"></i>
              <span>Add OT Entry</span>
            </button>
          </div>

          <!-- Added OT Entries Container -->
          <div style="margin-top: 14px;">
            <div style="font-size: 12.5px; font-weight: 700; color: var(--text-muted); margin-bottom: 8px;">Added OT Entries:</div>
            <div id="addedOTEntriesContainer">
              <div style="font-size: 12px; color: var(--text-muted); font-style: italic; padding: 8px 0; text-align: center; background: var(--bg-input); border-radius: 12px; border: 1px dashed var(--border-subtle);">No OT entries added yet. Fill in above and click "Add OT Entry".</div>
            </div>
          </div>

        </div>

      </div>

      <!-- BOTTOM ACTION FOOTER (MATCHING USER SCREENSHOT: DRAFT & SUBMIT PAPER PLANE BUTTONS) -->
      <div style="display: flex; align-items: center; justify-content: flex-end; gap: 12px; margin-top: 20px; padding-bottom: 24px;">
        <button type="button" onclick="saveDraft()" style="padding: 10px 22px; border-radius: 20px; background: var(--bg-card); border: 1px solid var(--border-subtle); color: var(--text-primary); font-size: 13.5px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px; box-shadow: var(--shadow-sm); transition: transform 0.15s;" onmousedown="this.style.transform='scale(0.96)'" onmouseup="this.style.transform='scale(1)'">
          <i class="fa-solid fa-floppy-disk" style="font-size: 13px;"></i>
          <span>Draft</span>
        </button>
        <button type="button" onclick="submitOTClaim()" style="padding: 10px 24px; border-radius: 20px; background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%); color: #ffffff; font-size: 13.5px; font-weight: 800; border: none; cursor: pointer; box-shadow: 0 4px 16px rgba(124, 58, 237, 0.45); display: flex; align-items: center; gap: 8px; transition: transform 0.15s;" onmousedown="this.style.transform='scale(0.96)'" onmouseup="this.style.transform='scale(1)'">
          <span>Submit</span>
          <i class="fa-solid fa-paper-plane" style="font-size: 13px;"></i>
        </button>
      </div>

    </div>

    <!-- Hidden native file input for upload simulation -->
    <input type="file" id="hiddenOTFileInput" style="display: none;" onchange="handleFileSelected(this)" />

    <phone-bottom-nav active="apps"></phone-bottom-nav>
  </div>
  
  <script>
    let isCrossDay = false;
    const addedOTEntries = [];

    function toggleCrossDay() {
      isCrossDay = !isCrossDay;
      const circle = document.getElementById('crossDayCircle');
      if (isCrossDay) {
        circle.classList.add('checked');
      } else {
        circle.classList.remove('checked');
      }
      calculateOTHours();
    }

    function handleMealSelectChange(val) {
      const amountInput = document.getElementById('mealAmountInput');
      if (val.includes('20')) {
        amountInput.value = '20.00';
      } else if (val.includes('35')) {
        amountInput.value = '35.00';
      } else {
        amountInput.value = '0';
      }
    }

    function calculateOTHours() {
      const start = document.getElementById('startTimeInput').value;
      const end = document.getElementById('endTimeInput').value;
      const breakHrs = parseFloat(document.getElementById('breakHoursSelect').value) || 0;
      const breakMins = parseFloat(document.getElementById('breakMinutesSelect').value) || 0;

      if (!start || !end) return;

      const [sH, sM] = start.split(':').map(Number);
      const [eH, eM] = end.split(':').map(Number);

      if (isNaN(sH) || isNaN(sM) || isNaN(eH) || isNaN(eM)) return;

      let startTotalMins = sH * 60 + sM;
      let endTotalMins = eH * 60 + eM;

      if (isCrossDay || endTotalMins < startTotalMins) {
        endTotalMins += 24 * 60;
      }

      let diffMins = endTotalMins - startTotalMins - (breakHrs * 60 + breakMins);
      if (diffMins < 0) diffMins = 0;

      const hrs = (diffMins / 60).toFixed(1);
      document.getElementById('otHoursInput').value = hrs;
    }

    function triggerFileUpload() {
      const input = document.getElementById('hiddenOTFileInput');
      if (input) input.click();
    }

    function handleFileSelected(input) {
      if (!input.files || !input.files[0]) return;
      const file = input.files[0];
      const container = document.getElementById('otChipsList');
      if (container) {
        const chip = document.createElement('div');
        chip.style.cssText = 'background: rgba(124, 58, 237, 0.12); border: 1px solid rgba(124, 58, 237, 0.25); color: var(--purple-primary); padding: 6px 12px; border-radius: 16px; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 6px;';
        chip.innerHTML = `<i class="fa-solid fa-paperclip"></i> ${file.name} <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="this.parentElement.remove()"></i>`;
        container.appendChild(chip);
      }
    }

    function addOTEntry() {
      const otType = document.getElementById('otCodeSelect').value || 'OT 1.5x';
      const otDate = document.getElementById('otDateInput').value || '22/09/2026';
      const hours = document.getElementById('otHoursInput').value || '0';
      const reason = document.getElementById('otReasonSelect').value || 'General OT';

      addedOTEntries.push({ type: otType, date: otDate, hours: hours, reason: reason });
      renderOTEntries();

      if (typeof showToast === 'function') {
        showToast(`✅ OT Entry [${otType}] added successfully!`);
      }
    }

    function renderOTEntries() {
      const container = document.getElementById('addedOTEntriesContainer');
      if (addedOTEntries.length === 0) {
        container.innerHTML = `<div style="font-size: 12px; color: var(--text-muted); font-style: italic; padding: 6px 0;">No OT entries added yet. Fill in above and click "Add".</div>`;
        return;
      }

      let html = '';
      addedOTEntries.forEach((item, idx) => {
        html += `
          <div class="item-chip-row">
            <div>
              <div style="font-size: 13px; font-weight: 800; color: var(--text-primary);">${item.type}</div>
              <div style="font-size: 11px; font-weight: 600; color: var(--text-muted);">${item.date} &bull; ${item.reason}</div>
            </div>
            <div style="display: flex; align-items: center; gap: 10px;">
              <div style="font-size: 13.5px; font-weight: 800; color: var(--purple-primary);">${item.hours} hrs</div>
              <i class="fa-solid fa-trash-can" style="color: #ef4444; cursor: pointer; font-size: 14px;" onclick="removeOTEntry(${idx})"></i>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    function removeOTEntry(idx) {
      addedOTEntries.splice(idx, 1);
      renderOTEntries();
    }

    function saveDraft() {
      if (typeof showToast === 'function') {
        showToast('💾 OT Claim draft saved successfully!');
      } else {
        alert('OT Claim draft saved successfully!');
      }
    }

    function submitOTClaim() {
      if (typeof showToast === 'function') {
        showToast('✅ OT Claim submitted successfully!');
      } else {
        alert('OT Claim submitted successfully!');
      }
      window.location.href = '../index.html';
    }
  </script>
</body>
</html>
