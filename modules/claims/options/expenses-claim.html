<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Claims - Expense Claim</title>
  <script src="../../../js/components.js"></script>
  <script src="../../../js/app.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../css/theme.css">
  <link rel="stylesheet" href="../../../css/app.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-page);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: var(--text-primary);
      padding: 20px 0;
    }

    .phone-container {
      width: 100%;
      max-width: 420px;
      height: 900px;
      background: var(--bg-phone);
      border-radius: 44px;
      overflow: hidden;
      box-shadow: var(--shadow-phone);
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 100px;
      position: relative;
      z-index: 10;
      scrollbar-width: none;
    }
    .main-content::-webkit-scrollbar { display: none; }

    .cal-top-header {
      background: linear-gradient(135deg, #4c1d95 0%, #6d28d9 50%, #7c3aed 100%);
      padding: 12px 16px 16px;
      border-bottom-left-radius: 24px;
      border-bottom-right-radius: 24px;
      box-shadow: 0 8px 24px rgba(76, 29, 149, 0.28);
      position: relative;
      z-index: 20;
    }

    .form-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 24px;
      padding: 18px 16px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-card);
    }

    .section-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .field-group {
      margin-bottom: 14px;
    }

    .field-label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 6px;
      letter-spacing: 0.2px;
    }

    .field-label span.req {
      color: #ef4444;
      margin-left: 2px;
      font-weight: 900;
    }

    .form-ctrl {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-primary);
      outline: none;
      transition: all 0.2s ease;
      appearance: none;
    }
    .form-ctrl:focus {
      border-color: var(--purple-primary);
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15);
    }
    .form-ctrl[readonly] {
      opacity: 0.85;
      background: rgba(255, 255, 255, 0.03);
      cursor: not-allowed;
    }

    .select-wrapper {
      position: relative;
    }
    .select-wrapper::after {
      content: "\f0d7";
      font-family: "Font Awesome 6 Free";
      font-weight: 900;
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
      font-size: 12px;
    }

    .itemized-banner {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.16) 0%, rgba(5, 150, 105, 0.08) 100%);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #10b981;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.12);
    }

    .attach-btn-row {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .attach-btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 14px;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      color: var(--text-primary);
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: var(--shadow-sm);
    }
    .attach-btn:hover {
      border-color: var(--purple-primary);
      color: var(--purple-primary);
    }
    .attach-btn:active {
      transform: scale(0.97);
    }

    .item-action-btns {
      display: flex;
      gap: 10px;
      margin-top: 18px;
      margin-bottom: 10px;
    }

    .btn-clear-item {
      flex: 1;
      padding: 12px;
      border-radius: 14px;
      background: rgba(59, 130, 246, 0.14);
      border: 1px solid rgba(59, 130, 246, 0.3);
      color: #3b82f6;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-clear-item:active { transform: scale(0.97); }

    .btn-add-item {
      flex: 1.2;
      padding: 12px;
      border-radius: 14px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border: none;
      color: #ffffff;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-add-item:active { transform: scale(0.97); }

    .table-container {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      overflow: hidden;
      margin-top: 14px;
    }

    .item-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      text-align: left;
    }

    .item-table th {
      background: var(--purple-subtle);
      color: var(--purple-primary);
      padding: 12px 14px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      border-bottom: 2px solid var(--purple-border);
    }

    .item-table td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-primary);
      vertical-align: middle;
    }

    .item-table tr:last-child td {
      border-bottom: none;
    }

    .file-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(124, 58, 237, 0.12);
      border: 1px solid rgba(124, 58, 237, 0.25);
      color: var(--purple-primary);
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 700;
      margin-top: 6px;
    }

    .bottom-floating-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--bg-card);
      border-top: 1px solid var(--border-subtle);
      padding: 14px 16px 28px;
      display: flex;
      gap: 12px;
      z-index: 50;
      box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.25);
    }

    .btn-draft-bright {
      flex: 1;
      padding: 13px;
      border-radius: 16px;
      background: rgba(245, 158, 11, 0.18);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #f59e0b;
      font-size: 13.5px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: var(--shadow-sm);
    }
    .btn-draft-bright:active { transform: scale(0.97); }

    .btn-submit-primary {
      flex: 1;
      padding: 13px;
      border-radius: 16px;
      background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
      border: none;
      color: #ffffff;
      font-size: 13.5px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(124, 58, 237, 0.4);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-submit-primary:active { transform: scale(0.97); }
  </style>
</head>
<body>

  <preview-top-bar active-page="claims"></preview-top-bar>

  <div class="phone-container">
    
    <!-- Top Header -->
    <div class="cal-top-header">
      <phone-status-bar time="9:41" style="color: #ffffff;"></phone-status-bar>

      <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 4px;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <a href="../index.html" class="me-back-btn" aria-label="Back" title="Back"
            style="background: rgba(255, 255, 255, 0.18); border: 1px solid rgba(255, 255, 255, 0.25); width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #ffffff; text-decoration: none;">
            <i class="fa-solid fa-chevron-left" style="font-size: 16px;"></i>
          </a>
          <h1 style="font-size: 18.5px; font-weight: 800; color: #ffffff; margin: 0;">Expense Claim</h1>
        </div>
        <button type="button" aria-label="Options" title="Options" style="background: none; border: none; color: #ffffff; font-size: 18px; cursor: pointer;">
          <i class="fa-solid fa-ellipsis-vertical"></i>
        </button>
      </div>
    </div>

    <!-- Main Scrollable Form Content -->
    <div class="main-content">
      
      <!-- 1. MAIN EXPENSE CLAIM FORM CARD -->
      <div class="form-card">
        <div class="section-title">
          <i class="fa-solid fa-file-invoice-dollar" style="color: var(--purple-primary);"></i>
          <span>Expense Claim Details</span>
        </div>

        <!-- Claim Period (Year & Month) -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;" class="field-group">
          <div>
            <label class="field-label">Claim Period (Year)</label>
            <input type="text" id="claimPeriodYear" class="form-ctrl" value="2026" readonly>
          </div>
          <div>
            <label class="field-label">Month</label>
            <div class="select-wrapper">
              <select id="claimPeriodMonth" class="form-ctrl">
                <option value="January">January</option>
                <option value="February">February</option>
                <option value="March">March</option>
                <option value="April">April</option>
                <option value="May">May</option>
                <option value="June">June</option>
                <option value="July">July</option>
                <option value="August">August</option>
                <option value="September" selected>September</option>
                <option value="October">October</option>
                <option value="November">November</option>
                <option value="December">December</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Date From & Date To -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;" class="field-group">
          <div>
            <label class="field-label">Date From</label>
            <input type="date" id="claimDateFrom" class="form-ctrl" value="2026-09-23">
          </div>
          <div>
            <label class="field-label">Date To</label>
            <input type="date" id="claimDateTo" class="form-ctrl" value="2026-09-23">
          </div>
        </div>

        <!-- Benefit Year & Benefit Type -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;" class="field-group">
          <div>
            <label class="field-label">Benefit Year</label>
            <input type="text" id="benefitYear" class="form-ctrl" value="2026" readonly>
          </div>
          <div>
            <label class="field-label">Benefit Type</label>
            <div class="select-wrapper">
              <select id="benefitTypeSelect" class="form-ctrl">
                <option value="" selected>Select Benefit</option>
                <option value="CAR MAINTENANCE">Car Maintenance</option>
                <option value="OFFICE SUPPLIES & PRINTING">Office Supplies &amp; Printing</option>
                <option value="SUBSCRIPTIONS & SOFTWARE">Subscriptions &amp; Software</option>
                <option value="PANTRY & SUNDRIES">Pantry &amp; Sundries</option>
                <option value="TRAVEL MILEAGE & TOLLS">Travel Mileage &amp; Tolls</option>
                <option value="CLIENT ENTERTAINMENT">Client Entertainment</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Purpose Required -->
        <div class="field-group">
          <label class="field-label">Purpose<span class="req">*</span></label>
          <input type="text" id="claimPurpose" class="form-ctrl" placeholder="Enter claim purpose e.g. Client Meeting Lunch">
        </div>

        <!-- Claim Currency & Claim Total -->
        <div style="display: grid; grid-template-columns: 1.2fr 1fr; gap: 10px;" class="field-group">
          <div>
            <label class="field-label">Claim Currency</label>
            <input type="text" class="form-ctrl" value="RINGGIT MALAYSIA" readonly>
          </div>
          <div>
            <label class="field-label">Claim Total</label>
            <div id="claimTotalDisplay" style="padding: 11px 14px; background: rgba(124, 58, 237, 0.12); border: 1.5px solid rgba(124, 58, 237, 0.3); border-radius: 14px; font-size: 15px; font-weight: 900; color: var(--purple-primary); text-align: right;">
              RM 165.00
            </div>
          </div>
        </div>

        <!-- Project & Cost Centre -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;" class="field-group">
          <div>
            <label class="field-label">Project</label>
            <div class="select-wrapper">
              <select id="projectSelect" class="form-ctrl">
                <option value="" selected>Select Project</option>
                <option value="HQ Digitalization">HQ Digitalization</option>
                <option value="Mobile HCM App">Mobile HCM App</option>
                <option value="Regional Expansion">Regional Expansion</option>
              </select>
            </div>
          </div>
          <div>
            <label class="field-label">Cost Centre</label>
            <div class="select-wrapper">
              <select id="costCentreSelect" class="form-ctrl">
                <option value="MANAGEMENT" selected>MANAGEMENT</option>
                <option value="ADMINISTRATION">ADMINISTRATION</option>
                <option value="FINANCE & ACCOUNTING">FINANCE &amp; ACCOUNTING</option>
                <option value="SALES & MARKETING">SALES &amp; MARKETING</option>
                <option value="IT DEPARTMENT">IT DEPARTMENT</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Remarks -->
        <div class="field-group" style="margin-bottom: 0;">
          <label class="field-label">Remarks</label>
          <textarea id="claimRemarks" class="form-ctrl" rows="2" placeholder="Enter remarks or additional notes..." style="resize: none;"></textarea>
        </div>

      </div>

      <!-- 2. ITEMIZED DETAILS FORM CARD -->
      <div class="form-card">
        
        <!-- Banner Header matching legacy screenshot structure -->
        <div class="itemized-banner">
          <div style="display: flex; align-items: center; gap: 8px;">
            <i class="fa-solid fa-list-check" style="font-size: 15px;"></i>
            <span>Itemized Details</span>
          </div>
          <span style="font-size: 11px; font-weight: 700; opacity: 0.85; background: rgba(16, 185, 129, 0.15); padding: 3px 8px; border-radius: 6px;">Required</span>
        </div>

        <!-- Transaction Date & Receipt # -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;" class="field-group">
          <div>
            <label class="field-label">Transaction Date</label>
            <input type="date" id="itemDate" class="form-ctrl" value="2026-09-23">
          </div>
          <div>
            <label class="field-label">Receipt #</label>
            <input type="text" id="itemReceiptNo" class="form-ctrl" placeholder="e.g. RCP-9901">
          </div>
        </div>

        <!-- Description -->
        <div class="field-group">
          <label class="field-label">Description</label>
          <input type="text" id="itemDescription" class="form-ctrl" placeholder="Item description e.g. Stationery &amp; Printing">
        </div>

        <!-- Expense Code -->
        <div class="field-group">
          <label class="field-label">Expense Code</label>
          <div class="select-wrapper">
            <select id="itemExpenseCode" class="form-ctrl">
              <option value="" selected>Select Expense</option>
              <option value="EXP-001 (Office Supplies)">EXP-001 (Office Supplies)</option>
              <option value="EXP-002 (Software Subscription)">EXP-002 (Software Subscription)</option>
              <option value="EXP-003 (Dining & Meals)">EXP-003 (Dining &amp; Meals)</option>
              <option value="EXP-004 (Transit & Mileage)">EXP-004 (Transit &amp; Mileage)</option>
            </select>
          </div>
        </div>

        <!-- Amount & Item Currency -->
        <div style="display: grid; grid-template-columns: 1fr 1.2fr; gap: 10px;" class="field-group">
          <div>
            <label class="field-label">Amount</label>
            <input type="number" id="itemAmount" class="form-ctrl" placeholder="0.00" step="0.01" oninput="calculateLocalAmount()">
          </div>
          <div>
            <label class="field-label">Item Currency<span class="req">*</span></label>
            <div class="select-wrapper">
              <select id="itemCurrency" class="form-ctrl">
                <option value="RINGGIT MALAYSIA" selected>RINGGIT MALAYSIA</option>
                <option value="US DOLLAR">US DOLLAR</option>
                <option value="SINGAPORE DOLLAR">SINGAPORE DOLLAR</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Forex Rate & Local Amount -->
        <div style="display: grid; grid-template-columns: 1fr 1.2fr; gap: 10px;" class="field-group">
          <div>
            <label class="field-label">Forex Rate</label>
            <input type="number" id="itemForex" class="form-ctrl" value="1.000" step="0.001" oninput="calculateLocalAmount()">
          </div>
          <div>
            <label class="field-label">Local Amount</label>
            <input type="text" id="itemLocalAmount" class="form-ctrl" value="0.00" readonly style="font-weight: 800; color: var(--purple-primary);">
          </div>
        </div>

        <!-- Attachment Buttons -->
        <div class="attach-btn-row">
          <button type="button" class="attach-btn" onclick="triggerFileInput()">
            <i class="fa-solid fa-file-arrow-up" style="color: var(--purple-primary);"></i>
            <span>Select File(s)</span>
          </button>
          <button type="button" class="attach-btn" onclick="triggerCameraInput()">
            <i class="fa-solid fa-camera" style="color: #10b981;"></i>
            <span>Take a Picture</span>
          </button>
        </div>
        <input type="file" id="hiddenFileInput" accept="image/*,.pdf" multiple style="display: none;" onchange="handleFileSelected(this)">
        
        <div id="fileChipsContainer" style="display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px;"></div>

        <!-- Item Actions (Clear Form / Add Claim's Item) -->
        <div class="item-action-btns">
          <button type="button" class="btn-clear-item" onclick="clearItemizedForm()">
            <i class="fa-solid fa-rotate-left"></i>
            <span>Clear Form</span>
          </button>
          <button type="button" class="btn-add-item" onclick="addClaimItem()">
            <i class="fa-solid fa-plus"></i>
            <span>Add Claim's Item</span>
          </button>
        </div>

        <!-- 3. ADDED ITEMS TABLE -->
        <div class="table-container">
          <table class="item-table">
            <thead>
              <tr>
                <th style="width: 50%;">Description</th>
                <th style="width: 32%; text-align: right;">Amount</th>
                <th style="width: 18%; text-align: center;">Actions</th>
              </tr>
            </thead>
            <tbody id="claimItemsTableBody">
              <!-- Default Pre-populated Item 1 -->
              <tr id="itemRow-1">
                <td>
                  <div style="font-weight: 800; color: var(--text-primary);">Popular Bookstore</div>
                  <div style="font-size: 10.5px; color: var(--text-muted); margin-top: 2px;">23/09/2026 • #RCP-9901 • EXP-001</div>
                  <div class="file-chip"><i class="fa-solid fa-paperclip"></i> receipt.jpg</div>
                </td>
                <td style="text-align: right; font-weight: 800; color: var(--text-primary);">RM 120.00</td>
                <td style="text-align: center;">
                  <button type="button" onclick="removeItemRow(1, 120.00)" title="Delete Item" style="background: rgba(239, 68, 68, 0.14); border: 1px solid rgba(239, 68, 68, 0.3); color: #ef4444; width: 30px; height: 30px; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;">
                    <i class="fa-solid fa-trash-can" style="font-size: 12px;"></i>
                  </button>
                </td>
              </tr>
              <!-- Default Pre-populated Item 2 -->
              <tr id="itemRow-2">
                <td>
                  <div style="font-weight: 800; color: var(--text-primary);">Starbucks Discussion</div>
                  <div style="font-size: 10.5px; color: var(--text-muted); margin-top: 2px;">22/09/2026 • #RCP-9905 • EXP-003</div>
                  <div class="file-chip"><i class="fa-solid fa-paperclip"></i> coffee_receipt.pdf</div>
                </td>
                <td style="text-align: right; font-weight: 800; color: var(--text-primary);">RM 45.00</td>
                <td style="text-align: center;">
                  <button type="button" onclick="removeItemRow(2, 45.00)" title="Delete Item" style="background: rgba(239, 68, 68, 0.14); border: 1px solid rgba(239, 68, 68, 0.3); color: #ef4444; width: 30px; height: 30px; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;">
                    <i class="fa-solid fa-trash-can" style="font-size: 12px;"></i>
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

      </div>

    </div>

    <!-- Bottom Floating Actions (Save Draft & Submit) -->
    <div class="bottom-floating-bar">
      <button type="button" class="btn-draft-bright" onclick="handleSaveDraft()">
        <i class="fa-regular fa-bookmark"></i>
        <span>Save Draft</span>
      </button>
      <button type="button" class="btn-submit-primary" onclick="handleSubmitExpenseClaim()">
        <i class="fa-solid fa-paper-plane"></i>
        <span>Submit</span>
      </button>
    </div>

  </div>

  <script>
    let addedItemsList = [
      { id: 1, amount: 120.00 },
      { id: 2, amount: 45.00 }
    ];
    let nextItemId = 3;
    let selectedFiles = [];

    function calculateLocalAmount() {
      const amt = parseFloat(document.getElementById('itemAmount').value) || 0;
      const forex = parseFloat(document.getElementById('itemForex').value) || 1;
      const local = (amt * forex).toFixed(2);
      document.getElementById('itemLocalAmount').value = local;
    }

    function triggerFileInput() {
      document.getElementById('hiddenFileInput').removeAttribute('capture');
      document.getElementById('hiddenFileInput').click();
    }

    function triggerCameraInput() {
      document.getElementById('hiddenFileInput').setAttribute('capture', 'environment');
      document.getElementById('hiddenFileInput').click();
    }

    function handleFileSelected(input) {
      if (input.files && input.files.length > 0) {
        for (let i = 0; i < input.files.length; i++) {
          selectedFiles.push(input.files[i].name);
        }
        renderFileChips();
      }
    }

    function renderFileChips() {
      const container = document.getElementById('fileChipsContainer');
      if (!container) return;
      if (selectedFiles.length === 0) {
        container.innerHTML = '';
        return;
      }
      let html = '';
      selectedFiles.forEach((fname, idx) => {
        html += `
          <div class="file-chip">
            <i class="fa-solid fa-paperclip"></i>
            <span>${fname}</span>
            <i class="fa-solid fa-xmark" style="cursor: pointer; margin-left: 4px;" onclick="removeFileChip(${idx})"></i>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    function removeFileChip(index) {
      selectedFiles.splice(index, 1);
      renderFileChips();
    }

    function clearItemizedForm() {
      document.getElementById('itemDate').value = '2026-09-23';
      document.getElementById('itemReceiptNo').value = '';
      document.getElementById('itemDescription').value = '';
      document.getElementById('itemExpenseCode').value = '';
      document.getElementById('itemAmount').value = '';
      document.getElementById('itemCurrency').value = 'RINGGIT MALAYSIA';
      document.getElementById('itemForex').value = '1.000';
      document.getElementById('itemLocalAmount').value = '0.00';
      selectedFiles = [];
      renderFileChips();
      if (typeof showToast === 'function') {
        showToast('Itemized form cleared');
      }
    }

    function addClaimItem() {
      const desc = document.getElementById('itemDescription').value.trim();
      const amtStr = document.getElementById('itemLocalAmount').value;
      const amt = parseFloat(amtStr) || 0;
      const receipt = document.getElementById('itemReceiptNo').value.trim() || '#RCP-AUTO';
      const expCode = document.getElementById('itemExpenseCode').value || 'EXP-GENERAL';
      const dateVal = document.getElementById('itemDate').value || '2026-09-23';

      if (!desc) {
        alert('Please enter a description for the itemized detail.');
        document.getElementById('itemDescription').focus();
        return;
      }

      if (amt <= 0) {
        alert('Please enter a valid amount.');
        document.getElementById('itemAmount').focus();
        return;
      }

      const itemId = nextItemId++;
      addedItemsList.push({ id: itemId, amount: amt });

      const fileBadgeHtml = selectedFiles.length > 0 
        ? `<div class="file-chip"><i class="fa-solid fa-paperclip"></i> ${selectedFiles[0]}</div>` 
        : '';

      // Format date
      const parts = dateVal.split('-');
      const formattedDate = parts.length === 3 ? `${parts[2]}/${parts[1]}/${parts[0]}` : dateVal;

      const tbody = document.getElementById('claimItemsTableBody');
      const tr = document.createElement('tr');
      tr.id = `itemRow-${itemId}`;
      tr.innerHTML = `
        <td>
          <div style="font-weight: 800; color: var(--text-primary);">${desc}</div>
          <div style="font-size: 10.5px; color: var(--text-muted); margin-top: 2px;">${formattedDate} • ${receipt} • ${expCode}</div>
          ${fileBadgeHtml}
        </td>
        <td style="text-align: right; font-weight: 800; color: var(--text-primary);">RM ${amt.toFixed(2)}</td>
        <td style="text-align: center;">
          <button type="button" onclick="removeItemRow(${itemId}, ${amt})" title="Delete Item" style="background: rgba(239, 68, 68, 0.14); border: 1px solid rgba(239, 68, 68, 0.3); color: #ef4444; width: 30px; height: 30px; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;">
            <i class="fa-solid fa-trash-can" style="font-size: 12px;"></i>
          </button>
        </td>
      `;

      tbody.appendChild(tr);
      recalculateClaimTotal();
      clearItemizedForm();

      if (typeof showToast === 'function') {
        showToast(`Added: ${desc} (RM ${amt.toFixed(2)})`);
      }
    }

    function removeItemRow(itemId, amt) {
      const row = document.getElementById(`itemRow-${itemId}`);
      if (row) {
        row.remove();
      }
      addedItemsList = addedItemsList.filter(it => it.id !== itemId);
      recalculateClaimTotal();
      if (typeof showToast === 'function') {
        showToast('Item removed');
      }
    }

    function recalculateClaimTotal() {
      const total = addedItemsList.reduce((sum, item) => sum + item.amount, 0);
      document.getElementById('claimTotalDisplay').innerText = `RM ${total.toFixed(2)}`;
    }

    function handleSaveDraft() {
      if (typeof showToast === 'function') {
        showToast('💾 Expense Claim draft saved successfully!');
      } else {
        alert('Expense Claim draft saved successfully!');
      }
    }

    function handleSubmitExpenseClaim() {
      const purpose = document.getElementById('claimPurpose').value.trim();
      if (!purpose) {
        alert('Please enter the Claim Purpose before submitting.');
        document.getElementById('claimPurpose').focus();
        return;
      }

      if (addedItemsList.length === 0) {
        alert('Please add at least one itemized claim detail before submitting.');
        return;
      }

      if (typeof showToast === 'function') {
        showToast('🚀 Expense Claim submitted successfully!');
      } else {
        alert('Expense Claim submitted successfully!');
      }
      setTimeout(() => {
        window.location.href = '../index.html';
      }, 1200);
    }
  </script>
</body>
</html>
