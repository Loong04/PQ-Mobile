<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Claims - Expense Claim</title>
  <script src="../../../js/components.js"></script>
  <script src="../../../js/app.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../css/theme.css">
  <link rel="stylesheet" href="../../../css/app.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-page);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: var(--text-primary);
      padding: 20px 0;
    }

    .phone-container {
      width: 100%;
      max-width: 420px;
      height: 900px;
      background: var(--bg-phone);
      border-radius: 44px;
      overflow: hidden;
      box-shadow: var(--shadow-phone);
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 100px;
      position: relative;
      z-index: 10;
      scrollbar-width: none;
    }
    .main-content::-webkit-scrollbar { display: none; }

    .cal-top-header {
      background: linear-gradient(135deg, #4c1d95 0%, #6d28d9 50%, #7c3aed 100%);
      padding: 12px 16px 16px;
      border-bottom-left-radius: 24px;
      border-bottom-right-radius: 24px;
      box-shadow: 0 8px 24px rgba(76, 29, 149, 0.28);
      position: relative;
      z-index: 20;
    }

    /* VIEW CONTAINERS (4-LEVEL DRILL-DOWN ISOLATION) */
    .view-container {
      display: none;
      width: 100%;
      animation: fadeIn 0.2s ease-in-out;
    }
    .view-container.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .form-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 22px;
      padding: 20px 18px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-card);
      position: relative;
    }

    .category-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 16px 18px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-card);
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .category-card:active {
      transform: scale(0.98);
      border-color: var(--purple-primary);
    }

    .section-header-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-top: 14px;
      margin-top: 14px;
      margin-bottom: 18px;
      border-top: 1px dashed var(--border-subtle);
    }
    .section-header-bar.no-top-border {
      border-top: none;
      padding-top: 0;
      margin-top: 0;
    }
    .section-title-accent {
      width: 3.5px;
      height: 15px;
      background: #a855f7;
      border-radius: 2px;
      display: inline-block;
      flex-shrink: 0;
    }
    .section-title-text {
      font-size: 13px;
      font-weight: 800;
      color: var(--text-primary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .field-group {
      margin-bottom: 16px;
    }

    .field-label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .field-label .req {
      color: #ef4444;
      margin-left: 2px;
    }

    .form-ctrl {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-primary);
      outline: none;
      transition: all 0.2s ease;
      appearance: none;
      font-family: inherit;
    }
    .form-ctrl:focus {
      border-color: var(--purple-primary);
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15);
    }
    .form-ctrl[readonly] {
      opacity: 0.9;
      background: rgba(255, 255, 255, 0.03);
    }

    .select-wrapper {
      position: relative;
    }
    .select-wrapper::after {
      content: "\f0d7";
      font-family: "Font Awesome 6 Free";
      font-weight: 900;
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
      font-size: 12px;
    }

    .btn-draft-bright {
      padding: 11px 24px;
      border-radius: 9999px;
      background: var(--bg-card);
      border: 1.5px solid var(--border-subtle);
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
    }
    .btn-draft-bright:active {
      transform: scale(0.96);
    }

    .btn-submit-primary {
      padding: 11px 26px;
      border-radius: 9999px;
      background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
      border: none;
      color: #ffffff;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 4px 18px rgba(124, 58, 237, 0.45);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }
    .btn-submit-primary:active {
      transform: scale(0.96);
      box-shadow: 0 2px 10px rgba(124, 58, 237, 0.35);
    }

    .btn-step-back {
      padding: 11px 22px;
      border-radius: 9999px;
      background: var(--bg-card);
      border: 1.5px solid var(--border-subtle);
      color: var(--text-primary);
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
    }
    .btn-step-back:active {
      transform: scale(0.96);
    }

    /* Toast Notification */
    .toast-box {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #0f172a;
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 12.5px;
      font-weight: 700;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      white-space: nowrap;
    }
    .toast-box.show {
    /* Top Claim Stepper Progress Indicator Standard */
    .claim-stepper-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 14px 16px 12px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-card);
      position: relative;
    }
    .stepper-track-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }
    .stepper-track-container.two-steps .stepper-line-bg {
      left: 25%;
      right: 25%;
    }
    .stepper-track-container.two-steps .stepper-line-fill {
      left: 25%;
    }
    .stepper-line-bg {
      position: absolute;
      top: 15px;
      height: 2px;
      background: rgba(255, 255, 255, 0.12);
      z-index: 1;
    }
    .stepper-line-fill {
      position: absolute;
      top: 15px;
      height: 2px;
      background: linear-gradient(90deg, #10b981 0%, #a855f7 100%);
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 2;
    }
    .stepper-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      position: relative;
      z-index: 3;
      cursor: pointer;
      flex: 1;
      user-select: none;
    }
    .stepper-circle {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 2px solid rgba(255, 255, 255, 0.2);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 800;
      transition: all 0.25s ease;
    }
    .stepper-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      white-space: nowrap;
      transition: all 0.25s ease;
    }
    /* Completed State: Green Outline & Text */
    .stepper-item.completed .stepper-circle {
      border-color: #10b981;
      background: rgba(16, 185, 129, 0.18);
      color: #10b981;
    }
    .stepper-item.completed .stepper-label {
      color: #34d399;
    }
    /* Active State: Vibrant Purple Filled Circle */
    .stepper-item.active .stepper-circle {
      border-color: #a855f7;
      background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(124, 58, 237, 0.5);
      transform: scale(1.08);
    }
    .stepper-item.active .stepper-label {
      color: #ffffff;
      font-weight: 900;
    }
  </style>
</head>
<body>

  <preview-top-bar active-page="claims"></preview-top-bar>

  <div class="phone-container">
    
    <!-- TOP HEADER -->
    <div class="cal-top-header">
      <phone-status-bar time="13:08" style="color: #ffffff;"></phone-status-bar>
      
      <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 4px;">
        <button type="button" class="header-back-btn" onclick="handleHeaderBack()" aria-label="Back" title="Back"
          style="background: rgba(255, 255, 255, 0.18); border: 1px solid rgba(255, 255, 255, 0.25); width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #ffffff; outline: none;">
          <i class="fa-solid fa-chevron-left" style="font-size: 16px;"></i>
        </button>
        <h1 id="headerNavTitle" style="font-size: 18px; font-weight: 800; color: #ffffff; margin: 0;">Expense Claim</h1>
        <div style="width: 36px;"></div>
      </div>
    </div>

    <!-- MAIN SCROLLABLE CONTENT (Unified Single Page Form) -->
    <div class="main-content" style="padding-bottom: 90px;">

      <!-- CARD 1: MAIN FORM INFO -->
      <div class="form-card">
        <div class="section-header-bar no-top-border">
          <span class="section-title-accent"></span>
          <span class="section-title-text">MAIN FORM INFO</span>
        </div>

        <!-- Claim Period & Month -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;" class="field-group">
          <div>
            <label class="field-label">Claim Period :</label>
            <input type="text" id="claimPeriodYear" class="form-ctrl" value="2026" readonly />
          </div>
          <div>
            <label class="field-label">Month :</label>
            <div class="select-wrapper">
              <select id="claimPeriodMonth" class="form-ctrl">
                <option value="January">January</option>
                <option value="February">February</option>
                <option value="March">March</option>
                <option value="April">April</option>
                <option value="May">May</option>
                <option value="June">June</option>
                <option value="July">July</option>
                <option value="August">August</option>
                <option value="September" selected>September</option>
                <option value="October">October</option>
                <option value="November">November</option>
                <option value="December">December</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Date From & Date To -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;" class="field-group">
          <div>
            <label class="field-label">Date From :</label>
            <input type="text" id="claimDateFrom" class="form-ctrl" value="25/09/2026" />
          </div>
          <div>
            <label class="field-label">Date To :</label>
            <input type="text" id="claimDateTo" class="form-ctrl" value="25/09/2026" />
          </div>
        </div>

        <!-- Benefit Year & Benefit Type -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;" class="field-group">
          <div>
            <label class="field-label">Benefit Year :</label>
            <input type="text" id="benefitYear" class="form-ctrl" value="2026" readonly />
          </div>
          <div>
            <label class="field-label">Benefit Type :</label>
            <div class="select-wrapper">
              <select id="benefitTypeSelect" class="form-ctrl">
                <option value="" selected>Select Benefit</option>
                <option value="GENERAL EXPENSE">General Expense</option>
                <option value="OFFICE SUPPLIES">Office Supplies</option>
                <option value="SUBSCRIPTIONS">Subscriptions & Software</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Purpose -->
        <div class="field-group">
          <label class="field-label">Purpose:<span class="req">*</span></label>
          <input type="text" id="claimPurpose" class="form-ctrl" placeholder="Stationery & Office Purchases" />
        </div>

        <!-- Claim Currency -->
        <div class="field-group">
          <label class="field-label">Claim Currency :</label>
          <div class="select-wrapper">
            <select id="claimCurrencySelect" class="form-ctrl">
              <option value="RINGGIT MALAYSIA" selected>RINGGIT MALAYSIA</option>
              <option value="US DOLLAR">US DOLLAR</option>
              <option value="SINGAPORE DOLLAR">SINGAPORE DOLLAR</option>
            </select>
          </div>
        </div>

        <!-- Claim Total -->
        <div class="field-group">
          <label class="field-label">Claim Total :</label>
          <input type="text" id="claimTotalInput" class="form-ctrl" value="0" readonly style="color: var(--purple-primary); font-weight: 800; font-size: 16px;" />
        </div>

        <!-- Project -->
        <div class="field-group">
          <label class="field-label">Project :</label>
          <div class="select-wrapper">
            <select id="projectSelect" class="form-ctrl">
              <option value="" selected>Select Project</option>
              <option value="HQ Digitalization">HQ Digitalization</option>
              <option value="Mobile HCM App">Mobile HCM App</option>
            </select>
          </div>
        </div>

        <!-- Cost Centre -->
        <div class="field-group">
          <label class="field-label">Cost Centre :</label>
          <div class="select-wrapper">
            <select id="costCentreSelect" class="form-ctrl">
              <option value="MANAGEMENT" selected>MANAGEMENT</option>
              <option value="ADMINISTRATION">ADMINISTRATION</option>
              <option value="FINANCE & ACCOUNTING">FINANCE & ACCOUNTING</option>
              <option value="SALES & MARKETING">SALES & MARKETING</option>
              <option value="IT DEPARTMENT">IT DEPARTMENT</option>
            </select>
          </div>
        </div>

        <!-- Remarks -->
        <div class="field-group" style="margin-bottom: 0;">
          <label class="field-label">Remarks :</label>
          <input type="text" id="claimRemarks" class="form-ctrl" placeholder="" />
        </div>
      </div>

      <!-- CARD 2: ITEMIZED DETAILS -->
      <div class="form-card">
        <div class="section-header-bar no-top-border">
          <span class="section-title-accent"></span>
          <span class="section-title-text">ITEMIZED DETAILS</span>
        </div>

        <!-- Transaction Date -->
        <div class="field-group">
          <label class="field-label">Transaction Date :</label>
          <input type="text" id="itemTxDate" class="form-ctrl" value="25/09/2026" />
        </div>

        <!-- Receipt # -->
        <div class="field-group">
          <label class="field-label">Receipt # :</label>
          <input type="text" id="itemReceiptNo" class="form-ctrl" placeholder="" />
        </div>

        <!-- Description -->
        <div class="field-group">
          <label class="field-label">Description :</label>
          <input type="text" id="itemDescription" class="form-ctrl" placeholder="" />
        </div>

        <!-- Expense Code -->
        <div class="field-group">
          <label class="field-label">Expense Code :</label>
          <div class="select-wrapper">
            <select id="itemExpenseCode" class="form-ctrl">
              <option value="" selected>Select Expense</option>
              <option value="GENERAL EXPENSE">General Expense</option>
              <option value="OFFICE SUPPLIES">Office Supplies</option>
              <option value="MEAL & ENTERTAINMENT">Meal & Entertainment</option>
              <option value="TRAVEL & TRANSPORT">Travel & Transport</option>
            </select>
          </div>
        </div>

        <!-- Amount -->
        <div class="field-group">
          <label class="field-label">Amount :</label>
          <input type="number" id="itemAmount" class="form-ctrl" value="0.00" step="0.01" oninput="calcItemLocalAmount()" />
        </div>

        <!-- Item Currency -->
        <div class="field-group">
          <label class="field-label">Item Currency: <span class="req">*</span></label>
          <div class="select-wrapper">
            <select id="itemCurrency" class="form-ctrl">
              <option value="RINGGIT MALAYSIA" selected>RINGGIT MALAYSIA</option>
              <option value="US DOLLAR">US DOLLAR</option>
              <option value="SINGAPORE DOLLAR">SINGAPORE DOLLAR</option>
            </select>
          </div>
        </div>

        <!-- Forex Rate -->
        <div class="field-group">
          <label class="field-label">Forex Rate :</label>
          <input type="number" id="itemForexRate" class="form-ctrl" value="1.000" step="0.001" oninput="calcItemLocalAmount()" />
        </div>

        <!-- Local Amount -->
        <div class="field-group">
          <label class="field-label">Local Amount :</label>
          <input type="text" id="itemLocalAmount" class="form-ctrl" value="0.00" readonly style="color: var(--purple-primary); font-weight: 800;" />
        </div>

        <!-- Upload Attachments -->
        <div style="margin-top: 18px;">
          <label class="field-label" style="font-size: 13px; font-weight: 700; color: var(--text-primary); margin-bottom: 10px; display: block;">Upload Attachments :</label>
          <div style="display: flex; align-items: center; justify-content: center; gap: 36px; padding: 8px 0;">
            <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer;" onclick="triggerFileUpload('sub')">
              <div style="width: 50px; height: 50px; border-radius: 50%; background: rgba(124, 58, 237, 0.12); border: 1px solid rgba(124, 58, 237, 0.3); display: flex; align-items: center; justify-content: center; color: var(--purple-primary); font-size: 18px;">
                <i class="fa-solid fa-file-arrow-up"></i>
              </div>
              <span style="font-size: 12px; font-weight: 700; color: var(--purple-primary);">Select File(s)</span>
            </div>
            <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer;" onclick="triggerFileUpload('sub')">
              <div style="width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%); display: flex; align-items: center; justify-content: center; color: #ffffff; font-size: 18px; box-shadow: 0 6px 18px rgba(124, 58, 237, 0.45);">
                <i class="fa-solid fa-camera"></i>
              </div>
              <span style="font-size: 12px; font-weight: 800; color: var(--text-primary);">Take a Picture</span>
            </div>
          </div>
          <div id="subChipsList" style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; justify-content: center;"></div>
        </div>

        <!-- ACTION BUTTONS ROW (Clear Form & Add Claim's Item) -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 22px;">
          <button type="button" onclick="clearItemForm()" style="background: #0000ff; color: #ffffff; border: none; padding: 11px; border-radius: 14px; font-weight: 800; font-size: 13px; cursor: pointer; box-shadow: 0 4px 12px rgba(0, 0, 255, 0.35);">
            Clear Form
          </button>
          <button type="button" onclick="addClaimItem()" style="background: #008000; color: #ffffff; border: none; padding: 11px; border-radius: 14px; font-weight: 800; font-size: 13px; cursor: pointer; box-shadow: 0 4px 12px rgba(0, 128, 0, 0.35);">
            Add Claim's Item
          </button>
        </div>

        <!-- ADDED ITEMS TABLE -->
        <div style="margin-top: 22px; border-radius: 16px; overflow: hidden; border: 1px solid var(--border-subtle); background: var(--bg-card);">
          <div style="background: #e9d5ff; color: #4c1d95; padding: 12px 16px; display: grid; grid-template-columns: 2fr 1fr 1fr; font-weight: 800; font-size: 13px; border-bottom: 1px solid var(--border-subtle);">
            <span>Description</span>
            <span style="text-align: right;">Amount</span>
            <span style="text-align: right;">Actions</span>
          </div>
          <div id="itemsTableContainer">
            <!-- Populated by JS -->
          </div>
        </div>

      </div>

      <!-- BOTTOM PAGE ACTION BUTTONS -->
      <div style="display: flex; justify-content: flex-end; align-items: center; gap: 12px; margin-top: 24px;">
        <button type="button" class="btn-draft-bright" onclick="saveDraft()">
          <i class="fa-solid fa-floppy-disk"></i>
          <span>Save Draft</span>
        </button>
        <button type="button" class="btn-submit-primary" onclick="submitExpenseClaim()">
          <span>Submit</span>
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </div>

    </div>

    <phone-bottom-nav active="apps"></phone-bottom-nav>
  </div>

  <input type="file" id="globalFileInput" style="display: none;" onchange="handleFileSelect(this)" />

  <!-- TOAST NOTIFICATION -->
  <div id="toastNotification" class="toast-box">
    <span id="toastText">Action completed successfully</span>
  </div>

  <script>
    let itemsList = [
      { id: '1', txDate: '25/09/2026', receiptNo: 'RCP-9901', description: 'Stationery & Printing Paper', expenseCode: 'OFFICE SUPPLIES', amount: 120.00, currency: 'RINGGIT MALAYSIA', forexRate: 1.000, localAmount: 120.00 },
      { id: '2', txDate: '25/09/2026', receiptNo: 'RCP-9905', description: 'Client Discussion Coffee', expenseCode: 'MEAL & ENTERTAINMENT', amount: 45.00, currency: 'RINGGIT MALAYSIA', forexRate: 1.000, localAmount: 45.00 }
    ];

    let activeUploadContext = 'sub';
    const subAttachments = [];

    document.addEventListener('DOMContentLoaded', () => {
      renderItemsTable();
      updateClaimTotal();
    });

    function showToast(msg) {
      const toast = document.getElementById('toastNotification');
      const toastText = document.getElementById('toastText');
      if (toast && toastText) {
        toastText.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => {
          toast.classList.remove('show');
        }, 2800);
      }
    }

    let editingItemIndex = -1;

    function handleHeaderBack() {
      window.location.href = '../index.html';
    }

    function calcItemLocalAmount() {
      const amt = parseFloat(document.getElementById('itemAmount')?.value || 0);
      const forex = parseFloat(document.getElementById('itemForexRate')?.value || 1);
      const localEl = document.getElementById('itemLocalAmount');
      if (localEl) {
        localEl.value = (amt * forex).toFixed(2);
      }
    }

    function addClaimItem() {
      const txDate = document.getElementById('itemTxDate')?.value || '25/09/2026';
      const receiptNo = document.getElementById('itemReceiptNo')?.value.trim() || '';
      const description = document.getElementById('itemDescription')?.value.trim() || 'Expense Item';
      const expenseCode = document.getElementById('itemExpenseCode')?.value || 'GENERAL EXPENSE';
      const amount = parseFloat(document.getElementById('itemAmount')?.value || 0);
      const currency = document.getElementById('itemCurrency')?.value || 'RINGGIT MALAYSIA';
      const forexRate = parseFloat(document.getElementById('itemForexRate')?.value || 1);
      const localAmount = parseFloat((amount * forexRate).toFixed(2));

      if (amount <= 0 && !description) {
        showToast('⚠️ Please enter description and valid amount');
        return;
      }

      const itemData = {
        id: editingItemIndex >= 0 ? itemsList[editingItemIndex].id : Date.now().toString(),
        txDate,
        receiptNo,
        description: description || expenseCode,
        expenseCode,
        amount,
        currency,
        forexRate,
        localAmount: localAmount > 0 ? localAmount : amount
      };

      if (editingItemIndex >= 0) {
        itemsList[editingItemIndex] = itemData;
        editingItemIndex = -1;
        const addBtn = document.getElementById('btnAddClaimItem');
        if (addBtn) addBtn.innerText = 'Add to Claim';
        showToast('✏️ Claim item updated');
      } else {
        itemsList.push(itemData);
        showToast('✅ Claim item added');
      }

      renderItemsTable();
      updateClaimTotal();
      clearItemForm();
    }

    function editClaimItem(idx) {
      editingItemIndex = idx;
      const item = itemsList[idx];
      if (!item) return;

      if (document.getElementById('itemTxDate')) document.getElementById('itemTxDate').value = item.txDate || '25/09/2026';
      if (document.getElementById('itemReceiptNo')) document.getElementById('itemReceiptNo').value = item.receiptNo || '';
      if (document.getElementById('itemDescription')) document.getElementById('itemDescription').value = item.description || '';
      if (document.getElementById('itemExpenseCode')) document.getElementById('itemExpenseCode').value = item.expenseCode || 'GENERAL EXPENSE';
      if (document.getElementById('itemAmount')) document.getElementById('itemAmount').value = item.amount ? item.amount.toFixed(2) : '0.00';
      if (document.getElementById('itemCurrency')) document.getElementById('itemCurrency').value = item.currency || 'RINGGIT MALAYSIA';
      if (document.getElementById('itemForexRate')) document.getElementById('itemForexRate').value = item.forexRate ? item.forexRate.toFixed(3) : '1.000';
      if (document.getElementById('itemLocalAmount')) document.getElementById('itemLocalAmount').value = item.localAmount ? item.localAmount.toFixed(2) : '0.00';

      const addBtn = document.getElementById('btnAddClaimItem');
      if (addBtn) addBtn.innerText = 'Save Changes';

      const formContainer = document.querySelector('.form-card');
      if (formContainer) formContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
      showToast('✏️ Editing item: ' + item.description);
    }

    function clearItemForm() {
      editingItemIndex = -1;
      const addBtn = document.getElementById('btnAddClaimItem');
      if (addBtn) addBtn.innerText = 'Add to Claim';

      if (document.getElementById('itemReceiptNo')) document.getElementById('itemReceiptNo').value = '';
      if (document.getElementById('itemDescription')) document.getElementById('itemDescription').value = '';
      if (document.getElementById('itemExpenseCode')) document.getElementById('itemExpenseCode').value = '';
      if (document.getElementById('itemAmount')) document.getElementById('itemAmount').value = '0.00';
      if (document.getElementById('itemForexRate')) document.getElementById('itemForexRate').value = '1.000';
      if (document.getElementById('itemLocalAmount')) document.getElementById('itemLocalAmount').value = '0.00';
      
      subAttachments.length = 0;
      renderChips('subChipsList', subAttachments, 'sub');
    }

    function renderItemsTable() {
      const container = document.getElementById('itemsTableContainer');
      if (!container) return;

      if (itemsList.length === 0) {
        container.innerHTML = `
          <div style="padding: 16px; text-align: center; color: var(--text-muted); font-size: 12.5px; font-weight: 600;">
            No itemized expenses added yet.
          </div>
        `;
        return;
      }

      container.innerHTML = itemsList.map((item, idx) => `
        <div style="padding: 12px 16px; display: grid; grid-template-columns: 2fr 1fr 1fr; align-items: center; border-bottom: 1px solid var(--border-subtle); font-size: 13px;">
          <div>
            <div style="font-weight: 700; color: var(--text-primary); cursor: pointer;" onclick="editClaimItem(${idx})">${item.description}</div>
            <div style="font-size: 11px; color: var(--text-muted); margin-top: 2px;">
              ${item.expenseCode}${item.receiptNo ? ' • #' + item.receiptNo : ''}
            </div>
          </div>
          <div style="text-align: right; font-weight: 800; color: var(--text-primary);">
            ${item.localAmount ? item.localAmount.toFixed(2) : item.amount.toFixed(2)}
          </div>
          <div style="text-align: right; display: flex; align-items: center; justify-content: flex-end;">
            <button type="button" onclick="editClaimItem(${idx})" aria-label="Edit item" style="background: rgba(124, 58, 237, 0.14); border: 1px solid rgba(124, 58, 237, 0.3); color: var(--purple-primary); width: 28px; height: 28px; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; margin-right: 6px;">
              <i class="fa-solid fa-pen-to-square" style="font-size: 12px;"></i>
            </button>
            <button type="button" onclick="deleteClaimItem(${idx})" aria-label="Delete item" style="background: rgba(239, 68, 68, 0.12); border: none; color: #ef4444; width: 28px; height: 28px; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;">
              <i class="fa-solid fa-trash-can" style="font-size: 12px;"></i>
            </button>
          </div>
        </div>
      `).join('');
    }

    function deleteClaimItem(idx) {
      itemsList.splice(idx, 1);
      renderItemsTable();
      updateClaimTotal();
      showToast('🗑️ Item removed');
    }

    function updateClaimTotal() {
      const total = itemsList.reduce((sum, item) => sum + (item.localAmount || item.amount || 0), 0);
      const totalEl = document.getElementById('claimTotalInput');
      if (totalEl) {
        totalEl.value = total.toFixed(2);
      }
    }

    function triggerFileUpload(ctx) {
      activeUploadContext = ctx;
      document.getElementById('globalFileInput').click();
    }

    function handleFileSelect(input) {
      if (input.files && input.files.length > 0) {
        const fname = input.files[0].name;
        subAttachments.push(fname);
        renderChips('subChipsList', subAttachments, 'sub');
        showToast(`📎 Attachment added: ${fname}`);
      }
    }

    function renderChips(containerId, list, target) {
      const container = document.getElementById(containerId);
      if (!container) return;
      container.innerHTML = list.map((f, idx) => `
        <div style="background: rgba(124, 58, 237, 0.12); border: 1px solid rgba(124, 58, 237, 0.3); color: var(--purple-primary); padding: 5px 10px; border-radius: 10px; font-size: 11.5px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px;">
          <i class="fa-solid fa-paperclip"></i>
          <span>${f}</span>
          <i class="fa-solid fa-xmark" style="cursor: pointer; font-size: 11px;" onclick="removeFile('${target}', ${idx})"></i>
        </div>
      `).join('');
    }

    function removeFile(target, idx) {
      subAttachments.splice(idx, 1);
      renderChips('subChipsList', subAttachments, 'sub');
      showToast('🗑️ Attachment removed');
    }

    function saveDraft() {
      showToast('💾 Expense Claim draft saved!');
    }

    function submitExpenseClaim() {
      showToast('🚀 Expense Claim submitted successfully!');
      setTimeout(() => {
        window.location.href = '../index.html';
      }, 1200);
    }
  </script>
</body>
</html>
