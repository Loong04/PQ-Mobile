<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Claims - Expense Claim</title>
  <script src="../../../js/components.js"></script>
  <script src="../../../js/app.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../css/theme.css">
  <link rel="stylesheet" href="../../../css/app.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    body {
      background-color: var(--bg-page);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: var(--text-primary);
      padding: 20px 0;
    }
    .phone-container {
      width: 100%;
      max-width: 420px;
      height: 900px;
      background: var(--bg-phone);
      border-radius: 44px;
      overflow: hidden;
      box-shadow: var(--shadow-phone);
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 100px;
      position: relative;
      z-index: 10;
      scrollbar-width: none;
    }
    .main-content::-webkit-scrollbar { display: none; }

    .cal-top-header {
      background: linear-gradient(135deg, #4c1d95 0%, #6d28d9 50%, #7c3aed 100%);
      padding: 12px 16px 16px;
      border-bottom-left-radius: 24px;
      border-bottom-right-radius: 24px;
      box-shadow: 0 8px 24px rgba(76, 29, 149, 0.28);
      position: relative;
      z-index: 20;
    }

    .view-container {
      display: none;
      width: 100%;
      animation: fadeIn 0.2s ease-in-out;
    }
    .view-container.active { display: block; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .form-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 22px;
      padding: 20px 18px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-card);
      position: relative;
    }

    .category-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 16px 18px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-card);
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .category-card:active {
      transform: scale(0.98);
      border-color: var(--purple-primary);
    }

    .section-header-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-top: 14px;
      margin-top: 14px;
      margin-bottom: 18px;
      border-top: 1px dashed var(--border-subtle);
    }
    .section-header-bar.no-top-border {
      border-top: none;
      padding-top: 0;
      margin-top: 0;
    }
    .section-title-accent {
      width: 3.5px;
      height: 15px;
      background: #a855f7;
      border-radius: 2px;
      display: inline-block;
      flex-shrink: 0;
    }
    .section-title-text {
      font-size: 13px;
      font-weight: 800;
      color: var(--text-primary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .field-group { margin-bottom: 16px; }
    .field-label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .field-label .req { color: #ef4444; margin-left: 2px; }

    .form-ctrl {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-primary);
      outline: none;
      transition: all 0.2s ease;
      appearance: none;
      font-family: inherit;
    }
    .form-ctrl:focus {
      border-color: var(--purple-primary);
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15);
    }
    .form-ctrl[readonly] {
      opacity: 0.9;
      background: rgba(255, 255, 255, 0.03);
    }

    .select-wrapper { position: relative; }
    .select-wrapper::after {
      content: "\f0d7";
      font-family: "Font Awesome 6 Free";
      font-weight: 900;
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
      font-size: 12px;
    }

    .btn-draft-bright {
      padding: 11px 24px;
      border-radius: 9999px;
      background: var(--bg-card);
      border: 1.5px solid var(--border-subtle);
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
    }
    .btn-draft-bright:active { transform: scale(0.96); }

    .btn-submit-primary {
      padding: 11px 26px;
      border-radius: 9999px;
      background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
      border: none;
      color: #ffffff;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 4px 18px rgba(124, 58, 237, 0.45);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }
    .btn-submit-primary:active {
      transform: scale(0.96);
      box-shadow: 0 2px 10px rgba(124, 58, 237, 0.35);
    }

    .btn-step-back {
      padding: 11px 22px;
      border-radius: 9999px;
      background: var(--bg-card);
      border: 1.5px solid var(--border-subtle);
      color: var(--text-primary);
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
    }
    .btn-step-back:active { transform: scale(0.96); }

    .file-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(124, 58, 237, 0.12);
      border: 1px solid rgba(124, 58, 237, 0.25);
      color: var(--purple-primary);
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 700;
      margin-top: 6px;
    }

    .toast-box {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #0f172a;
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 12.5px;
      font-weight: 700;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      white-space: nowrap;
    }
    .toast-box.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
    
    /* Top Claim Stepper Progress Indicator Standard */
    .claim-stepper-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 14px 16px 12px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-card);
      position: relative;
      overflow: hidden;
    }
    .stepper-track-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }
    .stepper-line-bg {
      position: absolute;
      top: 15px;
      left: 25%;
      right: 25%;
      height: 2px;
      background: rgba(255, 255, 255, 0.12);
      z-index: 1;
    }
    .stepper-line-fill {
      position: absolute;
      top: 15px;
      left: 25%;
      height: 2px;
      background: linear-gradient(90deg, #10b981 0%, #a855f7 100%);
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 2;
    }
    .stepper-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      position: relative;
      z-index: 3;
      cursor: pointer;
      flex: 1;
      user-select: none;
    }
    .stepper-circle {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #171529;
      border: 2px solid rgba(255, 255, 255, 0.2);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 800;
      transition: all 0.25s ease;
    }
    .stepper-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      white-space: nowrap;
      transition: all 0.25s ease;
    }
    /* Completed State */
    .stepper-item.completed .stepper-circle {
      border-color: #10b981;
      background: #171529;
      color: #10b981;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.25);
    }
    .stepper-item.completed .stepper-label {
      color: #34d399;
    }
    /* Active State */
    .stepper-item.active .stepper-circle {
      border-color: #a855f7;
      background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(124, 58, 237, 0.5);
      transform: scale(1.08);
    }
    .stepper-item.active .stepper-label {
      color: #ffffff;
      font-weight: 900;
    }
    html[data-theme="light"] .claim-stepper-card .stepper-line-bg { background: rgba(100, 116, 139, 0.24); }
    html[data-theme="light"] .claim-stepper-card .stepper-circle { background: #f1f5f9; border-color: #cbd5e1; color: #64748b; }
    html[data-theme="light"] .claim-stepper-card .stepper-label { color: #64748b; }
    html[data-theme="light"] .claim-stepper-card .stepper-item.completed .stepper-circle { background: #ecfdf5; border-color: #10b981; color: #059669; box-shadow: 0 0 10px rgba(16, 185, 129, 0.16); }
    html[data-theme="light"] .claim-stepper-card .stepper-item.completed .stepper-label { color: #059669; }
    html[data-theme="light"] .claim-stepper-card .stepper-item.active .stepper-circle { background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%); border-color: #a855f7; color: #ffffff; box-shadow: 0 4px 14px rgba(124, 58, 237, 0.34); }
    html[data-theme="light"] .claim-stepper-card .stepper-item.active .stepper-label { color: #6d28d9; font-weight: 900; }
  </style>
</head>
<body>

  <preview-top-bar active-page="claims"></preview-top-bar>

  <div class="phone-container">
    
    <!-- TOP HEADER -->
    <div class="cal-top-header">
      <phone-status-bar time="13:08" style="color: #ffffff;"></phone-status-bar>
      <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 4px;">
        <button type="button" id="headerBackBtn" class="header-back-btn" onclick="handleHeaderBack()" aria-label="Back" title="Back"
          style="background: rgba(255, 255, 255, 0.18); border: 1px solid rgba(255, 255, 255, 0.25); width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #ffffff; outline: none;">
          <i class="fa-solid fa-chevron-left" style="font-size: 16px;"></i>
        </button>
        <h1 id="headerTitleText" style="font-size: 18px; font-weight: 800; color: #ffffff; margin: 0;">Expense Claim</h1>
        <div style="width: 36px;"></div>
      </div>
    </div>

    <!-- MAIN SCROLLABLE CONTENT -->
    <div class="main-content" style="padding-bottom: 90px;">
      
      <!-- TOP STEPPER PROGRESS BAR (1: General, 2: Details) -->
      <div class="claim-stepper-card">
        <div class="stepper-track-container" style="justify-content: space-around;">
          <div class="stepper-line-bg" style="left: 25%; width: 50%;"></div>
          <div class="stepper-line-fill" id="stepperLineFill" style="left: 25%; width: 0%;"></div>
          
          <div class="stepper-item active" id="stepNode-1" onclick="navigateToStep(1)">
            <div class="stepper-circle">1</div>
            <span class="stepper-label">General</span>
          </div>
          <div class="stepper-item" id="stepNode-2" onclick="navigateToStep(2)">
            <div class="stepper-circle">2</div>
            <span class="stepper-label">Details</span>
          </div>
        </div>
      </div>

      <!-- ========================================================= -->
      <!-- VIEW 1: MAIN FORM (General - Drill-down Level 1) -->
      <!-- ========================================================= -->
      <div id="view-1-main" class="view-container active">
        
        <!-- MAIN APPLICATION DETAILS CARD -->
        <div class="form-card">
          <div class="section-header-bar no-top-border">
            <span class="section-title-accent"></span>
            <span class="section-title-text">APPLICATION DETAILS</span>
          </div>

          <!-- Claim Period (Year & Month) -->
          <div style="display: grid; grid-template-columns: 1fr 1.2fr; gap: 10px;" class="field-group">
            <div>
              <label class="field-label">Claim Period</label>
              <input type="text" id="claimPeriodYear" class="form-ctrl" value="2026" readonly />
            </div>
            <div>
              <label class="field-label">Month</label>
              <div class="select-wrapper">
                <select id="claimPeriodMonth" class="form-ctrl">
                  <option value="September" selected>September</option>
                  <option value="October">October</option>
                  <option value="November">November</option>
                </select>
              </div>
            </div>
          </div>

          <!-- Start Date & End Date -->
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;" class="field-group">
            <div>
              <label class="field-label">Start Date</label>
              <input type="date" id="claimDateFrom" class="form-ctrl" value="2026-09-25" />
            </div>
            <div>
              <label class="field-label">End Date</label>
              <input type="date" id="claimDateTo" class="form-ctrl" value="2026-09-25" />
            </div>
          </div>

          <!-- Benefit Year & Benefit Type -->
          <div style="display: grid; grid-template-columns: 1fr 1.2fr; gap: 10px;" class="field-group">
            <div>
              <label class="field-label">Benefit Year</label>
              <input type="text" id="benefitYear" class="form-ctrl" value="2026" readonly />
            </div>
            <div>
              <label class="field-label">Benefit Type</label>
              <div class="select-wrapper">
                <select id="benefitTypeSelect" class="form-ctrl">
                  <option value="" selected>Select Benefit</option>
                  <option value="GENERAL EXPENSE">General Expense</option>
                  <option value="OFFICE SUPPLIES">Office Supplies</option>
                  <option value="SUBSCRIPTIONS">Subscriptions & Software</option>
                </select>
              </div>
            </div>
          </div>

          <!-- Purpose -->
          <div class="field-group">
            <label class="field-label">Purpose<span class="req">*</span></label>
            <input type="text" id="claimPurpose" class="form-ctrl" value="" placeholder="Enter claim purpose..." />
          </div>

          <!-- Claim Currency -->
          <div class="field-group">
            <label class="field-label">Claim Currency</label>
            <div class="select-wrapper">
              <select id="claimCurrencySelect" class="form-ctrl">
                <option value="RINGGIT MALAYSIA" selected>RINGGIT MALAYSIA</option>
                <option value="US DOLLAR">US DOLLAR</option>
                <option value="SINGAPORE DOLLAR">SINGAPORE DOLLAR</option>
              </select>
            </div>
          </div>
          
          <!-- Claim Total (Live auto-calculated) -->
          <div class="field-group">
            <label class="field-label">Claim Total</label>
            <input type="text" id="claimTotalInput" class="form-ctrl" value="0.00" readonly style="color: var(--purple-primary); font-weight: 800;" />
          </div>

          <!-- Project -->
          <div class="field-group">
            <label class="field-label">Project</label>
            <div class="select-wrapper">
              <select id="projectSelect" class="form-ctrl">
                <option value="" selected>Select Project</option>
                <option value="HQ Digitalization">HQ Digitalization</option>
                <option value="Mobile HCM App">Mobile HCM App</option>
              </select>
            </div>
          </div>

          <!-- Cost Centre -->
          <div class="field-group">
            <label class="field-label">Cost Centre</label>
            <div class="select-wrapper">
              <select id="costCentreSelect" class="form-ctrl">
                <option value="MANAGEMENT" selected>MANAGEMENT</option>
                <option value="ADMINISTRATION">ADMINISTRATION</option>
                <option value="FINANCE & ACCOUNTING">FINANCE & ACCOUNTING</option>
              </select>
            </div>
          </div>

          <!-- Remarks -->
          <div class="field-group" style="margin-bottom: 0;">
            <label class="field-label">Remarks</label>
            <input type="text" id="claimRemarks" class="form-ctrl" placeholder="Enter remarks..." />
          </div>
        </div>

        <!-- AGGREGATED SUMMARY ROW (Level 1 Total Claim & Drill-down Entry) -->
        <div class="category-summary-row" onclick="openCategoryItems('expense')" style="background: linear-gradient(135deg, rgba(124, 58, 237, 0.12) 0%, rgba(109, 40, 217, 0.18) 100%); border: 1.5px solid rgba(124, 58, 237, 0.4); border-radius: 22px; padding: 18px; margin-bottom: 16px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 6px 20px rgba(124, 58, 237, 0.18); transition: transform 0.2s ease;">
          <div style="display: flex; align-items: center; gap: 14px;">
            <div style="width: 46px; height: 46px; border-radius: 14px; background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%); color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 20px; box-shadow: 0 4px 14px rgba(124, 58, 237, 0.45);">
              <i class="fa-solid fa-receipt"></i>
            </div>
            <div>
              <div style="font-size: 11px; font-weight: 800; color: var(--purple-primary); text-transform: uppercase; letter-spacing: 0.5px;">TOTAL EXPENSE CLAIM</div>
              <div id="v1TotalClaimDisplay" style="font-size: 20px; font-weight: 900; color: var(--text-primary); margin-top: 2px;">RM 0.00</div>
            </div>
          </div>
          <div style="display: flex; align-items: center; gap: 6px; background: rgba(124, 58, 237, 0.2); border: 1px solid rgba(124, 58, 237, 0.4); padding: 8px 14px; border-radius: 14px; color: var(--purple-primary); font-size: 12.5px; font-weight: 800;">
            <span>Details</span>
            <i class="fa-solid fa-chevron-right"></i>
          </div>
        </div>



        <!-- BOTTOM ACTION BUTTONS -->
        <div style="display: flex; justify-content: flex-end; align-items: center; gap: 12px; margin-top: 24px;">
          <button type="button" class="btn-draft-bright" onclick="saveDraft()">
            <i class="fa-solid fa-floppy-disk"></i>
            <span>Save Draft</span>
          </button>
          <button type="button" class="btn-submit-primary" onclick="submitClaim()">
            <span>Submit</span>
            <i class="fa-solid fa-paper-plane"></i>
          </button>
        </div>
      </div>

      <!-- ========================================================= -->
      <!-- VIEW 3: ITEM LIST VIEW (明细项列表页 - Drill-down Level 2) -->
      <!-- ========================================================= -->
      <div id="view-3-list" class="view-container">
        
        <!-- Unified Card for Header and Items -->
        <div class="form-card" style="padding: 0; overflow: hidden; display: flex; flex-direction: column; margin-bottom: 16px;">
          
          <!-- Category Summary Title Header (Matching advance-claim standard) -->
          <div style="padding: 14px 16px; border-bottom: 1px solid var(--border-subtle); display: flex; align-items: center; justify-content: space-between; background: rgba(255, 255, 255, 0.02);">
            <div style="display: flex; align-items: center; gap: 12px;">
              <div id="v3CategoryIconBox" style="width: 42px; height: 42px; border-radius: 14px; background: rgba(124, 58, 237, 0.15); color: var(--purple-primary); display: flex; align-items: center; justify-content: center; font-size: 18px;">
                <i class="fa-solid fa-receipt"></i>
              </div>
              <h2 id="v3CategoryTitleText" style="font-size: 15px; font-weight: 800; color: var(--text-primary); margin: 0;">Details</h2>
            </div>
            <button type="button" class="btn-submit-primary" style="padding: 8px 16px; font-size: 12.5px; border-radius: 12px; font-weight: 800; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; box-shadow: 0 4px 14px rgba(124, 58, 237, 0.35);" onclick="openEntryForm('add')">
              <i class="fa-solid fa-plus"></i>
              <span>Add Item</span>
            </button>
          </div>

          <!-- DYNAMIC ITEMS LIST / EMPTY STATE CONTAINER -->
          <div id="v3ItemsContainer" style="padding: 16px;">
            <!-- Populated by JS -->
          </div>
          
        </div>

        <!-- BOTTOM ACTION BUTTONS -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 24px;">
          <button type="button" class="btn-step-back" onclick="switchView('view-1-main', 'Expense Claim')">
            <i class="fa-solid fa-arrow-left"></i>
            <span>Back to Application</span>
          </button>
          <button type="button" class="btn-submit-primary" onclick="submitClaim()">
            <span>Submit</span>
            <i class="fa-solid fa-paper-plane"></i>
          </button>
        </div>

      </div>

      <!-- ========================================================= -->
      <!-- VIEW 4: ITEM DETAIL ENTRY VIEW (子表单录入页) -->
      <!-- ========================================================= -->
      <div id="view-4-entry" class="view-container">
        
        <!-- SUB-FORM CONTAINER -->
        <div id="v4SubFormContainer">
          <!-- Populated by JS -->
        </div>

        <!-- BOTTOM ACTION BUTTONS -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 24px;">
          <button type="button" class="btn-step-back" onclick="switchView('view-3-list', 'Details')">
            <i class="fa-solid fa-xmark"></i>
            <span>Cancel</span>
          </button>
          <button type="button" id="btnSaveSubItem" class="btn-submit-primary" onclick="saveSubItem()">
            <i class="fa-solid fa-floppy-disk"></i>
            <span>Save Item</span>
          </button>
        </div>

      </div>

    </div>

    <!-- Hidden File Inputs -->
    <input type="file" id="hiddenMainFileInput" accept="image/*,.pdf" style="display: none;" onchange="handleFileSelected(this, 'main')">
    <input type="file" id="hiddenSubFileInput" accept="image/*,.pdf" style="display: none;" onchange="handleFileSelected(this, 'sub')">

    <phone-bottom-nav active="apps"></phone-bottom-nav>
  </div>

  <div id="toastNotification" class="toast-box">
    <span id="toastText">Action completed successfully</span>
  </div>

  <!-- SCRIPT -->
  <script>
    const formData = {
      claimDetails: {
        addedDetails: []
      },
      mainAttachments: [],
      subAttachments: [],
      editingIndex: -1,
      currentView: 'view-1-main',
      activeCategory: 'expense',
      uploadTarget: 'sub'
    };

    function toDateInputValue(value) {
      const text = String(value || '');
      if (/^\d{4}-\d{2}-\d{2}$/.test(text)) return text;
      const match = text.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
      return match ? `${match[3]}-${match[2]}-${match[1]}` : '';
    }

    function toDisplayDate(value) {
      const text = String(value || '');
      const match = text.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      return match ? `${match[3]}/${match[2]}/${match[1]}` : text;
    }

    function showToast(msg) {
      const toast = document.getElementById('toastNotification');
      const toastText = document.getElementById('toastText');
      if (toast && toastText) {
        toastText.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2800);
      }
    }

    function updateStepperUI(stepNum) {
      const lineFill = document.getElementById('stepperLineFill');
      if (lineFill) {
        lineFill.style.width = stepNum >= 2 ? '50%' : '0%';
      }

      for (let i = 1; i <= 2; i++) {
        const node = document.getElementById('stepNode-' + i);
        if (!node) continue;
        node.classList.remove('active', 'completed');
        const circle = node.querySelector('.stepper-circle');
        if (circle) circle.textContent = i;
        if (i < stepNum) {
          node.classList.add('completed');
        } else if (i === stepNum) {
          node.classList.add('active');
        }
      }
    }

    function navigateToStep(stepNum) {
      if (stepNum === 1) {
        switchView('view-1-main', 'Expense Claim');
      } else if (stepNum === 2) {
        openCategoryItems('expense');
      }
    }

    function switchView(viewId, headerTitle) {
      formData.currentView = viewId;
      document.querySelectorAll('.view-container').forEach(el => el.classList.remove('active'));
      const targetView = document.getElementById(viewId);
      if (targetView) targetView.classList.add('active');

      const titleTextEl = document.getElementById('headerTitleText');
      if (titleTextEl && headerTitle) {
        titleTextEl.innerText = headerTitle;
      }

      if (viewId === 'view-3-list' || viewId === 'view-4-entry') {
        updateStepperUI(2);
      } else {
        updateStepperUI(formData.claimDetails.addedDetails.length > 0 ? 2 : 1);
      }

      const mainContent = document.querySelector('.main-content');
      if (mainContent) mainContent.scrollTop = 0;
      window.scrollTo(0, 0);
    }

    function handleHeaderBack() {
      if (formData.currentView === 'view-4-entry') {
        switchView('view-3-list', 'Details');
      } else if (formData.currentView === 'view-3-list') {
        switchView('view-1-main', 'Expense Claim');
      } else {
        window.location.href = '../index.html';
      }
    }

    function openCategoryItems(categoryKey) {
      formData.activeCategory = categoryKey;
      renderView3List();
      switchView('view-3-list', 'Details');
    }

    function renderLegacyView3List() {
      const iconBox = document.getElementById('v3CategoryIconBox');
      const titleText = document.getElementById('v3CategoryTitleText');
      const countText = document.getElementById('v3CategoryItemsCount');
      const container = document.getElementById('v3ItemsContainer');

      const items = formData.claimDetails.addedDetails;

      if (iconBox) iconBox.innerHTML = '<i class="fa-solid fa-receipt"></i>';
      if (titleText) titleText.innerText = 'Expense Items';
      if (countText) countText.innerText = items.length + ' record(s)';

      if (items.length === 0) {
        container.innerHTML = '<div style="text-align: center; padding: 24px 10px 14px;">' +
          '<div style="width: 50px; height: 50px; border-radius: 50%; background: rgba(124, 58, 237, 0.12); border: 1px solid rgba(124, 58, 237, 0.25); display: flex; align-items: center; justify-content: center; color: var(--purple-primary); font-size: 20px; margin: 0 auto 12px;">' +
            '<i class="fa-solid fa-folder-open"></i>' +
          '</div>' +
          '<div style="font-size: 14.5px; font-weight: 800; color: var(--text-primary); margin-bottom: 4px;">No items added yet</div>' +
          '<div style="font-size: 12px; font-weight: 600; color: var(--text-muted);">Click \"+ Add Item\" above to add a new expense item</div>' +
        '</div>';
        return;
      }

      let html = '<div style="display: flex; flex-direction: column; gap: 16px;">';
      items.forEach((item, idx) => {
        const borderStyle = idx === items.length - 1 ? '' : 'border-bottom: 1px dashed var(--border-subtle); padding-bottom: 16px;';
        const cardId = 'expCard_' + idx;
        const localAmtFormatted = (item.localAmount || 0).toFixed(2);
        
        let attachHtml = '';
        if (item.attachments && item.attachments.length > 0) {
          attachHtml = '<div style="margin-top: 12px; border-top: 1px dashed var(--border-subtle); padding-top: 10px;">' +
            '<span style="color: var(--text-muted); font-weight: 600;">Attachments:</span>' +
            '<div style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px;">' +
              item.attachments.map(att => '<div class="file-chip" style="background: rgba(124,58,237,0.08); border: 1px solid rgba(124,58,237,0.2); padding: 4px 8px; border-radius: 8px; font-size: 10.5px; font-weight: 700; color: var(--purple-primary); display: flex; align-items: center; gap: 4px;"><i class="fa-solid fa-paperclip"></i> ' + att + '</div>').join('') +
            '</div>' +
          '</div>';
        }

        html += '<div id="' + cardId + '" style="transition: all 0.25s ease; ' + borderStyle + '">' +
          '<div style="display: flex; align-items: center; justify-content: space-between; cursor: pointer;" onclick="toggleItemCard(\'' + cardId + '\')">' +
            '<div style="display: flex; align-items: center; gap: 10px;">' +
              '<div style="width: 36px; height: 36px; border-radius: 10px; background: rgba(124, 58, 237, 0.14); color: var(--purple-primary); display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0;">' +
                '<i class="fa-solid fa-receipt"></i>' +
              '</div>' +
              '<div>' +
                '<div style="font-size: 14px; font-weight: 800; color: var(--text-primary);">' + (item.expenseCode || 'EXPENSE') + '</div>' +
                '<div style="font-size: 11.5px; font-weight: 600; color: var(--text-muted); margin-top: 2px;">' + (item.desc || 'Expense description') + '</div>' +
              '</div>' +
            '</div>' +
            '<div style="display: flex; align-items: center; gap: 8px;">' +
              '<div style="font-size: 15px; font-weight: 800; color: var(--text-primary);">RM ' + localAmtFormatted + '</div>' +
              '<i class="fa-solid fa-chevron-down toggle-icon" style="color: var(--text-muted); font-size: 13px; padding: 4px; cursor: pointer; transition: transform 0.25s ease;" onclick="event.stopPropagation(); toggleItemCard(\'' + cardId + '\')"></i>' +
              '<i class="fa-solid fa-pen-to-square" style="color: var(--purple-primary); font-size: 14px; padding: 4px; cursor: pointer;" onclick="event.stopPropagation(); openEntryForm(\'edit\', ' + idx + ')" title="Edit Item"></i>' +
              '<i class="fa-solid fa-trash-can" style="color: #ef4444; font-size: 14px; padding: 4px; cursor: pointer;" onclick="event.stopPropagation(); deleteSubItem(' + idx + ')" title="Delete Item"></i>' +
            '</div>' +
          '</div>' +

          '<div class="item-details-body" style="display: none; padding-top: 14px; margin-top: 12px; border-top: 1px dashed var(--border-subtle);">' +
            '<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 11.5px;">' +
              '<div>' +
                '<span style="color: var(--text-muted); font-weight: 600;">Transaction Date:</span>' +
                '<div style="font-weight: 800; color: var(--text-primary); margin-top: 2px;">' + (item.txDate || '25/09/2026') + '</div>' +
              '</div>' +
              '<div>' +
                '<span style="color: var(--text-muted); font-weight: 600;">Receipt #:</span>' +
                '<div style="font-weight: 800; color: var(--text-primary); margin-top: 2px;">' + (item.receiptNo || 'N/A') + '</div>' +
              '</div>' +
              '<div style="grid-column: span 2;">' +
                '<span style="color: var(--text-muted); font-weight: 600;">Description:</span>' +
                '<div style="font-weight: 800; color: var(--text-primary); margin-top: 2px;">' + (item.desc || 'N/A') + '</div>' +
              '</div>' +
              '<div style="grid-column: span 2;">' +
                '<span style="color: var(--text-muted); font-weight: 600;">Expense Code:</span>' +
                '<div style="font-weight: 800; color: var(--text-primary); margin-top: 2px;">' + (item.expenseCode || 'GENERAL EXPENSE') + '</div>' +
              '</div>' +
              '<div>' +
                '<span style="color: var(--text-muted); font-weight: 600;">Amount:</span>' +
                '<div style="font-weight: 800; color: var(--text-primary); margin-top: 2px;">' + (item.amt || 0) + '</div>' +
              '</div>' +
              '<div>' +
                '<span style="color: var(--text-muted); font-weight: 600;">Item Currency:</span>' +
                '<div style="font-weight: 800; color: var(--text-primary); margin-top: 2px;">' + (item.currency || 'RINGGIT MALAYSIA') + '</div>' +
              '</div>' +
              '<div>' +
                '<span style="color: var(--text-muted); font-weight: 600;">Forex Rate:</span>' +
                '<div style="font-weight: 800; color: var(--text-primary); margin-top: 2px;">' + (item.forexRate || 1) + '</div>' +
              '</div>' +
              '<div>' +
                '<span style="color: var(--text-muted); font-weight: 600;">Local Amount:</span>' +
                '<div style="font-weight: 800; color: var(--text-primary); margin-top: 2px;">RM ' + localAmtFormatted + '</div>' +
              '</div>' +
            '</div>' +
            attachHtml +
          '</div>' +
        '</div>';
      });
      html += '</div>';
      container.innerHTML = html;
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      })[char]);
    }

    function renderView3List() {
      const iconBox = document.getElementById('v3CategoryIconBox');
      const titleText = document.getElementById('v3CategoryTitleText');
      const container = document.getElementById('v3ItemsContainer');
      const items = formData.claimDetails.addedDetails;

      if (iconBox) iconBox.innerHTML = '<i class="fa-solid fa-receipt"></i>';
      if (titleText) titleText.innerText = 'Details';

      if (items.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:24px 10px 14px;">' +
          '<div style="width:50px; height:50px; border-radius:50%; background:rgba(124,58,237,.12); border:1px solid rgba(124,58,237,.25); display:flex; align-items:center; justify-content:center; color:var(--purple-primary); font-size:20px; margin:0 auto 12px;"><i class="fa-solid fa-folder-open"></i></div>' +
          '<div style="font-size:14.5px; font-weight:800; color:var(--text-primary);">No items added yet</div>' +
        '</div>';
        return;
      }

      const detailRow = (label, value, valueColor) =>
        '<div style="display:grid; grid-template-columns:minmax(0,42%) minmax(0,58%); gap:12px; align-items:start; padding:8px 0; border-bottom:1px dashed var(--border-subtle); font-size:11.5px;">' +
          '<span style="color:var(--text-muted); font-weight:650;">' + label + '</span>' +
          '<span style="color:' + (valueColor || 'var(--text-primary)') + '; font-weight:800; text-align:right; overflow-wrap:anywhere;">' + value + '</span>' +
        '</div>';

      let html = '<div style="display:flex; flex-direction:column; gap:16px;">';
      items.forEach((item, idx) => {
        const cardId = 'expCard_' + idx;
        const localAmount = Number(item.localAmount || 0).toFixed(2);
        const attachmentNames = item.attachments?.length ? item.attachments : ['xxxx.jpg'];
        const attachmentValue = attachmentNames.map(name =>
          '<span class="file-chip" style="display:inline-flex; align-items:center; gap:4px; margin-left:5px; padding:4px 8px; border-radius:8px; background:rgba(124,58,237,.08); border:1px solid rgba(124,58,237,.2); color:var(--purple-primary);"><i class="fa-solid fa-paperclip"></i>' + escapeHtml(name) + '</span>'
        ).join('');

        html += '<div id="' + cardId + '" style="' + (idx < items.length - 1 ? 'border-bottom:1px dashed var(--border-subtle); padding-bottom:16px;' : '') + '">' +
          '<div style="display:flex; align-items:center; justify-content:space-between; gap:10px; cursor:pointer;" onclick="toggleItemCard(\'' + cardId + '\')">' +
            '<div style="display:flex; align-items:center; gap:10px; min-width:0;">' +
              '<div style="width:36px; height:36px; border-radius:10px; background:rgba(124,58,237,.14); color:var(--purple-primary); display:flex; align-items:center; justify-content:center; flex-shrink:0;"><i class="fa-solid fa-receipt"></i></div>' +
              '<div style="font-size:14px; font-weight:800; color:var(--text-primary); overflow-wrap:anywhere;">' + escapeHtml(item.expenseCode || 'Expense Detail') + '</div>' +
            '</div>' +
            '<div style="display:flex; align-items:center; gap:8px; flex-shrink:0;">' +
              '<div style="font-size:15px; font-weight:800; color:var(--text-primary);">RM ' + localAmount + '</div>' +
              '<i class="fa-solid fa-chevron-down toggle-icon" style="color:var(--text-muted); font-size:13px; padding:4px; transition:transform .25s ease;"></i>' +
              '<i class="fa-solid fa-pen-to-square" style="color:var(--purple-primary); font-size:14px; padding:4px; cursor:pointer;" onclick="event.stopPropagation(); openEntryForm(\'edit\', ' + idx + ')" title="Edit Item"></i>' +
              '<i class="fa-solid fa-trash-can" style="color:#ef4444; font-size:14px; padding:4px; cursor:pointer;" onclick="event.stopPropagation(); deleteSubItem(' + idx + ')" title="Delete Item"></i>' +
            '</div>' +
          '</div>' +
          '<div class="item-details-body" style="display:none; padding-top:8px; margin-top:12px; border-top:1px dashed var(--border-subtle);">' +
            detailRow('Transaction Date', escapeHtml(item.txDate || '—')) +
            detailRow('Receipt #', escapeHtml(item.receiptNo || '—')) +
            detailRow('Description', escapeHtml(item.desc || '—')) +
            detailRow('Expense Code', escapeHtml(item.expenseCode || '—')) +
            detailRow('Amount', Number(item.amt || 0).toFixed(2)) +
            detailRow('Item Currency', escapeHtml(item.currency || '—')) +
            detailRow('Forex Rate', Number(item.forexRate || 0).toFixed(3)) +
            detailRow('Local Amount', 'RM ' + localAmount) +
            detailRow('Attachment', attachmentValue) +
          '</div>' +
        '</div>';
      });
      container.innerHTML = html + '</div>';
    }

    function toggleItemCard(cardId) {
      const cardEl = document.getElementById(cardId);
      if (!cardEl) return;
      const bodyEl = cardEl.querySelector('.item-details-body');
      const iconEl = cardEl.querySelector('.toggle-icon');
      if (bodyEl) {
        const isHidden = bodyEl.style.display === 'none' || !bodyEl.style.display;
        bodyEl.style.display = isHidden ? 'block' : 'none';
        if (iconEl) {
          iconEl.style.transform = isHidden ? 'rotate(180deg)' : 'rotate(0deg)';
        }
      }
    }

    function deleteSubItem(idx) {
      formData.claimDetails.addedDetails.splice(idx, 1);
      recalcAllTotals();
      renderView3List();
      showToast('🗑️ Expense item removed!');
    }

    function openEntryForm(mode, editIdx) {
      if (!mode) mode = 'add';
      if (editIdx === undefined) editIdx = -1;

      formData.activeCategory = 'expense';
      const container = document.getElementById('v4SubFormContainer');

      if (mode === 'edit' && editIdx >= 0) {
        formData.editingIndex = editIdx;
      } else {
        formData.editingIndex = -1;
      }

      const isEdit = formData.editingIndex >= 0;
      const item = isEdit ? (formData.claimDetails.addedDetails[formData.editingIndex] || {}) : {};
      
      formData.subAttachments = (item.attachments ? [...item.attachments] : []);
      
      const titleText = isEdit ? 'EDIT EXPENSE ITEM' : 'ADD EXPENSE ITEM';
      const btnSaveEl = document.getElementById('btnSaveSubItem');
      if (btnSaveEl) {
        btnSaveEl.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> <span>' + (isEdit ? 'Save Changes' : 'Save Item') + '</span>';
      }

      container.innerHTML = '<div class="form-card">' +
        '<div class="section-header-bar no-top-border">' +
          '<span class="section-title-accent"></span>' +
          '<span class="section-title-text">' + titleText + '</span>' +
        '</div>' +

        '<div class="field-group">' +
          '<label class="field-label">Transaction Date</label>' +
          '<input type="date" id="itemTxDate" class="form-ctrl" value="' + toDateInputValue(item.txDate || '25/09/2026') + '" />' +
        '</div>' +

        '<div class="field-group">' +
          '<label class="field-label">Receipt #</label>' +
          '<input type="text" id="itemReceiptNo" class="form-ctrl" value="' + (item.receiptNo || '') + '" placeholder="Enter receipt number..." />' +
        '</div>' +

        '<div class="field-group">' +
          '<label class="field-label">Description</label>' +
          '<input type="text" id="itemDescription" class="form-ctrl" value="' + (item.desc || '') + '" placeholder="Enter description..." />' +
        '</div>' +

        '<div class="field-group">' +
          '<label class="field-label">Expense Code</label>' +
          '<div class="select-wrapper">' +
            '<select id="itemExpenseCode" class="form-ctrl">' +
              '<option value="" ' + (!item.expenseCode ? 'selected' : '') + '>Select Expense</option>' +
              '<option value="GENERAL EXPENSE" ' + (item.expenseCode === 'GENERAL EXPENSE' ? 'selected' : '') + '>General Expense</option>' +
              '<option value="OFFICE SUPPLIES" ' + (item.expenseCode === 'OFFICE SUPPLIES' ? 'selected' : '') + '>Office Supplies</option>' +
              '<option value="MEAL & ENTERTAINMENT" ' + (item.expenseCode === 'MEAL & ENTERTAINMENT' ? 'selected' : '') + '>Meal & Entertainment</option>' +
              '<option value="TRAVEL & TRANSPORT" ' + (item.expenseCode === 'TRAVEL & TRANSPORT' ? 'selected' : '') + '>Travel & Transport</option>' +
            '</select>' +
          '</div>' +
        '</div>' +

        '<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;" class="field-group">' +
          '<div>' +
            '<label class="field-label">Amount</label>' +
            '<input type="number" id="itemAmount" class="form-ctrl" value="' + (item.amt !== undefined ? item.amt : '0.00') + '" step="0.01" oninput="calcSubLocalAmount()" />' +
          '</div>' +
          '<div>' +
            '<label class="field-label">Item Currency <span class="req">*</span></label>' +
            '<div class="select-wrapper">' +
              '<select id="itemCurrency" class="form-ctrl" onchange="calcSubLocalAmount()">' +
                '<option value="RINGGIT MALAYSIA" ' + (item.currency === 'RINGGIT MALAYSIA' || !item.currency ? 'selected' : '') + '>RINGGIT MALAYSIA</option>' +
                '<option value="US DOLLAR" ' + (item.currency === 'US DOLLAR' ? 'selected' : '') + '>US DOLLAR</option>' +
                '<option value="SINGAPORE DOLLAR" ' + (item.currency === 'SINGAPORE DOLLAR' ? 'selected' : '') + '>SINGAPORE DOLLAR</option>' +
              '</select>' +
            '</div>' +
          '</div>' +
        '</div>' +

        '<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;" class="field-group">' +
          '<div>' +
            '<label class="field-label">Forex Rate</label>' +
            '<input type="number" id="itemForexRate" class="form-ctrl" value="' + (item.forexRate !== undefined ? item.forexRate : '1.000') + '" step="0.001" oninput="calcSubLocalAmount()" />' +
          '</div>' +
          '<div>' +
            '<label class="field-label">Local Amount</label>' +
            '<input type="text" id="itemLocalAmount" class="form-ctrl" value="' + (item.localAmount !== undefined ? item.localAmount.toFixed(2) : '0.00') + '" readonly style="font-weight: 800;" />' +
          '</div>' +
        '</div>' +

        '<div style="margin-top: 14px;">' +
          '<label class="field-label" style="font-size: 13px; font-weight: 700; color: var(--text-primary); margin-bottom: 10px; display: block;">Upload Attachments</label>' +
          '<div style="display: flex; align-items: center; justify-content: center; gap: 36px; padding: 8px 0;">' +
            '<div style="display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer;" onclick="triggerFileUpload(\'sub\')">' +
              '<div style="width: 50px; height: 50px; border-radius: 50%; background: rgba(124, 58, 237, 0.12); border: 1px solid rgba(124, 58, 237, 0.3); display: flex; align-items: center; justify-content: center; color: var(--purple-primary); font-size: 18px;">' +
                '<i class="fa-solid fa-file-arrow-up"></i>' +
              '</div>' +
              '<span style="font-size: 12px; font-weight: 700; color: var(--purple-primary);">Select File(s)</span>' +
            '</div>' +
            '<div style="display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer;" onclick="triggerFileUpload(\'sub\')">' +
              '<div style="width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%); display: flex; align-items: center; justify-content: center; color: #ffffff; font-size: 18px; box-shadow: 0 6px 18px rgba(124, 58, 237, 0.45);">' +
                '<i class="fa-solid fa-camera"></i>' +
              '</div>' +
              '<span style="font-size: 12px; font-weight: 800; color: var(--text-primary);">Take a Picture</span>' +
            '</div>' +
          '</div>' +
          '<div id="subChipsList" style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; justify-content: center;"></div>' +
        '</div>' +

      '</div>';

      switchView('view-4-entry', isEdit ? 'Edit Details' : 'Add Details');
      renderSubChips();
    }

    function calcSubLocalAmount() {
      const amt = parseFloat(document.getElementById('itemAmount')?.value || 0);
      const rate = parseFloat(document.getElementById('itemForexRate')?.value || 1);
      const local = (amt * rate).toFixed(2);
      const locEl = document.getElementById('itemLocalAmount');
      if (locEl) locEl.value = local;
    }

    function saveSubItem() {
      const txDate = toDisplayDate(document.getElementById('itemTxDate')?.value) || '25/09/2026';
      const receiptNo = document.getElementById('itemReceiptNo')?.value.trim() || '';
      const expenseCode = document.getElementById('itemExpenseCode')?.value || 'GENERAL EXPENSE';
      const desc = document.getElementById('itemDescription')?.value.trim() || '';
      const amt = parseFloat(document.getElementById('itemAmount')?.value || 0);
      const currency = document.getElementById('itemCurrency')?.value || 'RINGGIT MALAYSIA';
      const forexRate = parseFloat(document.getElementById('itemForexRate')?.value || 1);
      const localAmount = parseFloat(document.getElementById('itemLocalAmount')?.value || 0);

      const isEdit = formData.editingIndex >= 0;
      const itemObj = { 
        id: isEdit ? formData.claimDetails.addedDetails[formData.editingIndex].id : Date.now().toString(),
        txDate, 
        receiptNo, 
        expenseCode, 
        desc, 
        amt, 
        currency, 
        forexRate, 
        localAmount: localAmount > 0 ? localAmount : (amt * forexRate),
        attachments: [...(formData.subAttachments || [])]
      };

      if (isEdit) {
        formData.claimDetails.addedDetails[formData.editingIndex] = itemObj;
      } else {
        formData.claimDetails.addedDetails.push(itemObj);
      }

      formData.editingIndex = -1;
      recalcAllTotals();
      openCategoryItems('expense');

      showToast(isEdit ? '✏️ Expense item updated!' : '✅ Expense item saved!');
    }

    function recalcAllTotals() {
      const grandTotal = formData.claimDetails.addedDetails.reduce((sum, i) => sum + (i.localAmount || 0), 0);
      // Update View 1 Total Summary Display
      const v1Total = document.getElementById('v1TotalClaimDisplay');
      if (v1Total) v1Total.innerText = 'RM ' + grandTotal.toFixed(2);

      // Update View 1 Main Form "Claim Total" Input
      const claimTotalInput = document.getElementById('claimTotalInput');
      if (claimTotalInput) claimTotalInput.value = grandTotal.toFixed(2);

    }

    function triggerFileUpload(target) {
      formData.uploadTarget = target;
      if (target === 'main') {
        const input = document.getElementById('hiddenMainFileInput');
        if (input) input.click();
      } else {
        const input = document.getElementById('hiddenSubFileInput');
        if (input) input.click();
      }
    }

    function handleFileSelected(input, target) {
      if (!input.files || !input.files[0]) return;
      const fname = input.files[0].name;
      if (target === 'main') {
        if (!formData.mainAttachments) formData.mainAttachments = [];
        formData.mainAttachments.push(fname);
        renderMainChips();
        showToast('📎 Main attachment added: ' + fname);
      } else {
        if (!formData.subAttachments) formData.subAttachments = [];
        formData.subAttachments.push(fname);
        renderSubChips();
        showToast('📎 Attachment added: ' + fname);
      }
      input.value = '';
    }

    function removeMainAttachment(idx) {
      if (!formData.mainAttachments) return;
      formData.mainAttachments.splice(idx, 1);
      renderMainChips();
    }

    function removeSubAttachment(idx) {
      if (!formData.subAttachments) return;
      formData.subAttachments.splice(idx, 1);
      renderSubChips();
    }

    function renderMainChips() {
      const container = document.getElementById('mainChipsList');
      if (!container) return;
      if (!formData.mainAttachments || formData.mainAttachments.length === 0) {
        container.innerHTML = '';
        return;
      }
      container.innerHTML = formData.mainAttachments.map((att, idx) => {
        return '<div class="file-chip" style="background: rgba(124,58,237,0.08); border: 1px solid rgba(124,58,237,0.2); padding: 4px 8px; border-radius: 8px; font-size: 10.5px; font-weight: 700; color: var(--purple-primary); display: flex; align-items: center; gap: 4px;">' +
          '<i class="fa-solid fa-paperclip"></i>' +
          '<span>' + att + '</span>' +
          '<i class="fa-solid fa-xmark" style="cursor:pointer; margin-left:4px;" onclick="removeMainAttachment(' + idx + ')"></i>' +
        '</div>';
      }).join('');
    }

    function renderSubChips() {
      const container = document.getElementById('subChipsList');
      if (!container) return;
      if (!formData.subAttachments || formData.subAttachments.length === 0) {
        container.innerHTML = '';
        return;
      }
      container.innerHTML = formData.subAttachments.map((att, idx) => {
        return '<div class="file-chip" style="background: rgba(124,58,237,0.08); border: 1px solid rgba(124,58,237,0.2); padding: 4px 8px; border-radius: 8px; font-size: 10.5px; font-weight: 700; color: var(--purple-primary); display: flex; align-items: center; gap: 4px;">' +
          '<i class="fa-solid fa-paperclip"></i>' +
          '<span>' + att + '</span>' +
          '<i class="fa-solid fa-xmark" style="cursor:pointer; margin-left:4px;" onclick="removeSubAttachment(' + idx + ')"></i>' +
        '</div>';
      }).join('');
    }

    function saveDraft() {
      showToast('💾 Expense Claim draft saved!');
    }

    function submitClaim() {
      showToast('🚀 Expense Claim submitted successfully!');
      setTimeout(() => {
        window.location.href = '../index.html';
      }, 1000);
    }

    window.addEventListener('DOMContentLoaded', () => {
      recalcAllTotals();
      renderMainChips();
    });
  </script>
</body>
</html>
