<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PeopleHCM - Expenses Highlight</title>
  <script src="../../../js/components.js"></script>
  <script src="../../../js/app.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../css/theme.css">
  <link rel="stylesheet" href="../../../css/app.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg-page); display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; color: var(--text-primary); padding: 20px 0; }
    .phone-container { width: 100%; max-width: 420px; height: 900px; background: var(--bg-phone); border-radius: 44px; overflow: hidden; box-shadow: var(--shadow-phone); position: relative; display: flex; flex-direction: column; }
    .main-content { flex: 1; overflow-y: auto; padding: 16px 16px 90px; position: relative; z-index: 10; scrollbar-width: none; }
    .main-content::-webkit-scrollbar { display: none; }
    .cal-top-header { background: linear-gradient(135deg, #4c1d95 0%, #6d28d9 50%, #7c3aed 100%); padding: 12px 16px 16px; border-bottom-left-radius: 24px; border-bottom-right-radius: 24px; box-shadow: 0 8px 24px rgba(76, 29, 149, 0.28); position: relative; z-index: 20; }
    .card { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 20px; padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow-card); }
  </style>
</head>
<body>

  <preview-top-bar active-page="claims"></preview-top-bar>

  <div class="phone-container">
    <div class="cal-top-header">
      <phone-status-bar time="9:41" style="color: #ffffff;"></phone-status-bar>
      <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 4px;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <a href="../index.html" class="me-back-btn" style="background: rgba(255, 255, 255, 0.18); border: 1px solid rgba(255, 255, 255, 0.25); width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #ffffff; text-decoration: none;">
            <i class="fa-solid fa-chevron-left" style="font-size: 16px;"></i>
          </a>
          <h1 style="font-size: 18px; font-weight: 800; color: #ffffff; margin: 0;">Expenses Highlight</h1>
        </div>
      </div>
    </div>

    <div class="main-content">
      
      <!-- Top Card -->
      <div class="card" style="background: linear-gradient(135deg, rgba(16, 185, 129, 0.12) 0%, rgba(16, 185, 129, 0.04) 100%); border: 1px solid rgba(16, 185, 129, 0.3);">
        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
          <div>
            <div style="font-size: 11px; font-weight: 800; color: #10b981; text-transform: uppercase;">DEPARTMENT SPEND BREAKDOWN</div>
            <div style="font-size: 22px; font-weight: 900; color: var(--text-primary); margin: 4px 0;">RM 4,250.00 / RM 15,000</div>
            <div style="font-size: 12px; color: #10b981; font-weight: 700; margin-top: 2px;">✔ 28.3% Budget Utilized</div>
          </div>
          <button style="display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 13px; border-radius: 12px; background: rgba(16, 185, 129, 0.14); border: 1px solid rgba(16, 185, 129, 0.3); color: #10b981; font-weight: 800; font-size: 12px; white-space: nowrap; cursor: pointer;" onclick="alert('Viewing department expense breakdown chart')">
            <i class="fa-solid fa-chart-pie"></i><span>View Chart</span>
          </button>
        </div>
      </div>

      <!-- Detail Spikes -->
      <div class="card">
        <h3 style="font-size: 15px; font-weight: 800; color: var(--text-primary); margin-bottom: 12px;">Expense Categories</h3>
        
        <div style="margin-bottom: 12px;">
          <div style="display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 700;">
            <span>Client Dining &amp; Entertainment</span>
            <span style="color: #7c3aed;">RM 1,850.00</span>
          </div>
          <div style="width: 100%; height: 6px; background: var(--bg-input); border-radius: 4px; overflow: hidden; margin-top: 6px;">
            <div style="width: 43%; height: 100%; background: #7c3aed;"></div>
          </div>
        </div>

        <div style="margin-bottom: 12px;">
          <div style="display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 700;">
            <span>Travel Mileage &amp; Tolls</span>
            <span style="color: #3b82f6;">RM 1,420.00</span>
          </div>
          <div style="width: 100%; height: 6px; background: var(--bg-input); border-radius: 4px; overflow: hidden; margin-top: 6px;">
            <div style="width: 33%; height: 100%; background: #3b82f6;"></div>
          </div>
        </div>

        <div>
          <div style="display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 700;">
            <span>Office Supplies &amp; Printing</span>
            <span style="color: #10b981;">RM 980.00</span>
          </div>
          <div style="width: 100%; height: 6px; background: var(--bg-input); border-radius: 4px; overflow: hidden; margin-top: 6px;">
            <div style="width: 23%; height: 100%; background: #10b981;"></div>
          </div>
        </div>
      </div>

    </div>

    <phone-bottom-nav active="apps"></phone-bottom-nav>
  </div>
</body>
</html>
