<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleHCM - Workplace History</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../css/theme.css">
  <link rel="stylesheet" href="../../../css/app.css">
  <link rel="stylesheet" href="../../../css/claim-forms.css">
  <link rel="stylesheet" href="../../../css/history-cards.css">
  <link rel="stylesheet" href="../../../css/payroll-history.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/workplace-history.css">
  <script src="../../../js/components.js"></script>
  <script src="../../../js/app.js" defer></script>
  <script src="../js/admin-app.js" defer></script>
  <script src="../js/workplace-history-store.js" defer></script>
  <script src="../js/workplace-history.js" defer></script>
</head>
<body class="admin-page workplace-history-page">
  <preview-top-bar active-page="workplace"></preview-top-bar>
  <div class="phone-container payroll-history-phone">
    <header class="admin-header">
      <phone-status-bar time="9:41"></phone-status-bar>
      <div class="admin-header-row">
        <a class="admin-back" data-admin-back href="../index.html" aria-label="Back to Workplace"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></a>
        <div class="admin-heading"><h1>History</h1><p>Workplace</p></div><span aria-hidden="true"></span>
      </div>
    </header>
    <main class="main-content admin-content">
      <div class="history-categories" aria-label="History categories"><div class="me-jump-bar">
        <button class="me-jump-pill active" type="button" data-history-kind="guest-visit" aria-pressed="true">Guest Visit</button>
        <button class="me-jump-pill" type="button" data-history-kind="letter-request" aria-pressed="false">Letter Request</button>
      </div></div>
      <button id="historyFilterTrigger" class="claim-filter-bar" type="button" aria-haspopup="dialog" aria-controls="historyFilterModal">
        <span class="claim-filter-copy"><span class="claim-eyebrow">Current Filter</span><span id="historyFilterSummary" class="claim-filter-value">All Guest Visits</span></span>
        <span class="claim-icon-button" aria-hidden="true"><i class="fa-solid fa-sliders"></i></span>
      </button>
      <div class="history-section-heading"><h2 id="historyCategoryTitle">Guest Visit History</h2><span id="historyRecordCount" aria-live="polite"></span></div>
      <p id="historyLoadError" class="history-filter-error" role="status" hidden></p>
      <div id="workplaceHistoryList" aria-live="polite"></div>
      <div id="historyEmptyState" class="history-empty" hidden><i class="fa-regular fa-folder-open" aria-hidden="true"></i><h3>No records found</h3><p id="historyEmptyDescription">Saved Guest Visit requests will appear here.</p></div>
    </main>
    <phone-bottom-nav active="apps"></phone-bottom-nav>
    <div id="historyFilterModal" class="claim-filter-sheet" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="historyFilterTitle">
      <form id="historyFilterForm" class="claim-filter-panel" novalidate>
        <div class="claim-filter-handle" aria-hidden="true"></div>
        <div class="claim-filter-header"><h2 id="historyFilterTitle" class="claim-filter-title">Filter History</h2><div class="claim-filter-header-actions">
          <button id="resetHistoryFilter" type="button" class="claim-filter-reset"><i class="fa-solid fa-rotate-left" aria-hidden="true"></i><span>Reset</span></button>
          <button id="closeHistoryFilter" type="button" class="claim-filter-close" aria-label="Close filter"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
        </div></div>
        <div class="claim-filter-fields">
          <div class="history-date-fields"><div><label for="historyDateFrom" class="claim-filter-label">Start Date</label><input id="historyDateFrom" class="claim-control" type="date"></div><div><label for="historyDateTo" class="claim-filter-label">End Date</label><input id="historyDateTo" class="claim-control" type="date"></div></div>
          <div><label for="historyStatus" class="claim-filter-label">Status</label><div class="claim-filter-select-wrap"><select id="historyStatus" class="claim-filter-select"><option value="">All Statuses</option><option value="submitted">Submitted</option><option value="resubmit">Resubmit</option><option value="approved">Approved</option><option value="rejected">Rejected</option></select><i class="fa-solid fa-chevron-down claim-filter-chevron" aria-hidden="true"></i></div></div>
          <p id="historyFilterError" class="history-filter-error" role="alert" hidden></p>
        </div>
        <button id="applyHistoryFilter" class="claim-filter-apply" type="submit">Apply Filter</button>
      </form>
    </div>
    <div id="historyDetailsModal" class="history-detail-overlay" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="historyDetailTitle">
      <section class="history-detail-panel"><div class="history-detail-header"><h2 id="historyDetailTitle">Guest Visit Details</h2><button id="closeHistoryDetails" type="button" aria-label="Close details"><i class="fa-solid fa-circle-xmark" aria-hidden="true"></i></button></div><div id="historyDetailBody" class="history-detail-body" tabindex="0" role="region" aria-label="Request details"></div></section>
    </div>
  </div>
</body>
</html>
