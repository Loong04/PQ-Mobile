<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleHCM - Policy Document</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../css/theme.css">
  <link rel="stylesheet" href="../../../css/app.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/policy-sop.css">
  <script src="../../../js/components.js"></script>
  <script src="../../../js/app.js" defer></script>
  <script src="../js/policy-data.js" defer></script>
  <script src="../js/policy-document.js" defer></script>
</head>
<body class="admin-page policy-page policy-document-page">
  <preview-top-bar active-page="workplace"></preview-top-bar>
  <div class="phone-container">
    <header class="admin-header">
      <phone-status-bar time="9:41"></phone-status-bar>
      <div class="admin-header-row">
        <a id="policyDocumentBack" class="admin-back" href="policy-sop.html" aria-label="Back to Policy / SOP"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></a>
        <div class="admin-heading"><h1>Policy</h1><p>Policy / SOP</p></div>
        <span aria-hidden="true"></span>
      </div>
    </header>
    <main class="main-content admin-content">
      <section id="policyDocumentPreview" aria-label="Policy document" hidden>
        <div class="policy-document-file">
          <span class="policy-card-icon"><i class="fa-solid fa-file-lines" aria-hidden="true"></i></span>
          <div><h2 id="policyDocumentFilename"></h2><p id="policyDocumentMeta"></p></div>
        </div>
        <div class="policy-preview-toolbar"><span><i class="fa-regular fa-file-lines" aria-hidden="true"></i>Page 1</span></div>
        <figure class="policy-paper"><img id="policyDocumentImage" width="595" height="842" alt="PeopleTime Version 2.0 User Guide cover"></figure>
      </section>
      <section id="policyDocumentUnavailable" class="policy-empty" hidden><span class="policy-empty-icon"><i class="fa-regular fa-file" aria-hidden="true"></i></span><h2>Document unavailable</h2><p>Return to Policy / SOP to select a document.</p></section>
    </main>
    <phone-bottom-nav active="apps"></phone-bottom-nav>
  </div>
</body>
</html>
