<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleHCM - Workplace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../css/theme.css">
  <link rel="stylesheet" href="../../css/app.css">
  <link rel="stylesheet" href="css/admin.css">
  <script src="../../js/components.js"></script>
  <script src="../../js/app.js" defer></script>
  <script src="js/workplace-history-store.js" defer></script>
  <script src="js/admin-app.js" defer></script>
</head>
<body class="admin-page">
  <preview-top-bar active-page="workplace"></preview-top-bar>
  <div class="phone-container">
    <header class="admin-header">
      <phone-status-bar time="9:41"></phone-status-bar>
      <div class="admin-header-row">
        <a class="admin-back" href="../../appdark.html" onclick="navTo('nav_apps', event)" aria-label="Back to apps"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></a>
        <div class="admin-heading"><h1>Workplace</h1><p id="workplaceScopeSubtitle">Individual</p></div>
        <span aria-hidden="true"></span>
      </div>
    </header>
    <main class="main-content admin-content">
      <div class="workplace-scope" role="tablist" aria-label="Workplace scope">
        <button type="button" id="workplaceTabIndividual" class="workplace-scope-tab active" role="tab" aria-selected="true" aria-controls="workplaceIndividualPanel"><i class="fa-solid fa-user" aria-hidden="true"></i><span>Individual</span></button>
        <button type="button" id="workplaceTabTeam" class="workplace-scope-tab" role="tab" aria-selected="false" aria-controls="workplaceTeamPanel" tabindex="-1"><i class="fa-solid fa-users" aria-hidden="true"></i><span>Team</span></button>
      </div>
      <div id="workplaceIndividualPanel" class="workplace-scope-panel" role="tabpanel" aria-labelledby="workplaceTabIndividual">
      <section id="workplaceDocumentStatus" class="workplace-document-status" aria-labelledby="workplaceDocumentStatusTitle">
        <h2 id="workplaceDocumentStatusTitle">My Document Status</h2>
        <div class="workplace-status-grid">
          <a class="workplace-status-card submitted" data-document-status="submitted" href="options/history.html"><strong>0</strong><span>Submitted</span><small>In Review</small></a>
          <a class="workplace-status-card resubmit" data-document-status="resubmit" href="options/history.html"><strong>0</strong><span>Resubmit</span><small>Needs Action</small></a>
          <a class="workplace-status-card approved" data-document-status="approved" href="options/history.html"><strong>0</strong><span>Approved</span><small>Confirmed</small></a>
          <a class="workplace-status-card rejected" data-document-status="rejected" href="options/history.html"><strong>0</strong><span>Rejected</span><small>Declined</small></a>
        </div>
        <p id="workplaceStatusError" role="status" hidden></p>
      </section>
      <section aria-labelledby="adminOptionsTitle">
        <h2 class="admin-section-title" id="adminOptionsTitle">OPTIONS</h2>
        <div class="admin-options">
          <a class="admin-option" data-tone="purple" href="options/news.html">
            <span class="admin-option-icon"><i class="fa-solid fa-newspaper" aria-hidden="true"></i></span>
            <span class="admin-option-title">News</span>
          </a>
          <a class="admin-option" data-tone="purple" href="options/book-resource.html">
            <span class="admin-option-icon"><i class="fa-solid fa-calendar-check" aria-hidden="true"></i></span>
            <span class="admin-option-title">Book Resource</span>
          </a>
          <a class="admin-option" data-tone="purple" href="options/letter-request.html">
            <span class="admin-option-icon"><i class="fa-solid fa-envelope-open-text" aria-hidden="true"></i></span>
            <span class="admin-option-title">Letter Request</span>
          </a>
          <a class="admin-option" data-tone="purple" href="options/guest-visit.html">
            <span class="admin-option-icon"><i class="fa-solid fa-user-group" aria-hidden="true"></i></span>
            <span class="admin-option-title">Guest Visit</span>
          </a>
          <a class="admin-option" data-tone="purple" href="options/policy-sop.html">
            <span class="admin-option-icon"><i class="fa-solid fa-file-shield" aria-hidden="true"></i></span>
            <span class="admin-option-title">Policy / SOP</span>
          </a>
          <a class="admin-option" data-tone="purple" data-option-id="history" href="options/history.html">
            <span class="admin-option-icon"><i class="fa-solid fa-clock-rotate-left" aria-hidden="true"></i></span>
            <span class="admin-option-title">History</span>
          </a>
        </div>
      </section>
      </div>
      <div id="workplaceTeamPanel" class="workplace-scope-panel" role="tabpanel" aria-labelledby="workplaceTabTeam" hidden></div>
    </main>
    <phone-bottom-nav active="apps"></phone-bottom-nav>
  </div>
</body>
</html>
