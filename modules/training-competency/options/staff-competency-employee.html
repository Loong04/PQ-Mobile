<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleHCM - Employee Competency</title>
  <script>(() => { document.documentElement.dataset.theme = new URLSearchParams(location.search).get('theme') === 'light' ? 'light' : 'dark'; })();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../css/theme.css"><link rel="stylesheet" href="../../../css/app.css">
  <link rel="stylesheet" href="../../../css/attendance-highlight-report.css"><link rel="stylesheet" href="../../../css/detail-popout.css">
  <link rel="stylesheet" href="../css/training-competency.css"><link rel="stylesheet" href="../../performance/css/performance-highlight.css">
  <link rel="stylesheet" href="../css/competency-summary.css">
  <script src="../../../js/components.js"></script><script src="../../../js/app.js" defer></script>
  <script src="../js/staff-competency-data.js" defer></script><script src="../js/competency-summary-data.js" defer></script><script src="../js/competency-summary.js" defer></script>
</head>
<body class="training-competency-page attendance-highlight-page performance-highlight-page cs-page" data-cs-page="employee" data-cs-origin="staff">
  <preview-top-bar active-page="training-competency"></preview-top-bar>
  <div class="phone-container">
    <header class="training-competency-header performance-header">
      <phone-status-bar time="9:41"></phone-status-bar>
      <div class="training-competency-header-row performance-header-row">
        <a id="csBack" class="training-competency-back performance-back" href="../index.html?scope=team" aria-label="Back"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></a>
        <h1 id="csPageTitle">Employee Competency</h1><span class="training-competency-header-spacer performance-header-spacer" aria-hidden="true"></span>
      </div>
    </header>
    <main class="main-content cs-content">
      <div id="csUnavailable" class="cs-empty" hidden><i class="fa-solid fa-folder-open" aria-hidden="true"></i><h2>Employee unavailable</h2><p>The selected employee could not be found in this report.</p></div>
      <section id="csReportView" aria-label="Employee Competency">
        <section id="csEmployeeSummary" class="cs-context record-summary-card" aria-label="Employee information"></section>
        <div class="cs-assess-actions"><button id="staffCompetencyAssess" class="cs-assess-button" type="button">Assess</button></div>
        <section class="attendance-report-table-card"><div class="attendance-report-table-scroll"><table id="csTable" class="attendance-report-table" data-kind="employee" aria-label="Employee competencies"><thead><tr><th scope="col">Competency</th><th scope="col">Level</th><th scope="col">Chge</th><th scope="col">Gap</th></tr></thead><tbody></tbody></table></div></section>
      </section>

    </main>
    <phone-bottom-nav active="apps"></phone-bottom-nav>
    <div id="appToast" class="app-toast" role="status" aria-live="polite"></div>

    <div id="csModal" class="cs-modal detail-popout-overlay" aria-hidden="true" hidden>
      <section class="detail-popout-panel" role="dialog" aria-modal="true" aria-labelledby="csModalTitle">
        <header class="detail-popout-header"><h2 id="csModalTitle" class="detail-popout-title">Competency Details</h2><button id="csModalClose" class="detail-popout-close" type="button" aria-label="Close details"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button></header>
        <div id="csModalBody" class="detail-popout-body cs-modal-body" tabindex="0" role="region" aria-label="Competency detail content"></div>
      </section>
    </div>
  </div>
</body>
</html>
