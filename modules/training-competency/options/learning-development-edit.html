<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleHCM - Edit L&amp;D Progress</title>
  <script>(() => { const theme = new URLSearchParams(location.search).get('theme'); document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark'; })();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../css/theme.css">
  <link rel="stylesheet" href="../../../css/app.css">
  <link rel="stylesheet" href="../../../css/detail-popout.css">
  <link rel="stylesheet" href="../../../css/form-section-headings.css">
  <link rel="stylesheet" href="../css/training-competency.css">
  <link rel="stylesheet" href="../css/learning-development.css">
  <script src="../../../js/components.js"></script>
  <script src="../../../js/app.js" defer></script>
  <script src="../js/training-competency-data.js" defer></script>
  <script src="../js/learning-development.js" defer></script>
</head>
<body class="training-competency-page ld-page" data-ld-page="edit">
  <preview-top-bar active-page="training-competency"></preview-top-bar>
  <div class="phone-container">
    <header class="training-competency-header">
      <phone-status-bar time="9:41"></phone-status-bar>
      <div class="training-competency-header-row">
        <a id="ldBack" class="training-competency-back" href="../index.html?scope=individual" aria-label="Back"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></a>
        <h1 id="ldEditPageTitle">Edit L&amp;D Progress</h1>
        <span class="training-competency-header-spacer" aria-hidden="true"></span>
      </div>
    </header>
    <main class="main-content ld-content">
      <p id="ldStorageError" class="ld-error" role="alert" hidden></p>
      <section id="ldUnavailable" class="ld-empty" hidden>
        <i class="fa-solid fa-folder-open" aria-hidden="true"></i>
        <h2>Record unavailable</h2>
        <p>This activity or progress record could not be found.</p>
        <a id="ldUnavailableBack" class="ld-primary" href="learning-development-plan.html">Back to L&amp;D Plan</a>
      </section>
      <section id="ldEditSummary" class="ld-summary record-summary-card" aria-label="Activity context"></section>
      <form id="ldEditForm" class="ld-form-card" novalidate>
        <h2 id="ldEditFormTitle" class="form-section-heading form-section-heading--new">Progress Update</h2>
        <div class="ld-form-grid">
          <div class="ld-field"><label for="ldStartInput">Start <span aria-hidden="true">*</span></label><input id="ldStartInput" name="start" type="date" required></div>
          <div class="ld-field"><label for="ldEndInput">End <span aria-hidden="true">*</span></label><input id="ldEndInput" name="end" type="date" required></div>
          <div class="ld-field"><label for="ldProgressInput">Progress% <span aria-hidden="true">*</span></label><div class="ld-input-suffix"><input id="ldProgressInput" name="progress" type="number" min="0" max="100" step="0.01" inputmode="decimal" required><span>%</span></div></div>
          <div class="ld-field"><label for="ldHoursInput">Hours <span aria-hidden="true">*</span></label><input id="ldHoursInput" name="hours" type="number" min="0" step="0.01" inputmode="decimal" required></div>
        </div>
        <div class="ld-field"><label for="ldRemarksInput">Remarks</label><textarea id="ldRemarksInput" name="remarks" rows="4" maxlength="2000" placeholder="Describe the progress made"></textarea></div>
        <p id="ldEditError" class="ld-error" role="alert" hidden></p>
        <footer class="ld-form-actions">
          <a id="ldCancel" class="form-cancel-btn" href="learning-development-plan.html"><i class="fa-solid fa-xmark" aria-hidden="true"></i><span>Cancel</span></a>
          <button id="ldSave" class="ld-primary" type="submit"><span id="ldSaveLabel">Update</span></button>
        </footer>
      </form>
    </main>
    <div id="appToast" class="app-toast" role="status" aria-live="polite"></div>
    <phone-bottom-nav active="apps"></phone-bottom-nav>
    <left-profile-drawer></left-profile-drawer>
    <notification-sheet></notification-sheet>

  </div>
</body>
</html>
