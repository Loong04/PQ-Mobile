<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleHCM - Assess Competency</title>
  <script>(() => { document.documentElement.dataset.theme = new URLSearchParams(location.search).get('theme') === 'light' ? 'light' : 'dark'; })();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../css/theme.css"><link rel="stylesheet" href="../../../css/app.css">
  <link rel="stylesheet" href="../css/training-competency.css"><link rel="stylesheet" href="../css/competency-summary.css">
  <link rel="stylesheet" href="../css/staff-competency-assess.css">
  <script src="../../../js/components.js"></script><script src="../../../js/app.js" defer></script>
  <script src="../js/staff-competency-data.js" defer></script><script src="../js/competency-summary-data.js" defer></script><script src="../js/staff-competency-assess.js" defer></script>
</head>
<body class="training-competency-page cs-page csa-page">
  <preview-top-bar active-page="training-competency"></preview-top-bar>
  <div class="phone-container">
    <header class="training-competency-header">
      <phone-status-bar time="9:41"></phone-status-bar>
      <div class="training-competency-header-row">
        <a id="staffAssessBack" class="training-competency-back" href="staff-competency.html" aria-label="Back to employee competency"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></a>
        <h1>Assess Competency</h1><span class="training-competency-header-spacer" aria-hidden="true"></span>
      </div>
    </header>
    <main class="main-content cs-content">
      <div id="staffAssessUnavailable" class="cs-empty" hidden><i class="fa-solid fa-folder-open" aria-hidden="true"></i><h2>Employee unavailable</h2><p>The selected employee could not be found.</p></div>
      <form id="staffAssessForm" novalidate>
        <section id="staffAssessSummary" class="cs-context record-summary-card" aria-label="Employee assessment summary">
          <div class="cs-summary-field"><span>Employee</span><strong id="staffAssessEmployee"></strong><span id="staffAssessEmployeeId" class="csa-employee-id"></span></div>
          <div class="cs-summary-field"><span>Department</span><strong id="staffAssessDepartment"></strong></div>
          <div class="cs-summary-field"><span>Position</span><strong id="staffAssessPosition"></strong></div>
          <div class="cs-summary-field"><span>Skill Group</span><strong id="staffAssessSkillGroup"></strong></div>
          <div class="cs-summary-field"><span>Total Records</span><strong id="staffAssessTotalRecords" aria-live="polite">0</strong></div>
        </section>
        <section id="staffAssessCards" class="csa-cards" aria-label="Competencies for assessment"></section>
        <p id="staffAssessEmpty" class="cs-empty" hidden>No competencies are assigned to this skill group.</p>
        <p id="staffAssessError" class="csa-error" role="alert" hidden></p>
        <footer class="csa-actions"><button id="staffAssessSubmit" class="csa-submit" type="submit">Submit</button></footer>
      </form>
    </main>
    <phone-bottom-nav active="apps"></phone-bottom-nav>
  </div>
</body>
</html>
