<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleHCM - Training Clocking</title>
  <script>(() => { const theme = new URLSearchParams(location.search).get('theme'); document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark'; })();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../css/theme.css">
  <link rel="stylesheet" href="../../../css/app.css">
  <link rel="stylesheet" href="../css/training-competency.css">
  <link rel="stylesheet" href="../css/training-clocking.css">
  <script src="../../../js/components.js"></script>
  <script src="../../../js/app.js" defer></script>
  <script src="../js/training-competency-data.js" defer></script>
  <script src="../js/training-clocking.js" defer></script>
</head>
<body class="training-competency-page training-clocking-page">
  <preview-top-bar active-page="training-competency"></preview-top-bar>
  <div class="phone-container">
    <header class="training-competency-header">
      <phone-status-bar time="9:41"></phone-status-bar>
      <div class="training-competency-header-row">
        <a id="trainingClockingBack" class="training-competency-back" href="../index.html?scope=individual" aria-label="Back to Training and Competency"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></a>
        <h1>Training Clocking</h1>
        <span class="training-competency-header-spacer" aria-hidden="true"></span>
      </div>
    </header>

    <main class="main-content training-clocking-content">
      <section id="trainingClockingNow" class="training-clocking-now record-summary-card" aria-label="Current day, date and time">
        <div class="training-clocking-now-item">
          <span>Day</span>
          <strong id="trainingClockingDay">--</strong>
        </div>
        <div class="training-clocking-now-item">
          <span>Date</span>
          <strong id="trainingClockingDate">--</strong>
        </div>
        <div class="training-clocking-now-item">
          <span>Time</span>
          <strong id="trainingClockingTime" aria-live="off">--:--:--</strong>
        </div>
      </section>

      <div class="training-clocking-actions" aria-label="Training clocking actions">
        <button type="button" id="trainingClockIn" class="training-clocking-action training-clocking-action-primary">
          <i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i>
          <span>Clock In</span>
        </button>
        <button type="button" id="trainingClockOut" class="training-clocking-action training-clocking-action-secondary">
          <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
          <span>Clock Out</span>
        </button>
      </div>
      <p id="trainingClockingStatus" class="training-clocking-status" role="status" aria-live="polite">Ready to clock in</p>

      <section class="training-clocking-history" aria-labelledby="trainingClockingHistoryTitle">
        <h2 id="trainingClockingHistoryTitle">Clocking History</h2>
        <div class="training-clocking-table-wrap">
          <table id="trainingClockingTable">
            <thead>
              <tr>
                <th scope="col">Date</th>
                <th scope="col">Type</th>
                <th scope="col">Time</th>
              </tr>
            </thead>
            <tbody id="trainingClockingRows"></tbody>
          </table>
          <div id="trainingClockingEmpty" class="training-clocking-empty">
            <i class="fa-regular fa-clock" aria-hidden="true"></i>
            <strong>No clocking records yet</strong>
            <span>Your training attendance will appear here.</span>
          </div>
        </div>
      </section>
    </main>

    <phone-bottom-nav active="apps"></phone-bottom-nav>
    <left-profile-drawer></left-profile-drawer>
    <notification-sheet></notification-sheet>
  </div>
</body>
</html>
