<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleHCM - Add L&amp;D Progress</title>
  <script>(() => { const theme = new URLSearchParams(location.search).get('theme'); document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark'; })();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../css/theme.css">
  <link rel="stylesheet" href="../../../css/app.css">
  <link rel="stylesheet" href="../../../css/form-section-headings.css">
  <link rel="stylesheet" href="../css/training-competency.css">
  <link rel="stylesheet" href="../css/learning-development.css">
  <link rel="stylesheet" href="../css/staff-learning-development.css">
  <script src="../../../js/components.js"></script>
  <script src="../../../js/app.js" defer></script>
  <script src="../js/training-competency-data.js" defer></script>
  <script src="../js/staff-learning-development.js" defer></script>
</head>
<body class="training-competency-page ld-page sld-page" data-sld-page="edit">
  <preview-top-bar active-page="training-competency"></preview-top-bar>
  <div class="phone-container">
    <header class="training-competency-header">
      <phone-status-bar time="9:41"></phone-status-bar>
      <div class="training-competency-header-row">
        <a id="sldBack" class="training-competency-back" href="staff-learning-development-plan.html" aria-label="Back to Staff L&amp;D Progress"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></a>
        <h1 id="sldEditPageTitle">Add L&amp;D Progress</h1>
        <span class="training-competency-header-spacer" aria-hidden="true"></span>
      </div>
    </header>
    <main class="main-content ld-content">
      <p id="sldStorageError" class="ld-error" role="alert" hidden></p>
      <section id="sldUnavailable" class="ld-empty" hidden>
        <i class="fa-solid fa-folder-open" aria-hidden="true"></i>
        <h2>Record unavailable</h2>
        <p>This activity could not be found.</p>
        <a id="sldUnavailableBack" class="ld-primary" href="staff-learning-development-plan.html">Back to Staff L&amp;D Plan</a>
      </section>
      <section id="sldEditSummary" class="ld-summary record-summary-card" aria-label="Activity context"></section>
      <form id="sldEditForm" class="ld-form-card" novalidate>
        <h2 class="form-section-heading form-section-heading--new">Progress Details</h2>
        <div class="ld-form-grid">
          <div class="ld-field"><label for="sldStartInput">Start <span aria-hidden="true">*</span></label><input id="sldStartInput" name="start" type="date" required></div>
          <div class="ld-field"><label for="sldEndInput">End <span aria-hidden="true">*</span></label><input id="sldEndInput" name="end" type="date" required></div>
          <div class="ld-field"><label for="sldProgressInput">Progress% <span aria-hidden="true">*</span></label><div class="ld-input-suffix"><input id="sldProgressInput" name="progress" type="number" min="0" max="100" step="0.01" inputmode="decimal" required><span>%</span></div></div>
          <div class="ld-field"><label for="sldHoursInput">Hours <span aria-hidden="true">*</span></label><input id="sldHoursInput" name="hours" type="number" min="0" step="0.01" inputmode="decimal" required></div>
        </div>
        <div class="ld-field"><label for="sldRemarksInput">Remarks</label><textarea id="sldRemarksInput" name="remarks" rows="4" maxlength="2000" placeholder="Describe the progress made"></textarea></div>
        <p id="sldEditError" class="ld-error" role="alert" hidden></p>
        <footer class="ld-form-actions">
          <a id="sldCancel" class="form-cancel-btn" href="staff-learning-development-update.html"><i class="fa-solid fa-xmark" aria-hidden="true"></i><span>Cancel</span></a>
          <button id="sldSave" class="ld-primary" type="submit"><span id="sldSaveLabel">Add</span></button>
        </footer>
      </form>
    </main>
    <div id="appToast" class="app-toast" role="status" aria-live="polite"></div>
    <phone-bottom-nav active="apps"></phone-bottom-nav>
    <left-profile-drawer></left-profile-drawer>
    <notification-sheet></notification-sheet>
  </div>
</body>
</html>
