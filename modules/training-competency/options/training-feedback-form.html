<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleHCM - Training Feedback</title>
  <script>(() => { const theme = new URLSearchParams(location.search).get('theme'); document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark'; })();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../css/theme.css">
  <link rel="stylesheet" href="../../../css/app.css">
  <link rel="stylesheet" href="../css/training-competency.css">
  <link rel="stylesheet" href="../css/training-feedback.css">
  <script src="../../../js/components.js"></script>
  <script src="../../../js/app.js" defer></script>
  <script src="../js/training-competency-data.js" defer></script>
  <script src="../js/training-feedback.js" defer></script>
</head>
<body class="training-competency-page training-feedback-page" data-training-feedback-page="form">
  <preview-top-bar active-page="training-competency"></preview-top-bar>
  <div class="phone-container">
    <header class="training-competency-header">
      <phone-status-bar time="9:41"></phone-status-bar>
      <div class="training-competency-header-row">
        <a id="trainingFeedbackFormBack" class="training-competency-back" href="training-feedback.html" aria-label="Back to Training Feedback"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></a>
        <h1>Training Feedback</h1>
        <span class="training-competency-header-spacer" aria-hidden="true"></span>
      </div>
    </header>
    <main class="main-content training-feedback-form-content">
      <section id="trainingFeedbackUnavailable" class="training-feedback-empty" hidden>
        <i class="fa-solid fa-folder-open" aria-hidden="true"></i><h2>Feedback Unavailable</h2><p>This training feedback record could not be found.</p>
        <a id="trainingFeedbackUnavailableBack" class="training-feedback-primary" href="training-feedback.html">Back to Training Feedback</a>
      </section>
      <form id="trainingFeedbackForm" novalidate>
        <section class="training-feedback-form-card training-feedback-general" aria-labelledby="trainingFeedbackGeneralTitle">
          <header class="training-feedback-section-header">
            <h2 id="trainingFeedbackGeneralTitle">General Feedback</h2>
            <button type="button" id="trainingFeedbackGeneralToggle" class="training-feedback-section-toggle" aria-label="Collapse General Feedback" aria-expanded="true" aria-controls="trainingFeedbackGeneralBody"><i class="fa-solid fa-chevron-down" aria-hidden="true"></i></button>
          </header>
          <div id="trainingFeedbackGeneralBody" class="training-feedback-form-body">
            <dl class="training-feedback-general-details">
              <div class="training-feedback-general-row"><dt>Course</dt><dd id="trainingFeedbackCourse"></dd></div>
              <div class="training-feedback-general-row"><dt>Start Date</dt><dd id="trainingFeedbackStartDate"></dd></div>
              <div class="training-feedback-general-row"><dt>End Date</dt><dd id="trainingFeedbackEndDate"></dd></div>
            </dl>
            <div class="training-feedback-field">
              <label for="trainingFeedbackRemark">Remark <span aria-hidden="true">*</span></label>
              <textarea id="trainingFeedbackRemark" rows="4" maxlength="2000" required placeholder="Share your feedback about this training"></textarea>
            </div>
            <fieldset class="training-feedback-upload">
              <legend>Upload Attachment</legend>
              <div class="training-feedback-upload-actions">
                <button type="button" class="training-feedback-upload-button" data-file-target="trainingFeedbackFiles"><span class="training-feedback-upload-icon"><i class="fa-solid fa-file-arrow-up" aria-hidden="true"></i></span><span>Select File(s)</span></button>
                <button type="button" class="training-feedback-upload-button is-camera" data-file-target="trainingFeedbackCamera"><span class="training-feedback-upload-icon"><i class="fa-solid fa-camera" aria-hidden="true"></i></span><span>Take a Picture</span></button>
              </div>
              <input id="trainingFeedbackFiles" type="file" multiple hidden>
              <input id="trainingFeedbackCamera" type="file" accept="image/*" capture="environment" hidden>
              <div id="trainingFeedbackAttachments" class="training-feedback-attachments" aria-live="polite"></div>
            </fieldset>
          </div>
        </section>
        <section class="training-feedback-form-card training-feedback-rating" aria-labelledby="trainingFeedbackRatingTitle">
          <header class="training-feedback-section-header"><h2 id="trainingFeedbackRatingTitle">Rating Feedback</h2></header>
          <div class="training-feedback-rating-table-wrap">
            <table id="trainingFeedbackRatings">
              <thead><tr><th scope="col">Feedback Criteria</th><th scope="col">Rating</th><th scope="col">Edit</th></tr></thead>
              <tbody id="trainingFeedbackRatingRows"></tbody>
            </table>
          </div>
        </section>
        <p id="trainingFeedbackFormError" class="training-feedback-error training-feedback-form-error" role="alert" hidden></p>
        <footer class="training-feedback-submit-row"><button type="submit" id="trainingFeedbackSubmit" class="training-feedback-primary">Submit</button></footer>
      </form>
    </main>
    <phone-bottom-nav active="apps"></phone-bottom-nav>
    <left-profile-drawer></left-profile-drawer>
    <notification-sheet></notification-sheet>
    <div id="trainingFeedbackRatingOverlay" class="training-feedback-rating-overlay" aria-hidden="true" hidden>
      <section class="training-feedback-rating-sheet" role="dialog" aria-modal="true" aria-labelledby="trainingFeedbackRatingDialogTitle">
        <div class="training-feedback-rating-handle" aria-hidden="true"></div>
        <header>
          <div><small>Rate This Item</small><h2 id="trainingFeedbackRatingDialogTitle">Select Rating</h2></div>
          <button type="button" id="trainingFeedbackCloseRating" aria-label="Close rating selection"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
        </header>
        <p id="trainingFeedbackRatingCriterion"></p>
        <div class="training-feedback-rating-options" role="radiogroup" aria-label="Rating from 1 to 5">
          <button type="button" data-rating-option="1" role="radio" aria-checked="false" tabindex="0">1</button>
          <button type="button" data-rating-option="2" role="radio" aria-checked="false" tabindex="-1">2</button>
          <button type="button" data-rating-option="3" role="radio" aria-checked="false" tabindex="-1">3</button>
          <button type="button" data-rating-option="4" role="radio" aria-checked="false" tabindex="-1">4</button>
          <button type="button" data-rating-option="5" role="radio" aria-checked="false" tabindex="-1">5</button>
        </div>
        <button type="button" id="trainingFeedbackSaveRating" class="training-feedback-primary">Save Rating</button>
      </section>
    </div>
  </div>
</body>
</html>
