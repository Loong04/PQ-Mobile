<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleHCM - Training Need</title>
  <script>(() => { const theme = new URLSearchParams(location.search).get('theme'); document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark'; })();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../css/theme.css">
  <link rel="stylesheet" href="../../../css/app.css">
  <link rel="stylesheet" href="../../../css/form-section-headings.css">
  <link rel="stylesheet" href="../css/training-competency.css">
  <link rel="stylesheet" href="../css/training-need.css">
  <script src="../../../js/components.js"></script>
  <script src="../../../js/app.js" defer></script>
  <script src="../js/training-competency-data.js" defer></script>
  <script src="../js/training-need.js" defer></script>
</head>
<body class="training-competency-page training-need-page">
  <preview-top-bar active-page="training-competency"></preview-top-bar>
  <div class="phone-container">
    <header class="training-competency-header">
      <phone-status-bar time="9:41"></phone-status-bar>
      <div class="training-competency-header-row">
        <button id="needBack" class="training-competency-back" type="button" aria-label="Back"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></button>
        <h1 id="needPageTitle">Training Need</h1>
        <span class="training-competency-header-spacer" aria-hidden="true"></span>
      </div>
    </header>
    <main class="main-content training-need-content">
      <form id="trainingNeedForm" novalidate>
        <section class="form-card" aria-labelledby="needApplicationTitle">
          <h2 id="needApplicationTitle" class="form-section-heading form-section-heading--new">Application Details</h2>
          <div class="field-group"><label class="field-label" for="needName">Name</label><input id="needName" class="form-ctrl" readonly></div>
          <div class="field-group"><label class="field-label" for="needPosition">Position</label><input id="needPosition" class="form-ctrl" readonly></div>
          <div class="field-group"><label class="field-label" for="needDepartment">Department</label><input id="needDepartment" class="form-ctrl" readonly></div>
          <fieldset class="field-group need-period">
            <legend class="field-label">Training Period <span class="req">*</span></legend>
            <div class="need-period-fields">
              <div><input id="needPeriodStart" class="form-ctrl" type="date" aria-label="Training period start date" required></div>
              <div><input id="needPeriodEnd" class="form-ctrl" type="date" aria-label="Training period end date" required></div>
            </div>
          </fieldset>
          <div class="field-group"><label class="field-label" for="needCareerTarget">Career Target <span class="req">*</span></label><textarea id="needCareerTarget" class="form-ctrl" rows="3" maxlength="2000" placeholder="Describe your career target" required></textarea></div>
          <div class="field-group"><label class="field-label" for="needWeakness">Weakness <span class="req">*</span></label><textarea id="needWeakness" class="form-ctrl" rows="3" maxlength="2000" placeholder="Identify areas you want to improve" required></textarea></div>
          <div class="field-group"><label class="field-label" for="needRemarks">Remarks</label><textarea id="needRemarks" class="form-ctrl" rows="3" maxlength="2000" placeholder="Additional remarks"></textarea></div>
        </section>
        <section class="form-card need-details-card" aria-labelledby="needDetailsTitle">
          <header class="need-details-header">
            <span class="need-details-icon" aria-hidden="true"><i class="fa-solid fa-clipboard-list"></i></span>
            <div class="need-details-heading"><h2 id="needDetailsTitle" class="form-section-heading">Details</h2><span id="needItemCount" aria-live="polite">Total Items: 0</span></div>
            <button id="needAddItem" class="btn-submit-primary need-add-item" type="button" aria-label="Add Item" title="Add Item"><i class="fa-solid fa-plus" aria-hidden="true"></i></button>
          </header>
          <div id="needItemsContainer" class="need-items-container"></div>
        </section>
        <p id="needFormError" class="need-form-error" role="alert" hidden></p>
        <div class="need-actions">
          <button id="needCancel" class="form-cancel-btn" type="button"><i class="fa-solid fa-xmark" aria-hidden="true"></i><span>Cancel</span></button>
          <button id="needSaveDraft" class="btn-draft-bright" type="button"><i class="fa-solid fa-floppy-disk" aria-hidden="true"></i><span>Save Draft</span></button>
          <button id="needSubmit" class="btn-submit-primary" type="submit"><i class="fa-solid fa-paper-plane" aria-hidden="true"></i><span>Submit</span></button>
        </div>
      </form>
      <form id="trainingNeedEntryForm" hidden novalidate>
        <section class="form-card" aria-labelledby="needEntryTitle">
          <h2 id="needEntryTitle" class="form-section-heading form-section-heading--new">Add Training Details</h2>
          <div class="field-group"><label class="field-label" for="needDevelopmentArea">Development Area <span class="req">*</span></label><div class="select-wrapper"><select id="needDevelopmentArea" class="form-ctrl" required></select></div></div>
          <div class="field-group"><label class="field-label" for="needCourse">Course <span class="req">*</span></label><div class="select-wrapper"><select id="needCourse" class="form-ctrl" required></select></div></div>
          <div class="field-group"><label class="field-label" for="needTargetDate">Target Date <span class="req">*</span></label><input id="needTargetDate" class="form-ctrl" type="date" required></div>
          <div class="field-group"><label class="field-label" for="needJustification">Justification <span class="req">*</span></label><textarea id="needJustification" class="form-ctrl" rows="4" maxlength="2000" placeholder="Explain why this training is needed" required></textarea></div>
        </section>
        <div class="need-actions">
          <button id="needCancelItem" class="form-cancel-btn" type="button"><i class="fa-solid fa-xmark" aria-hidden="true"></i><span>Cancel</span></button>
          <button id="needSaveItem" class="btn-submit-primary" type="submit"><i class="fa-solid fa-floppy-disk" aria-hidden="true"></i><span>Save Item</span></button>
        </div>
      </form>
    </main>
    <div id="appToast" class="app-toast" role="status" aria-live="polite"></div>
    <phone-bottom-nav active="apps"></phone-bottom-nav>
    <left-profile-drawer></left-profile-drawer>
    <notification-sheet></notification-sheet>
  </div>
</body>
</html>
