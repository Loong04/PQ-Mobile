<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleHCM - Training Calendar</title>
  <script>(() => { const theme = new URLSearchParams(location.search).get('theme'); document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark'; })();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../css/theme.css">
  <link rel="stylesheet" href="../../../css/app.css">
  <link rel="stylesheet" href="../css/training-competency.css">
  <link rel="stylesheet" href="../css/training-calendar.css">
  <script src="../../../js/components.js"></script>
  <script src="../../../js/app.js" defer></script>
  <script src="../js/training-competency-data.js" defer></script>
  <script src="../js/training-calendar.js" defer></script>
</head>
<body class="training-competency-page training-calendar-page" data-training-calendar-page="calendar">
  <preview-top-bar active-page="training-competency"></preview-top-bar>
  <div class="phone-container">
    <header class="training-competency-header">
      <phone-status-bar time="9:41"></phone-status-bar>
      <div class="training-competency-header-row">
        <a id="trainingCalendarBack" class="training-competency-back" href="../index.html?scope=individual" aria-label="Back to Training and Competency"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></a>
        <h1>Training Calendar</h1>
        <span class="training-competency-header-spacer" aria-hidden="true"></span>
      </div>
    </header>
    <main class="main-content training-calendar-content">
      <section class="training-calendar-card" aria-labelledby="trainingCalendarMonth">
        <header class="training-calendar-toolbar">
          <div>
            <p>My Training Schedule</p>
            <h2 id="trainingCalendarMonth">October 2026</h2>
          </div>
          <div class="training-calendar-controls">
            <button id="trainingCalendarPrevious" type="button" aria-label="Previous month"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></button>
            <button id="trainingCalendarNext" type="button" aria-label="Next month"><i class="fa-solid fa-chevron-right" aria-hidden="true"></i></button>
          </div>
        </header>
        <div class="training-calendar-weekdays" aria-hidden="true"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
        <div id="trainingCalendarGrid" class="training-calendar-grid" aria-label="Training calendar dates"></div>
        <div class="training-calendar-legend"><span aria-hidden="true"></span>Training activity</div>
      </section>
    </main>
    <phone-bottom-nav active="apps"></phone-bottom-nav>
    <left-profile-drawer></left-profile-drawer>
    <notification-sheet></notification-sheet>
    <div id="trainingCalendarSheet" class="training-calendar-sheet-overlay" aria-hidden="true">
      <section class="training-calendar-sheet" role="dialog" aria-modal="true" aria-labelledby="trainingCalendarSheetDate">
        <div class="training-calendar-sheet-handle" aria-hidden="true"></div>
        <header class="training-calendar-sheet-heading">
          <div><p>Training Schedule</p><h2 id="trainingCalendarSheetDate">Selected Date</h2></div>
          <button id="trainingCalendarSheetClose" type="button" aria-label="Close training schedule"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
        </header>
        <div id="trainingCalendarEvents" class="training-calendar-events"></div>
        <button id="trainingCalendarSheetCancel" class="training-calendar-sheet-cancel" type="button">Cancel</button>
      </section>
    </div>
  </div>
</body>
</html>
