<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleHCM - Competency</title>
  <script>(() => { const theme = new URLSearchParams(location.search).get('theme'); document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark'; })();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../css/theme.css">
  <link rel="stylesheet" href="../../../css/app.css">
  <link rel="stylesheet" href="../../../css/detail-popout.css">
  <link rel="stylesheet" href="../css/training-competency.css">
  <link rel="stylesheet" href="../css/competency.css">
  <script src="../../../js/components.js"></script>
  <script src="../../../js/app.js" defer></script>
  <script src="../js/training-competency-data.js" defer></script>
  <script src="../js/competency.js" defer></script>
</head>
<body class="training-competency-page competency-page">
  <preview-top-bar active-page="training-competency"></preview-top-bar>
  <div class="phone-container">
    <header class="training-competency-header">
      <phone-status-bar time="9:41"></phone-status-bar>
      <div class="training-competency-header-row">
        <a id="competencyBack" class="training-competency-back" href="../index.html?scope=individual" aria-label="Back to Training and Competency"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></a>
        <h1>Competency</h1>
        <span class="training-competency-header-spacer" aria-hidden="true"></span>
      </div>
    </header>

    <main class="main-content competency-content">
      <section id="competencySummary" class="competency-summary-card record-summary-card" aria-label="Employee competency summary">
        <div class="competency-summary-field competency-summary-name"><span>Name</span><strong id="competencyEmployeeName"></strong></div>
        <div class="competency-summary-field"><span>Position</span><strong id="competencyEmployeePosition"></strong></div>
        <div class="competency-summary-field"><span>Department</span><strong id="competencyEmployeeDepartment"></strong></div>
        <div class="competency-summary-field competency-summary-total"><span>Total Record</span><strong id="competencyTotalRecords" aria-live="polite">0</strong></div>
      </section>

        <section class="competency-records" aria-label="Competency records">
          <div id="competencyList" class="competency-list"></div>
        </section>
    </main>

    <phone-bottom-nav active="apps"></phone-bottom-nav>
    <left-profile-drawer></left-profile-drawer>

    <div id="competencyDetailsOverlay" class="competency-details-overlay detail-popout-overlay" aria-hidden="true" hidden>
      <section class="detail-popout-panel" role="dialog" aria-modal="true" aria-labelledby="competencyDetailsTitle">
        <header class="detail-popout-header">
          <h2 id="competencyDetailsTitle" class="detail-popout-title">Competency Details</h2>
          <button type="button" id="competencyDetailsClose" class="detail-popout-close" aria-label="Close competency details"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
        </header>
        <div class="detail-popout-body competency-detail-body" tabindex="0" role="region" aria-label="Competency and assessment information">
          <table id="competencyDetailsTable" class="detail-popout-table" aria-label="Competency details"><tbody id="competencyDetailsRows"></tbody></table>
          <section class="competency-assessment-section" aria-labelledby="competencyAssessmentTitle">
            <h3 id="competencyAssessmentTitle">Assessment</h3>
            <div id="competencyAssessmentList" class="competency-assessment-list"></div>
          </section>
        </div>
      </section>
    </div>
  </div>
</body>
</html>
