<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleHCM - L&amp;D Progress</title>
  <script>(() => { const theme = new URLSearchParams(location.search).get('theme'); document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark'; })();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../css/theme.css">
  <link rel="stylesheet" href="../../../css/app.css">
  <link rel="stylesheet" href="../../../css/detail-popout.css">
  <link rel="stylesheet" href="../../../css/form-section-headings.css">
  <link rel="stylesheet" href="../css/training-competency.css">
  <link rel="stylesheet" href="../css/learning-development.css">
  <script src="../../../js/components.js"></script>
  <script src="../../../js/app.js" defer></script>
  <script src="../js/training-competency-data.js" defer></script>
  <script src="../js/learning-development.js" defer></script>
</head>
<body class="training-competency-page ld-page" data-ld-page="update">
  <preview-top-bar active-page="training-competency"></preview-top-bar>
  <div class="phone-container">
    <header class="training-competency-header">
      <phone-status-bar time="9:41"></phone-status-bar>
      <div class="training-competency-header-row">
        <a id="ldBack" class="training-competency-back" href="../index.html?scope=individual" aria-label="Back"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></a>
        <h1>L&amp;D Progress</h1>
        <span class="training-competency-header-spacer" aria-hidden="true"></span>
      </div>
    </header>
    <main class="main-content ld-content">
      <p id="ldStorageError" class="ld-error" role="alert" hidden></p>
      <section id="ldUnavailable" class="ld-empty" hidden>
        <i class="fa-solid fa-folder-open" aria-hidden="true"></i>
        <h2>Record unavailable</h2>
        <p>This activity or progress record could not be found.</p>
        <a id="ldUnavailableBack" class="ld-primary" href="learning-development-plan.html">Back to L&amp;D Plan</a>
      </section>
      <section id="ldProgressSummary" class="ld-summary record-summary-card" aria-label="Activity progress summary"></section>
      <section id="ldRecords" class="ld-cards" aria-label="Activity progress records"></section>
      <div id="ldRecordsEmpty" class="ld-empty" hidden><i class="fa-solid fa-clipboard-list" aria-hidden="true"></i><h2>No progress records</h2><p>There are no progress records for this activity.</p></div>
    </main>
    <div id="appToast" class="app-toast" role="status" aria-live="polite"></div>
    <phone-bottom-nav active="apps"></phone-bottom-nav>
    <left-profile-drawer></left-profile-drawer>
    <notification-sheet></notification-sheet>
    <div id="ldDetailsOverlay" class="ld-details-overlay detail-popout-overlay" aria-hidden="true" hidden>
      <section class="detail-popout-panel" role="dialog" aria-modal="true" aria-labelledby="ldDetailsTitle">
        <header class="detail-popout-header">
          <h2 id="ldDetailsTitle" class="detail-popout-title">Progress Details</h2>
          <button id="ldDetailsClose" class="detail-popout-close" type="button" aria-label="Close progress details"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
        </header>
        <div class="detail-popout-body" tabindex="0" role="region" aria-label="Progress record details">
          <table class="detail-popout-table" aria-label="Progress details"><tbody id="ldDetailsRows"></tbody></table>
        </div>
      </section>
    </div>
  </div>
</body>
</html>
