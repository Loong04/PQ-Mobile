<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleHCM - Training Request Details</title>
  <script>(() => { const theme = new URLSearchParams(location.search).get('theme'); document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark'; })();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../css/theme.css">
  <link rel="stylesheet" href="../../../css/app.css">
  <link rel="stylesheet" href="../css/training-competency.css">
  <link rel="stylesheet" href="../css/training-calendar.css">
  <script src="../../../js/components.js"></script>
  <script src="../../../js/app.js" defer></script>
  <script src="../js/training-competency-data.js" defer></script>
  <script src="../js/training-calendar.js" defer></script>
</head>
<body class="training-competency-page training-request-page" data-training-calendar-page="details">
  <preview-top-bar active-page="training-competency"></preview-top-bar>
  <div class="phone-container">
    <header class="training-competency-header">
      <phone-status-bar time="9:41"></phone-status-bar>
      <div class="training-competency-header-row">
        <a id="trainingRequestBack" class="training-competency-back" href="training-calendar.html" aria-label="Back to Training Calendar"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></a>
        <h1>Training Request Details</h1>
        <span class="training-competency-header-spacer" aria-hidden="true"></span>
      </div>
    </header>
    <main class="main-content training-request-content">
      <section id="trainingRequestUnavailable" class="training-request-unavailable" hidden>
        <i class="fa-solid fa-calendar-xmark" aria-hidden="true"></i>
        <h2>Training request unavailable</h2>
        <p>The selected training request could not be found.</p>
      </section>
      <div id="trainingRequestDetails">
        <section class="training-request-section" aria-labelledby="trainingClassDetailsTitle">
          <h2 id="trainingClassDetailsTitle">Class Details</h2>
          <dl id="trainingClassDetails" class="training-request-fields"></dl>
        </section>
        <section class="training-request-section" aria-labelledby="trainingRequestDetailsTitle">
          <h2 id="trainingRequestDetailsTitle">Request Details</h2>
          <dl id="trainingRequestFields" class="training-request-fields"></dl>
        </section>
      </div>
      <div class="training-request-actions"><a id="trainingRequestCancel" class="form-cancel-btn" href="training-calendar.html"><i class="fa-solid fa-xmark" aria-hidden="true"></i><span>Cancel</span></a></div>
    </main>
    <phone-bottom-nav active="apps"></phone-bottom-nav>
    <left-profile-drawer></left-profile-drawer>
    <notification-sheet></notification-sheet>
  </div>
</body>
</html>
