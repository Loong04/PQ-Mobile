<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleHCM - Training Plan</title>
  <script>(() => { document.documentElement.dataset.theme = new URLSearchParams(location.search).get('theme') === 'light' ? 'light' : 'dark'; })();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../css/theme.css">
  <link rel="stylesheet" href="../../../css/app.css">
  <link rel="stylesheet" href="../css/training-competency.css">
  <link rel="stylesheet" href="../css/training-plan.css">
  <script src="../../../js/components.js"></script>
  <script src="../../../js/app.js" defer></script>
  <script src="../js/training-plan-data.js" defer></script>
  <script src="../js/training-plan.js" defer></script>
</head>
<body class="training-competency-page training-plan-page">
  <preview-top-bar active-page="training-competency"></preview-top-bar>
  <div class="phone-container">
    <header class="training-competency-header">
      <phone-status-bar time="9:41"></phone-status-bar>
      <div class="training-competency-header-row">
        <a id="trainingPlanBack" class="training-competency-back" href="../index.html?scope=individual" aria-label="Back to Training and Competency"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></a>
        <h1>Training Plan</h1>
        <span class="training-competency-header-spacer" aria-hidden="true"></span>
      </div>
    </header>
    <main class="main-content training-plan-content">
      <section class="training-plan-summary record-summary-card" aria-label="Training Plan reporting information and totals">
        <div class="training-plan-summary-field"><span>Position</span><strong id="trainingPlanPosition"></strong></div>
        <div class="training-plan-summary-field"><span>Supervisor</span><div id="trainingPlanSupervisor" class="training-plan-person"></div></div>
        <div class="training-plan-summary-field"><span>Reporting To</span><div id="trainingPlanReportingTo" class="training-plan-person"></div></div>
        <div class="record-summary-metric training-plan-total"><span class="record-summary-label">Total Records</span><strong id="trainingPlanTotalRecords" class="record-summary-value" aria-live="polite">0</strong></div>
      </section>
      <section class="training-plan-records" aria-label="Planned training courses">
        <div id="trainingPlanCourses" class="training-plan-courses"></div>
        <div id="trainingPlanEmpty" class="training-plan-empty" hidden><h2>No training courses planned</h2><p>Your planned courses and attendance details will appear here.</p></div>
      </section>
    </main>
    <phone-bottom-nav active="apps"></phone-bottom-nav>
  </div>
</body>
</html>
