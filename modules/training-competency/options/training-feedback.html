<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleHCM - Training Feedback</title>
  <script>(() => { const theme = new URLSearchParams(location.search).get('theme'); document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark'; })();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../css/theme.css">
  <link rel="stylesheet" href="../../../css/app.css">
  <link rel="stylesheet" href="../../../css/history-cards.css">
  <link rel="stylesheet" href="../css/training-competency.css">
  <link rel="stylesheet" href="../css/training-feedback.css">
  <script src="../../../js/components.js"></script>
  <script src="../../../js/app.js" defer></script>
  <script src="../js/training-competency-data.js" defer></script>
  <script src="../js/training-feedback.js" defer></script>
</head>
<body class="training-competency-page training-feedback-page" data-training-feedback-page="list">
  <preview-top-bar active-page="training-competency"></preview-top-bar>
  <div class="phone-container">
    <header class="training-competency-header">
      <phone-status-bar time="9:41"></phone-status-bar>
      <div class="training-competency-header-row">
        <a id="trainingFeedbackBack" class="training-competency-back" href="../index.html?scope=individual" aria-label="Back to Training and Competency"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></a>
        <h1>Training Feedback</h1>
        <span class="training-competency-header-spacer" aria-hidden="true"></span>
      </div>
    </header>
    <main class="main-content training-feedback-content">
      <section class="training-feedback-filter-summary" aria-label="Current Training Feedback filter">
        <div><small>Current Filter</small><strong id="trainingFeedbackFilterSummary">All Training Feedback</strong></div>
        <button type="button" id="trainingFeedbackFilterTrigger" aria-label="Open Training Feedback filter" aria-haspopup="dialog" aria-controls="trainingFeedbackFilterOverlay" aria-expanded="false"><i class="fa-solid fa-sliders" aria-hidden="true"></i></button>
      </section>
      <section class="training-feedback-summary record-summary-card" aria-label="Training Feedback total records">
        <span class="record-summary-label">Total Records</span>
        <strong id="trainingFeedbackTotalRecords" class="record-summary-value" aria-live="polite">0</strong>
      </section>
      <section id="trainingFeedbackList" class="training-feedback-list" aria-label="Training feedback records" aria-live="polite"></section>
      <div id="trainingFeedbackEmpty" class="training-feedback-empty" hidden><i class="fa-regular fa-message" aria-hidden="true"></i><h2>No Feedback Found</h2><p>Adjust the filters to view training feedback records.</p></div>
    </main>
    <phone-bottom-nav active="apps"></phone-bottom-nav>
    <left-profile-drawer></left-profile-drawer>
    <notification-sheet></notification-sheet>
    <div id="trainingFeedbackFilterOverlay" class="training-feedback-filter-overlay standard-filter-sheet" aria-hidden="true" hidden>
      <form id="trainingFeedbackFilterForm" class="training-feedback-filter-panel standard-filter-panel" data-standard-filter-ready="true" role="dialog" aria-modal="true" aria-labelledby="trainingFeedbackFilterTitle" novalidate>
        <div class="standard-filter-handle" aria-hidden="true"></div>
        <header class="standard-filter-header">
          <h2 id="trainingFeedbackFilterTitle">Filter</h2>
          <div class="standard-filter-header-actions">
            <button type="button" id="trainingFeedbackResetFilter" class="standard-filter-reset"><i class="fa-solid fa-rotate-left" aria-hidden="true"></i><span>Reset</span></button>
            <button type="button" id="trainingFeedbackCloseFilter" class="standard-filter-close" aria-label="Close Training Feedback filter"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
          </div>
        </header>
        <div class="training-feedback-filter-fields">
          <div data-filter-field="start-date"><label for="trainingFeedbackFilterStart">Start Date</label><input id="trainingFeedbackFilterStart" type="date" aria-describedby="trainingFeedbackFilterError"></div>
          <div data-filter-field="end-date"><label for="trainingFeedbackFilterEnd">End Date</label><input id="trainingFeedbackFilterEnd" type="date" aria-describedby="trainingFeedbackFilterError"></div>
          <div data-filter-field="status"><label for="trainingFeedbackFilterStatus">Status</label><div class="training-feedback-select"><select id="trainingFeedbackFilterStatus"><option value="">All Statuses</option><option>Pending</option><option>Completed</option></select><i class="fa-solid fa-chevron-down" aria-hidden="true"></i></div></div>
          <p id="trainingFeedbackFilterError" class="training-feedback-error" role="alert" hidden></p>
        </div>
        <footer class="standard-filter-footer"><button type="submit" id="trainingFeedbackApplyFilter" class="standard-filter-apply">Apply Filter</button></footer>
      </form>
    </div>
  </div>
</body>
</html>
