<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleHCM - Course Catalog</title>
  <script>(() => { const theme = new URLSearchParams(location.search).get('theme'); document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark'; })();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../css/theme.css">
  <link rel="stylesheet" href="../../../css/app.css">
  <link rel="stylesheet" href="../css/training-competency.css">
  <link rel="stylesheet" href="../css/course-catalog.css">
  <script src="../../../js/components.js"></script>
  <script src="../../../js/app.js" defer></script>
  <script src="../js/training-competency-data.js" defer></script>
  <script src="../js/course-catalog.js" defer></script>
</head>
<body class="training-competency-page course-catalog-page">
  <preview-top-bar active-page="training-competency"></preview-top-bar>
  <div class="phone-container">
    <header class="training-competency-header">
      <phone-status-bar time="9:41"></phone-status-bar>
      <div class="training-competency-header-row">
        <a id="courseCatalogBack" class="training-competency-back" href="../index.html?scope=individual" aria-label="Back to Training and Competency"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></a>
        <h1>Course Catalog</h1>
        <span class="training-competency-header-spacer" aria-hidden="true"></span>
      </div>
    </header>

    <main class="main-content course-catalog-content">
      <section class="course-filter-summary" aria-label="Current course catalog filter">
        <div>
          <small>Current Filter</small>
          <strong id="courseFilterSummary">All Courses</strong>
        </div>
        <button type="button" id="courseFilterTrigger" aria-label="Open Course Catalog Filter" aria-haspopup="dialog" aria-controls="courseFilterOverlay"><i class="fa-solid fa-sliders" aria-hidden="true"></i></button>
      </section>

      <section id="courseSummary" class="course-summary-card record-summary-card" aria-label="Course catalog total records">
        <span class="record-summary-label">Total Records</span>
        <strong id="courseTotalRecords" class="record-summary-value" aria-live="polite">0</strong>
      </section>

      <section class="course-catalog-results" aria-label="Course catalog results">
        <div id="courseList" class="course-catalog-list" aria-live="polite"></div>
        <div id="courseEmpty" class="course-catalog-empty" hidden>
          <i class="fa-solid fa-book-open" aria-hidden="true"></i>
          <h2>No Courses Found</h2>
          <p>Adjust the filters to view available courses.</p>
        </div>
      </section>
    </main>

    <phone-bottom-nav active="apps"></phone-bottom-nav>
    <left-profile-drawer></left-profile-drawer>
    <notification-sheet></notification-sheet>

    <div id="courseFilterOverlay" class="course-filter-overlay standard-filter-sheet" aria-hidden="true" hidden>
      <form id="courseFilterForm" class="course-filter-sheet standard-filter-panel" data-standard-filter-ready="true" role="dialog" aria-modal="true" aria-labelledby="courseFilterTitle">
        <div class="standard-filter-handle" aria-hidden="true"></div>
        <header class="standard-filter-header">
          <h2 id="courseFilterTitle">Filter</h2>
          <div class="standard-filter-header-actions">
            <button type="button" id="courseResetFilter" class="standard-filter-reset" aria-label="Reset filter"><i class="fa-solid fa-rotate-left" aria-hidden="true"></i><span>Reset</span></button>
            <button type="button" id="courseFilterClose" class="standard-filter-close" aria-label="Close filter"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
          </div>
        </header>

        <div class="course-filter-fields">
          <div data-filter-field="keyword">
            <label for="courseFilterKeyword">Search Keyword</label>
            <input id="courseFilterKeyword" type="search" placeholder="Search course..." maxlength="150">
          </div>
          <div data-filter-field="effective-date">
            <label for="courseFilterEffectiveDate">Effective Date</label>
            <input id="courseFilterEffectiveDate" type="date">
          </div>
          <div data-filter-field="course-category">
            <label for="courseFilterCategory">Course Category</label>
            <div class="course-filter-select"><select id="courseFilterCategory"></select><i class="fa-solid fa-chevron-down" aria-hidden="true"></i></div>
          </div>
          <div data-filter-field="training-type">
            <label for="courseFilterTrainingType">Training Type</label>
            <div class="course-filter-select"><select id="courseFilterTrainingType"></select><i class="fa-solid fa-chevron-down" aria-hidden="true"></i></div>
          </div>
          <div data-filter-field="development-area">
            <label for="courseFilterDevelopmentArea">Development Area</label>
            <div class="course-filter-select"><select id="courseFilterDevelopmentArea"></select><i class="fa-solid fa-chevron-down" aria-hidden="true"></i></div>
          </div>
          <label class="course-filter-switch-row" for="courseFilterHasOpenClass" data-filter-field="has-open-class">
            <span>Has Open Class</span>
            <span class="course-filter-switch"><input id="courseFilterHasOpenClass" type="checkbox" role="switch"><span class="course-filter-switch-track" aria-hidden="true"></span></span>
          </label>
          <label class="course-filter-switch-row" for="courseFilterOnlineCourse" data-filter-field="online-course">
            <span>Online Course</span>
            <span class="course-filter-switch"><input id="courseFilterOnlineCourse" type="checkbox" role="switch"><span class="course-filter-switch-track" aria-hidden="true"></span></span>
          </label>
          <label class="course-filter-switch-row" for="courseFilterShowAll" data-filter-field="show-all">
            <span>Show All</span>
            <span class="course-filter-switch"><input id="courseFilterShowAll" type="checkbox" role="switch"><span class="course-filter-switch-track" aria-hidden="true"></span></span>
          </label>
        </div>

        <footer class="course-filter-footer standard-filter-footer">
          <button type="submit" id="courseApplyFilter" class="standard-filter-apply">Apply Filter</button>
        </footer>
      </form>
    </div>
  </div>
</body>
</html>
