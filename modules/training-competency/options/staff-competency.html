<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleHCM - Staff Competency</title>
  <script>(() => { document.documentElement.dataset.theme = new URLSearchParams(location.search).get('theme') === 'light' ? 'light' : 'dark'; })();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../css/theme.css">
  <link rel="stylesheet" href="../../../css/app.css">
  <link rel="stylesheet" href="../../../css/attendance-highlight-report.css">
  <link rel="stylesheet" href="../css/training-competency.css">
  <link rel="stylesheet" href="../../performance/css/performance-highlight.css">
  <link rel="stylesheet" href="../css/staff-competency.css">
  <script src="../../../js/components.js"></script>
  <script src="../../../js/app.js" defer></script>
  <script src="../../performance/js/highlight-export.js" defer></script>
  <script src="../js/staff-competency-data.js" defer></script>
  <script src="../js/staff-competency.js" defer></script>
</head>
<body class="training-competency-page attendance-highlight-page performance-highlight-page staff-competency-page">
  <preview-top-bar active-page="training-competency"></preview-top-bar>
  <div class="phone-container">
    <header class="training-competency-header performance-header">
      <phone-status-bar time="9:41"></phone-status-bar>
      <div class="training-competency-header-row performance-header-row">
        <a id="staffCompetencyBack" class="training-competency-back performance-back" href="../index.html?scope=team" aria-label="Back to Training and Competency Team"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></a>
        <h1 id="staffCompetencyTitle" data-print-title="Staff Competency">Staff Competency</h1>
        <span class="training-competency-header-spacer performance-header-spacer" aria-hidden="true"></span>
      </div>
    </header>
    <main class="main-content performance-highlight-content">
      <section id="staffCompetencyReportView" aria-label="Staff competency matches">
        <div class="filter-summary-bar performance-highlight-filter-summary">
          <div><small>Current Filter</small><strong id="staffCompetencyFilterSummary">All Staff</strong></div>
          <button id="staffCompetencyFilterTrigger" type="button" aria-label="Open Staff Competency filter" aria-haspopup="dialog" aria-controls="staffCompetencyFilterOverlay" aria-expanded="false"><i class="fa-solid fa-sliders" aria-hidden="true"></i></button>
        </div>
        <section class="attendance-report-summary record-summary-card" aria-label="Staff competency totals" aria-live="polite">
          <div class="attendance-report-summary-row">
            <div class="record-summary-metric"><span class="record-summary-label">Total Records</span><strong id="staffCompetencyTotalRecords" class="record-summary-value">0</strong></div>
            <button id="staffCompetencyViewChart" class="view-chart-btn" type="button"><i class="fa-solid fa-chart-pie" aria-hidden="true"></i><span>View Chart</span></button>
          </div>
          <div class="attendance-report-summary-row">
            <div><span class="attendance-report-summary-label">Average Match</span><strong id="staffCompetencyAverageMatch" class="performance-highlight-average">—</strong></div>
            <div class="performance-highlight-export-actions">
              <button id="staffCompetencyExportPdf" class="performance-highlight-export-pdf" type="button" title="Export PDF" aria-label="Export PDF"><i class="fa-solid fa-file-pdf" aria-hidden="true"></i></button>
              <button id="staffCompetencyExportExcel" class="performance-highlight-export-excel" type="button" title="Export Excel" aria-label="Export Excel"><i class="fa-solid fa-file-excel" aria-hidden="true"></i></button>
            </div>
          </div>
        </section>
        <section class="attendance-report-table-card">
          <div class="attendance-report-table-scroll"><table id="staffCompetencyTable" class="attendance-report-table" aria-label="Employee competency matches"><thead><tr><th scope="col">Emp #</th><th scope="col">Name</th><th scope="col">Match %</th><th scope="col">Branch</th><th scope="col">Department</th><th scope="col">Position</th></tr></thead><tbody></tbody></table></div>
        </section>
      </section>
      <section id="staffCompetencyChartView" class="attendance-report-chart" aria-label="Staff competency analysis" hidden>
        <section class="attendance-report-breakdown"><label for="staffCompetencyChartMetric">BREAKDOWN BY</label><select id="staffCompetencyChartMetric"></select></section>
        <section class="attendance-report-chart-card">
          <h3 id="staffCompetencyChartTitle"></h3><p>Average match and share of filtered employees</p>
          <div class="attendance-report-donut"><svg id="staffCompetencyChartDonut" viewBox="0 0 180 180" role="img"><circle cx="90" cy="90" r="70" fill="none" stroke="var(--border-subtle)" stroke-width="22"></circle><g id="staffCompetencyChartSegments"></g></svg><div class="attendance-report-donut-center"><strong id="staffCompetencyChartAverage">—</strong><small>Average Match</small></div></div>
          <p id="staffCompetencyChartNote" class="attendance-report-note"></p>
        </section>
        <section class="attendance-report-legend"><div class="attendance-report-legend-head"><span id="staffCompetencyChartColumn">Branch</span><span>Avg Match</span><span>% Records</span></div><div id="staffCompetencyChartLegend"></div></section>
      </section>
    </main>
    <phone-bottom-nav active="apps"></phone-bottom-nav>
    <div id="staffCompetencyFilterOverlay" class="performance-highlight-filter-overlay standard-filter-sheet" aria-hidden="true" hidden>
      <form id="staffCompetencyFilterForm" class="standard-filter-panel" data-standard-filter-ready="true" role="dialog" aria-modal="true" aria-labelledby="staffCompetencyFilterTitle" novalidate>
        <div class="standard-filter-handle" aria-hidden="true"></div>
        <header class="standard-filter-header"><h2 id="staffCompetencyFilterTitle">Filter</h2><div class="standard-filter-header-actions"><button id="staffCompetencyResetFilter" class="standard-filter-reset" type="button"><i class="fa-solid fa-rotate-left" aria-hidden="true"></i><span>Reset</span></button><button id="staffCompetencyCloseFilter" class="standard-filter-close" type="button" aria-label="Close filter"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button></div></header>
        <div class="performance-highlight-filter-fields">
          <div><label for="staffCompetencyKeyword">Search Keyword</label><input id="staffCompetencyKeyword" name="keyword" type="search" placeholder="Search employee, ID, branch or position" maxlength="200"></div>
          <div><label for="staffCompetencyCompany">Company</label><select id="staffCompetencyCompany" name="company"><option value="">All Companies</option></select></div>
          <div><label for="staffCompetencyBranch">Branch</label><select id="staffCompetencyBranch" name="branch"><option value="">All Branches</option></select></div>
          <div><label for="staffCompetencyDepartment">Department</label><select id="staffCompetencyDepartment" name="department"><option value="">All Departments</option></select></div>
          <div><label for="staffCompetencyJob">Job</label><select id="staffCompetencyJob" name="job"><option value="">All Jobs</option></select></div>
          <div role="group" aria-labelledby="staffCompetencyMatchLabel"><label id="staffCompetencyMatchLabel" for="staffCompetencyMatchMin">Match %</label><div class="performance-highlight-score-range"><input id="staffCompetencyMatchMin" name="matchMin" type="number" min="0" max="100" step="any" value="0" aria-label="Minimum match percentage" aria-describedby="staffCompetencyFilterError"><span aria-hidden="true">–</span><input id="staffCompetencyMatchMax" name="matchMax" type="number" min="0" max="100" step="any" value="100" aria-label="Maximum match percentage" aria-describedby="staffCompetencyFilterError"></div></div>
          <p id="staffCompetencyFilterError" class="performance-highlight-error" role="alert" hidden></p>
        </div>
        <footer class="standard-filter-footer"><button id="staffCompetencyApplyFilter" class="standard-filter-apply" type="submit">Apply Filter</button></footer>
      </form>
    </div>
  </div>
</body>
</html>
