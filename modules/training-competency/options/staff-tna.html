<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleHCM - Staff TNA</title>
  <script>(() => { document.documentElement.dataset.theme = new URLSearchParams(location.search).get('theme') === 'light' ? 'light' : 'dark'; })();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../css/theme.css">
  <link rel="stylesheet" href="../../../css/app.css">
  <link rel="stylesheet" href="../../../css/detail-popout.css">
  <link rel="stylesheet" href="../css/training-competency.css">
  <link rel="stylesheet" href="../css/staff-tna.css">
  <script src="../../../js/components.js"></script>
  <script src="../../../js/app.js" defer></script>
  <script src="../js/staff-tna-data.js" defer></script>
  <script src="../js/staff-tna.js" defer></script>
</head>
<body class="training-competency-page staff-tna-page">
  <preview-top-bar active-page="training-competency"></preview-top-bar>
  <div class="phone-container">
    <header class="training-competency-header">
      <phone-status-bar time="9:41"></phone-status-bar>
      <div class="training-competency-header-row">
        <a id="staffTnaBack" class="training-competency-back" href="../index.html?scope=team" aria-label="Back to Training and Competency Team"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></a>
        <h1>Staff TNA</h1>
        <span class="training-competency-header-spacer" aria-hidden="true"></span>
      </div>
    </header>
    <main class="main-content staff-tna-content">
      <section class="staff-tna-filter-summary" aria-label="Current Staff TNA filter">
        <div><small>Current Filter</small><strong id="staffTnaFilterSummary">All Staff TNA</strong></div>
        <button id="staffTnaFilterTrigger" type="button" aria-label="Open Staff TNA filter" aria-haspopup="dialog" aria-controls="staffTnaFilterOverlay" aria-expanded="false"><i class="fa-solid fa-sliders" aria-hidden="true"></i></button>
      </section>
      <section class="staff-tna-summary record-summary-card" aria-label="Staff TNA total records">
        <span class="record-summary-label">Total Records</span>
        <strong id="staffTnaTotalRecords" class="record-summary-value" aria-live="polite">0</strong>
      </section>
      <section id="staffTnaList" class="staff-tna-list" aria-label="Staff training need analysis records" aria-live="polite"></section>
      <div id="staffTnaEmpty" class="staff-tna-empty" hidden><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i><h2>No Staff TNA Found</h2><p>Adjust the filters to view staff training need records.</p></div>
    </main>
    <phone-bottom-nav active="apps"></phone-bottom-nav>
    <left-profile-drawer></left-profile-drawer>
    <notification-sheet></notification-sheet>
    <div id="staffTnaFilterOverlay" class="staff-tna-filter-overlay standard-filter-sheet" aria-hidden="true" hidden>
      <form id="staffTnaFilterForm" class="standard-filter-panel" data-standard-filter-ready="true" role="dialog" aria-modal="true" aria-labelledby="staffTnaFilterTitle" novalidate>
        <div class="standard-filter-handle" aria-hidden="true"></div>
        <header class="standard-filter-header">
          <h2 id="staffTnaFilterTitle">Filter</h2>
          <div class="standard-filter-header-actions">
            <button id="staffTnaResetFilter" class="standard-filter-reset" type="button"><i class="fa-solid fa-rotate-left" aria-hidden="true"></i><span>Reset</span></button>
            <button id="staffTnaCloseFilter" class="standard-filter-close" type="button" aria-label="Close Staff TNA filter"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
          </div>
        </header>
        <div class="staff-tna-filter-fields">
          <div data-filter-field="keyword"><label for="staffTnaKeyword">Search Keyword</label><input id="staffTnaKeyword" name="keyword" type="search" placeholder="Search employee, ID or reference" maxlength="200"></div>
          <div id="staffTnaTrainingPeriod" data-filter-field="training-period" role="group" aria-labelledby="staffTnaTrainingPeriodLabel">
            <label id="staffTnaTrainingPeriodLabel">Training Period</label>
            <div class="staff-tna-period-inputs"><input id="staffTnaPeriodStart" name="periodStart" type="date" aria-label="Training period start date" aria-describedby="staffTnaFilterError"><span aria-hidden="true">–</span><input id="staffTnaPeriodEnd" name="periodEnd" type="date" aria-label="Training period end date" aria-describedby="staffTnaFilterError"></div>
          </div>
          <div data-filter-field="company"><label for="staffTnaCompany">Company</label><select id="staffTnaCompany" name="company"><option value="">All Companies</option></select></div>
          <div data-filter-field="branch"><label for="staffTnaBranch">Branch</label><select id="staffTnaBranch" name="branch"><option value="">All Branches</option></select></div>
          <div data-filter-field="department"><label for="staffTnaDepartment">Department</label><select id="staffTnaDepartment" name="department"><option value="">All Departments</option></select></div>
          <div data-filter-field="job"><label for="staffTnaJob">Job</label><select id="staffTnaJob" name="job"><option value="">All Jobs</option></select></div>
          <p id="staffTnaFilterError" class="staff-tna-filter-error" role="alert" hidden></p>
        </div>
        <footer class="standard-filter-footer"><button id="staffTnaApplyFilter" class="standard-filter-apply" type="submit">Apply Filter</button></footer>
      </form>
    </div>
    <div id="staffTnaDetailOverlay" class="staff-tna-detail-overlay detail-popout-overlay" aria-hidden="true" hidden>
      <section id="staffTnaDetailPanel" class="detail-popout-panel" role="dialog" aria-modal="true" aria-labelledby="staffTnaDetailTitle">
        <header class="detail-popout-header">
          <h2 id="staffTnaDetailTitle" class="detail-popout-title">Staff TNA Details</h2>
          <button id="staffTnaDetailClose" class="detail-popout-close" type="button" aria-label="Close Staff TNA details"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
        </header>
        <div class="detail-popout-body staff-tna-detail-body">
          <section class="staff-tna-detail-section" aria-label="Application Details"><dl id="staffTnaApplicationDetails" class="staff-tna-detail-list"></dl></section>
          <section class="staff-tna-detail-section" aria-labelledby="staffTnaDetailsHeading"><h3 id="staffTnaDetailsHeading" class="staff-tna-detail-section-heading">Details</h3><div id="staffTnaDetailItems" class="staff-tna-detail-items"></div></section>
        </div>
        <footer class="history-detail-actions"><button id="staffTnaDetailCancel" class="history-detail-action" type="button">Cancel</button></footer>
      </section>
    </div>
  </div>
</body>
</html>
