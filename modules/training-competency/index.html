<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleHCM - Training &amp; Competency</title>
  <script>(() => { const theme = new URLSearchParams(location.search).get('theme'); document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark'; })();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../css/theme.css">
  <link rel="stylesheet" href="../../css/app.css">
  <link rel="stylesheet" href="css/training-competency.css">
  <script src="../../js/components.js"></script>
  <script src="../../js/app.js" defer></script>
  <script src="js/training-competency-app.js" defer></script>
</head>
<body class="training-competency-page">
  <preview-top-bar active-page="training-competency"></preview-top-bar>
  <div class="phone-container">
    <header class="training-competency-header">
      <phone-status-bar time="9:41"></phone-status-bar>
      <div class="training-competency-header-row">
        <a id="trainingCompetencyBack" class="training-competency-back" href="../../appdark.html" aria-label="Back to Apps"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></a>
        <h1>Training &amp; Competency</h1>
        <span class="training-competency-header-spacer" aria-hidden="true"></span>
      </div>
    </header>

    <main class="main-content training-competency-content">
      <div class="training-competency-scope" role="tablist" aria-label="Training and Competency scope">
        <button id="trainingCompetencyTabIndividual" class="training-competency-scope-tab active" type="button" role="tab" aria-selected="true" aria-controls="trainingCompetencyIndividualPanel"><i class="fa-solid fa-user" aria-hidden="true"></i><span>Individual</span></button>
        <button id="trainingCompetencyTabTeam" class="training-competency-scope-tab" type="button" role="tab" aria-selected="false" aria-controls="trainingCompetencyTeamPanel" tabindex="-1"><i class="fa-solid fa-users" aria-hidden="true"></i><span>Team</span></button>
      </div>

      <div id="trainingCompetencyIndividualPanel" class="training-competency-panel" role="tabpanel" aria-labelledby="trainingCompetencyTabIndividual">
        <section class="training-competency-section" aria-labelledby="trainingCompetencyStatusTitle">
          <h2 id="trainingCompetencyStatusTitle" class="training-competency-section-title">My Document Status</h2>
          <div class="training-competency-status-grid">
            <button type="button" class="training-competency-status-card" data-status="submitted" aria-label="Submitted, count unavailable. Training history coming soon"><strong>&mdash;</strong><span>Submitted</span><small>In Review</small></button>
            <button type="button" class="training-competency-status-card" data-status="resubmit" aria-label="Resubmit, count unavailable. Training history coming soon"><strong>&mdash;</strong><span>Resubmit</span><small>Needs Action</small></button>
            <button type="button" class="training-competency-status-card" data-status="approved" aria-label="Approved, count unavailable. Training history coming soon"><strong>&mdash;</strong><span>Approved</span><small>Confirmed</small></button>
            <button type="button" class="training-competency-status-card" data-status="rejected" aria-label="Rejected, count unavailable. Training history coming soon"><strong>&mdash;</strong><span>Rejected</span><small>Declined</small></button>
          </div>
        </section>

        <section class="training-competency-section" aria-labelledby="trainingCompetencyIndividualQuickTitle">
          <h2 id="trainingCompetencyIndividualQuickTitle" class="training-competency-section-title">Quick Options</h2>
          <ul id="trainingCompetencyIndividualOptions" class="training-competency-options">
            <li><a class="training-competency-option" data-option-id="competency" href="options/competency.html"><span class="training-competency-option-icon" aria-hidden="true"><i class="fa-solid fa-list-check"></i></span><span class="training-competency-option-title">Competency</span></a></li>
            <li><a class="training-competency-option" data-option-id="course-catalog" href="options/course-catalog.html"><span class="training-competency-option-icon" aria-hidden="true"><i class="fa-solid fa-book-open"></i></span><span class="training-competency-option-title">Course Catalog</span></a></li>
            <li><a class="training-competency-option" data-option-id="training-need" href="options/training-need.html"><span class="training-competency-option-icon" aria-hidden="true"><i class="fa-solid fa-clipboard-question"></i></span><span class="training-competency-option-title">Training Need</span></a></li>
            <li><a class="training-competency-option" data-option-id="learning-development-plan" href="options/learning-development-plan.html"><span class="training-competency-option-icon" aria-hidden="true"><i class="fa-solid fa-route"></i></span><span class="training-competency-option-title">L&amp;D Plan</span></a></li>
            <li><a class="training-competency-option" data-option-id="training-plan" href="options/training-plan.html"><span class="training-competency-option-icon" aria-hidden="true"><i class="fa-solid fa-calendar-check"></i></span><span class="training-competency-option-title">Training Plan</span></a></li>
            <li><button type="button" class="training-competency-option" data-option-id="training-calendar"><span class="training-competency-option-icon" aria-hidden="true"><i class="fa-solid fa-calendar-days"></i></span><span class="training-competency-option-title">Training Calendar</span></button></li>
            <li><a class="training-competency-option" data-option-id="training-clocking" href="options/training-clocking.html"><span class="training-competency-option-icon" aria-hidden="true"><i class="fa-solid fa-clock"></i></span><span class="training-competency-option-title">Training Clocking</span></a></li>
            <li><button type="button" class="training-competency-option" data-option-id="training-feedback"><span class="training-competency-option-icon" aria-hidden="true"><i class="fa-solid fa-message"></i></span><span class="training-competency-option-title">Training Feedback</span></button></li>
          </ul>
        </section>
      </div>

      <div id="trainingCompetencyTeamPanel" class="training-competency-panel" role="tabpanel" aria-labelledby="trainingCompetencyTabTeam" hidden>
        <section class="training-competency-section" aria-labelledby="trainingCompetencyTeamQuickTitle">
          <h2 id="trainingCompetencyTeamQuickTitle" class="training-competency-section-title">Quick Options</h2>
          <ul id="trainingCompetencyTeamOptions" class="training-competency-options">
            <li><button type="button" class="training-competency-option" data-option-id="staff-competency"><span class="training-competency-option-icon" aria-hidden="true"><i class="fa-solid fa-users-gear"></i></span><span class="training-competency-option-title">Staff Competency</span></button></li>
            <li><button type="button" class="training-competency-option" data-option-id="competency-summary"><span class="training-competency-option-icon" aria-hidden="true"><i class="fa-solid fa-chart-pie"></i></span><span class="training-competency-option-title">Competency Summary</span></button></li>
            <li><button type="button" class="training-competency-option" data-option-id="skill-expiry"><span class="training-competency-option-icon" aria-hidden="true"><i class="fa-solid fa-hourglass-end"></i></span><span class="training-competency-option-title">Skill Expiry</span></button></li>
            <li><button type="button" class="training-competency-option" data-option-id="staff-tna"><span class="training-competency-option-icon" aria-hidden="true"><i class="fa-solid fa-magnifying-glass-chart"></i></span><span class="training-competency-option-title">Staff TNA</span></button></li>
            <li><button type="button" class="training-competency-option" data-option-id="staff-learning-development-plan"><span class="training-competency-option-icon" aria-hidden="true"><i class="fa-solid fa-people-group"></i></span><span class="training-competency-option-title">Staff L&amp;D Plan</span></button></li>
            <li><button type="button" class="training-competency-option" data-option-id="training-highlight"><span class="training-competency-option-icon" aria-hidden="true"><i class="fa-solid fa-chart-line"></i></span><span class="training-competency-option-title">Training Highlight</span></button></li>
          </ul>
        </section>
      </div>
    </main>

    <div id="appToast" class="app-toast" role="status" aria-live="polite"></div>
    <phone-bottom-nav active="apps"></phone-bottom-nav>
    <left-profile-drawer></left-profile-drawer>
    <notification-sheet></notification-sheet>
  </div>
</body>
</html>
